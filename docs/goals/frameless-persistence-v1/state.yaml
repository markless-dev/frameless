  slug: frameless-persistence-v1
  title: "Render-time persistence via a closed-form pre-paint seed script (Qwik-safe)"
  status: done
  classification: existing_plan
  oracle:
    signal: "pnpm e2e (or a persistence lane): for React + Solid emitted output, via @async/witness with receipts — a persisted value seeds from the closed-form PRE-PAINT script (present in the pre-activation DOM before framework activation; no fallback flash; anti-flash attr data-markless-<key>); ordinary-assignment WRITE-THROUGH to localStorage; cross-framework equality over the same corpus; a MUTATION/POLICY test proving a render-reachable storage read lowers to the pre-paint seed and never an eager visible task (Qwik-safe gate); the pre-paint script is a closed-form build artifact with a CSP hash in build receipts. Boxes calibrated against an intentionally broken seed first."
    final_proof: "T999 Judge audit from a fresh clone: documented command green (pre-paint seed + no-flash + write-through + equality, React+Solid), witness receipts + calibration evidence present, gate-policy mutation test green (Qwik-safety recorded), script artifact + CSP hash in receipts, docs honest, markless repo untouched, Qwik/Solid2 cards intact; records full_outcome_complete: true."
  intake:
    original_request: "Start the next tranche (owner named Qwik/Solid 2); resolved to frameless persistence — the buildable unblock. markless is finalizing storage() ergonomics: reference, don't block."
    interpreted_outcome: "Frameless compiles render-time persistence reads to a closed-form pre-paint seed script (no flash) + per-target landing slots (markless/React/Solid) + runtime write-through, made Qwik-safe now via a gate policy + mutation test; proven behaviorally via witness, green from a fresh clone; consumes the settled markless storage() contract without touching markless."
    input_shape: existing_plan
    authority: requested
    proof_type: test
    completion_proof: "Fresh-clone documented command green (pre-paint seed + no-flash + write-through + cross-framework equality for React+Solid via witness), gate-policy mutation test green, script artifact + CSP hash in receipts, docs honest, markless untouched (T999 audit, full_outcome_complete)."
    goal_oracle: "Persistence lane: pre-paint seed (no-flash) -> post-activation write-through -> cross-framework equality -> gate-policy mutation test (render read never eager task) -> script artifact + CSP hash in receipts; boxes calibrated against a broken seed first."
    likely_misfire: "Skipping/weakening the Qwik-safe gate policy; hardcoding the theme case vs general compiler-derivation; structural not behavioral tests; actual flash (fallback before seed); mangled name leaking into the baked key; cornering React SSR hydration-match; touching markless."
    existing_plan_facts: "See goal.md: OWNER-LOCKED design (persistence-design-input.md) — markless records persist:{key}; frameless owns script gen/landing/write-through/gates; v1 rule (render access -> pre-paint read+seed, handler access -> plain runtime read); script = closed-form artifact; settled storage() ergonomics (derived key markless:<id>, verbatim explicit key, anti-flash attr data-markless-<key>, baked literal, rename-safety manifest); markless payload-scripts as the markless landing slot; corrupted-storage never throws; key namespacing across libraries."
