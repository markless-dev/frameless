tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: >-
      Map what Frameless actually is and what its compilers emit, so the site shows
      truthful output. Answer: what is the authoring input format, which framework
      emitters exist and are working today, and what is the shortest honest
      one-source -> many-frameworks story to dramatize on a landing page.
    inputs:
      - README.md
      - AGENTS.md
      - packages/
      - demos/react-official/
      - demos/solid-official/
      - demos/qwik/
      - docs/goals/frameless-qwik-v1/state.yaml
      - docs/goals/frameless-composition-v1/state.yaml
    constraints:
      - "Read-only. No edits anywhere."
      - "Report what is genuinely working today, not what is aspirational."
      - "Identify the exact command or code path that produces per-framework output from one source."
    expected_output:
      - "One-paragraph plain-English description of Frameless suitable for a hero headline"
      - "List of framework emitters that work today, with the file/command that produces each"
      - "A concrete small example component + its real emitted output per framework (or the exact way to generate it)"
      - "Whether output can be produced at build time for the website, or must be pre-captured"
      - "Any claim on the site that would be false or overstated today"
    receipt:
      result: done
      note: docs/goals/frameless-website-v1/notes/T001-frameless-pipeline-map.md
      summary: >-
        Frameless compiles .tsrx into a semantic IR, then emits idiomatic per-framework
        code. Exactly three emitters exist and are proven: React 19, Solid, Qwik. The
        programmatic path is two hops - buildEnrichedIr({filename, source}) then
        emit(ir)/formatEmitted(...) from each framework package; there is no single
        compile(source, {target}) helper. Committed input->IR->output triples exist for
        S1/S2/S3. Reading the committed generated/*.jsx with fs is safer than importing
        the compiler, because packages export raw src TS, are private, unbuilt, v0.0.0,
        and @frameless/compiler depends on a vendored tarball.
      evidence:
        - packages/compiler/test/fixtures/s1-render-once.tsrx
        - packages/compiler/test/goldens/s1-render-once.json
        - packages/frameworks/react/generated/S1.jsx
        - packages/frameworks/solid/generated/S1.jsx
        - packages/frameworks/qwik/generated/S1.jsx
        - packages/compiler/src/build.ts:139
        - packages/frameworks/qwik/scripts/regenerate.ts
        - packages/cli/src/program.ts:6-10
      key_facts:
        - "Authoring format .tsrx; state()/computed() imported from @markless/core in every real fixture"
        - "Only packages/frameworks/{react,solid,qwik} exist - no vue, svelte, angular"
        - "Best showcase is S1 RenderOnce: Solid emits <Show fallback=> where React and Qwik emit ternaries"
        - "CLI TARGET_INVENTORY is react+solid only; qwik unreachable via `frameless build`"
      honesty_flags:
        - "'Compile to any framework' is false today - three emitters, Angular/Vue/Svelte are Planned"
        - "README hero imports @frameless.md/core but every on-disk fixture imports @markless/core"
        - "Frameless Studio does not exist anywhere in the codebase"
        - "All packages are version 0.0.0 and private - nothing is published"
        - "Persistence is React+Solid only, not Qwik; a11y and perf are not proven"

  - id: T002
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: >-
      Tear down the three inspiration sites interactively and inventory the brand inputs,
      so the build starts from mechanics rather than guesses.
    inputs:
      - "https://avara.xyz/ — sticker popup mechanic (owner: 'exactly like this')"
      - "https://sticker.oooo.so/ — peeling sticker effect"
      - "https://react.gg/ — overall energy and pacing"
      - "/Users/jacksm5pro/Downloads/image (3).png — theme reference image"
      - "/Users/jacksm5pro/Downloads/Que_Grotesque_Professional_License_typeberka.com"
      - "https://icon-sets.iconify.design/game-icons/"
    constraints:
      - "Read-only. No edits anywhere."
      - "Actually drive avara.xyz and sticker.oooo.so with a real browser — click, drag, hover. Do not describe from a screenshot alone."
      - "Read the theme reference image and describe its palette, texture, and sticker language concretely."
      - "Inventory the font folder: list available weights/styles and which WOFF/WOFF2 files are usable. Note EULA constraints on redistribution."
      - "Do not download or vendor any asset from the inspiration sites."
    expected_output:
      - "Sticker-popup mechanic teardown: trigger, open/close animation, layering, dismissal, how content is presented"
      - "Peel effect teardown: what it tracks (pointer? scroll?), how the shadow/curl is produced, rough technique (CSS mask / canvas / SVG / WebGL)"
      - "react.gg: 2-3 pacing or delight devices worth stealing"
      - "Palette + texture spec extracted from the reference image (hex values, surface treatment, sticker outline/shadow language)"
      - "Font inventory: usable web weights, exact file paths, licensing constraints"
      - "Candidate Game Icons picks for framework/nature motifs"
      - "Asset gap list: which stickers/mascots/textures must be generated because no real asset exists"
    receipt:
      result: done
      note: docs/goals/frameless-website-v1/notes/T002-inspiration-and-brand-inputs.md
      summary: >-
        Drove all three sites in real Chromium. avara.xyz is fully decoded: fixed
        full-viewport black stage, a loose pile of draggable die-cut stickers with three
        nested transform layers (float / drag / resting tilt), and on click the sticker
        scales up while every other sticker desaturates to silhouette and a 448px-wide
        panel slides in from the right carrying a title, description, and a label/value
        spec table, plus prev/next controls to cycle the pile. sticker.oooo.so's peel is
        three.js r185 WebGL exposed as role=slider with aria-valuenow = percent peeled and
        arrow-key support; its control panel gives the full parameter model (curl radius,
        stiffness, wind, peel sound). react.gg contributes a fanned card deck, a near-black
        fine-grid backdrop, and cream-on-black display type with one saturated CTA. The
        reference image is near-finished key art and yields a 10-colour palette plus the
        die-cut sticker language.
      evidence:
        - "https://avara.xyz/ — button.styles_draggable__ > div(translateY) > div(drag) > div.styles_logo__(rotate) > img"
        - "https://sticker.oooo.so/ — <canvas data-engine='three.js r185' role='slider' aria-valuetext='0% peeled'>"
        - "https://react.gg/ — scrollHeight 11898, Paytone One + Outfit, no canvas/video"
        - "/Users/jacksm5pro/Downloads/image (3).png"
        - "/Users/jacksm5pro/Downloads/Que_Grotesque_Professional_License_typeberka.com/WOFF (9 weights, woff+woff2)"
      key_facts:
        - "avara selection state: chosen sticker scales ~2x, others desaturate to silhouette, right panel 448px inset 8px, footer fades to opacity 0"
        - "avara spec-table pattern maps directly onto per-framework metadata rows"
        - "avara prev/next cycling is the best device to steal - flipping frameworks on one pinned source IS the product thesis"
        - "Peel is WebGL in the reference, but role=slider + aria-valuenow makes peel state machine-assertable - keep that regardless of technique"
        - "Peel parameter model: curl radius, stiffness, wind, plus a peel sound"
        - "Palette: lime #C3D93A, deep green #173A22, cream #F5EFDD, ink #12100E, sky #A6CDE0, teal #3B8CA0, cliff #6E9B4E, sand #D9C9A3"
        - "Que Grotesque ships 9 web weights as woff2 - no conversion needed; do not ship the variable file"
        - "Game Icons is CC BY 3.0 - footer attribution required"
      conflicts_for_judge:
        - "Reference art shows SIX framework stickers; T001 proves only THREE emitters exist. Candidate resolution: React/Solid/Qwik are full-colour and clickable, while Vue/Svelte/Angular become the peel stickers whose adhesive underside reads COMING SOON."
        - "three.js is ~600KB for one section. CSS/SVG fold-line peel is the recommended default with three.js as fallback."

  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: >-
      Turn Scout evidence into the build contract: define the three distinct interaction
      concepts, the shared foundation, and the written interaction contract every variant
      must pass. This is the decision that prevents three-pretty-static-pages.
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "docs/goals/frameless-website-v1/goal.md"
    constraints:
      - "Read-only. No edits anywhere."
      - "Each variant must have a materially different core interaction mechanic, not a different palette."
      - "Every variant must include: framework sticker popups with real output, a peel-sticker section, a Studio coming-soon moment."
      - "The interaction contract must be machine-checkable by Playwright. No subjective assertions."
      - "Reject any concept whose framework popups would need hand-written code samples."
    expected_output:
      - "Decision"
      - "Variant 1/2/3: name, core mechanic, what the user does, why it is memorable, honest difficulty rating"
      - "Shared foundation scope: tokens, font pipeline, emitter-output capture, sticker asset kit"
      - "The interaction contract as an explicit numbered assertion list"
      - "Where the peel section lives in each variant"
      - "Exact T004 Worker objective, allowed_files, verify, stop_if"
    receipt:
      result: done
      decision: approved
      note: docs/goals/frameless-website-v1/notes/T003-build-contract.md
      full_outcome_complete: false
      rationale: >-
        Build contract issued. Six-vs-three resolved as a hardened two-tier sticker board
        that is honest at rest, not only after peeling, and that gives the peel a semantic
        job instead of leaving it decorative. Three variants separated by how the user
        causes output - selection, progression, causation. CSS peel chosen because the
        oracle is a headless run and the WebGL reference renders nothing there. Emitter
        output read from committed, git-clean files behind a provenance gate. Judge also
        found that the board's original verify command could not run at all.
      blockers_found:
        - "@playwright/test is in no package.json and not in the pnpm store; a spec importing it fails outright. Zero-install path proven instead: createRequire(packages/frameworks/react/package.json)('playwright') launches Chromium, matching scripts/e2e.mjs:36-38."
        - "website/ does not exist (T001 called it an empty directory), and .gitignore already ignores website/assets/fonts/, so the font assertions only go green after an explicit install step."
      decisions:
        framework_honesty: >-
          Two-tier sticker board. React/Solid/Qwik are full-colour, clickable,
          data-status=shipped, and the only stickers inside the COMPILED OUTPUTS group.
          Vue/Svelte/Angular sit in a separately labelled "PLANNED - peel to check" group:
          desaturated, visible PLANNED tag, aria-disabled=true, cannot open a code panel.
          Peeling reveals NOT SHIPPED YET. Keeps the owner's six-sticker key art while
          staying true at every frame.
        peel_technique: >-
          CSS/SVG fold-line peel, no three.js in any variant. Decisive reason is
          testability, not bundle size - the reference WebGL peel renders nothing under
          default headless Chromium and the whole oracle is a headless run. clip-path fold
          plus reflected flap under perspective, single --peel 0->1 mirrored to
          aria-valuenow, role=slider and arrow keys retained. Fallback is a hard stop, not
          a Worker judgment call.
        emitter_output: >-
          T001 confirmed. fs-read the committed files (all nine verified git-tracked and
          clean) into one committed ES module, website/src/data/emitter-output.js. Hero
          scenario is S1 RenderOnce because `grep -l '<Show'` matches solid only. The
          capture script carries a provenance gate - each output's first line must be
          exactly "// @generated by @frameless/<fw>; do not edit." or it exits 1.
        asset_policy: >-
          T004 generates zero images. The wordmark is live CSS text in Que Grotesque Black,
          because assertion 16 checks the computed font-family of [data-wordmark], which is
          unverifiable if it is an image. Texture via inline feTurbulence, backdrop via the
          react.gg near-black grid. Coastal parallax, framework logo SVGs, nature stickers
          and peel sound all deferred - asset generation is the second named misfire.
      contract: "23 machine-checkable assertions in section 5.2 of the note"
      anti_gaming_assertions:
        - "#9 harness reads packages/frameworks/<fw>/generated/S1.jsx from disk at test time and asserts normalize(panelText) === normalize(fileContents) - hand-written snippets become impossible"
        - "#15 peel geometry must actually move, not just aria-valuenow"
        - "#17 a QueGrotesque*.woff2 resource must have decodedBodySize > 0, defeating a false green from a desktop-installed copy"
        - "#20 no framework bundle may be loaded by the page"
      parallel_safety: >-
        T005 and T006 both declare allowed_files website/** and are NOT provably disjoint;
        they must run sequentially after T004. T004 must complete first regardless, since
        it creates the foundation and the shared harness both later tasks extend.

  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Build the shared foundation plus Variant 1 "The Pile" end to end, and stand up the
      interaction-contract harness so it runs green against Variant 1. Follow
      docs/goals/frameless-website-v1/notes/T003-build-contract.md exactly; it is binding.
      Foundation: website/ scaffold per contract section 6.1; install-fonts.mjs copying the
      four licensed Que Grotesque woff2 weights into the gitignored website/assets/fonts/;
      tokens.css from the T002 palette; capture-emitter-output.mjs producing the committed
      website/src/data/emitter-output.js from the twelve committed fixture and generated
      files, with the "@generated by @frameless/<fw>" provenance gate; serve.mjs, a
      zero-dependency node:http static server; and the CSS fold-line peel with
      role="slider" + aria-valuenow. Variant 1 is the avara mechanic: a fixed non-scrolling
      full-viewport stage of draggable die-cut stickers, click to select (6px drag
      threshold), others desaturate, a 448px right-hand panel showing that framework's real
      compiled S1 output verbatim plus the spec table, and < > controls that cycle
      React/Solid/Qwik with the .tsrx source pinned. React/Solid/Qwik are data-status=shipped
      and clickable; Vue/Svelte/Angular are data-status=planned, aria-disabled, in a
      separately labelled PLANNED group, and are the peel stickers whose underside reads NOT
      SHIPPED YET. Include the Frameless Studio coming-soon sticker. The harness is plain
      Node against the playwright library resolved via createRequire — NOT @playwright/test,
      which is not installed and cannot be installed. It must auto-discover
      website/variants/*/index.html so T005 and T006 inherit the contract for free. All 23
      assertions in contract section 5.2 must pass for Variant 1. It must be a running,
      interactive page, not a mockup.
    allowed_files:
      - "website/**"
      - "package.json"
      - ".gitignore"
    verify:
      - "node website/scripts/install-fonts.mjs"
      - "node website/scripts/capture-emitter-output.mjs"
      - "git diff --quiet website/src/data/emitter-output.js"
      - "node website/tests/interaction-contract.mjs"
      - "git status --porcelain website/assets/fonts | grep . ; test $? -eq 1"
    stop_if:
      - "Need files outside allowed_files — packages/, demos/ and poc/ are read-only."
      - "Any new npm dependency appears necessary, including @playwright/test or three.js. The sandbox has no network. Stop and report; do not install, do not vendor."
      - "The licensed font folder is missing at /Users/jacksm5pro/Downloads/Que_Grotesque_Professional_License_typeberka.com/WOFF/."
      - "Any generated S1.jsx first line is not exactly '// @generated by @frameless/<fw>; do not edit.' — upstream moved; stop rather than adapt."
      - "You are about to hand-write, reformat, re-indent, truncate or abbreviate any compiled output, or inject line numbers inside [data-output-code]."
      - "You are about to set aria-valuenow on the peel without moving real geometry."
      - "The CSS peel cannot reach aria-valuenow >= 90 without visible artifacts at 390px width."
      - "Verification fails twice."
    receipt:
      result: done
      summary: >-
        Built the website/ foundation, Variant 1 "The Pile", and the 23-assertion contract
        harness. 23/23 green, re-verified independently by PM. The page really runs: a
        160px drag moves a sticker and opens nothing while a 4px nudge still activates, so
        the 6px threshold works; the panel opens, swaps and closes; < > cycles
        react->solid->qwik with the .tsrx source byte-identical across cycles; the peel
        deforms real geometry and reveals NOT SHIPPED YET under the Vue sticker. Panel code
        is byte-identical to packages/frameworks/*/generated/S1.jsx.
      changed_files:
        - website/index.html
        - website/variants/pile/index.html
        - website/src/css/{tokens,base,sticker,peel,pile}.css
        - website/src/js/{pile,stickers,peel,emitter-panel,studio}.js
        - website/src/data/emitter-output.js
        - website/scripts/{install-fonts,capture-emitter-output,serve}.mjs
        - website/tests/{interaction-contract,contract-assertions}.mjs
        - website/README.md
        - package.json
      commands:
        - cmd: node website/scripts/install-fonts.mjs
          status: pass
        - cmd: node website/scripts/capture-emitter-output.mjs
          status: pass
        - cmd: git diff --quiet website/src/data/emitter-output.js
          status: pass
        - cmd: node website/tests/interaction-contract.mjs
          status: pass
        - cmd: "git status --porcelain website/assets/fonts | grep . ; test $? -eq 1"
          status: pass
      assertions: "23/23"
      worker_decisions:
        - "capture records the last commit touching the twelve inputs plus a dirty flag rather than HEAD, because HEAD would break the contract's own determinism check on the next unrelated commit"
        - "selected-sticker scale is 1.7x in place rather than a 2x move to a spotlight slot, so the React->Solid swap stays clickable at 1100px"
        - "files live at src/css/tokens.css per contract 6.1, not the task text's src/styles/"
      load_bearing: >-
        renderCode in website/src/js/emitter-panel.js walks the string by index and emits
        every character exactly once. That lossless walk is the only reason assertion 9's
        byte equality survives syntax colouring. T005/T006 must preserve it.
      pm_review: >-
        Mechanics and honesty are excellent and fully verified. Art direction is NOT yet on
        brief: the page is react.gg's dark grid with rounded rectangles, with no coastal
        nature scene, no paper texture, no die-cut organic shapes and no framework logos.
        This is the direct consequence of the T003 asset policy deferring all imagery,
        which was correct for de-risking the build but leaves the owner's primary stated
        goal - nature-like sticker theme that leaves an impression - unmet. Spawned T004b
        and T004c before T005 so the two remaining variants inherit correct art rather than
        replicating the gap three times.
      spawned_tasks:
        - T010
        - T011

  - id: T010
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: >-
      Generate the nature-sticker art kit with codex image generation, which only the PM
      can do because the Worker sandbox has no network. Verified working: `codex exec
      --sandbox workspace-write --skip-git-repo-check "<prompt>"` produces on-brand die-cut
      sticker art at 1254x1254. Deliver, into website/assets/art/: a coastal/meadow poster
      backdrop in separable parallax layers, six framework die-cut sticker plates, a paper
      grain/crinkle tile, a peel backing texture, and a handful of loose nature stickers
      (leaf, mushroom, seagull, wildflower). Framework logos come from official marks, not
      generation. Generate on a pure magenta #FF00FF field and key it out, because the
      cream die-cut border is too close to white to key against a white background.
    allowed_files:
      - "website/assets/art/**"
      - "docs/goals/frameless-website-v1/**"
    verify:
      - "every generated asset opens as a valid image and has a transparent background where required"
      - "node website/tests/interaction-contract.mjs still 23/23 (art alone must not break the contract)"
    stop_if:
      - "codex image generation stops working or returns off-brand art twice in a row for the same asset."
      - "An asset would embed a framework's trademark in generated art rather than using the official mark."
    receipt:
      result: done
      summary: >-
        Generated and installed the art kit into website/assets/art/ - 14 files, 1.0 MB
        total. The magenta-key technique works: generating each sticker on a pure #FF00FF
        field and keying it out gives clean die-cut cutouts, which a white field could not
        because the cream border is too close to white. First pass left magenta fringing
        where the baked drop shadow blended into the field; fixed by widening the fuzz to
        45-55% and eroding the alpha channel, which removes the baked shadow entirely -
        T011 must re-add shadows in CSS via filter: drop-shadow.
      changed_files:
        - website/assets/art/texture/coast.jpg
        - website/assets/art/texture/paper.jpg
        - website/assets/art/texture/backing.jpg
        - website/assets/art/stickers/{mushroom,seagull,flower,pine,leaf}.png
        - website/assets/art/logos/{react,solid,qwik,vue,svelte,angular}.svg
      commands:
        - cmd: "codex exec --sandbox workspace-write --skip-git-repo-check '<prompt>'"
          status: pass
        - cmd: "magick <in> -fuzz 45% -transparent '#FF00FF' -channel A -morphology Erode Octagon:2 +channel -trim +repage -resize 640x640 -colors 64"
          status: pass
      assets:
        backdrop: >-
          coast.jpg, 2400px wide, 653 KB - vintage screen-print coastal cliff meadow with
          lighthouse, teal ocean, wildflower foreground and halftone paper grain. The
          middle of the frame was deliberately prompted calm so content sits on top.
        textures: "paper.jpg (41 KB) sticker fill grain; backing.jpg (49 KB) adhesive underside for the peel"
        stickers: "mushroom, seagull, flower, pine, leaf - transparent PNG, <=640px, 20-113 KB each"
        logos: >-
          Six official marks from simple-icons via jsDelivr, each verified by its <title>
          element. Note the correct slug for SolidJS is `solid`; `solidity` is a different
          project and was fetched and discarded on the first attempt.
      notes_for_t011:
        - "Stickers have NO baked drop shadow - add it in CSS with filter: drop-shadow, which also keeps the shadow correct when a sticker rotates."
        - "Logos are single-path monochrome SVGs with currentColor-friendly markup; tint them per framework rather than expecting full-colour brand art."
        - "coast.jpg is a single flat image, not parallax layers. Separable layers were prompted for but the model returned one composed scene. Parallax, if wanted, needs either a re-prompt or CSS depth faked with the loose nature stickers."

  - id: T011
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Art-direction pass on the shared foundation and Variant 1, using the T004b asset kit.
      Bring the page onto the owner's brief: the coastal/meadow poster backdrop replacing
      the react.gg dark grid, real die-cut organic sticker shapes replacing rounded
      rectangles, official framework logos on the plates, paper texture on sticker fills,
