    receipt:
      result: done
      summary: >-
        Re-skinned Variant 1 to the vintage-coastal nature-sticker brief without touching
        the mechanics. coast.jpg replaces the dark grid under three CSS scrims plus corner
        ramps; framework plates became organic die-cut SVG wobble paths with a fat cream
        stroke, ink outline and paper.jpg grain, carrying inlined simple-icons marks tinted
        per brand; five loose nature stickers joined the draggable pile; the peel reveals a
