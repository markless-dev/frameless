      summary: >-
        website/variants/shelf/index.html — the skeleton forked with the avara mechanic wired
        into the output-exploration slot. Mechanic VERIFIED WORKING: click selects React with
        the other five desaturated to grey silhouettes, ArrowRight carousels react -> vue ->
        svelte, the panel shows real emitted output with activation model, output path, line
