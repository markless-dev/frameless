  status: green
  note: >-
    Currently RED, and correctly so — it asserts rules the owner OVERTURNED (the kit-wide
    box-shadow ban, and drop-shadow permitted only in the peel state). It also catches two real
    breaks: dead references to deleted stickers from artifacts/, and build-guideline.mjs
