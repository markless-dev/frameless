risks:
  - id: R1
    note: >-
      THE ORACLE THAT PASSED A REJECTED DESIGN. Every automated check in the previous attempt
      was numeric and every one passed while the result was, in the owner's words, horrible.
      Visual grading is therefore signal ONE, not a nicety, and every Worker must screenshot and
      grade rather than assert. If a Worker reports grades without screenshots, the grades are
      void.
  - id: R2
    note: >-
      Owner is asleep and has delegated all decisions. Do NOT block. Where a call is needed,
      make it, record it with reasoning in the receipt, and continue. Blocking until morning
      wastes the entire window.
  - id: R3
    note: >-
      file:// is the real delivery surface. CSS mask/image url() is CORS-blocked from disk, which
      silently blanked all six framework marks once already. Verify every page from file://, not
      only over http.

tasks:
  - id: T001
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Repair the four known breaks so the kit is a sound base to build on. Rewrite the
      structural gate to assert the NEW rules (elevation required; drop-shadow preferred;
      box-shadow discouraged) instead of the overturned ones. Fix build-guideline.mjs. Refresh
      assets/README.md. Retokenise or delete the two broken artifacts pages.
    inputs:
      - docs/goals/frameless-design-kit-v1/notes/REBUILD-SPEC.md
      - docs/goals/frameless-design-kit-v1/notes/REFERENCE-STUDY.md
      - brand/tools/structural-gate.mjs
    constraints:
      - "The gate must still RECOMPUTE rather than read — keep the clamp and contrast recomputation, which is its real value."
      - "Mutation-test any assertion you change: prove it can still go red."
      - "Do NOT rebuild the visual system. It is rebuilt and graded. Fix breaks only."
    allowed_files:
      - brand/tools/**
      - brand/human/**
      - brand/agent/visual/assets/README.md
      - brand/agent/visual/artifacts/**
    verify:
      - "node brand/tools/structural-gate.mjs exits 0"
      - "Seed a defect and confirm the gate still goes red"
      - "node brand/human/build-guideline.mjs --check passes"
    stop_if:
      - "A fix would require rebuilding the visual system."
    expected_output:
      - "Green structural gate asserting the new rules, mutation-proven"
    receipt:
      result: done
      summary: >-
        All four breaks fixed. Gate green at 26/26 and mutation-proven 16/16. The two void
        shadow assertions are replaced by four that enforce the NEW law: the elevation scale
        exists and every step is a drop-shadow; elevation is actually USED in declaration
        position, not merely declared; box-shadow permitted only as the documented --elev-inset
        exception; and no file still claims the overturned ban.
      best_idea_in_the_receipt: >-
        SELF-EXPIRING EXEMPTIONS. Known-stale locations of the old shadow ban live in a
        SHADOW_BAN_EXEMPTIONS list, and a STALE exemption also fails the gate — so the entry
        self-destructs when the debt is paid. Technical debt that cannot be silently forgotten.
      gate_bug_it_found_in_itself: >-
        Mutation M04 initially escaped: "elevation is actually USED" counted the /human
        guideline QUOTING --shadow-peel's value in a table cell as a use. Every elevation step
        could have gone dead while the gate stayed green on the strength of the docs describing
        them. Now requires declaration position. Three other seeds also missed and each exposed
        a weak seed rather than a weak check (a surviving second drop-shadow; a ../../ escape
        that lands back inside brand/; a mutation that reproduced the correct clamp).
      second_real_find: >-
        The lime-law check was hard-coding #f2efd4 / #fdf8e4 / #ebd5a0 / #1d2c22 — four hexes the
        rebuild superseded. It was PASSING while testing colours the kit no longer contains.
        Now reads the beds from color.json (9 beds including every framework band) and asserts
        the --ink-on-lime trap fails at 1.22:1.
      build_guideline_was_worse_than_one_crash: >-
        The missing hero section was hiding a stack of dead reads — --halo,
        --sticker-halo-ratio, color.scrims, passes.normal_text_aa,
        motion.forbidden['drop-shadow'] and a "six frames, one view" section, none of which
        exist. It was publishing a section headed "Nothing floats." Rewritten against current
        sources with a new 02-depth section rendering the elevation scale.
      artifacts_decision: >-
        Middle path, reasoned in artifacts/web/README.md. landing-page.html DELETED — the token
        rename was the small part; the page is COMPOSED for a light paper bed with flat objects,
        so correcting it is rebuilding it, which trips the stop condition and competes with the
        real variants. studio-inspector.html RETOKENISED since nothing replaces it: --ink labels
        on lime fills corrected to --accent-ink (1.22:1 -> 13.08:1, recomputed) and --elev-card
        added so it stops teaching "no shadow to reach for".
      also_corrected: >-
        artifacts/web/page-composition.md — binding input for the next tasks, and it still taught
        --scrim-*, counted targets, and said drop-shadow was peel-only.
      commands:
        - cmd: "node brand/tools/structural-gate.mjs"
          status: pass
          detail: "exit 0, 26/26"
        - cmd: "mutation harness, 16 seeded defects"
          status: pass
          detail: "16/16 caught; restore byte-identical per sha256; gate green after restore"
        - cmd: "node brand/human/build-guideline.mjs --check"
          status: pass
        - cmd: "playwright file:// smoke on studio-inspector + human/index.html"
          status: pass
          detail: "0 console errors, 0 failed requests, no overflow at 1440 or 390"
      routed_to_T002:
        - "components/callout.html:240 still asserts the overturned rule. Carried as the gate's ONE declared exemption — it will fail the gate if fixed and the entry is not removed."
        - "motion/specimen.html and build-motion.mjs still reference dead --halo and --sticker-halo-fixed tokens (render unstyled, not broken)."
      changed_files:
        - brand/tools/structural-gate.mjs
        - brand/human/ (build-guideline.mjs, index.html, README.md)
        - brand/agent/visual/assets/README.md
        - brand/agent/visual/artifacts/ (landing-page.html deleted; web/README.md, page-composition.md, product/studio-inspector.html, product/README.md)

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Fix the hero to option D (lime -> black keyline -> cream band -> stacked drop-shadow),
      correct the line-height so the band stops eating descenders, and lift the page bed toward
      the art's brightness. Re-grade the affected components against the brighter bed.
    inputs:
      - "PM decision: option D, recorded in the charter"
      - brand/agent/visual/assets/wordmark/wordmark.css
    constraints:
      - "line-height ~1.06 with a per-line stack — the band adds ~26px of stroke in every direction."
      - "Dark bed survives as a SECONDARY surface for code blocks and detail panels."
      - "Re-grade every component that sat on the dark bed; contrast pairs must be recomputed, not assumed."
    allowed_files:
      - brand/agent/visual/**
      - brand/tools/structural-gate.mjs
    scope_note: >-
      structural-gate.mjs added because T001 designed its SHADOW_BAN_EXEMPTIONS list to fail on
      a stale entry — so the task that pays the debt is the task that must remove the entry.
      Executed by PM, not a Worker: two dispatched Workers stalled on the watchdog with no
      progress, so PM fell back to doing the slice directly.
    verify:
      - "Screenshot the hero and grade it >= B"
      - "Recompute contrast for every pair affected by the bed change"
      - "Structural gate still green"
    stop_if:
      - "The brighter bed drops any required contrast pair below its threshold and cannot be resolved by adjusting the bed."
    expected_output:
      - "Hero at option D, corrected leading, brighter bed, components re-graded"
    receipt:
      result: done
      summary: >-
        Hero display type now carries the full die-cut treatment: lime fill -> black keyline ->
        cream band -> stacked drop-shadow. Implemented as ::before/::after copies driven by
        data-text with negative z-index behind the real glyphs, since one element cannot carry
        two strokes. isolation: isolate keeps those negatives inside the headline. The shadow is
        a FILTER, not a text-shadow, so it follows the silhouette of the outermost band rather
        than the glyphs.
      grade: "A-"
      the_leading_finding: >-
        The known descender defect was real but the fix was bigger than specified. 1.06 clears
        the INK, and the measurement said CLEARS — but the screenshot showed the cream BANDS of
        adjacent lines merging into one connected blob at the joins. The band is a CENTRED
        stroke extending band/2 outside every glyph, so consecutive lines must clear each
        other's BANDS, not each other's ink. Landed at 1.22: band-to-band clearance 68.9px at
        1440 and 39.4px at 390, both separating cleanly. Caught by looking, not by the numeric
        check — which had reported CLEARS.
      escalations_from_T001_handled:
        - "components/callout.html rewritten: the 0.00 dark-fringe measurement is kept as a fact about the flat PNG exports, and the void generalisation is replaced by why the kit casts elevation in CSS instead."
        - "SELF-EXPIRING EXEMPTION WORKED AS DESIGNED. Removing that sentence made the gate go RED on a stale exemption at the very next run, exactly as T001 built it to. Entry removed and the list emptied with a note explaining the mechanism."
      still_open:
        - "motion/specimen.html and build-motion.mjs still reference dead --halo and --sticker-halo-fixed tokens. Renders unstyled, not broken. Carried to a later task."
      bed_note: >-
        The brighter bed was already in place from the kit rebuild — --surface is #a2cbd0, the
        cyan-blue measured from the real art. The hero keeps its dark bed deliberately: it is a
        nested dark island, and with the cream band now doing the separating, lime display type
        is no longer strictly dependent on it. That unlocks lime display on light beds for the
        variants.
      commands:
        - cmd: "node brand/tools/structural-gate.mjs"
          status: pass
          detail: "26/26"
        - cmd: "playwright file:// hero at 1440 and 390"
          status: pass
          detail: "0 console errors; band-to-band clearance 68.9px / 39.4px, bands separate at both"
      changed_files:
        - brand/agent/visual/components/hero.html
        - brand/agent/visual/components/callout.html
        - brand/tools/structural-gate.mjs

