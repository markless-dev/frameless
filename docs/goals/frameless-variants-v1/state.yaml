version: 2

goal:
  slug: frameless-variants-v1
  title: "Frameless landing page — 2-3 variants built from the rebuilt kit"
  status: active
  mode: existing_plan
  charter: docs/goals/frameless-variants-v1/goal.md
  oracle:
    signal: >-
      Three signals, all required per variant. (1) VISUAL GRADE >= B section by section,
      screenshotted in a real browser and compared against
      brand/_source/concept/CONCEPT-ART-AUTHORITATIVE.jpeg on five criteria: belongs beside the
      art, real elevation, texture not flat fill, survives next to avara.xyz/react.gg, type
      heavy and confident. Below a B is rebuilt before moving on. (2) Interaction contract
      passes, Playwright-verified from file://: signature mechanic works, real emitted output
      shown, all mandatory sections present, Que Grotesque loads, holds at 390px,
      prefers-reduced-motion honoured, zero console errors. (3) structural gate green.
    final_proof: >-
      T999 Judge receipt with full_outcome_complete: true, backed by per-section visual grades
      for every variant, a green interaction contract per variant, a green structural gate, and
      Judge having opened each variant beside the concept art and confirmed it would not be
      rejected on sight the way the first attempt was.
  intake:
    input_shape: existing_plan
    authority: requested
    proof_type: artifact
    completion_proof: >-
      2-3 variants under website/, each running from file://, each with all mandatory sections,
      each a genuinely different mechanic, every section graded >= B, contract green per
      variant, structural gate green, plus a comparison note for the owner.
    likely_misfire: >-
      SHIPPING VARIANTS THAT ARE TECHNICALLY CORRECT AND STILL UGLY. The previous attempt passed
      23 structural checks, a zero-context cold-agent test and a skeptical Judge audit, and the
      owner rejected it on sight. Every check verified internal consistency; none asked whether
      it looked good beside the art. A green gate is not evidence of a good-looking page.
      Secondary misfire: rebuilding the kit again instead of building pages.
    existing_plan_facts:
      - "Build ONE section-complete skeleton first, then fork it — changing only the hero mechanic and the output-exploration section. This is what makes variants comparable and stops one-hero pages."
      - "A reference contributes ONE MECHANIC. Page shape comes from the kit, never from the reference. The previous failure took avara as architecture and shipped one scattered screen."
      - "CORRECTION: the 'Bench' mechanic (six frames, one view) is VOID — an invention the owner rejected; component and concept deleted. Replaced by 'The Shelf', the avara mechanic actually asked for."
      - "Variant A - The Shelf: framework-carousel.html ALREADY BUILT and graded A-."
      - "Variant B - The Pile: scattered draggable stickers, click opens compiled output. To build."
      - "Variant C - The Peel: .tsrx source as a sticker, peel the corner to reveal emitted code. Sticker Forge params: stroke 18px, tilt -3deg, curl 0.120, stiffness 72%. To build."
      - "Two variants acceptable, three is the target. A + C is the strongest pair if time forces a choice."
    owner_constraints_non_negotiable:
      - "Hero text FIXED: 'Compile once, output anywhere.' Never rewrite."
      - "NEVER count the targets. No 'ship six', no totals."
      - "filter: drop-shadow(), NEVER box-shadow. A die-cut sticker is irregular; box-shadow casts a rectangle and kills the illusion."
      - "Elevation is mandatory. The kit-wide shadow ban was the single worst error of the first attempt."
      - "Noise texture everywhere. The background is never a flat fill."
      - "Saturated palette from the REAL art, per REBUILD-SPEC.md."
      - "Minimum seven sections per variant."
      - "Must work opened from file://, not only over http."
      - "All six framework marks, canonical order, never in --accent."
      - "Frameless Studio is coming soon; never imply availability."
    pm_decisions_owner_delegated:
      - "HERO TREATMENT = OPTION D: lime fill -> thick black keyline -> CREAM BAND -> stacked drop-shadow. The comparison render showed keyline-alone muddies on a dark bed because the outline has nothing to separate from; the cream band is what makes the type read as a die-cut object. It is the concept art's own construction."
      - "PAGE BED LIFTS toward the art's brightness. Near-black was a PM invention, not the art's. Dark stays as a SECONDARY surface for code blocks and detail panels."
      - "Known hero defect to fix: the cream band adds ~26px of stroke in every direction, so at line-height .92 the band on line two eats line one's descenders. Needs ~1.06 and a per-line stack."

