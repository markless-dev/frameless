    receipt:
      result: done
      resolution: "not built — deliberate, per the charter"
      retyped_from_worker_to_pm: >-
        This card was seeded as a Worker, but the outcome is a SCOPE DECISION that wrote no
        files. A Worker receipt with no changed_files is a contradiction, so the card is retyped
        to PM — which is what actually made the call.
      summary: >-
        The charter states plainly: "Two variants is acceptable, three is the target... A + C is
        the strongest pair if time forces a choice." That is the call. The Shelf and the Peel
        are genuinely different mechanics — one is selection-and-inspection, the other is a
        physical reveal — and both are green from file:// with real emitted output.
      why_not_a_third: >-
        The Pile (scattered draggable stickers) is the weakest of the three by the kit's own
        ranking of what interactivity should mean: it decorates rather than demonstrates. The
        Shelf makes the claim inspectable and the Peel makes the compile step physical; dragging
        stickers around does neither. Building it would also have meant leaving the Shelf's two
        known layout defects unfixed in order to add a variant nobody would pick.
      recommendation: >-
