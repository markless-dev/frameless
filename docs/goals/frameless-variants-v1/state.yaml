        lose a rule. Unused specimen selectors ride along harmlessly. Never filter CSS by regex.
      also_fixed:
        - "The carousel markup dragged the specimen's <main class='spec'> documentation into the page (sections went 9 -> 12, and 'What is real here' rendered as page content). Stripped."
        - "Added .band--bleed: the carousel gives 430px of its width to the detail panel the moment it opens, so inside any contained measure the row has nowhere to go. It was designed against the full viewport."
