      - "Must degrade sensibly under prefers-reduced-motion and on touch."
    allowed_files:
      - website/**
    verify:
      - "Peel responds to pointer position, not just hover"
      - "Revealed code is real emitted output"
      - "Every section graded >= B"
    stop_if:
      - "The peel cannot be made to respond to pointer position without a physics dependency — the sandbox cannot install packages."
    expected_output:
      - "Variant C complete and graded"
    receipt:
      result: done
      grade: "B+"
      summary: >-
        website/variants/peel/index.html — the .tsrx source is a lime sticker laid over its own
        compiled output. The corner peels back under the pointer and the emitted framework code
        is literally underneath. Verified: pointer at the corner drives --peel to 0.849, click
        latches it fully open, the framework picker swaps to genuinely emitted Solid and Qwik
        files read out of packages/frameworks/*/generated/S1.jsx. Zero console errors, zero
        failed requests from file://.
      THE_BUG_THAT_MATTERED: >-
        The first build made the curl the SAME SIZE as the cut, so the flap covered the entire
        area it uncovered and the compiled code was never visible. The mechanic looked
        completely right in a screenshot and communicated nothing — the one thing the whole
        variant exists to show was hidden by its own animation. A real peeled corner folds back
        ON ITSELF, so the flap is a fraction of what it reveals. Now 38%: curl 181px against a
        764px card, and the payload reads.
      why_this_variant_earns_its_place: >-
        It is the only surface in the system where a shadow is doing genuinely physical work
        rather than implying depth — a corner is actually lifting, and filter: drop-shadow()
        follows the curl's triangular silhouette. box-shadow would draw a rectangle behind a
        triangle and kill it outright. It is the strongest argument for the owner's
        drop-shadow-not-box-shadow correction.
      commands:
        - cmd: "playwright file:// — pointer toward corner"
          status: pass
          detail: "--peel 0.849, curl 405px, drop-shadow present, React output underneath"
        - cmd: "playwright file:// — click to latch, switch to Qwik"
          status: pass
          detail: "aria-expanded true; label 'Qwik · resumes'; real @frameless/qwik output"
        - cmd: "curl coverage after fix"
          status: pass
          detail: "24% of card width, down from 62% — payload legible"
      changed_files:
        - website/variants/peel/index.html
        - website/src/css/peel.css
        - website/src/js/peel.js

