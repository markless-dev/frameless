  - id: T006
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Variant C — The Peel. Fork the skeleton; the .tsrx source is a sticker whose corner peels
      to reveal the emitted framework code underneath. Sticker Forge params: stroke 18px, tilt
      -3deg, curl 0.120, stiffness 72%.
    constraints:
