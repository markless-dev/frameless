      for code blocks and panels; bring the Shelf panel inside the page measure so it occludes
      no mark; make the Peel curl meet its fold line and put the under-layer on a distinct
      surface.
    inputs:
      - "T999 receipt — the six ship-blocking defects"
      - docs/goals/frameless-design-kit-v1/notes/REBUILD-SPEC.md
      - brand/_source/concept/CONCEPT-ART-AUTHORITATIVE.jpeg
    constraints:
      - "MEASURE getBoundingClientRect().right AGAINST innerWidth. Never document.scrollWidth — an ancestor's overflow:hidden makes it read clean over a clipped page. That false green is how these defects shipped."
      - "Screenshot every section and grade it against the art. Grades without screenshots are void."
    allowed_files:
      - website/src/**
      - website/index.html
      - website/variants/**
      - brand/agent/visual/tokens/color.css
      - brand/agent/visual/components/hero.html
    scope_note: >-
      Widened during execution. website/src/js was needed because Judge located defect 5's root
      cause in carousel.js (focalFraction). The two brand/ files were needed because defects 2
      and 4 — the band's miter spikes and the near-black bed — live in the kit's own tokens and
      hero component, not in the site. Both are the minimum surface required by defects Judge
      identified, and both were executed by PM under R2 rather than by a Worker.
    verify:
      - "At 390px no element has getBoundingClientRect().right > innerWidth"
      - "Hero renders 'anywhere.' complete at 390px"
      - ".band--deep and .band--paper compute a non-none background-image"
      - "Shelf panel sits within the carousel measure and all six marks stay visible with it open"
      - "Every section screenshotted and graded >= B against the concept art"
      - "node brand/tools/structural-gate.mjs exits 0"
    stop_if:
      - "Fixing the band requires replacing the wordmark asset pipeline."
      - "Lifting the deep bed drops a required contrast pair below threshold."
    expected_output:
      - "Six defects fixed, every section re-graded >= B with screenshots"
    receipt:
      result: done
      summary: >-
        All six ship-blocking defects addressed. 1-4 independently confirmed fixed by Judge.
        5 (Shelf) confirmed fixed by Judge on a stricter hit-test than PM ran. 6 (Peel) took
        three attempts and was resolved only by changing the reveal GEOMETRY from a corner
        wedge to a bottom-edge fold — the shape, not the numbers, was the bug.
      commands:
        - cmd: "playwright file:// — Shelf marks whole at 1440/1200/1024, panel open"
          status: pass
          detail: "6/6 at every width; nav overlapping a mark: 0"
        - cmd: "playwright file:// — Peel latched, flap forced to pointer-events:auto so it counts as an occluder"
          status: pass
          detail: "complete terminated lines of emitted React legible under the flap; confirmed by screenshot, which is the criterion Judge set"
        - cmd: "node brand/tools/structural-gate.mjs"
          status: pass
          detail: "26/26"
      changed_files:
        - website/src/css/peel.css
        - website/src/css/carousel.css
        - website/src/css/page.css
        - website/src/js/carousel.js
        - brand/agent/visual/tokens/color.css
        - brand/agent/visual/components/hero.html
    progress:
      done:
        - >-
          DEFECT 1 FIXED — the 390px hero truncation. Cause was the band, not the type:
          --step-7 is only ~90px at 390, but the cream band adds --hd-band of stroke on every
          side, so the PAINTED width far exceeds the type width. Capped to min(--step-7, 13vw)
          with the band and keyline scaled down to match. Verified by measuring
          getBoundingClientRect().right against innerWidth — the method Judge prescribed, not
          the scrollWidth check that produced the false green. h1 right=354 of vw=390 on all
          three pages; skeleton now has ZERO overflowing elements.
        - >-
          Also removed the clipped ancestor at 390 (overflow: clip visible) so a future
          regression is VISIBLE rather than silently cropped. The overflow:hidden is what hid
          this failure in the first place.
      also_done:
        - >-
          DEFECT 2 FIXED — the band's miter spikes. Cause: -webkit-text-stroke joins segments
          with a MITER, so at 0.26em (40.8px at display size) every sharp corner in the
          letterforms threw a rectangular growth. Replaced the band with a 24-step ring of
          text-shadows: each copy is the glyph itself, offset, so the union is a true outline
          with no joins to miter and the letterform's own curvature preserved. The keyline stays
          a stroke at 0.075em, thin enough that miters never show. Verified by screenshot —
          the growths above Compile's l/i and across utput are gone.
        - >-
          DEFECT 3 FIXED — noise now on 9/9 page beds. .grained was on <body> only, so every
          band's own background painted straight over it. The grain has to sit on the element
          that paints the bed; applied via ::after on .band, .pagefoot and .hero, with the
          stronger opacity on deep beds because a dark bed shows less of the same grain.
        - >-
          DEFECT 4 FIXED — near-black lifted to the art's own deep water. --surface-sunk
          #060f0d -> #0f3238, --surface #0b1714 -> #143d43, --surface-raised -> #1b4a51. Every
          affected contrast pair RECOMPUTED, not assumed: lime holds 9.28 / 8.00 / 6.64 and
          cream ink 11.31 / 9.76 / 8.09. This also resolves the contradiction Judge found
          between the shipped page and the board's own recorded decision.
      remaining:
        - >-
          DEFECT 5 PARTIALLY FIXED, and the remainder is a DESIGN DECISION rather than a bug.
          FIXED: the panel no longer bleeds to the window — the carousel is wrapped in a
          .carousel-measure and ends at x=1302 of 1440, inside the page.
          STILL OPEN: 4 of 6 marks visible with the panel open, and the code block clips.
          Cascade-winning overrides were appended to carousel.css (a gentler selected scale,
          tighter gaps, smaller marks, more height) and the numbers did not move — which is the
          signal that this is not a CSS problem. The stage is calc(100% - 430px) when open, so
          inside a page measure roughly four marks fit; a carousel showing a WINDOW onto a row
          is what a carousel is. Judge is right that the canonical six should be visible in the
          signature moment, but satisfying both means changing the mechanic — panel below rather
          than beside, or a two-row shelf — and that is an owner-facing design call, not a
          defect to grind at. RECOMMENDED: move the panel BELOW the row at desktop, which the
          component already does under 60rem. That single change would satisfy both constraints.
        - >-
          DEFECT 6 FIXED — the Peel curl. Judge's physics was the spec and it was right: the
          flap has to HINGE ON THE FOLD, and it is smaller than what it revealed because it
          ROLLS, not because it is arbitrarily scaled. Rebuilt with transform-origin on the
          diagonal, a curved free corner (border-end-end-radius), and a five-stop gradient
          running from a shadowed underside against the fold to a lit crest at the free edge.
          The under-layer moved off --surface-sunk — that was the section bed, so the revealed
          wedge read as a HOLE PUNCHED THROUGH the card rather than a second sheet; it now uses
          --surface-raised and reads as distinct paper. Verified by screenshot: the compiled
          React is legible on its own sheet and the flap is believable. Grade B+.
      DEFECT_5_NOW_FIXED: >-
        PM made the design call the charter's R2 requires rather than blocking on the owner:
        THE PANEL MOVES BELOW THE ROW AT EVERY WIDTH. The component already did this under 60rem
        with a stated reason — "a 430px drawer on a 390px viewport is the whole screen, and a
        drawer that covers everything is a page, not a drawer." The same logic holds at desktop
        inside a measured container: 430px of a 1164px carousel is 37% of it. Promoting that
        behaviour to all widths REMOVES a breakpoint rather than adding one, and satisfies both
        constraints at once. Result at 1440: 6/6 marks visible, code no longer clipped, zero
        elements past the viewport, zero console errors.
      THE_MEASUREMENT_LESSON_IN_FULL: >-
        Three checks in this goal were wrong in two opposite directions, and the pair is the
        real lesson. document.scrollWidth UNDER-reports: an ancestor's overflow:hidden masks a
        genuinely broken page, which is how the truncated 390px hero shipped green. A raw
        getBoundingClientRect().right sweep OVER-reports: it flagged 33 "overflowing" elements
        on the Shelf that were the carousel track sliding inside its own clipped stage and code
        blocks scrolling in their own container — all correct by design. THE CORRECT CHECK IS
        BOTH: does the page actually scroll sideways, AND is there any overflow NOT contained by
        a clipping or scrolling ancestor. Under that check all three pages are clean at 390.
      receipt_note: >-
        Closed with all six defects addressed. Defects 1-4 were independently confirmed fixed by
        Judge. Defect 5 (Shelf) confirmed fixed by Judge on a STRICTER test than PM ran — a 9x9
        elementFromPoint hit-test, because visFrac against the stage tests CLIPPING but not
        COVERING. Defect 6 (Peel) took three attempts and was only resolved by changing the
        GEOMETRY rather than the numbers — see peel_resolution.
      peel_resolution: >-
        THE SHAPE WAS THE BUG. A corner triangle is the wrong reveal for a code block: code
        renders as full-width rectangular lines and a diagonal wedge only ever catches their
        ragged ends. That is why every tuning attempt traded legibility against composition —
        at 62% the wedge caught only closing braces, at 88% the code read but the card became a
        diagonal wipe. Replaced with a BOTTOM-EDGE FOLD: clip-path inset lifting the whole
        bottom edge, so the reveal is the same shape as the thing revealed. The flap hinges on
        that horizontal fold and lies back ON THE SOURCE above it, mirrored, which is what a
        folded sheet does and the only arrangement that leaves the hole empty. Verified by
        screenshot: complete terminated lines of emitted React are legible under a rolled cream
        flap that casts a real shadow.
      my_worst_mistake_this_tranche: >-
        Fixing Judge's "the flap does not span its fold" by setting scale: 1 made the flap
        CONGRUENT to the hole — reinstating verbatim the bug T006 had already found and written
        a receipt about ("the curl the SAME SIZE as the cut, so the flap covered the entire area
        it uncovered"). I reintroduced a documented defect while fixing a different one, and
        only caught it because Judge hit-tested rather than trusting the receipt.
      three_bad_metrics_in_a_row: >-
        On this component alone: (1) scrollWidth <= clientWidth is TAUTOLOGICAL for a
        block-level pre — it passed on 3px type; (2) counting a mark "visible" on partial
        overlap rather than whole visibility produced a false 6/6; (3) sampling the whole code
        box counted area legitimately behind the source card. Each was confidently reported.
        The pattern: when a metric keeps agreeing with me, it is measuring the wrong thing.
        Judge caught all three by preferring a screenshot to a number.
      a_measurement_error_worth_recording: >-
        One attempt to constrain the carousel set max-inline-size: 92rem. That is 1472px — WIDER
        than the 1440 viewport — so it did nothing at all while the measurement kept reporting
        1440 and looking like a failed selector. A max-width above the viewport is not a
        constraint. Same family of mistake as the scrollWidth false green: the check was fine,
        the value made it meaningless.
    receipt: null

