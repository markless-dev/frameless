# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless v0: the real product"
  slug: "frameless-product-v0"
  kind: existing_plan
  tranche: "Turn the proven POC pipeline into the real Frameless product: a monorepo with a compiler-extension layer consuming the markless compiler, a targets/ architecture (React 19, Solid), the equivalence oracle as product test infrastructure, and one end-to-end build command demonstrated on a real demo component library with receipts."
  status: active
  oracle:
    signal: "From a fresh checkout, one documented command compiles the demo TSRX component library into React 19 and Solid packages that (a) pass each target's conventionality gate, (b) produce green cross-target equivalence receipts (React output vs Solid output behaviorally equal under the oracle in headless Chromium, per scripted scenarios), and (c) the migrated POC evidence suites still pass."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge audit runs the fresh-checkout end-to-end flow plus all suites and records full_outcome_complete: true."
  intake:
    original_request: "I want the real frameless project, in reality — something that would change the game for frontend forever. Decide: compiler extension vs targets folder; vitest browser mode per framework for runtime checking; what all should we do."
    interpreted_outcome: "Frameless exists as a consumable product skeleton: compiler-extension layer + per-target packages + oracle harness + build entry, proven end-to-end on a real demo library with equivalence receipts."
    input_shape: existing_plan
    audience: "The user (markless/Frameless author); next tranche audiences: library authors evaluating Frameless."
    authority: requested
    proof_type: test
    completion_proof: "One documented command builds the demo library to both targets with gates + receipts green from a fresh checkout; POC evidence suites remain green; final audit records full_outcome_complete: true."
    likely_misfire: "Scope explosion driven by 'change the game forever' energy (composition/SSR/more targets creeping into v0); a grand rewrite that discards proven POC code instead of migrating it; or skeleton theater — a beautiful folder structure with no working end-to-end command."
    blind_spots_considered:
      - "The markless fixing board owns the markless repo right now — this goal must not touch it; IR-upstreaming waits for that board to close."
      - "React target bump 18.3.1 -> 19 changes the ref story and possibly act/testing semantics; must be validated, not assumed."
      - "The demo library has no hand-written references — its receipts are CROSS-TARGET equivalence (React vs Solid outputs) plus scenario scripts; that is the product's actual value prop and must be exercised."
      - "npm naming unresolved (frameless is squatted/stale) — publishing is out of scope; package names internal until resolved."
      - "The POC packages are the evidence base for the shipped report — migration must not break their suites."
    existing_plan_facts:
      - "Architecture (user-confirmed): compiler extension AND targets folder at different layers — the enriched IR (poc/05, frameless-enriched-ir contract) is the compiler-extension pass consuming markless's semantic graph + TSRX AST; targets/react and targets/solid each own emitter + conventionality-gate config + oracle adapter + framework-version matrix."
      - "Runtime verification: vitest browser mode per framework (poc/08 pattern) becomes the product test harness; receipts become the per-release support matrix."
      - "React target: 19 (ref-as-prop, no forwardRef). Solid: v2-forward idioms, v1 runtime fallback documented until the v2 toolchain exists."
      - "Write-on-change is regular state (user decision) — no sink primitive needed this tranche; mount-scoped work is a markless-language question queued behind the markless fixing board."
      - "Consume markless via pinned vendored artifacts (poc/vendor pattern) until the fixing board closes; then re-pack and re-verify."
      - "Composition surface (children/slots, shared->context, refs) is the NEXT tranche, designed per the recorded discussion; v0 covers the proven fixture-family surface."
      - "Migrate proven POC code; do not rewrite from scratch. POC packages stay intact as evidence."
      - "2026-07-19 user constraint: per-target IDIOM DOSSIERS — before each target package, a corpus-evidenced research pass (grep MCP if connected, framework docs, and the local framework repos under /Users/jacksm5pro/dev/open-source e.g. solid/, qwik/) records the most idiomatic pattern per IR construct (e.g. derived state: Solid createMemo; React useMemo-vs-derived-in-render decided with evidence and thresholds), each decision with citations; the emitter implements the dossier and the conventionality gate enforces it. Verification is layered: (1) IR/compiler contract tests, (2) emitter golden/freshness tests, (3) conventionality gate (build+lint+AST policies from the dossier), (4) browser-mode runtime equivalence via the oracle, (5) fresh-checkout end-to-end."
      - "2026-07-19 user constraint: monorepo conventions MUST match the markless repo (it will be pushed to the markless GitHub org): pnpm workspace layout under packages/, package.json/tsconfig shapes, test lanes and doctor-script pattern, specs/ discipline, CONTRIBUTING package map, agent playbook file pattern (agent/<name>.md), and tooling choices (vitest, vite/rolldown) mirrored from /Users/jacksm5pro/dev/open-source/markless — read-only reference."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/frameless-product-v0/"
    command: "npx goalbuddy board docs/goals/frameless-product-v0"

