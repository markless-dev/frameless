      - "demos/svelte-official - the shape a new official demo must match. CORRECTED 2026-07-27: this input originally named react-official and solid-official, but those run a hand-written server.js while svelte-official runs no server of its own, and is both fresher and structurally closer to whatever a Vue lane becomes."
