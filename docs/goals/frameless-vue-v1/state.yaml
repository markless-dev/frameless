    INHERITED RULING, do NOT re-litigate. frameless-svelte-v1 T005 ruled IR-4 DEFERRED and
    STRENGTHENED after re-running all six gates against a real emitter at a pinned version.
    Binding text, verbatim: "A lane discharges ONLY the Gate 1 absent-framework deferral and the
