  kind: specific
  tranche: "Land a Vue lane end to end - official scaffold, emitter, gate, goldens, demo, e2e row asserting S1/S2/S3 equality with the existing three - then run the ratified idiom policy on Vue's flagship sugar now that Gate 1 and Gate 6 can resolve."
