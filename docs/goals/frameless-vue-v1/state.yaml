    "markup the server never sent" class in all four lanes and loses the class "S3 text seeded
    wrong at hydration, in the SOLID AND REACT lanes".
    CORRECTED 2026-07-27 by the T999 re-audit: the earlier text said "SOLID LANE ONLY" and that was
    MEASURABLY FALSE. react-dom 19.2.3 also rewrites the value CONTENT ATTRIBUTE at hydration -
    initInput skips the property write while hydrating (react-dom-client.development.js:1720) but
    sets element.defaultValue UNCONDITIONALLY at :1721, and .defaultValue reflects the content
    attribute; the hydration call site is :5287. Measured in Chromium twice, with a non-React input
    on the same page as a frozen-attribute control (seed=bye -> react attr "bye", control attr
    "hello"). PM verified both source lines. The qwik cell of that table remains INHERITED PROSE,
    NEVER MEASURED - treat it as unestablished. THE LESSON FOR THIS BOARD, which is why the
    correction is recorded rather than silently applied: two audit passes checked the DISTRIBUTION
    of a false sentence and neither checked the TRUTH of its replacement, and the replacement was
    labelled "measured" when what had been measured was an emitted golden - which cannot decide
    whether a framework rewrites an attribute at hydration. That is this repo's recurring
    proxy-for-measurement fault recurring one layer up, in the documentation. THE PRECEDENT TO INHERIT, verbatim: "An observation must
    be read where its name claims; a site correction is legitimate even when it trades coverage,
    provided the trade is uniform, the loss is enumerated PER LANE, and a re-open trigger names the
    lost class." So if this board moves a measurement site, it owes a per-lane loss table and a
    re-open trigger - an undisclosed or non-uniform trade is NOT covered by this precedent. Related:
    the three-part widening test's criterion 2 was restated for the same reason; it demanded a
    strictly SMALLER accepted-behaviour set AND a written statement of what the old check caught
    that the new cannot, which cannot both hold. Full trail in
    docs/goals/frameless-svelte-v1/notes/T006-value-attribute-ruling.md.
