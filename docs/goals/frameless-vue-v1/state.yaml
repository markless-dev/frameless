    caught the PM's original closing sentence contradicting the verbatim quote two lines above it:
    IR-4 may NOT be invoked as a blocker before G2-G5 have been scored against a real emitter. A
    version-gated sugar that FAILs G2 or G5 is DENIED, not deferred - T005 ruled worked example 6
