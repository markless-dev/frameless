  - id: T005
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Now that a Vue lane exists at a pinned version, re-run the idiom policy on at least one Vue sugar question and record whether Gate 1 and Gate 6 actually clear."
    inputs:
      - "docs/emitter-idiom-policy.md worked examples 2 and 3 (Vue shorthands, defineEmits) - both currently DEFERRED"
      - "The landed Vue lane"
    constraints:
      - "Do not implement. Rule."
      - "This is the test of whether the lane discharged the deferral or merely claimed to. If Gate 1 still cannot be measured, say so."
      - "Record the ruling in the policy's own format so it can be folded back into docs/emitter-idiom-policy.md by a later package."
    expected_output:
      - "Six gate outcomes for at least one Vue sugar question"
      - "Whether Gate 1 and Gate 6 cleared, with evidence"
      - "Ruling, and whether docs/emitter-idiom-policy.md needs updating"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      note: notes/T005-vue-shorthand-ruling.md
      rationale: "Re-ran all six gates on worked example 2 against vue@3.5.40 as resolved in the lockfile. G1 PASS (empty errors AND tips for both forms across four compile modes; template codegen and production compileScript byte-identical; SSR HTML byte-identical; two calibrated negative controls; eslint-plugin-vue measured two-sided). G2/G3/G5 PASS. G4 PASS structurally via compiler-core's ondirname plus a 28-member domain sample. G6 PASS: pnpm e2e drives demos/vue-official on the exact copied goldens. Ruling: v-bind/v-on shorthands WITH A VALUE are sugar and adopted; the v-slot limb SPLITS OFF and is DENIED."
      summary: "GATE 1 AND GATE 6 BOTH CLEARED - neither remains DEFERRED, so the Vue lane genuinely discharged the deferral rather than merely claiming to. Worked example 2 splits: 2a (: and @ with a value) is sugar, all six gates PASS; 2b (#header / v-slot) is DENIED on G4 UNKNOWN plus G6 FAIL. docs/emitter-idiom-policy.md needs three edits, and the Vue emitter's decision-site comment currently rules the OPPOSITE way and must be rewritten."
      the_entry_did_not_survive_as_one_entry: "Worked example 2 bundled v-bind, v-on and v-slot. Two of them were only ever travelling on the third's deferral, and when the deferral lifted they parted company. #header has NO DECIDING FUNCTION AT ALL - packages/frameworks/vue/src/emitter/index.ts contains no v-slot path and packages/compiler/src/schema.ts:173 is default-slot-only - so its totality is VACUOUS, which is the exact move worked example 7 explicitly refused. Splitting the entry is the ruling, not a bookkeeping convenience."
      strongest_evidence_is_a_source_line_not_a_sample: "@vue/compiler-core@3.5.40 dist/compiler-core.cjs.js:2435 normalises ':' -> bind, '@' -> on and '#' -> slot inside ondirname, at PARSE TIME, before any argument or modifier is read; the raw spelling survives only as rawName. That is why Gate 4 is a STRUCTURAL claim. The 28-member domain sample is its CALIBRATION, not its basis - a distinction this board has had to make before."
      judge_held_a_hypothesis_and_measured_it_FALSE: "The Judge predicted the flip would introduce a version hazard via the value-less same-name shorthand (3.4-gated). MEASURED AT 3.5.40: <span v-bind:count> compiles exactly like <span :count>, and value-less v-on errors in BOTH spellings. The hazard is SYMMETRIC and already latent in the longhand we ship today - which converts it from a blocker into a cheap standing assertion in the follow-on Worker package. Recorded because a predicted blocker that dissolves under measurement is worth as much as one that survives."
      evidence:
        - "pnpm-lock.yaml:367-369 and :725-727 - vue@3.5.40(typescript@6.0.3) at BOTH importers; Gate 1's 'DEFERRED - framework absent' is discharged"
        - "@vue/compiler-core@3.5.40 dist/compiler-core.cjs.js:2435 - ondirname normalises the spelling at parse time"
        - "packages/frameworks/vue/generated/{S1,S2,S3}.vue vs mechanical shorthand twins: empty errors AND tips both forms x 4 modes; template codegen byte-identical x4; production inlineTemplate compileScript byte-identical x4; SSR HTML byte-identical at 155/561/521 bytes"
        - "Negative controls, calibrated: v-on:input -> .stop DIFFERS in client modes and is IDENTICAL in SSR modes (the SSR arm is blind to event routing - itself worth knowing); v-bind: -> v-bind:data-planted- DIFFERS in rendered HTML"
        - "Domain sample over the emitter's own ATTRIBUTE_NAME and event-name regexes: 19 binding names + 9 event names x 4 modes, zero divergence; a planted divergent member reports true"
        - "eslint-plugin-vue@10.10.0 two-sided: flat/essential clean on BOTH forms; flat/strongly-recommended reports vue/v-on-style (S1,S2,S3) and vue/v-bind-style (S2,S3) on the LONGHAND and NEITHER on the shorthand"
        - "packages/frameworks/vue/src/gate/index.ts checkSources at HEAD: 0 violations longhand, 30 shorthand (25 no-directive-shorthand + 5 baseline-form-inventory) - the form is already pinned in text and must be INVERTED, not deleted"
        - "demos/vue-official/package.json:7 copy-emitted copies the three goldens on every dev and build, and the checked-in demo files are byte-identical to the goldens - so the e2e lane drives the exact emitted text (this is the G6 basis)"
        - "packages/compiler/src/schema.ts:173 - the IR's only slot kind is default-slot-projection (IR-3)"
      missing_evidence:
        - "NO BEHAVIOURAL CHECK CAN DISTINGUISH SHORTHAND FROM LONGHAND, because they are behaviourally identical. A silent revert to longhand would be caught by the gate's TEXT policy alone. Recorded so the G6 PASS is not over-read as a behavioural pin on the spelling."
        - "Worked example 3 (defineEmits) still carries 'G1 DEFERRED - framework absent', a label no longer available. Its DENIED ruling is unchanged because G5 FAIL outranks, but the entry needs a cheap re-run - queued as T007 rather than folded in silently."
        - "The ':' and '@' version floors remain unverified in the same sense every existing Vue and Svelte inventory floor is: the resolved package dates neither the shorthand nor the longhand."
      pm_relay_to_the_angular_board: "The Judge asked that this be relayed and the PM has done so on the Angular board: Gate 1's 'Vue and Angular are absent today' sentence is now FULLY false, not half - the Angular lane landed while this ruling was being taken, and demos/angular-official is green in a six-row e2e. Worked example 2's DEFERRED phrasing must not be inherited as a template by the Angular idiom re-run."
      pm_adaptation_of_the_worker_package: "The Judge's worker_package is ADOPTED but NOT dispatched verbatim, because the tree moved underneath it while it ran. Three corrections, all recorded on the T006 card: (1) its verify says 'pnpm e2e # FIVE demos x 3 scenarios' - there are now SIX, and the byte-identity requirement covers all 18 observation strings across six lanes; (2) its freeze list predates demos/angular-official, which must be added; (3) it uses git diff --exit-code over scripts/ and demos/react-official, both of which are legitimately DIRTY from the Angular lane, so an --exit-code check there would fail on landed work rather than on a regression. Replaced with asserted content hashes captured by the PM at dispatch. A verify command that cannot pass on a correct tree is not a verify command."
