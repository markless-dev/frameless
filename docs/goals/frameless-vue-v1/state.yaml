# PREPPED, NOT STARTED. Created by frameless-idiom-policy-v1 task T007 on 2026-07-26.

version: 2

goal:
  title: "Frameless Vue adapter v1"
  slug: "frameless-vue-v1"
  kind: specific
  tranche: "Land a Vue lane end to end - official scaffold, emitter, gate, goldens, demo, e2e row asserting S1/S2/S3 equality with the existing three - then run the ratified idiom policy on Vue's flagship sugar now that Gate 1 and Gate 6 can resolve."
  status: active
  started: >-
    STARTED 2026-07-27. T001 Scout dispatched by the PM after frameless-svelte-v1 landed its
    lane (pnpm e2e green, four rows) and ruled IR-4. This board is no longer prepped-only;
    the previous "NOTHING IS RUNNING THIS BOARD" banner is withdrawn as of that dispatch.
  inherited_gaps_revalidated: >-
    Two of the three standing gaps inherited from frameless-idiom-policy-v1 are now FIXED and the
    charter has been corrected: pnpm check DOES typecheck emitted output (three tsc passes plus a
    per-package emitted-typecheck lane), and pnpm test:browser runs clean (react 55/55, solid
    44/44). Still true: pnpm e2e pins dev mode only, scenarios.box.ts modes ['dev'].
  ir_4_ruled_by_svelte: >-
    INHERITED RULING, do NOT re-litigate. frameless-svelte-v1 T005 ruled IR-4 DEFERRED and
    STRENGTHENED after re-running all six gates against a real emitter at a pinned version.
    Binding text, verbatim: "A lane discharges ONLY the Gate 1 absent-framework deferral and the
    Gate 6 no-lane deferral. It does NOT touch G2, G3, G4 or G5, and it does NOT satisfy the
    version corollary's second conjunct." So landing this lane clears Gate 1 and Gate 6 for this
    framework's sugar and NOTHING else. Every version-gated sugar ruling on this board must DEFER
    on IR-4 grounds and say so. Recorded by the PM on 2026-07-27.
  s3_contract_changed_option_d: >-
    demos/react-official/three-way-contract.ts now reads S3's `text` observation from the SERVED
    PAYLOAD (served.text), not the post-activation live DOM, and `served: EnvironmentResponse` is a
    REQUIRED parameter threaded through runScenario at all four existing call sites. A new lane must
    thread it too. Ruled as OPTION D by frameless-svelte-v1 T006, implemented by its T007, after
    svelte 5.56.8's remove_input_defaults() was found to delete the value ATTRIBUTE on hydration by
    design. servedClientEntry and expectedNavigations are total Readonly<Record<...>> tables.
  svelte_is_the_freshest_precedent: >-
    demos/svelte-official is a landed 4th e2e lane and docs/goals/frameless-svelte-v1 is the closest
    prior board. Read both before planning. pnpm e2e is green with four rows, all observations equal.
  instrument_rules: >-
    THREE STANDING CONSTRAINTS added by T010, full text in goal.md. This board adds four new
    instruments and four of six findings on the defects goal were instrument faults. (1) Two-variable
    triangulation before any finding is filed - and a finding that reproduces on a stock official
    scaffold with none of our code is evidence the TEST is unfair, not that the framework is broken.
    (2) Every instrument asserts its own preconditions. (3) Two-sided calibration for harnesses, not
    only gates - a settle loop that cannot throw is not a settle loop.
  oracle:
    signal: "pnpm e2e includes a Vue row driving an official Vue scaffold at the pinned lockfile version, and its S1/S2/S3 observations are ASSERTED equal to demos/react-official, demos/solid-official, demos/qwik AND demos/svelte-official under the same matrix."
    cadence: "after each Worker package and at final audit"
    final_proof: "A green pnpm e2e receipt naming the Vue row, plus at least one Vue idiom question run through all six policy gates reaching a non-DEFERRED Gate 1 and Gate 6 - proving the lane actually discharged the deferral."
  intake:
    original_request: "Owner asked, during frameless-idiom-policy-v1: 'I'm also wondering if we should start the goals for Vue, Angular, and Svelte.' This board is the Vue answer, prepped after the idiom policy was ratified so it inherits a decided rule instead of re-litigating one."
    interpreted_outcome: "Vue becomes a FIFTH frameless target with proven activation neutrality on official tooling."
    input_shape: specific
    audience: "frameless maintainers and future adapter authors"
    authority: requested
    proof_type: test
    completion_proof: "Vue row green in pnpm e2e with asserted S1/S2/S3 equality."
    likely_misfire: "Building a Vue emitter that produces plausible-looking Vue source and calling it done, without an official-scaffold lane proving the emitted components actually activate equivalently. The repo has already paid for this once - see the Qwik hand-rolled-harness episode."
    blind_spots_considered:
      - "SFC vs Vue JSX is an unforced decision that changes tooling, goldens, gate and demo consumption. React/Solid/Qwik all emit JSX; Vue is the first target where that is not obvious."
      - "Vue's flagship sugar (v-model / defineModel) is blocked by IR-1 AND IR-4, not by taste. The adapter work and the sugar question are separable and must not be conflated."
      - "poc/09-storage/vue exists from earlier work and assumed cheap lexical sugar with classic lifecycle shapes. That is a prior in-repo assumption, not a validated decision."
    existing_plan_facts:
      - "docs/emitter-idiom-policy.md governs every emission-site form choice. Run the six gates; record outcomes. Do NOT amend the policy from inside this board."
      - "Official scaffold only (npm create vue@latest or current official equivalent), used as it ships. No hand-rolled SSR harness."
      - "IR gaps biting Vue: IR-1 no bindable prop kind (blocks defineModel), IR-2 no emit concept (blocks defineEmits), IR-3 default slot only (blocks named v-slot), IR-4 no framework-version input (defineModel needs 3.4+), IR-5 two-item modifier vocabulary vs Vue's ten v-on modifiers, IR-6 no class/style binding vocabulary, IR-7 purity never asserted."
      - "GATE 6 DEFERRED: every Vue sugar ruling is deferred-not-denied until this board lands a Vue lane at a pinned lockfile version. That is the policy's own rule, and it is the first-order reason this board exists."
      - "CORRECTED 2026-07-27 (T010 revalidation): pnpm check DOES now typecheck emitted output - three tsc passes plus a per-package emitted-typecheck lane. NOT a gap. STILL TRUE: pnpm e2e pins dev mode only."
      - "CORRECTED 2026-07-27: pnpm test:browser does NOT hang - it runs clean, react 55/55 and solid 44/44."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

