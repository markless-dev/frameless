    stop_if:
      - "Need files outside allowed_files."
      - "pnpm-lock.yaml moves, or any dependency needs installing. Stop and report the exact package and version; the PM installs before re-dispatch."
      - "`vue` and `@vue/compiler-sfc` do not resolve to the SAME version. Gate 1 would then have two answers and the compile() oracle would measure a build the browser lane does not run."
      - "You are about to emit a v-bind / v-on / v-slot SHORTHAND (`:id`, `@click`, `#header`) or any v-on MODIFIER (`.prevent`, `.stop`, `.self`). docs/emitter-idiom-policy.md worked example 2 rules the shorthands DEFERRED and this board's T005 re-runs its six gates. Pre-adopting makes T005 ratify a fait accompli - the exact failure frameless-svelte-v1 T002 named. Emit longhand and a plain in-body event.preventDefault()."
      - "You are about to emit defineModel, defineEmits, or v-model. IR-1 and IR-2, out of scope on two independent axes; worked example 3 is already ruled DENIED at Gate 5."
      - "You are about to emit typed props - defineProps<{...}>(), lang=\"ts\", or any type annotation. The IR carries NO prop type field (PropDestructuringEntry, schema.ts:205-212), so every type would be INVENTED from expression contents, which Gate 3 forbids, and unsound for any prop the corpus does not exercise, which Gate 4 forbids. Ruled IR-8 and deferred."
      - "You are about to build an emitter code path for stopPropagation. VERIFIED zero occurrences across all twelve existing goldens, so that path would be UNTESTED DEAD CODE - worse than absent code in an emitter. Throw at emit time with a gate row proving the throw fires."
      - "You are about to choose the event-emission form, or the whitespace layout, on DOCUMENTARY evidence. Gate 1 records FAIL for documentary-only evidence once the framework is in the lockfile, and this package puts it there. Measure M1, M2 and M3 in a real browser first."
      - "A gate policy, the compile-emitted empty-diagnostics assertion, the baseline-form-inventory, or the console-warning check cannot be made to go RED. A check that cannot fail is not a check."
      - "Any mutation in the gate corpus is built with a bare .replace(). Copy the THROWING mutate/mutateAll constructor from packages/frameworks/qwik/test/gate.test.ts - its own doc comment instructs a new adapter to do exactly this. Audited corpus-wide by defects-and-targets T018."
