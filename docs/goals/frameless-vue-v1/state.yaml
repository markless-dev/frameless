  - id: T007
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: medium
    objective: "Cheap re-run of worked example 3 (defineEmits) at Gate 1 and Gate 4 now that the Vue lane exists; the DENIED ruling is expected to stand, only its labels are stale."
    why_this_exists: >-
