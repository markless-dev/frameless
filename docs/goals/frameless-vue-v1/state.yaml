tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the official Vue scaffold, its activation model, and what a Vue row in scripts/e2e.mjs would require."
    inputs:
      - "The current official Vue scaffold (npm create vue@latest) - what it ships with, and at what versions"
      - "scripts/e2e.mjs - the activation matrix and its hydrate/resume vocabulary"
      - "demos/svelte-official - the shape a new official demo must match. CORRECTED 2026-07-27: this input originally named react-official and solid-official, but those run a hand-written server.js while svelte-official runs no server of its own, and is both fresher and structurally closer to whatever a Vue lane becomes."
      - "poc/09-storage/vue - prior in-repo assumptions"
      - "packages/compiler/src/schema.ts - IR-1 through IR-7 as they actually stand"
    constraints:
      - "Read-only."
      - "Do NOT scaffold anything yet; report what scaffolding would produce."
      - "Answer the SFC-vs-JSX question with evidence about tooling consequences, but do NOT rule on it - that is Judge work."
    expected_output:
      - "Official scaffold contents and pinned versions"
      - "Vue's activation model and whether the e2e vocabulary covers it"
      - "What a Vue row in the e2e matrix concretely requires"
      - "SFC vs JSX: consequences of each for goldens, gate, tooling and demo consumption"
      - "Which of IR-1..IR-7 actually block S1/S2/S3, versus which only block sugar"
    receipt:
      result: done
      harness: claude-code
      summary: >-
        HEADLINE, and it is a charter conflict rather than a detail: `npm create vue@latest`
        (create-vue@3.23.0) scaffolds a CLIENT-ONLY SPA. Scripts are exactly dev=vite,
        build=vite build, preview=vite preview; template/entry/default/src/main.js is
        `createApp(App).mount('#app')`; grepping the whole bundle for ssr|nuxt yields ONE hit and
        it is the `**/dist-ssr/**` eslint ignore glob. There is no entry-server, no createSSRApp,
        no server.js anywhere in the scaffold. SvelteKit and Qwik server-render by default; Vue
        does not. Every S1/S2/S3 observation opens with "server-rendered ..." and
        assertServedActivation demands a client-entry literal in a markup payload, so a stock
        create-vue app CANNOT satisfy the oracle. Which scaffold supplies SSR is a T002 ruling and
        it is UPSTREAM of SFC-vs-JSX.
      vite_aligns: >-
        Vue is the Svelte case, not the Qwik case. Scaffold declares vite ^8.1.5 against the root
        catalog's ^8.0.16 (pnpm-workspace.yaml:16) - same major range, one vite instance.
        @vitejs/plugin-vue@6.0.8 peers vite ^5||^6||^7||^8. NO PIN NEEDED.
      scaffold_versions: "create-vue@3.23.0, vue@3.5.40, @vitejs/plugin-vue@6.0.8, vite ^8.1.5, vue-tsc@3.3.8, @vue/tsconfig ^0.9.1, engines node ^22.18.0||>=24.12.0. The lint variant uses @vue/eslint-config-typescript, NOT eslint-plugin-vue by name."
      e2e_needs_a_row_not_a_widening: >-
        scripts/e2e.mjs:32-36 officialDemos rows are {framework, activation, directory} and
        activation is already 'hydrate'|'resume'. Vue hydrates, so e2e.mjs needs a FIFTH ROW plus
        participation in the threeWay equality at :442-457 - no vocabulary widening, unlike Svelte.
        What does move: three-way-contract.ts:42-46's hydrate arm is the literal union
        'react'|'solid'|'svelte', and adding 'vue' forces both total tables - servedClientEntry
        (:77-81) and expectedNavigations (:104-109, react 0 solid 0 qwik 1 svelte 1). Omission is a
        compile error, which the doc comments at :62-76 and :101-103 say is the point.
      both_table_values_must_be_MEASURED: >-
        servedClientEntry must be read from the payload, never guessed - react and solid share
        '/src/entry-client.jsx' only by scaffold coincidence while SvelteKit owns
        '@sveltejs/kit/src/runtime/client/entry.js'. expectedNavigations is 0 if no router
        (create-vue's router is optional) and likely 1 under Nuxt. Both depend on the scaffold ruling.
      activation_marker: >-
        onMounted imported from 'vue', called in the ROOT App component - the exact structural
        analogue of Svelte's onMount in +layout.svelte. Vue flushes mounted hooks child-first like
        Svelte, so the root component's onMounted is last in the tree, preserving the ordering
        property Svelte's dissent demanded evidence for. Setting the marker after mount() returns in
        the entry module is the shape Svelte's T002 explicitly ruled out.
      ir_gaps: >-
        NONE of IR-1..IR-7 blocks S1/S2/S3 for Vue - matching the Svelte result. IR-1/2/3/6 are
        sugar-only (defineModel, defineEmits, named v-slot, :class). IR-5's two actions cover the
        corpus: S3 needs only preventDefault, expressible as a plain in-body event.preventDefault();
        Vue's @submit.prevent is sugar over it. IR-7 is soundness, addressable as Svelte did it - a
        conservative reject-list over computed(...) rather than $derived(...).
      the_dev_sink_matters_MORE_for_vue: >-
        RULE-4 FINDING, and the sharpest thing in this receipt after the SSR gap. Vue does NOT fail
        on hydration mismatch - it emits 'Hydration text mismatch' / 'Hydration node mismatch'
        through console.warn and then PATCHES THE DOM TO MATCH THE CLIENT. So without a warn sink a
        Vue lane CAN PASS GREEN WHILE HYDRATION IS GENUINELY MISMATCHING. There is no
        hooks.client.ts analogue; the nearest shape is a sink module imported at the top of the
        client entry before mount, optionally plus app.config.warnHandler. Self-calibration copies
        demos/svelte-official/src/hooks.client.ts - plant one warn and one error, require each
        captured EXACTLY ONCE (catches both non-install and double-install), drain, then write
        data-frameless-dev-sink=calibrated.
      vue_tsc_hole_is_emitter_controlled: >-
        Svelte's calibration table is unknown prop RED, missing prop RED, WRONG-TYPED prop GREEN,
        because emitted output carries no prop types. vue-tsc checks route call sites identically,
        so the hole TRANSFERS - but for Vue it is emitter-controlled. defineProps(['label']) types
        every prop `any`; defineProps<{...}>() carries real types and would CLOSE the hole Svelte
        could not close. That is an emitter-format consequence with a real instrument payoff.
      sfc_vs_jsx_evidence_not_ruled: >-
        copy-emitted is extension-agnostic (one-line copyFileSync in all four demos) - zero cost
        either way. SFC repeats Svelte's T003 divergence 1 (nothing in this workspace parses .vue,
        so format-emitted becomes an assertion over deterministic text rather than an oxfmt rewrite)
        and divergence 2 (.vue is a DEFAULT export, so the IR's named ComponentExport cannot be
        honoured by spelling), and adds a new one (plain tsc cannot read .vue, so vue-tsc becomes a
        distinct pass inside pnpm check). JSX reuses oxfmt, keeps named exports, and is checkable by
        the existing `tsc -p` pattern. THE NON-OBVIOUS INPUT - eslint-plugin-vue is a TEMPLATE
        linter driven by vue-eslint-parser and does NOT lint Vue JSX, so the JSX branch has the
        WEAKER arbiter, inverting the usual JSX-is-better-tooled intuition.
      whitespace_must_be_remeasured: >-
        Vue's SFC compiler defaults to whitespace:'condense', a DIFFERENT rule from Svelte's, so
        T003's measurement 3 and its newline-inside-the-closing-tag idiom do NOT carry over and must
        be re-measured against the react/solid text observations.
      what_does_not_transfer_from_svelte:
        - "Svelte's S3 value-attribute problem does NOT recur. It came from svelte's hydration-only remove_input_defaults; Vue's hydration does not strip the value attribute. Vue inherits the Option D served-payload read as a free benefit rather than a necessity."
        - "Svelte's DELEGATION question does not arise. Svelte 5 delegates click to the root and simulates propagation, which forced T003's four-cell behavioural measurement of preventDefault. Vue attaches real listeners at the element, so both the Qwik async-QRL failure mode and the Svelte delegation uncertainty are structurally absent - but instrument rule 1 still requires the triangulation to be RUN, not assumed."
        - "The two-negative-arm calibration on the served read lives INSIDE the shared contract (three-way-contract.ts:275-330). A Vue lane inherits it by calling the same function - no per-lane reimplementation."
      contradictions_found:
        - "PM PREMISE WAS WRONG. The PM's brief said all four existing gates import a third-party plugin at src/gate/index.ts:5. FALSE for Svelte: packages/frameworks/svelte/src/gate/index.ts:3 is `import { parse } from 'svelte/compiler'` and the file contains no eslint plugin. Only react, solid and qwik fit that shape. Svelte deliberately used the framework's OWN COMPILER as its arbiter - which for Vue maps to @vue/compiler-sfc parse/compile, shipped inside vue, and is the closer precedent. PM has issued this correction to the Angular scout."
        - "ORDINAL: goal.md:7 and state.yaml:37 call Vue 'a fourth frameless target'. Svelte already landed as the fourth (scripts/e2e.mjs:36). VUE IS THE FIFTH. Cosmetic, but any 'four lanes' assertion text will be off by one."
        - "STALE NOTE: docs/goals/frameless-svelte-v1/notes/T003-svelte-emitter.md:124 says eslint-plugin-svelte is not in the lockfile. It now is (pnpm-lock.yaml:2839, :6898). Do not cite that line as current."
        - "STALE INPUT LIST: state.yaml:100 names react-official and solid-official as the shape to match. Those run a hand-written server.js; demos/svelte-official runs no server of its own and is both fresher and structurally closer to whatever a Vue lane becomes."
        - "poc/09-storage/vue contains ONLY build.mjs and main.js - no package.json, no .vue file, no vue dependency. goal.md:46's characterisation of it is not evidenced by the directory as it stands."
      pre_install_set_pm_owns: >-
        ZERO Vue packages in the lockfile - `grep -c vue pnpm-lock.yaml` returns 0. Workers must not
        move the lockfile, so the PM installs. Runtime: vue@3.5.40, @vitejs/plugin-vue@6.0.8,
        vue-tsc@3.3.8, @vue/tsconfig ^0.9.1. Arbiter, ONLY IF the SFC branch is ruled:
        eslint-plugin-vue@10.10.0 plus its REQUIRED separate peer vue-eslint-parser ^10.3.0 (other
        peers already satisfied - eslint 9.39.5, @typescript-eslint/parser 8.65.0). PM HELD THIS
        INSTALL until T002 rules, because both the scaffold choice and the SFC/JSX choice change the
        set, and installing the wrong one moves the lockfile for nothing.
      devtools_contaminant_flagged: >-
        vite-plugin-vue-devtools ^8.1.5 is in the scaffold's DEFAULT devDependencies. It injects an
        overlay and its own module graph into the dev page, so it will appear in served payloads and
        can add console output - a candidate served-payload contaminant AND dev-sink false positive
        for whoever measures the client-entry literal.
      commands:
        - "npm view create-vue version; npm pack create-vue@latest; tar xzf into scratchpad"
        - "cat template/base/package.json, template/entry/default/src/main.js, template/tsconfig/base/package.json, template/linting/core/ts/eslint.config.js.ejs"
        - "grep -o 'ssr|nuxt' bundle.js -> 1 hit, the dist-ssr eslint ignore glob"
        - "grep -c vue pnpm-lock.yaml -> 0"
        - "sed -n 1,12p packages/frameworks/{react,solid,qwik,svelte}/src/gate/index.ts"
        - "grep -n 'HydrateFramework|servedClientEntry|expectedNavigations|served|runScenario' demos/react-official/three-way-contract.ts"
      note_needed: false

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Ratify the Vue adapter contract: emitted format, S1/S2/S3 scope, and which IR gaps must be closed versus deferred."
    inputs:
      - "T001 receipt"
      - "docs/emitter-idiom-policy.md"
    constraints:
      - "Do not implement."
      - "Rule on SFC vs Vue JSX explicitly, with the reasoning recorded - this decision is expensive to reverse."
      - "Separate what S1/S2/S3 activation neutrality REQUIRES from what Vue idiom sugar would merely be nicer with. Only the former blocks this board."
      - "Any IR change proposed here must be justified as required for activation neutrality, not for ergonomics."
    expected_output:
      - "Emitted-format ruling with rationale"
      - "S1/S2/S3 scope for the first Worker package"
      - "IR gaps: must-close vs deferred, each justified"
      - "Exact Worker objective, allowed_files, verify, stop_if"
    receipt:
      result: done
      decision: approved
      harness: claude-code
      full_outcome_complete: false
      headline: >-
        T001's headline is right but its THREE scaffold options collapse into TWO. T002 packed
        create-vite-extra@5.0.2 and diffed template-ssr-react/server.js against
        demos/react-official/server.js: THEY ARE THE SAME FILE, differing only by the inline handler
        being lifted into createSsrHandler; index.html differs in <title> alone; the dependency
        block (compression ^1.8.1, express ^5.2.1, sirv ^3.0.2, cross-env ^10.1.0) is BYTE-IDENTICAL.
        So option (c) was MISDESCRIBED in the brief - nobody hand-rolled react-official's server, and
        two of four existing lanes already run this template family. That collapses (b) and (c) and
        makes (b) the INCUMBENT precedent rather than the risky novelty. It also means
        servedClientEntry being '/src/entry-client.jsx' for both react and solid is NOT the "scaffold
        coincidence" three-way-contract.ts:56-59 supposes - it is one template.
      ruling_1_scaffold: >-
        create-vite-extra template-ssr-vue-ts. goal.md:16's scaffold sentence is AMENDED IN THE OPEN,
        not ignored: the clause being read is the SECOND sentence (no hand-rolled SSR harness - the
        rule), while the first names a particular that T001 proved cannot satisfy the oracle. Nuxt
        was MEASURED, not dismissed: @nuxt/vite-builder@4.5.1 depends on vite ^8.1.5, the same major
        as the catalog, so the Qwik version-collision argument FAILS and is not why Nuxt loses. Nuxt
        loses on ~60 direct dependencies including rolldown, @nuxt/nitro-server, unimport auto-imports
        (which would auto-register emitted components and could MASK an emitter bug), @nuxt/devtools
        (served-payload contaminant), @nuxt/telemetry (network at build time, in a sandbox with none)
        and vue-router (pushing expectedNavigations to 1 for no gain).
      ruling_1_side_effect: "vite-plugin-vue-devtools DISSOLVES as a question. It is in create-vue's default devDependencies, NOT this template's. Eliminated by construction, not managed."
      ruling_2_format_and_arbiter: >-
        SFC with <script setup>, no lang="ts", and LONGHAND v-bind:/v-on:. Both arbiters:
        @vue/compiler-sfc AND eslint-plugin-vue via vue-eslint-parser. THE BRIEF'S BALANCE WAS
        INVERTED - T001's true input is not "JSX has a weaker arbiter" but that JSX HAS NONE AT ALL,
        since @vue/compiler-sfc does not apply to it either. The JSX branch would be the only lane in
        this repo with zero framework-owned arbiter, on the board whose entire purpose is to
        discharge a Gate 1 deferral that exists BECAUSE documentary evidence is not evidence.
        Longhand is the POLICY's ruling, not the Judge's: worked example 2 already designates the
        shorthands candidate sugar, and goal.md:15 forbids amending the policy from inside this board.
        It is also what leaves T005 a live question capable of reaching a non-DEFERRED Gate 1 and
        Gate 6 - this board's stated final_proof. A worker reaching for @click on reflex would hand
        T005 a fait accompli.
      ruling_2_vue_tsc_narrowed: >-
        vue-tsc is NOT required at T003, on frameless-svelte-v1 T002 ruling 6's reasoning verbatim:
        T003's corpus is three self-contained components with no cross-module props, so the class
        vue-tsc adds has A POPULATION OF ZERO, and buying an instrument for a population of zero is
        exactly how this repo acquired instruments whose preconditions were never asserted. Re-open
        trigger fires at T004, where App.vue passes props to emitted components - and the template's
        own build script is already `vue-tsc -b`, so it arrives FROM THE SCAFFOLD as svelte-check did.
      ruling_3_prop_types_NO_and_it_is_IR_8: >-
        REFUTES THE BRIEF'S FRAMING, and the PM verified the evidence directly.
        PropDestructuringEntry (schema.ts:205-212) carries sourceName, localName, path, alias,
        graphNodeId and defaultValue? - THERE IS NO TYPE FIELD, and none on EnrichedComponent.props
        (schema.ts:249-252) either. So defineProps<{...}>() cannot be emitted from DECLARED FACTS.
        Every type would be inferred from what expressions DO with the prop - a content-based
        trigger, which GATE 3 FORBIDS OUTRIGHT - and unsound for any prop the corpus does not
        exercise, which GATE 4 FORBIDS. The middle road does not exist either: defineProps<{ label:
        unknown }>() closes nothing the array form does not, because `unknown` accepts every wrong
        type. IT IS NOT EMITTER-CONTROLLED FOR VUE; IT IS IR-CONTROLLED FOR BOTH, and Vue is simply
        the first lane where the missing input became visible. NAMED IR-8 - no prop type input - and
        DEFERRED. The Angular scout reaching the same conclusion for strictTemplates is
        CORROBORATION THAT THE HOLE IS REAL, not a second vote for closing it here.
      ruling_3_precedent_stated_for_other_boards: >-
        "The wrong-typed-prop hole is an IR gap, and NO LANE MAY CLOSE IT BY INVENTING TYPES.
        Re-open when a board can show a FORCING CASE" - the same bar frameless-svelte-v1 T002 ruling
        3 set for IR-4, and for the same reason: a general facility designed against zero forcing
        cases is folklore. This also stays inside T002's constraint that any proposed IR change be
        justified by activation neutrality: IR-8 is NOT required for it, which is precisely why it is
        named and deferred rather than proposed. PM relayed this to the Angular judge mid-flight.
      ruling_4_dev_sink_required_and_it_has_a_trap: >-
        REQUIRED - a Vue lane can pass green while hydration is genuinely mismatching. Installs as
        the FIRST IMPORT in src/entry-client.ts, BEFORE app.mount(), at module scope so warnings
        raised DURING hydration are captured. Copy demos/svelte-official/src/hooks.client.ts: plant
        one warn and one error, require each captured EXACTLY ONCE (non-install fails the capture,
        double-install fails the count), drain, write data-frameless-dev-sink=calibrated, and have
        the box assert 'calibrated' BEFORE it trusts a count of zero.
        THE TRAP, a T004 stop condition: app.config.warnHandler INTERCEPTS Vue's own warn() channel
        and SUPPRESSES the console output. If hydration mismatches route through it, setting a
        warnHandler without re-emitting turns the sink into A GREEN VACUUM.
      ruling_5_ir_gaps: >-
        T001's "none of IR-1..IR-7 blocks S1/S2/S3" HOLDS against the corpus. IR-1/IR-2 out of scope
        hard. IR-3/IR-6 deferred, no instance. IR-4 deferred, inherited, untouched - and Vue takes
        ROUTE (b) of the version corollary's second conjunct (emit only baseline-safe forms), which
        is a CLAIM ABOUT EMITTED OUTPUT and is why the baseline form inventory is MANDATORY rather
        than optional; the policy's own baseline-form-inventory section says verbatim "The Svelte
        lane is the second way. So are Vue and Angular, by inheritance." IR-5 needs no schema change:
        preventDefault emits as an ordinary in-body statement, and stopPropagation FAILS CLOSED with
        a throw - PM VERIFIED zero occurrences across all twelve existing goldens, so an emitter code
        path for it would be UNTESTED DEAD CODE, worse than absent code. IR-7 is the sleeper again:
        conservative syntactic guard over emitted computed(...), NEVER a purity proof.
      overturned_T001_contradiction_1: >-
        T001 reported the Svelte gate imports only `parse` with no eslint plugin, and the PM
        propagated that to the Angular scout as a correction. AT HEAD IT IS FALSE:
        packages/frameworks/svelte/src/gate/index.ts:3 is `import { ESLint } from 'eslint'` and :4 is
        `import sveltePlugin from 'eslint-plugin-svelte'`. BOTH WERE TRUE AT DIFFERENT TIMES - T009
        landed the plugin AFTER the scouts read the file. The precedent is BOTH ARBITERS, FOUR FOR
        FOUR. PM verified at HEAD and relayed the retraction to the Angular judge mid-flight.
      dissent:
        - "create-vite-extra's OFFICIAL STANDING is the weakest link in the scaffold ruling. It is reachable from npm create vite@latest -> Others and sits in the Vite org's orbit, but it is not `npm create vue@latest` and a later auditor could reasonably challenge it. The answer: two landed lanes already run it, and the alternative forces either a client-only app that cannot satisfy the oracle or a genuinely hand-rolled server. Recorded so the challenge is visible rather than quietly absorbed."
        - "NOT VERIFIED: that Vue 3.5.40's hydration-mismatch message reaches window.console rather than an internal warn() that warnHandler could swallow. T001's claim is DOCUMENTARY and Gate 1 rejects documentary evidence once the framework is in the lockfile. If the T004 lane is ever green on a planted mismatch, LOOK HERE FIRST."
        - "PREDICTS defineModel is DENIED at Gate 2, not deferred - the child must declare bindability and frameless emits one module per IR. FAIL outranks DEFERRED, which would mean IR-4 was never its blocker. Inherited from frameless-svelte-v1 T002's dissent; a prediction for T005 to TEST, not a finding."
        - "M1's condense hypothesis is the Judge's and is UNMEASURED. Belief: a whitespace-only newline between two ELEMENTS is removed, while one between an INTERPOLATION and text condenses to a single space - which would make S2's '1/2' render as '1 /2'. Stated as a two-sided hypothesis rather than a fact DELIBERATELY, because acting on it would be the exact Gate 1 violation this board exists to discharge."
      missing_evidence_for_T004:
        - "Vue's hydration-mismatch warning reaching window.console - must PLANT a real mismatch and observe it before any green is read as 'hydration matched'."
        - "The literal /src/entry-client.ts as servedClientEntry - must be READ OUT OF THE PAYLOAD, never guessed, and put through calibrateServedClientEntry on every run."
        - "expectedNavigations = 0 for Vue - follows from the template shipping no router, but must be MEASURED as SvelteKit's 1 was."

  - id: T003
    type: worker
    assignee: Worker
    status: active
    reasoning_hint: high
    reasoning_hint_raised_by_T002: "Raised medium -> high. The Svelte equivalent was high, this package carries FOUR required measurements plus a baseline form inventory, and the shorthand trap is one a competent Vue author will walk into on reflex."
    objective: >-
      Land packages/frameworks/vue as a whole vertical slice for S1/S2/S3: an emitter turning the
      three existing compiler goldens into Vue 3 single-file components using <script setup> with NO
      lang="ts" and LONGHAND v-bind:/v-on: directives; a gate importing BOTH @vue/compiler-sfc parse
      AND eslint-plugin-vue (via vue-eslint-parser) plus frameless-owned policies, with a mutation
      corpus built from qwik's THROWING mutate/mutateAll; a BASELINE FORM INVENTORY discharging the
      IR-4 version corollary's second conjunct the way packages/frameworks/svelte/src/gate/index.ts
      does, with mutation rows and an anti-vacuity row; checked-in .vue goldens with a byte-equality
      freshness test; a compile-emitted oracle running @vue/compiler-sfc parse + compileScript +
      compileTemplate asserting errors AND tips are an EXACT EMPTY SET across ssr:true/false x
      dev/prod, with a mutation calibration proving it goes red; and a vitest browser lane that
      mounts the emitted corpus, fails on ANY Vue dev console warning with NO allowlist and a
      three-way sink calibration, and MEASURES M1-M4 rather than assuming them.
      No demo, no e2e row, no scaffold - T004 owns those.
    four_required_measurements: >-
      Each two-sided with a negative control (instrument rules 1-4).
      M1 WHITESPACE: Vue's SFC compiler defaults to whitespace:'condense', a DIFFERENT rule from
      Svelte's, so frameless-svelte-v1 T003 measurement 3 and its newline-inside-the-closing-tag
      idiom DO NOT CARRY OVER. Measure both arms - a whitespace-only newline between two ELEMENTS
      (hypothesis: removed) and one between an INTERPOLATION and adjacent text (hypothesis:
      condensed to a single space, NOT removed). THE OBSERVABLE AT RISK is S2's '1/2' silently
      becoming '1 /2' against the react/solid/svelte text observations.
      M2 BUBBLING: S3's emitted output puts v-on:click on the <form> itself reading
      event.target.dataset.action === 'submit', so the corpus DEPENDS on a click BUBBLING from
      [data-action="submit"] to the form. Vue attaches real listeners at the element so this is
      predicted native, but instrument rule 1 requires it RUN. Assert the full ORDERED TRACE.
      M3 PREVENTDEFAULT: a plain in-body event.preventDefault() inside v-on:click on <button
      type="submit"> must avert the real GET navigation assertS3 checks by Document-request count.
      Two-variable triangulation - vary the PRODUCT variable (call present/absent) and confirm the
      signal tracks it; the negative control proves the instrument can SEE a navigation.
      M4 VERSION IDENTITY: assert AT TEST TIME that `vue` and `@vue/compiler-sfc` resolve to the SAME
      version. If they diverge, the compile() oracle measures a different build than the browser lane
      runs, which Gate 1 names as a FAIL.
