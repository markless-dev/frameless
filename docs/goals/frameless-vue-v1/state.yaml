    demos/svelte-official is a landed 4th e2e lane and docs/goals/frameless-svelte-v1 is the closest
    prior board. Read both before planning. pnpm e2e is green with four rows, all observations equal.
  instrument_rules: >-
    FOUR STANDING CONSTRAINTS added by T010, full text in goal.md. This board adds four new
    instruments and four of six findings on the defects goal were instrument faults. (1) Two-variable
    triangulation before any finding is filed - and a finding that reproduces on a stock official
    scaffold with none of our code is evidence the TEST is unfair, not that the framework is broken.
    (2) Every instrument asserts its own preconditions. (3) Two-sided calibration for harnesses, not
    only gates - a settle loop that cannot throw is not a settle loop. (4) An instrument that
    establishes a SET or issues a VERDICT must be calibrated against a KNOWN MEMBER - plant an
    instance a scan should find, read a status field on a case whose true value you already know,
    establish a green cell's variance before treating it as a verdict. NOT redundant with rule 2:
    rule 2 would have a scan assert THAT IT RAN, not that it COVERED THE SHAPE IT NAMED.
