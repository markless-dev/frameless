    final_proof: "A green pnpm e2e receipt naming the Vue row, plus at least one Vue idiom question run through all six policy gates reaching a non-DEFERRED Gate 1 and Gate 6 - proving the lane actually discharged the deferral."
  intake:
    original_request: "Owner asked, during frameless-idiom-policy-v1: 'I'm also wondering if we should start the goals for Vue, Angular, and Svelte.' This board is the Vue answer, prepped after the idiom policy was ratified so it inherits a decided rule instead of re-litigating one."
    interpreted_outcome: "Vue becomes a FIFTH frameless target with proven activation neutrality on official tooling."
    input_shape: specific
    audience: "frameless maintainers and future adapter authors"
    authority: requested
    proof_type: test
    completion_proof: "Vue row green in pnpm e2e with asserted S1/S2/S3 equality."
    likely_misfire: "Building a Vue emitter that produces plausible-looking Vue source and calling it done, without an official-scaffold lane proving the emitted components actually activate equivalently. The repo has already paid for this once - see the Qwik hand-rolled-harness episode."
    blind_spots_considered:
      - "SFC vs Vue JSX is an unforced decision that changes tooling, goldens, gate and demo consumption. React/Solid/Qwik all emit JSX; Vue is the first target where that is not obvious."
      - "Vue's flagship sugar (v-model / defineModel) is blocked by IR-1 AND IR-4, not by taste. The adapter work and the sugar question are separable and must not be conflated. [HALF REFUTED BY T009 ON MEASUREMENT, 2026-07-27 - see the correction below. Left in place rather than edited, because this is the text the board reasoned from for its whole life and silently fixing it would hide that.]"
      - "CORRECTION TO THE ABOVE, T009: IR-1 IS LOAD-BEARING; IR-4 WAS NEVER A BLOCKER FOR EITHER LIMB. T009 scored G2-G5 before IR-4 was permitted to appear, exactly as this board's own inherited rule requires, and both limbs FAIL four gates at the shipped version - FAIL outranks DEFERRED. v-model on a host element is not version-gated at all. AND IR-1's REAL CONTENT WAS MEASURED rather than cited: every prop entry in every golden shares ONE graph node (prop:props), writable=false, writes=0, so per-prop write-back has no channel. That child-side gap is what actually decides defineModel, and IR-1 as written names only the parent-side ComponentPropExpression.kind - so the board was right that IR-1 blocks it, and wrong about which half of IR-1."
      - "poc/09-storage/vue exists from earlier work and assumed cheap lexical sugar with classic lifecycle shapes. That is a prior in-repo assumption, not a validated decision."
    existing_plan_facts:
      - "docs/emitter-idiom-policy.md governs every emission-site form choice. Run the six gates; record outcomes. Do NOT amend the policy from inside this board."
      - "Official scaffold only (npm create vue@latest or current official equivalent), used as it ships. No hand-rolled SSR harness."
      - "IR gaps biting Vue: IR-1 no bindable prop kind (blocks defineModel), IR-2 no emit concept (blocks defineEmits), IR-3 default slot only (blocks named v-slot), IR-4 no framework-version input (defineModel needs 3.4+), IR-5 two-item modifier vocabulary vs Vue's ten v-on modifiers, IR-6 no class/style binding vocabulary, IR-7 purity never asserted."
      - "GATE 6 DEFERRED: every Vue sugar ruling is deferred-not-denied until this board lands a Vue lane at a pinned lockfile version. That is the policy's own rule, and it is the first-order reason this board exists."
      - "CORRECTED 2026-07-27 (T010 revalidation): pnpm check DOES now typecheck emitted output - three tsc passes plus a per-package emitted-typecheck lane. NOT a gap. STILL TRUE: pnpm e2e pins dev mode only."
      - "CORRECTED 2026-07-27: pnpm test:browser does NOT hang - it runs clean, react 55/55 and solid 44/44."

