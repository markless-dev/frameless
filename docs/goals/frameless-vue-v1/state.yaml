    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      note: notes/T007-define-emits-rerun.md
      rationale: "Re-ran all six gates on worked example 3 against vue@3.5.40. G1 PASS (exact-empty diagnostics both forms x 4 modes, calibrated). G4 FAIL, NOT UNKNOWN: propsDeclaration() is a real deciding function with live instances and the sugar applies to 1 of 6 shipped props; every repair narrowing dies at IR-8 or Gate 3. G6 FAIL - Gate 1's coupling clause forces the move once G1 is PASS. G5 FAIL STANDS BUT ITS WRITTEN MECHANISM IS MEASURED FALSE: frameless DECLARES the callback prop, and a declared prop leaves $attrs exactly as a declared emit does. Three-sided DOM measurement with a calibration arm that fires. DENIED strengthened from one FAIL to three."
      summary: "DENIED STANDS, deciding gate G5 - the predicted outcome. Labels: G1 DEFERRED->PASS, G4 DEFERRED->FAIL, G6 DEFERRED->FAIL; G2/G3/G5 unchanged in verdict. The substantive finding is that the entry's G5 rationale describes the delta between an UNDECLARED prop and a declared emit, while frameless emits a DECLARED prop - measured identical on $attrs and native-click delivery. G5 re-based on three measured differences: throw behaviour on a missing handler, return value, and handler-name resolution. Exact replacement text produced; the policy file was NOT edited."
      THE_VERDICT_SURVIVED_ITS_OWN_STATED_REASON: "The entry read that declaring a native event name in emits removes it from fallthrough $attrs, so 'a frameless component with a callback prop named onClick would stop receiving native clicks'. THAT IS THE DELTA BETWEEN AN UNDECLARED PROP AND A DECLARED EMIT. Frameless DECLARES the prop - propsDeclaration() prints onTrace into defineProps([...]) in all three goldens - and a declared prop behaves exactly as a declared emit does here. MEASURED THREE-SIDED against vue@3.5.40 in a real DOM: props:['onClick'] gives $attrs [] and no native click; emits:['click'] gives $attrs [] and no native click; and the CALIBRATION arm declaring NEITHER gives $attrs ['onClick'] and DOES deliver the click. The calibration firing is what makes the two negatives a real result rather than a dead probe. This is the third time on this goal that a correct ruling was found resting on an incorrect reason - the Angular T005 NG0950 limb and the T007 toolchain mechanism being the others."
      G4_is_FAIL_not_UNKNOWN_and_that_distinction_is_the_point: "Entry 2b took UNKNOWN on an EMPTY domain - no emitter path exists, so its totality was vacuous. HERE THE DOMAIN IS POPULATED AND SHIPPED: six props, sugar applies to one. Every repair narrowing dies - 'is a callback' needs the type field IR-8 does not have, the /^on[A-Z]/ narrowing is unsound for the same reason, and 'props the body calls' is killed by Gate 3. A populated domain with no sound narrowing is FAIL; an empty domain is UNKNOWN. Conflating them is how a vacuous entry gets read as a considered one."
      the_judge_exceeded_its_brief_by_one_gate_and_flagged_it: "The card scoped this to G1 and G4. G6 moved as well, and the Judge surfaced that rather than absorbing it: Gate 1's own coupling paragraph makes recording PASS at G1 while leaving DEFERRED at G6 self-contradictory - it would make Gate 1 FAIL by its own text. The move is in the direction of the existing verdict, which is why it is a strengthening rather than a scope violation."
      consequence_outside_the_policy_file: "packages/frameworks/vue/src/gate/index.ts:1029 SHIPS THE REFUTED SENTENCE IN A LIVE, USER-VISIBLE VIOLATION MESSAGE: 'worked example 3 rules the defineEmits form DENIED at Gate 5 because a declared native event name stops the listener receiving native events.' The RULE is correct and stays; only its EXPLANATION is now known to be false. So the fold is code plus docs, not docs alone."
      evidence:
        - "pnpm-lock.yaml:367-369 and :725-727 - vue@3.5.40 at both importers; vue and @vue/compiler-sfc BOTH resolve 3.5.40 from packages/frameworks/vue"
        - "G1 probe: shipped generated/S1.vue and its mechanical defineEmits twin - parse errors 0, template errors 0, tips 0, no throw, across ssr x isProd; a planted syntax error reports 1+1 in all four modes (calibrated)"
        - "G1 DISCLOSED BLIND SPOT: emit('trace') against defineEmits(['other']) is exact-empty clean in all four modes - the compiler CANNOT SEE the class G5 decides on"
        - "G5 three-sided DOM measurement (jsdom 28.1.0, vue@3.5.40) with a firing calibration arm - table in the note"
        - "G5 measured grounds: missing handler -> baseline TypeError 'props.onTrace is not a function' vs candidate silent no-op; return value 42 vs undefined; parent 'on-trace' reached by baseline only, 'onTraceOnce' reached by emit() only"
        - "packages/frameworks/vue/src/emitter/index.ts:400 propsDeclaration(), called at :482 - the Gate 4 deciding function; six shipped props, sugar applies to one"
        - "packages/compiler/src/schema.ts:205 PropDestructuringEntry - no type field (IR-8), which is what makes every Gate 4 repair narrowing unsound"
        - "packages/frameworks/vue/src/gate/index.ts:1024-1029 - the standing refusal, whose message text repeats the refuted mechanism"
        - "scripts/e2e.mjs:38 - the Vue row; six rows total, discharging Gate 6's one DEFERRED cause"
      missing_evidence:
        - "The native-click arm was measured in jsdom, not Chromium. In envelope - this is runtime-core's props/attrs partition, not layout - and the G5 FAIL stands on the throw-behaviour arm alone, but a browser re-take is cheap if an auditor wants it."
      pm_reconciled_the_lockfile_flag_FALSE_ALARM: "The Judge flagged that pnpm-lock.yaml 'shows as modified in the working tree while T006's receipt asserts it frozen at f52229150e6b4b5a', and asked the PM to reconcile before any completion audit reads that freeze as holding. PM CHECKED: THE FREEZE HOLDS EXACTLY. shasum -a 256 pnpm-lock.yaml is f52229150e6b4b5a right now, byte-for-byte what T006 asserted at dispatch. The file IS modified relative to HEAD - it carries the Angular lane's +3918/-160 - but it has not MOVED since the freeze was taken, which is what the assertion claims. The Judge conflated 'modified vs HEAD' with 'moved since dispatch'. A reasonable misread, correctly escalated rather than assumed, and it is the THIRD verification confusion this session traceable to the same root cause: a large legitimate uncommitted changeset sitting under every git-based check."
