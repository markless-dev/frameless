        - "docs/goals/frameless-real-apps-v1/notes/T007-todomvc-style.md sections 2-3: five byte-identical PNGs; a 3614-pixel heading divergence INVISIBLE to every computed-style check; and a `margin: 0` making all six lanes identical AND ALL SIX WRONG"
        - "packages/frameworks/react/scripts/regenerate.ts: the ordinal slot is LOAD-BEARING - ten-plus per-lane suites derive their generated/ inventory from /^s(\\d+)-[\\w-]+\\.json$/ and assert it EXACTLY"
        - "packages/frameworks/vue/src/gate/index.ts carries a shipped refusal asserting a LIVE census over 'the ten-scenario corpus ... TWELVE shipped instances ... applies to THREE'"
        - "git ls-files: demos/*/public|static/todomvc-app-css/*.css are TRACKED, not gitignored - a third stylesheet adds six tracked derived copies"
      missing_evidence:
