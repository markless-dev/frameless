tasks:
  - id: T001
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: high
    objective: >-
      PROBE THE DATA-FETCHING DOOR. Measure computed(async ...) in all six lanes: does it
      emit, does it refuse with a verbatim message, or does it emit and misbehave?
    why_this_is_PHASE_A_and_not_a_footnote: >-
      EVERY capability Patrick named - fetch, optimistic updates, remote query, streaming -
      reduces to "can a component fetch". MEASURED AT PREP: the authoring surface is state,
      computed, element, shared with ZERO LIFECYCLE HOOKS, and there are ZERO computed(async)
      instances in the corpus in any lane. If the door does not open, four apps' worth of
      authoring would be written against a shape that CANNOT EXIST.
    what_a_result_looks_like: >-
      Per lane, one of: EMITS (with the emitted shape quoted), REFUSES (with the verbatim
      message), or EMITS-BUT-MISBEHAVES (with the observed behaviour and how it differs). A
      REFUSAL IS A LEGITIMATE RESULT and is worth more than a guess. If a lane cannot express
      it INSIDE ITS DESIGN ENVELOPE - Qwik's SSR serializer AWAITS promises, which is why S8's
      gate had to be click-armed - that is a LANE LIMIT, recorded, not chased.
    also_measure_because_the_apps_need_them: >-
      (a) Whether the resolved value can be READ in the template and whether a pending state
      is observable at all - an app needs a spinner. (b) Whether a SECOND resolution updates
      the view, which is the difference between fetching and STREAMING. (c) Whether an
      optimistic write followed by a revert is expressible, given that every conditional must
      be an EXPRESSION because of DEFECTS.md 8.1.
    allowed_files:
      - probes/async-door/**
      - docs/goals/frameless-app-suite-v1/notes/T001-async-door.md
    verify:
      - "PER LANE, a recorded result with its evidence - emitted shape, verbatim refusal, or observed misbehaviour"
      - "pnpm test   # baseline is EXACTLY ONE failure, the foreign package-inventory ARM B - must stay exactly 1"
      - "pnpm check  # must stay at EXACTLY 267"
      - "pnpm lint && pnpm check:citations"
      - "git diff --exit-code -- packages/ demos/ scripts/   # probes live OUTSIDE the product tree"
      - "fingerprint the owner's three paths at start AND finish"
    stop_if:
      - "Need files outside allowed_files. This is a PROBE - it must not touch the product tree."
      - "You are about to change the authoring surface, an emitter, or the IR. Measuring is the whole task."
      - "A lane cannot express it inside its design envelope - RECORD THE LANE LIMIT and continue with the rest."
      - "pnpm check rises above 267."
      - "NEVER pkill -f on a broad pattern - a prior task killed one of the owner's long-running servers that way. Kill by recorded PID only, and only PIDs you started."
      - "Verification fails twice for the same reason."
    receipt:
      result: done
      harness: claude-code
      verification_attempts: 1
      note: notes/T001-async-door.md
      summary: "Measured the data-fetching door in six lanes. computed(async ...) is CLOSED IN ALL SIX, and closed TWICE BEFORE ANY EMITTER RUNS: the Markless compiler demands an @try/@pending/@catch boundary, and the Frameless IR cannot represent JSXTryExpression. Five emitters refuse verbatim; Angular EMITS INVALID TYPESCRIPT (TS1308, a non-async getter containing await) because it is the only lane that does not verify its own output. Streaming (repeated resolution) and optimistic write-then-revert BOTH EMIT IN ALL SIX LANES via async event handlers. Fetch-on-render is unreachable in every lane."
      THE_DOOR_IS_CLOSED_BY_A_PINCER_AND_BOTH_JAWS_ARE_UPSTREAM_OF_THE_EMITTERS: "MARKLESS_ASYNC_BOUNDARY_REQUIRED: 'Cannot read async computed \"greeting\" outside @try/@pending/@catch. Wrap the read in an async boundary.' AND 'Unsupported template construct JSXTryExpression cannot be represented in frameless-enriched-ir/2.' You may not read an async computed without the boundary, and the boundary is unrepresentable. Neither jaw is an emitter. THE DOOR IS DESIGNED UPSTREAM AND UNIMPLEMENTED DOWNSTREAM: @markless/core already declares computed<T>(derive: () => T): AsyncComputedValue<T> with Awaited<Value> unwrapping, and the vendored compiler carries async-computed-runner, async-boundary-update and per-arm boundary records. THE REFUSAL IS FRAMELESS'S."
      THE_PM_BRIEF_WAS_WRONG_ABOUT_THE_AUTHORING_SURFACE: "The brief said the surface is exactly state/computed/element/shared with zero lifecycle hooks - that count is INCOMPLETE. There is a FOURTH template control-flow form, @try / @pending / @catch, which the parser HAS and the Markless compiler DEMANDS. @pending IS THE SPINNER THE BOARD ASKED FOR, and it is unrepresentable downstream. Every prior board that counted this surface counted four constructs and missed it."
      THREE_OF_ITS_OWN_READINGS_WERE_CONFOUNDS_AND_CONTROLS_REFUTED_THEM: "P2-P6 produced refusals that read as async limits and are NOT. Qwik's is a CALLBACK-PROP rule. Solid's is a ZERO-PROP defect - reproduces with no async at all. Angular's is a GLOBAL-IDENTIFIER ban - fetch, setTimeout, Promise, JSON, Date all refused, measured on a FULLY SYNCHRONOUS control. Without PB and PC, which contain no async whatsoever, all three would have been reported as async refusals and three false lane limits would have entered the record."
      ANGULAR_IS_THE_ONLY_LANE_THAT_DOES_NOT_VERIFY_ITS_OWN_BYTES: "For an async computed it emits `get greeting(): any { return await this.ready; }` - a NON-ASYNC getter containing await. tsc reports TS1308 on EXACTLY the three async-computed scenarios and NONE of the five handler ones. Its EMITS is not a capability; it is an unchecked lane. 'Did not throw' is not 'produced valid output'. NOT THIS BOARD'S TO FIX."
      door_table: "async computed: REFUSES in react/solid/qwik/svelte/vue, MISBEHAVES in angular. Streaming, 3 awaits (P8): EMITS in all six. Optimistic write-then-revert (P9): EMITS in all six. Bare async-computed read and @try-wrapped read: refused pre-emitter for all six."
