  local:
    status: not_requested
    url: null
    command: "node ~/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/frameless-app-suite-v1"
  why: >-
    The owner has run twenty-plus goals in this repo against the file board alone. Recorded as
    an explicit choice, not an omission.

