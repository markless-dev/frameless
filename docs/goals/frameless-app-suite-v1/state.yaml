# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless app suite: the data-fetching door, TodoMVC Advanced, and a Codex clone"
  slug: "frameless-app-suite-v1"
  kind: existing_plan
  tranche: >-
    Probe the async door in six lanes and rule what it supports. Then ship TodoMVC Advanced
    styled to a NAMED reference. Then attempt the Codex clone. STOP AT EACH REFUSAL AND
    RECORD IT. Dashboard and Twitter are recorded as candidates, not scope.
  status: active
  oracle:
    signal: >-
      THREE PARTS, ALL REQUIRED. (1) THE DOOR IS MEASURED: computed(async ...) probed in ALL
      SIX LANES with a witnessed per-lane result - emits / refuses-with-verbatim-message /
      emits-but-misbehaves - landing BEFORE any app depends on it. A REFUSAL IS A LEGITIMATE
      RESULT. (2) EVERY APP THAT SHIPS IS AUTHORED ONCE, EMITTED SIX WAYS, AND LOOKS LIKE ITS
      REFERENCE: one .tsrx source, NO hand-written per-lane app code, a documented and
      ACTUALLY-RUN launch command per lane, and a visual match to a NAMED reference design
      recorded on the card. A lane that cannot be generated is left UNBUILT with its verbatim
      refusal. (3) NOTHING REGRESSES: pnpm test at EXACTLY ONE failure (the foreign
      package-inventory ARM B); pnpm check DOES NOT RISE above 267; pnpm e2e stays 6 x 9;
      lint and check:citations clean.
    cadence: "after the probe, after each app, and at final audit"
    final_proof: >-
      The six-lane door result stated per lane; then, for each shipped app, the launch command
      that was RUN, a visual comparison against its NAMED reference, and proof that no
      per-lane app code was hand-written. For every lane NOT shipped, the VERBATIM refusal. A
      missing lane with a refusal is a legitimate outcome; a missing lane with no refusal is
      not.
  intake:
    original_request: >-
      Slack with Patrick Stapleton: build the apps frameworks get tested with - TodoMVC simple
      AND advanced, a Codex/ChatGPT clone with streaming and window management - prove
      behaviour matches across lanes with witness, and COPY THE STYLES OF THE REAL THING
      ("find a good shadcn dashboard template or something... same with chatgpt copy").
    interpreted_outcome: >-
      Measure whether the authoring surface can express data fetching at all; then build the
      apps it supports, each authored once, emitted six ways, visually matching a named
      reference, with every refusal recorded.
    input_shape: existing_plan
    audience: "framework authors evaluating frameless, and Patrick's 'apps frameworks use for testing' bar"
    authority: approved
    proof_type: demo
    completion_proof: >-
      The six-lane door result; each shipped app emitted from ONE source into six lanes with a
      launch command that was RUN and a visual match to its named reference; every refusal
      verbatim.
    existing_plan_facts:
      - "PATRICK: 'you basically have to do the same thing all frameworks do' - the suite is the standard evaluation set, not a showcase."
      - "PATRICK: TodoMVC 'is actually surprisingly good' and covers CRUD, search local/remote, local/in-memory state management, AND OPTIMISTIC UPDATES."
      - "OWNER: split it - 'todoMVC simple and todoMVC advanced or something like that'. The simple one SHIPPED on frameless-real-apps-v1 (S10, six lanes, styled). Advanced is NEW."
      - "PATRICK: 'the most important one is recreating ChatGPT... so streaming... streaming and window management. So codex basically. Sidebar, chat thread. Right detail pane with tabs. Bottom detail pane with tabs. Streaming response while still navigating the app.'"
      - "PATRICK: 'Twitter was crud/infinite scrolling. Codex clone will cover all that.' - so Twitter is SUBSUMED, not separate scope."
      - "PATRICK: dashboards. OWNER: 'I can make the same for each framework.' RECORDED AS A CANDIDATE, not this tranche."
      - "OWNER: the music player demo is IN MARKLESS already - explicitly NOT this repo's scope."
      - "OWNER: 'Witness verifies the behavior across each' - the cross-lane oracle is the existing witness/e2e machinery, not a new one."
      - "OWNER: search 'needs to be local filtering and remote query' - BOTH, not either."
      - "OWNER: data fetching, 'or artificial delay' - the delay is an acceptable stand-in for a real remote."
      - "OWNER, EXPLICIT AND EASY TO UNDER-READ: 'I want you to copy the styles of the actual dashboards, for example find a good shadcn dashboard template or something there's tons of those, same with chatgpt copy, etc.' FINDING THE REFERENCE IS TASK WORK - it needs browsing, which prep may not do."
    likely_misfire: >-
      BUILDING THE APPS ON AN UNMEASURED DOOR. Streaming, optimistic updates and remote query
      all reduce to "can a component fetch". If the answer is no, four apps' worth of
      authoring gets written against a shape that CANNOT EXIST. That is why the probe is Phase
      A and not a footnote. SECOND MISFIRE: hand-writing the lanes - the fastest route to six
      impressive demos, and it proves nothing. THIRD: shipping unstyled - TodoMVC's first pass
      emitted correct markup with no stylesheet and THREE OF THE FIVE visual features were
      missing, so THE VISUAL REFERENCE BELONGS ON THE CARD BEFORE THE APP IS BUILT.
    blind_spots_considered:
      - "MEASURED AT PREP: the authoring surface is state, computed, element, shared - ZERO lifecycle hooks - and there are ZERO computed(async) instances in the corpus. Every capability Patrick named depends on that one unopened door."
      - "TWO-WORD DOM EVENTS ARE UNSPELLABLE IN EVERY LANE (DEFECTS.md 15). onKeyDown and onDoubleClick cannot be produced and onKeydown/onDblclick NEVER FIRE. THIS WILL HIT THE CODEX CLONE HARD - keyboard shortcuts, tab navigation, pane focus are exactly what it needs."
      - "REACT MISCOMPILES A STATE WRITE NESTED IN AN if, and entry 8's shipped refusal has a hole that exact shape - NEITHER LOWERED NOR REFUSED (8.1). Every authored conditional must be an EXPRESSION."
      - ".svelte and .vue refuse multi-component modules BY NAME. A Codex clone is naturally many components - this is a structural question, not a styling one."
      - "STREAMING IS HARDER THAN FETCHING: it is repeated async updates over time, and Qwik's SSR serializer AWAITS promises, which is why S8's gate had to be click-armed. A streaming response may be unserializable in that lane by design."
      - "grep is BLIND to the React emitter (one NUL byte, exit 1 with no output). Use Python for sweeps of that file until T008 on the sibling board lands."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  continuous_until_full_outcome: true

agents:
  scout: installed
  worker: installed
  judge: installed

