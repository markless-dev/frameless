      harness: claude-code
      note: notes/T002-ruling.md
      summary: "TodoMVC Advanced ships in FIVE lanes, not six, and the reason is NOT the one the dispatch named. Codex clone is REACHABLE-NARROWED, not out of reach. The narrowing from 'loads when it appears' to 'when the user asks' is ACCEPTED and does NOT gut the app - both async axes are user-initiated by nature, so an explicit initial-load button is ruled OUT and the list is seeded in-component as S10 already does. Named visual reference: todomvc-app-css@2.4.3 vendored verbatim PLUS the shipped /todomvc page at HEAD as rendered ground truth; new pixels go in a third stylesheet linked only on the new route."
      THE_LOAD_BEARING_CORRECTION_TO_THE_PMs_BRIEF: "'Streaming and optimistic write-then-revert both emit in all six lanes' is TRUE OF THE LOWERING AND FALSE OF THE SOURCE. probes/async-door/sources/P8-promise-prop-streaming.tsrx says so in its own header: 'what is being measured is whether the SECOND and THIRD post-await writes are lowered and land, NOT whether the source can produce distinct chunks.' Ask instead for a NEW PROMISE PER USER ACTION and the six-lane intersection is EMPTY. QWIK cannot consume a callback prop's return value ANYWHERE: lowerStatement accepts a callback-bearing statement on exactly one path, an ExpressionStatement whose expression IS the CallExpression, so `const next = await load()` throws AND the obvious workaround `value = await load()` throws too, being an AssignmentExpression. THE ASSIGNMENT-FORM WORKAROUND DOES NOT EXIST. ANGULAR cannot NAME a global to make its own promise. So the binding constraint is not 'fetch-on-render becomes fetch-on-ask' - IT IS ONE PROMISE PER RENDER, OR LOSE A LANE."
      rationale: "Ruled on meaning, not measurement. Read the qwik and angular emitters directly rather than inheriting T001's summary, and the two refusals close on each other: no six-lane shape produces a fresh promise per action. That reframes the narrowing and makes angular an UNBUILT LANE WITH A RECORDED REFUSAL - an outcome this board's oracle explicitly permits. T003 is the largest reversible slice: one authored source, six ATTEMPTED lanes, the inventory suites closed up front so it cannot stop where its predecessor stopped, and the styling reference named before the build as goal.md demands."
      THREE_SUB_RULINGS: "(1) The narrowing does NOT gut the app and an explicit initial-load button is ruled OUT - both async axes are user-initiated by nature, and S10 already seeds its list in-component for an unrelated measured reason (IR-8 has no TSArrayType lowering). (2) The Codex clone is REACHABLE-NARROWED. The card's multi-component blocker is WEAKER THAN STATED: demos/composition-kit/src/page.tsrx composes four .tsrx modules today, so the limit is one component per MODULE, not per app. What actually binds is streaming's source (five lanes) and the unspellable keyboard. (3) A VARIABLE-LENGTH stream is unauthorable in EVERY lane - a write inside a loop body is DEFECTS.md 8.1 - so a fixed unrolled chunk count is the only shape."
      evidence:
        - "packages/frameworks/qwik/src/emitter/index.ts lowerStatement: a callback-prop call is accepted ONLY as an ExpressionStatement whose expression IS the CallExpression, so both `const x = await load()` and `x = await load()` hit 'Qwik v1 callbacks must be observational expression statements in ${event.id}'. Same function: 'Qwik v1 rejects synchronous actions after an awaited callback'."
        - "packages/frameworks/angular/src/emitter/index.ts: every Identifier in a transplanted body is resolved against scope + declared members or the emitter throws. T001 measured six globals refusing on the FULLY SYNCHRONOUS PC control."
        - "probes/async-door/sources/P8-promise-prop-streaming.tsrx header, verbatim - the source of the load-bearing correction"
        - "demos/composition-kit/src/page.tsrx imports Frame/Dashboard/Status/Search across FOUR .tsrx module boundaries - multi-MODULE composition is shipped and e2e-wired"
