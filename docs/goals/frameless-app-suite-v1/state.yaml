        - "NOT BROWSED: this harness gave Read and Bash only, with NO web tool, though the dispatch said browsing was in scope for the Judge. The visual reference was settled from VENDORED UPSTREAM BYTES WITH RECORDED PROVENANCE instead - stronger evidence than a screenshot, but not what was asked for."
