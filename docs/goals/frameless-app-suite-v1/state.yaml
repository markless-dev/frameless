      AXES: CRUD + in-memory state (six lanes); local filtering via a computed plus S10's
      `hidden` binding (six lanes); remote query with artificial delay (FIVE); optimistic
      write-then-revert with a per-row pending flag (FIVE).
    WHY_FIVE_AND_NOT_SIX: >-
      T002 CORRECTED THE BOARD'S INHERITED CLAIM. "Streaming and optimistic updates emit in
      all six lanes" is true of the LOWERING and false of the SOURCE. P8's own header says it
      measured "whether the SECOND and THIRD post-await writes are lowered and land, NOT
      whether the source can produce distinct chunks." Ask for a NEW PROMISE PER USER ACTION
      and the six-lane intersection is EMPTY: qwik cannot consume a callback prop's return
      value anywhere (lowerStatement accepts a callback-bearing statement ONLY as an
      ExpressionStatement whose expression IS the CallExpression, so both `const x = await
      load()` and `x = await load()` throw), and angular cannot NAME a global to make its own
      promise. The binding constraint is not fetch-on-render becoming fetch-on-ask; it is ONE
      PROMISE PER RENDER, OR LOSE A LANE.
    THE_NAMED_VISUAL_REFERENCE_RECORDED_BEFORE_THE_BUILD: >-
      todomvc-app-css@2.4.3, vendored VERBATIM at demos/shared/todomvc-app-css/index.css with
      its MIT LICENSE and the exact tarball URL in README.md, PLUS THE SHIPPED /todomvc PAGE
      AT HEAD as rendered ground truth. New controls get a THIRD stylesheet,
      demos/shared/todomvc-app-css/frameless-advanced.css, linked ONLY on the advanced route.
      index.css and LICENSE are UPSTREAM BYTES and are not editable.
    CONSTRAINTS_MEASURED_NOT_GUESSED: >-
      Every conditional is an EXPRESSION. Every state write is top-level and unconditional -
      DEFECTS.md 8.1, react's if-nested write is NEITHER LOWERED NOR REFUSED. NO for/while
      around an await, same reason. Any callback-prop call is the LAST statement in its
      handler - qwik emits "Qwik v1 rejects synchronous actions after an awaited callback".
      The ordinal slot is LOAD-BEARING: ten-plus per-lane suites derive their generated/
      inventory from /^s(\d+)-[\w-]+\.json$/ and assert it EXACTLY, so closing those suites
      is part of THIS card and not a follow-up.
    ATTEMPT_ANGULAR_ANYWAY: >-
      Angular is expected to refuse via its global-identifier ban - every Identifier in a
      transplanted body must resolve to scope or a declared member, and Promise/setTimeout/
      fetch/Date/JSON are all globals. RECORD ITS VERBATIM MESSAGE FROM THE REAL MODULE. T001
      measured the PA/PC probes, NOT this app; whether the ban fires here is UNMEASURED.
      A missing lane WITH a verbatim refusal is a legitimate outcome under this board's oracle.
