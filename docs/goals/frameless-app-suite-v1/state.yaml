  - id: T004
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: high
    objective: >-
      Attempt the CODEX CLONE: sidebar, chat thread, right detail pane with tabs, bottom
      detail pane with tabs, and a streaming response that continues while the app is
      navigated.
    THIS_IS_THE_ONE_MOST_LIKELY_TO_REFUSE_AND_THAT_IS_INFORMATION: >-
      T002 RULED IT REACHABLE-NARROWED, NOT OUT OF REACH - and corrected one of the three
      blockers this card used to name. (1) TWO-WORD DOM EVENTS ARE UNSPELLABLE IN EVERY LANE -
      no onKeyDown, no onDoubleClick, and onKeydown/onDblclick NEVER FIRE (DEFECTS.md 15,
      still OPEN). So there is NO KEYBOARD INTERACTION AT ALL: no Enter-to-send, no shortcuts,
      no Escape, no Tab pane navigation. That is what actually binds this app.
      (2) STREAMING IS FIVE-LANE, NOT SIX, for the reason recorded on T003 - a fresh promise
      per action has an empty six-lane intersection. And a VARIABLE-LENGTH stream is
      unauthorable in EVERY lane, because a write inside a loop body is DEFECTS.md 8.1: A
      FIXED UNROLLED CHUNK COUNT IS THE ONLY SHAPE.
      (3) CORRECTED: ".svelte and .vue refuse multi-component modules" is TRUE BUT NOT
      LIMITING. Multi-MODULE composition is SHIPPED and e2e-proven - demos/composition-kit/
      src/page.tsrx composes Frame/Dashboard/Status/Search across four .tsrx module
      boundaries. The limit is ONE COMPONENT PER MODULE, not one component per app.
      Angular additionally HAS NO CLOCK - it cannot name Date - so message timestamps must
      arrive as props, and it is expected to go unbuilt here for the same global-identifier
      ban as T003.
      A CAPABILITY LIST IS A LEGITIMATE DELIVERABLE HERE. Record each refusal verbatim and
      ship whatever subset stands.
    THE_NAMED_VISUAL_REFERENCE_RECORDED_BEFORE_THE_BUILD: >-
      SETTLED BY THE PM WITH A WEB TOOL, because T002 was granted browsing and its harness had
      none. THREE NAMED SOURCES, ALL LICENSE-CHECKED AT SOURCE.
      (1) TOKENS, VENDORED VERBATIM: the shadcn/ui default theme - the oklch CSS custom
      properties --background/--foreground/--card/--primary/--muted/--border/--ring/--radius
      AND THE --sidebar-* FAMILY, which is exactly what this app's left rail needs. MIT,
      "Copyright (c) 2023 shadcn", github.com/shadcn-ui/ui/LICENSE.md, documented at
      ui.shadcn.com/docs/theming. Vendor it the SAME WAY todomvc-app-css@2.4.3 was vendored:
      verbatim bytes + LICENSE + README carrying the exact source URL.
      (2) LAYOUT OF THE RAIL: shadcn/ui official block `sidebar-07`, "a sidebar that collapses
      to icons", ui.shadcn.com/blocks. Same MIT.
      (3) LAYOUT OF THE THREAD AND COMPOSER: Vercel AI ELEMENTS, github.com/vercel/ai-elements
      - a component library and custom registry BUILT ON TOP OF shadcn/ui for AI-native apps -
      specifically its `conversation`, `message` and `prompt-input` families. APACHE-2.0,
      "Copyright 2023 Vercel, Inc." NOTE THE DIFFERENT LICENSE from (1) and (2); attribute it
      separately.
    SQUARE_UI_WAS_QA_D_LIVE_AND_ITS_LICENCE_RULES_OUT_COPYING: >-
      The owner named square.lndevui.com and square-ui-chat.vercel.app. THE REPO IS NOT MIT:
      zerostaticthemes/square-ui ships a bespoke "ln-dev UI License" (c) 2026 lndev, which
      GitHub classifies NOASSERTION and which FORBIDS publishing the templates or ANY
      DERIVATIVES in any repository. Frameless is public, so copying is out. OWNER RULED:
      REFERENCE ONLY, BUILD ON MIT. Square UI is itself built on shadcn/ui, so the vendored
      token layer above is unaffected. NOTHING from that repo is cloned, copied or vendored.
      FULL QA CENSUS: notes/T004-visual-reference.md
    T003_MEASURED_THE_STREAMING_AXIS_AT_FOUR_LANES_NOT_FIVE: >-
      CORRECTS THIS BOARD AND T002. Both predicted the new Promise + setTimeout shape loses
      ANGULAR ALONE. On the real module it loses TWO LANES AT TWO DIFFERENT STAGES. Angular
      REFUSES AT EMIT (global-identifier ban, verbatim). VUE EMITS, passes its gate, its
      compileScript, tsc AND pnpm check - THEN THROWS IN THE BROWSER: "_ctx.Promise is not a
      constructor", because the vue emitter inlines handlers into TEMPLATE EXPRESSIONS and
      @vue/shared@3.5.40's GLOBALS_ALLOWED carries Date and JSON but NOT Promise or setTimeout.
      FIVE STATIC GATES PASSED IT; ONLY A BROWSER REFUTED IT. So this card's streaming axis is
      FOUR RUN, ONE EMITS-BUT-MISBEHAVES, ONE REFUSES. Any lane verdict inherited from a probe
      MUST BE RE-RUN THROUGH THAT LANE'S OWN GATE - T001's "solid EMITS P9" was emit()-only and
      the Solid gate refuses it.
    THREE_QA_FINDINGS_THAT_CHANGE_THIS_BUILD: >-
      (a) THE CHAT REFERENCE DOES NOT DEMONSTRATE STREAMING. It answers the FIRST message with
      one canned reply and is SILENT to every message after. It gives us a LOOK, not a
      behaviour spec - so T001 and T002 remain the only authority on streaming.
      (b) ENTER-TO-SEND IS THE REFERENCE'S PRIMARY INTERACTION AND IS THE ONE THING WE CANNOT
      SPELL (DEFECTS.md 15). The demo ALSO ships a Send BUTTON, which is a plain click and IS
      spellable. NARROW TO CLICK-TO-SEND, RECORD THAT ENTER IS UNAVAILABLE, DO NOT FAKE IT.
      (c) MOST OF THESE DEMOS ARE LESS INTERACTIVE THAN THEY LOOK. Measured: task-management's
      Filter popover OPENS but DOES NOT FILTER, "Add task" is INERT, and cards DO NOT DRAG -
      the drag selected text. Emails' list selection and Files' grid/list toggle ARE stateful.
      OUR DEMOS WILL BE MORE FUNCTIONAL THAN THE REFERENCE. A visual match against a static
      demo IS NOT EVIDENCE OF BEHAVIOURAL PARITY and must not be reported as one.
    OWNER_DIRECTION_REPRODUCE_THE_LAYOUT_FAITHFULLY: >-
      "We will add the interactivity but basically just use all their styles / layout." SO THE
      BAR IS A FAITHFUL VISUAL REPRODUCTION, NOT AN INSPIRED-BY. And measuring the live page
      showed WHY THAT IS NOT A LICENCE PROBLEM: THERE IS ALMOST NO BESPOKE CSS TO COPY. Every
      class read off the rendered chat page is a stock Tailwind utility bound to a stock
      shadcn token - `w-64 border-r border-border`, `bg-sidebar border-r border-sidebar-border`,
      `text-xs font-medium text-muted-foreground uppercase tracking-wider`, `text-2xl
      font-semibold tracking-tight`, `rounded-md text-sm font-medium`. Their styles ARE the
      shadcn defaults we already vendor under MIT. The licensed creative layer is the TEMPLATE
      FILES; the visual result is reachable from the MIT layer directly, copying nothing.
    THE_MEASURED_SPEC_NUMBERS_NOT_ADJECTIVES: >-
      Read off the live page at 1440x757. Sidebar 256px (w-64), --sidebar fill, 1px right
      border on --sidebar-border. Sidebar nav item 230x36, radius 8, padding 8px 12px, gap 8px,
      14px/500. Section label 12px/500 uppercase wide-tracking on --muted-foreground. Brand row
      40px. Empty-state heading 24px/600 tight tracking. Composer shell 630x175 radius 14.
      Textarea 628x120 padding 12px 16px. Body type ui-sans-serif/system-ui at 16px/24px.
      CORROBORATION THAT THE TOKEN SCALE IS STOCK: shadcn ships --radius 0.625rem = 10px and
      rounded-md resolves to calc(var(--radius) - 2px) = 8px, which is EXACTLY what the buttons
      measure. So the vendored tokens REPRODUCE the reference rather than approximate it.
      PROCEDURE: write our own CSS to hit these numbers on the vendored MIT tokens, then
      compare our render against the LIVE demo side by side. NO FILE FROM THE RESTRICTED REPO
      ENTERS THIS TREE AT ANY POINT.
    HOW_TO_USE_A_REFERENCE_YOU_CANNOT_COPY: >-
      All three references are TAILWIND + REACT. Frameless emits plain markup into SIX lanes,
      so THEIR CODE CANNOT BE COPIED and must not be. The TodoMVC precedent is the procedure:
      VENDOR THE TOKENS VERBATIM (they are plain CSS custom properties and are lane-neutral),
