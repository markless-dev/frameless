# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Storage tradeoff study: device state for markless AND frameless"
  slug: "storage-tradeoff"
  kind: specific
  tranche: "Steelman the candidate space for device-state handling, score every candidate against BOTH consumption modes with executed/cited evidence, and deliver an owner decision menu that makes the choice evident. Exploration only — the owner ratifies."
  status: done
  oracle:
    signal: "The owner reads the final tradeoff dossier + decision menu and can decide without further research — every candidate scored against both modes, rejections reasoned, unknowns priced."
    cadence: "at each scout/judge receipt and at the final decision menu"
    final_proof: "Final audit records the owner's decision (or the named evidence gap that prevented one). full_outcome_complete requires the owner-facing menu was DELIVERED and answered."
  intake:
    original_request: "You're going to explore what the best tradeoff is here for handling this type of state and how we can keep it both ideal for both frameless and markless."
    interpreted_outcome: "An evidence-complete tradeoff analysis of device-state handling across both consumption modes, ending in an owner decision menu — research until the answer is super evident."
    input_shape: specific
    audience: "The owner (markless/Frameless author), deciding the storage/device-state design."
    authority: requested
    proof_type: decision
    completion_proof: "Owner-facing decision menu delivered with evidence-complete backing; owner decision (or named gap) recorded by the final audit."
    likely_misfire: "Premature convergence — presenting one candidate as conclusion or recording exploration as decisions (occurred 2026-07-20, owner-corrected twice); candidate-space theater (strawmen instead of steelmanned options)."
    blind_spots_considered:
      - "Both-modes asymmetry can hide in averaged scores — the board mandates explicit per-mode scoring."
      - "The declaration-inertness principle (no other declaration does client stuff) may rule out entire candidate families — must be tested against each, not assumed."
      - "Consent/ePrivacy ownership may force app-level enablement regardless of DX preference — legal line already evidenced, must be carried into every candidate."
      - "Frameless branding constraint (no markless imports for frameless consumers) interacts with package-home options non-obviously."
      - "Driver sync/async (localStorage vs SQLite) may be the hidden decider for the native path."
    existing_plan_facts:
      - "T013-persistence-api.md holds the full prior trail; post-evidence-pass sections are UNSETTLED exploration the owner declined to ratify — candidate material only."
      - "Slack session (2026-07-20): storage() leaning; separate-package direction (@markless/storage, driver/repository); device-state-not-data charter (owner's engineer-lens list); progressive runtime execution insight; explicit-key sketch storage('theme','light'); 'too much magic isn't great' (Patrick); declaration-inertness concern (owner)."
      - "Tonight's evidence convergence to be banked verbatim by T001: ePrivacy 5(3) technology-neutral (app owns storage-access timing); explicit-boundary ecosystem pattern; next-themes provider-as-enablement precedent."
      - "Proven repo facts available: T004b notification-atomic write contract; resumeFromPayloadScripts in pinned core; qwik build/v2 lazy-restore + native state-patch scripts (corpus-verified 2026-07-20)."
      - "Process: crew for repo/corpus probes (scratch-only execution), PM-direct for web research (crew sandbox lacks web + flaky DNS — evidenced); workflows BANNED (owner)."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/storage-tradeoff/"
    command: "npx goalbuddy board docs/goals/storage-tradeoff"

active_task: null  # goal closed: owner answered the menu with a named evidence gap (cross-framework POC, commissioned as goal storage-poc); T999 audit recorded

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Bank the chat-only evidence verbatim into notes/ (tonight's three-line convergence with citations; the declaration-inertness analysis incl. the compiled-upgrade reframe and module-scope option; the capability-vs-enablement split sketch) so no evidence lives only in conversation; annotate T013-persistence-api.md's status caveat by reference, not by editing that file."
    receipt:
      result: done
      note: notes/T001-banked-evidence.md
      summary: "Chat-only evidence banked verbatim with citations: consent law (app owns storage-access timing), explicit-boundary ecosystem pattern, next-themes capability/enablement precedent, executed repo/corpus facts (qwik lazy restore + patch scripts, resumeFromPayloadScripts, T004b contract, storage-event spec), the declaration-inertness asymmetry analysis, and six candidate sketches as steelman targets. T013 status caveat annotated by reference, file untouched."
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Steelman candidates A-E (charter list): for each, write the strongest honest version — exact authored surface, what each mode (markless runtime / frameless targets) does with it, how it answers every cross-cutting axis (key identity, package home + frameless branding, enablement, driver sync/async, consent/CSP ownership), and the sharpest argument AGAINST it. Extend the space if a real candidate is missing; kill duplicates with reasons."
    receipt:
      result: done
      note: notes/T002-steelman.md
      summary: "Candidate space steelmanned (34k chars): surviving candidates incl. inert-declaration + provider/boot-boundary enablement (dual-surface samples for markless AND frameless authoring — no markless import for frameless consumers), build-owned enablement contract (explicit-include and build-option merged), compiled-upgrade reframe, module-scope restriction, file conventions, visible directive. Killed with reasons: state-option-as-separate-candidate (same semantics, syntax-only), derived-key-as-candidate (identity policy not architecture; rename-orphan risk), auto-installing provider (recreates inertness+consent problem), consent-granting directive (library choosing app consent timing). Per-mode behavior + all axes answered per candidate; sharpest-against + failure modes written. Unknowns list produced for T003."
  - id: T003
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Evidence pass per candidate: corpus probes (scratch-only — markless payload-script contract shapes, progressive-chunk feasibility for an early storage chunk, qwik v2 patch-script status) + web where load-bearing (provider-pattern variants beyond next-themes; manifest/file-convention precedents e.g. route files, app manifests; any framework shipping library-declared page behavior and the outcome). Executed vs cited vs inferred labeled per claim."
    receipt:
      result: done
      note: notes/T003-probes.md
      summary: "Five choice-changing probes EXECUTED: (1) markless seed channel VIABLE without core changes — early script populated the payload, value in graph before runtime start (verbatim: graph.read(theme-cell)=dark-from-early-script); browser chunk-ordering stays priced. (2) React 19 + Solid 1.8.22: seed-first initialization commits seeded value on first render, StrictMode-safe (no double-consume), consent-gated late enablement updates exactly once (driverReads:1, notifyCalls:1). (3) NO candidate requires pre-paint access for reactive correctness — pre-paint buys only the no-flash initial paint; fallback-then-patch is universally sound. (4) Consolidated seed script cost: ~0.006ms @1 key, ~0.022ms @10, ~0.094ms @50 (Node V8, rough budget, browser caveats stated). (5) Facade NOT accepted on today's pin — verbatim MARKLESS_FRAMEWORK_IMPORT_REQUIRED; import-rewrite is the available frameless-side mechanism now, accepted-import-sources is a markless-side change. Implementation-phase unknowns intentionally priced, not probed."
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Tradeoff matrix + decision menu: score every surviving candidate PER MODE (markless ideal-ness, frameless ideal-ness — asymmetries explicit, never averaged), against the constraints (inertness principle, consent ownership, branding, device-state-not-data), with the evidence trail per cell; produce the owner decision menu (2-4 real options, each with what-you-get/what-you-give-up, a recommendation with reasoning, and the named unknowns each option carries). NO ratification — menu preparation only."
    receipt:
      result: done
      decision: approved
      note: notes/T004-tradeoff-matrix.md
      summary: "Matrix built: all 8 surviving candidates scored per-mode (asymmetries explicit) against 8 constraint rows, every cell cited to E1-E5/P1-P5/S1-S8 or labeled INF; executed probes moved scores (payload viability, fallback-then-patch soundness, pre-paint-as-upgrade-only, facade rejection, seed budget). Menu: 4 headlined options (provider/root switch; build-config+include; plain-cell-now/no-flash-later; app-owned cells) + promotable alternates (manifest, directive) + module-scope add-on; recommendation (C1 with C4's semantic framing, C3 as staging) clearly subordinate. Misfire self-check included, five risky-reading spots named. Nothing ratified."
  - id: T005
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Deliver the decision menu to the owner (plain-language, understandable without goal context, per AGENTS.md decision-menu rules) and record the owner's choice or their named evidence gap; if a gap — spawn the targeted follow-up scout and loop."
    receipt:
      result: done
      summary: "Menu delivered; owner reviewed and declined to choose — NAMED GAP (verbatim intent): 'I want empirical data to figure out the solution based on what's existing, but I only want the best suggestions no implementation.' Loop per board design: T006 empirical-evidence scout spawned (existing production systems: adoption data, winning API shapes, real first-paint/consent/key handling — corpus + web); suggestions refreshed after. Implementation permanently out of scope for this goal (charter already says so; owner re-affirmed)."
  - id: T006
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Empirical survey of EXISTING device-state solutions (owner-directed): what production systems actually do and which shapes won — adoption evidence (npm downloads/usage), API surfaces of next-themes/zustand-persist/jotai-storage/TanStack-persist/Capacitor-Preferences/AsyncStorage/SharedPreferences-class solutions, how each handles first paint, consent, keys, drivers, sync; LOCAL CORPUS mining (qwik-ui, qwik-design-system, solid, fumadocs and other checkouts under /Users/jacksm5pro/dev/open-source) for real in-repo device-state patterns. Output: evidence-ranked observations feeding a refreshed suggestions note. SUGGESTIONS ONLY — no implementation, no ratification."
    receipt:
      result: done
      note: "notes/T006-web-empirics.md + notes/T006-corpus-empirics.md"
      summary: "Empirical survey complete, both halves. WEB: next-themes 24.5M/wk (provider family, order-of-magnitude category winner); @nuxtjs/color-mode = mass-adopted build-module family instance; zustand/jotai persisted-cell family ~11M/wk combined; app-owned-cells family has NO mass-adopted instance; MMKV validates sync-read-before-render demand on native. CORPUS: 9/10 local repos have device-state code; 6 independently-authored theme-persistence families (9 physical copies incl. 3 byte-identical) — the owner's 'everyone hand-rolls it, same bugs' thesis proven IN THEIR OWN REPOS; keys mostly hardcoded, consent gates ZERO across all systems, cross-tab sync mostly absent; Qwik UI themes uses a rendered pre-slot sync script mutating <html> (provider shape, configurable key + CSP nonce, NO useVisibleTask$ for initial read); fumadocs delegates to next-themes; frameless goalbuddy boards read theme after async settings (flash-prone)."
  - id: T007
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Fold both empirical halves into refreshed BEST SUGGESTIONS (owner-directed: suggestions only, no implementation, no ratification): re-weigh the four menu families against the adoption + corpus evidence, state what existing systems converged on and where they all fail identically (keys, consent, sync), and produce the morning owner summary — evidence-first, suggestions clearly labeled as suggestions."
    receipt:
      result: done
      decision: approved
      note: notes/T007-refreshed-suggestions.md
      summary: "Suggestions refreshed with both empirical halves. Ordering changed with reasons: Option 4 (app-owned cells) DEMOTED — no mass-adopted instance exists and the corpus hand-rolls are its documented failure mode; Option 2 (build-config) RAISED to production-proven via @nuxtjs/color-mode. T004 synthesis (provider switch + honest persisted-cell semantic + plain-cell staging) strengthened on every leg (next-themes 24.5M/wk, ~11M/wk cell family, Qwik UI independent convergence, P3 upgrade framing matching observed practice); one labeled NEW amendment (build-level switch as the markless-native face of the same contract — flagged as highest decision-reading risk). Compiler-advantage statement tied to the four identical library failures (keys/consent/sync/flash) with the fumadocs delegate-path counter-option stated. Unknowns priced. Everything SUGGESTION; owner ratifies; T999 queued pending owner response."
  - id: T008
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Owner-continued dig round (owner: 'Not deciding yet — name the next dig', no unknown named — PM picks the two priced unknowns most blocking the decision, both flagged weakest-evidence in T007): (a) EXECUTED real-browser seed-ordering probe — build in a standalone scratch root outside the repo (cached Playwright chromium + local playwright-core; sidesteps the T007 env triangle), emulate the generated artifact shape (pre-content sync seed script + later module chunks), assert ordering and first-paint state; (b) winner-internals source read — fetch next-themes and @nuxtjs/color-mode actual source (npm tarballs), verify the 'two faces of one contract / same artifact underneath' amendment against real code with file:line citations (currently adoption-inferred only). Output: notes/T008 evidence note + refreshed suggestion deltas. SUGGESTIONS ONLY."
    receipt:
      result: done
      note: notes/T008-dig-round.md
      summary: "Both digs EXECUTED. (a) Real-browser probe (Chromium hs-1228, standalone scratch root, playwright-core from sibling checkout — env triangle sidestepped): seed ran before first paint in both cases (13.5ms vs 32ms cold; 2.7ms vs 12ms stored), root attribute correct AT first paint (no-flash proven with stored value, honest fallback cold), seed ordered before deferred-ESM, classic, AND late-injected progressive chunks, landing slot visible to all three — the chunk-ordering unknown RETIRED for the artifact shape (residue: re-run against real markless output at implementation time). (b) Winner internals source-read: 'two faces of one contract' CONFIRMED at source level — both winners generate the identical artifact triple (sync seed mutating root pre-paint + reactive cell initialized from seeded result + write-back); next-themes renders its script in-place before children (the exact Qwik UI shape, NOT head-injected) but double-reads storage with duplicated resolution logic (no landing slot); @nuxtjs/color-mode is a build-time template mini-compiler (static key/driver/fallback substitution, module.mjs:127-129) whose seed writes window.__NUXT_COLOR_MODE__ and whose client plugin initializes state FROM the slot — our P1 landing-slot design in production at ecosystem scale. CORRECTION banked against our own claim: next-themes HAS cross-tab sync; the four-axis 'sync universally absent' softens to 'inconsistently present' (recorded, not smoothed). Keys/consent/flash axes stand. Owner has ratified nothing."
  - id: T009
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Owner-named gap (2026-07-21: 'Would you say you feel confident with storage function being able to create scripts on render? Inlining a script? Especially in cases like ssr'): execute the SSR+hydration probe on our stack shape — real renderToString + hydrateRoot (React 19 dev build, StrictMode, Chromium), seed script rendered by provider, fallback-parity state init, landing-slot patch. SUGGESTIONS ONLY."
    receipt:
      result: done
      note: notes/T009-ssr-probe.md
      summary: "EXECUTED, all assertions pass in both cases (cold + stored value): inline seed script present in renderToString output and runs pre-paint (root attr correct AT first paint, 12-20ms); ZERO hydration mismatch/recoverable-error messages under dev build + StrictMode (fallback-parity makes server HTML and client first render identical by construction); stored value patched to content exactly once post-hydration; ZERO client driver reads (landing-slot handshake consumed — combining the provider channel with the Nuxt-style slot, which no surveyed library does). Retires the C3-SSR unknown for React. Residue: Solid SSR + streaming not separately probed; real markless emitted output re-run at implementation time; server-truthful content requires the cookie driver (unprobed). Owner has ratified nothing."
  - id: T010
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Record the owner's response to the refreshed menu + clarifications + T008/T009 evidence."
    receipt:
      result: done
      summary: "Owner response 2026-07-21 (verbatim): 'ok I want you to make a POC of the storage function across several different frameworks, angular, react, svelte, vue, and see if it works. Do this in a new git worktree' — a NAMED EVIDENCE GAP (executed cross-framework proof), not a ratification. Preceding owner engagement in the same session: asked what the API decisions concretely are (answered with code-level breakdown of the three decision points), asked about persist-true removal/eagerness/core-vs-package (answered with recommendation: standalone storage() in core, lazy driver reads inert at import, optional consent gate, per-platform seed switch), asked about script-on-render SSR confidence (answered with the executed T009 probe). No option ratified. The gap is delegated to successor goal storage-poc (docs/goals/storage-poc/), whose charter records that POC success is evidence for this decision, never ratification of it."
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Final audit: was the menu evidence-complete and delivered; did the owner decide (record it) or name a gap (record the loop state); misfire check — was anything presented as decided that the owner did not ratify; full_outcome_complete accordingly."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "owner decision or named gap"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "AUDIT: (1) Menu evidence-complete and DELIVERED — T004 matrix/menu, T005 delivery, T006 empirical survey (owner-directed), T007 refreshed suggestions, T008 executed browser-ordering probe + winner source-reads, T009 executed SSR+hydration probe (owner-named gap), plus plain-language API breakdown and an explicit recommendation on all three decision points. (2) Menu ANSWERED — not with a ratification but with a named evidence gap per T010 (cross-framework POC commission, verbatim recorded), which the charter's final_proof explicitly accepts ('the owner's decision or the named evidence gap that prevented one'); full_outcome_complete: true by the charter's own definition (menu delivered AND answered). (3) MISFIRE CHECK PASSED: no receipt or note presents anything as decided/ratified; all outputs labeled SUGGESTION/EVIDENCE; two self-corrections banked against our own claims (sync-axis softening in T008; env-blocked probe recorded honestly before being executed for real). (4) Decision state at close: API shape NOT ratified — storage(key,fallback) standalone/core, lazy+gate, per-platform seed switch stand as the RECOMMENDATION; the decision now waits on storage-poc evidence. Residual priced unknowns carried in T008/T009 notes (key stability, async-driver lifecycle, facade timing, Solid/streaming SSR)."

