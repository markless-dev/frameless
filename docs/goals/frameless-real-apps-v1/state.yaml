      TWO_REAL_EMITTER_DEFECTS_FOUND_BY_BUILDING_A_REAL_APP: "(1) TWO-WORD DOM EVENT NAMES ARE UNSPELLABLE IN EVERY LANE, AND IT IS BEHAVIOURAL. T001 thought this was qwik-only and cosmetic. MEASURED: build.ts does name.slice(2).toLowerCase(), destroying casing irrecoverably - PM CONFIRMED ZERO emitters can produce onKeyDown or onDoubleClick. In a real DOM at react-dom 19.2.3, onKeydown and onDblclick NEVER FIRE. React's name for the double-click is onDoubleClick, WHICH NO CAPITALISATION OVER 'dblclick' CAN PRODUCE, so a per-lane spelling map is required. One onKeyDown binding also took check 267 -> 272 across three lanes. (2) REACT SILENTLY MISCOMPILES A STATE WRITE NESTED INSIDE AN if - it lowers only top-level handler statements and prints the write as an assignment to the const from useState: invalid TS, TypeError at runtime. FIVE OTHER LANES LOWER IT CORRECTLY. Invisible until now because NO S1-S9 HANDLER WRITES STATE INSIDE AN if."
