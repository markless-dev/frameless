tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: >-
      Validate the plan shape before any app is authored: rule the PM's three assumptions, and
      spec the smallest authored surface that still honestly counts as "TodoMVC" and "Hacker
      News".
    why_a_judge_and_not_a_worker_first: >-
      This is an EXISTING PLAN - the owner named both apps and the scope - and the contract
      says validate a plan before executing it. There is also a real question underneath: WHAT
      COUNTS AS THE APP. TodoMVC has a published spec with a conformance list; HN has no spec
      at all. Authored too small, the demo proves nothing; authored too large, it stalls on
      cosmetics before reaching the axes that matter.
    the_three_assumptions_to_rule: >-
      (1) PINNED SNAPSHOT vs LIVE FETCH for HN. The PM chose snapshot because live data breaks
      six-lane comparison. Is that right, and does it still exercise the axis?
      (2) TODOMVC FIRST. The PM chose it to de-risk the pipeline because s2-keyed-todo already
      covers its shapes. Is that ordering right, or does it just delay the real information?
      (3) BROWSABLE BEFORE e2e-WIRED. Everything in demos/ is a gate today.
    what_a_ruling_must_contain:
      - "Each assumption: upheld, reversed, or narrowed - with the reason"
      - "The authored surface for TodoMVC: which of the spec's behaviours are in, which are out, and why - it must be recognisably TodoMVC, not s2 renamed"
      - "The authored surface for HN front page and item page, and WHICH AXIS each part exists to exercise"
      - "The kit shape: does hn-kit / todomvc-kit follow composition-kit, or does the routing requirement need something composition-kit does not have?"
      - "The exact Worker spec for the FIRST app: objective, allowed_files, verify, stop_if"
    constraints:
      - "READ-ONLY. Author nothing, emit nothing, edit no product file."
      - "MEASURE before ruling on the kit shape - composition-kit is the closest precedent and its per-lane wiring is real, not hypothetical."
      - "A lane limit is a legitimate outcome; an unargued one is not."
      - "FINGERPRINT the owner's three paths at start and finish."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      rationale: "Plan shape is sound but rested on THREE FALSE PREMISES, one of them fatal. composition-kit CANNOT deliver this goal: the CLI target inventory is literally [react, solid] and the kit produces no dev server, so a todomvc-kit caps at 2/6 lanes and 0/12 sites. Six viewable lanes are reachable only via the CORPUS CHAIN. And oracle part 3 collides with the deliverable: pnpm check reads generated/ in react/solid/qwik, so the source MUST be prop-annotated. Assumptions 2 and 3 upheld; 1 upheld but RE-BASED - there is no lifecycle to fetch in."
      summary: "TodoMVC first, authored as ONE fully-annotated component reaching six lanes through the corpus pipeline, not through a composition-kit-shaped kit."
      THE_FATAL_PREMISE: "My question 4 asked 'does hn-kit follow composition-kit'. IT MUST NOT. packages/cli/src/program.ts TARGET_INVENTORY is literally [react, solid] - PM CONFIRMED - and unknown targets throw 'Unknown target (known: react, solid)'. composition-kit, ui-kit and ssr all build react+solid ONLY and SERVE NO SITE. A kit-shaped todomvc caps at TWO OF SIX LANES AND ZERO OF TWELVE SITES, failing oracle parts 1 and 2 BY CONSTRUCTION. Both apps must route through the corpus chain: fixture -> golden -> six regenerate.ts -> generated/ -> six copy-emitted -> six host wirings -> six dev servers."
      THE_DATA_AXIS_I_NAMED_DOES_NOT_EXIST: "Assumption 1's conclusion is UPHELD - determinism across lanes is a good reason to pin - but ITS STATED REASON IS UNSOUND. packages/core/src/index.ts exports exactly state, computed, element and shared, held closed by surface-contract.ts, and PM VERIFIED ZERO LIFECYCLE HOOKS OF ANY KIND. So 'a free global in a lifecycle that must survive SSR and resumption' IS NOT AUTHORABLE, snapshot or live. The only door is computed(async () => ...), whose type unwraps promises via AsyncComputedValue<T> but WHOSE LOWERING HAS ZERO INSTANCES IN ANY LANE. Probe it before HN is planned; if it refuses, HN's front page ships on host-supplied props - which is s2Seed, and exercises NOTHING NEW."
      and_zero_routing_was_true_of_the_wrong_thing: "'Zero routing' holds for the CORPUS and is FALSE of the DELIVERY SURFACE: all six official demos ALREADY ROUTE - PM CONFIRMED qwik src/routes/ and angular app.routes.ts carrying 9 paths. HN's second route needs NO NEW AUTHORING CONSTRUCT, which makes T004's premise wrong as written."
      assumption_2_upheld_but_MY_REASON_ARGUED_THE_OPPOSITE: "I justified TodoMVC-first with 's2 already covers its shapes' - WHICH IS A REASON IT TEACHES LITTLE. The real justification is THE DELIVERY CHAIN: golden -> six regenerate.ts -> generated/ -> six copy-emitted -> six host wirings -> six dev servers, where EVERY LINK CARRIES A HARDCODED 9-ENTRY LIST AND NONE HAS EVER GROWN. That risk is APP-INDEPENDENT, so de-risk it on the app whose shapes are known."
      THE_CONSTRAINT_NOBODY_COSTED: "pnpm check type-checks generated*/ in react, solid and qwik, and ALL 267 ERRORS ARE EMITTED OUTPUT. The mandated deliverable IS new files in generated/. MEASURED BY PM: S8, the annotated fixture, contributes ZERO errors in all three checked lanes, while S2 contributes 34, S7 28, S4 26 and S9 21. ANNOTATION IS THE PRECONDITION FOR ORACLE PART 3, not a style choice."
      three_hazards_measured_in_EXISTING_fixtures: "(1) state(null) POISONS THE INFERRED TYPE - s7's `lock = state(null)` is a live qwik TS2322. Use a '' sentinel. (2) A TOP-LEVEL SIDE-EFFECT CALL emits useRef(null) in react and costs a type error - it is S1's ONLY error. (3) QWIK EMITS onKeydown$ / onDblclick$ rather than its declared onKeyDown$ / onDblClick$, because eventAttributeName capitalises an ALREADY-LOWERCASED name - invisible today because the corpus's three events are all single-word, and the qwik demo is type-checked by no gate."
      evidence:
        - "packages/cli/src/program.ts TARGET_INVENTORY = [react, solid] - PM CONFIRMED"
        - "packages/core/src/index.ts exports state, computed, element, shared only - PM CONFIRMED zero lifecycle hooks"
        - "qwik src/routes/ and angular app.routes.ts with 9 paths - PM CONFIRMED the demos already route"
        - "check census: S2 34, S7 28, S4 26, S9 21, S3 12, S6 11 - and S8 ABSENT - PM CONFIRMED"
        - "svelte emitter: 'a .svelte file declares exactly one component'; vue: 'a .vue SFC declares exactly one component' - both apps must be ONE component per module"
        - "scripts/e2e.mjs threeWayScenarios is the literal ['s1'..'s9'] and officialDemos is 6, so 6 x 9 is a hardcoded invariant a 10th fixture cannot move"
        - "Protected paths unchanged start and finish: f326d314 / aeb7edc1 / f936e169, 116 files"
      missing_evidence:
        - "WHETHER THE COMPILER LOWERS AN ASYNC COMPUTED AT ALL, and whether each of the six emitters can express it. This is the ONLY authorable door to HN's data axis and it is UNMEASURED. Must be probed before T003 is planned."
        - "Whether onKeyDown / onDblClick survive end to end in all six lanes - structurally accepted by every guard, but ZERO corpus instances and no served payload has ever carried a two-word event name."
        - "Whether the six per-lane regenerate.ts / copy-emitted chains tolerate a 10th artifact - each carries a hardcoded 9-entry list and NONE HAS EVER GROWN."
      required_board_updates:
