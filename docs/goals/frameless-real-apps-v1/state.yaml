        - "goal.md assumption 1 and T003: 'a free global in a lifecycle' is NOT AUTHORABLE. Re-stated as 'async computed lowering, unmeasured in all six lanes', with a probe owed before T003."
        - "T001 question 4's premise recorded as false: it must NOT follow composition-kit."
        - "Oracle constraint added: the authored source MUST be fully prop-annotated."
        - "T002 populated from worker_package with the three measured hazards."
        - "TodoMVC's filters recorded as INTERNAL STATE, not URL routes - a deliberate narrowing the final audit must not read as a lane limit."
