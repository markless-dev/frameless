      findings:
        - id: "findings-001-engines-node-floor"
          severity: medium
          note: notes/findings-001-engines-node-floor.md
          detail: >-
            NEW DEFECT, previously unknown. package.json declares engines.node
            ">=20" but the toolchain cannot load vite.config.ts on the Node 20
            GitHub ships (v20.20.2): "TypeScript config files require Node.js
            ^20.19.0 || >=22.12.0". Broke pnpm lint outright and failed 2 tests
            (react/solid format-emitted, which shell out to npx vp fmt). Local
            dev is Node 24.15.0, which is why it was never seen. NOT FIXED HERE
            - the error text is self-contradictory (v20.20.2 satisfies ^20.19.0
            yet fails), so the true floor is unknown and inventing one would put
            a second unverified promise in package.json. Ownership assigned to
            T007, whose Node axis will measure it.
        - id: "browser-defect-is-worse-in-ci"
          severity: medium
          detail: >-
            Locally the parallelism defect errors out after 95-246s. In CI it
            HANGS INDEFINITELY - 20 minutes to job timeout, zero test output,
            orphaned chrome processes. A hang is a worse failure mode than an
            error: it burns budget and reads as "slow" rather than "broken".
            T010 must tighten the browser job timeout as well as fix the cause.
        - id: "tsconfig-widening-is-structural"
          severity: medium
          detail: >-
            Attempted and REVERTED. Including packages/*/test in the root
            tsconfig transitively pulls in .tsx reference files, and a single
            root tsconfig cannot serve both React and Solid JSX - Solid's
            reference.solid.tsx gets React's JSX types, producing TS2786
            "'Show'/'For' cannot be used as a JSX component" plus a cascade of
            event-type mismatches. Correct fix is per-package tsconfigs with the
            right jsx/jsxImportSource. Reverted to a clean tree (pnpm check green)
            rather than half-landing it. Split into T011.
      commands:
