# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless testing enforcement layer: CI, output type-checking, matrix, Qwik parity, generative + metamorphic corpus"
  slug: "frameless-testing-ci-v1"
  kind: existing_plan
  tranche: >-
    Implement audit items 1-7 and 11 from frameless-testing-strategy-v1 as
    successive verified Worker packages inside a dedicated git worktree, each
    lane calibrated to prove it can fail, until the whole suite is green on
    GitHub Actions on branch goal/frameless-testing-ci-v1. Merge is the owner's
    action and is outside this goal.
  status: active
  oracle:
    signal: >-
      Two required signals. (1) A green GitHub Actions run on branch
      goal/frameless-testing-ci-v1, identified by URL - not a local pass, since
      "it works on my laptop" is the exact failure audit item 1 exists to kill.
      (2) Every lane added by this goal ships a calibrated failure demonstration:
      a deliberately broken input that the lane rejects, matching this repo's
      existing culture in packages/analyzer/src/mutants.ts and the
      calibration.browser.test.ts suites.
    cadence: "after each Worker package and at final audit"
    final_proof: >-
      A final audit receipt that links the green Actions run URL, and enumerates
      all eight in-scope items with, for each, the file that implements it and
      the calibration proving it can fail. Any item not implemented must be
      marked blocked with a receipt naming the blocker. A receipt that lists
      green checks without a witnessed failure per lane does not close this goal.
  intake:
    original_request: >-
      Work on everything we talked about in the audit. Frameless is now public so
      it has unlimited GitHub CI minutes. Do it in a separate git worktree, then
      we will merge it back into main and also our current branch.
    interpreted_outcome: >-
      Audit items 1-7 and 11 implemented and calibrated, green on GitHub Actions
      on a dedicated branch, left unmerged for the owner.
    input_shape: existing_plan
    audience: "Frameless maintainer, hardening the compiler before public use"
    authority: approved
    proof_type: test
    completion_proof: >-
      Green Actions run URL on goal/frameless-testing-ci-v1 plus a per-item
      calibration table in the final receipt.
    likely_misfire: >-
      Producing a large volume of green CI that proves nothing - a matrix that
      only runs one cell, a tsc invocation that cannot fail, fast-check
      arbitraries that only emit the three shapes already in the corpus,
      metamorphic transforms over programs too simple for the invariant to bite.
      The calibration requirement in the oracle exists to make this detectable.
    blind_spots_considered:
      - "CI may be red on arrival: nothing has ever been verified on Linux.
         T002 establishes the cold-checkout baseline before any workflow is written."
      - "Qwik pins Vite 7.3.1 while the root workspace is on Vite 8.0.16 - a live
         collision hazard for the Qwik browser project in T006, not hypothetical."
      - "Qwik is on 2.0.0-beta.38; a version matrix across a pre-release may
         measure churn rather than compatibility. T003 decides whether Qwik gets
         a matrix axis at all."
      - "A generative corpus will likely surface real miscompiles, which would
         blow scope if fixed inline; constraints route them to escalation."
      - "CI-first means most later tasks touch the same workflow file; T003 must
         confirm that ordering rather than let it emerge."
      - "'Current branch' moved mid-session (land/stack-and-three-way-demo ->
         goal/frameless-idiom-policy-v1) because a concurrent session drives the
         shared checkout. Merge targets are pinned in goal.md, not guessed."
    existing_plan_facts:
      - "No .github/ exists; .githooks/pre-commit runs vp lint only."
      - "Emitted output is all .jsx and never type-checked; root tsconfig.json
         excludes packages/*/test so pnpm check skips tests."
      - "One version pinned per framework: React 19.2.3, Solid 1.8.22, Qwik
         2.0.0-beta.38. Chromium only, dev mode only, no StrictMode lane."
      - "Qwik: 9 test cases vs React 64 / Solid 79; 163-LOC gate vs 547/713; no
         eslint-plugin-qwik; no browser test project; absent from test.projects
         in vite.config.ts."
      - "Zero fast-check/fuzz hits anywhere in the workspace."
      - "'Jitter testing' is non-standard; implemented as StrictMode lane,
         randomised action ordering, throttled Qwik resumption."
      - "Metamorphic invariants: rename-all, reorder-siblings, extract-child,
         split-file -> identical traces."
      - "VERIFIED AT PREP: repo is public at github.com/markless-dev/frameless,
         default branch main, so Actions minutes are unmetered."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed
  # Verified at prep: ~/.claude/agents/goal-{scout,worker,judge}.md all present.

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/frameless-testing-ci-v1/"
    command: "npx goalbuddy board docs/goals/frameless-testing-ci-v1"

worktree:
  required: true
  branch: "goal/frameless-testing-ci-v1"
  path: ".claude/worktrees/frameless-testing-ci-v1"
  base: "main"
  primary_checkout_offlimits: true
  note: >-
    The primary checkout is being actively driven by a concurrent session
    (currently on goal/frameless-idiom-policy-v1). All Worker writes happen in
    the worktree. Merge is the owner's action; this goal ends at a pushed green
    branch and must not merge, rebase onto main, or force-push.
  collision_warning: >-
    OBSERVED AT PREP, UNCOMMITTED IN THE PRIMARY CHECKOUT: the concurrent
    frameless-idiom-policy-v1 goal is actively editing exactly the files T006
    needs - packages/frameworks/qwik/src/emitter/index.ts,
    packages/frameworks/qwik/test/emitter.test.ts, and all three
    packages/frameworks/qwik/generated/S*.jsx. Branching from main isolates this
    goal from that work in progress, but the two WILL conflict in
    packages/frameworks/qwik/ at merge time. Two consequences the PM must honor:
    (1) T006 must be sequenced late, or re-based on the idiom-policy result once
    it lands, rather than racing it; (2) the owner must be told at merge time
    that qwik/ is a contested path, not surprised by it.

execution_mode:
  delegation: pm_fallback
  reason: >-
    Agents are installed, but subagent dispatch is disabled by session policy in
    this environment, so the PM performs Scout/Judge/Worker-shaped tasks directly.
    GoalBuddy supports this explicitly. Each card records the shape it ran under
    via `executed_as`. This does not relax any task's constraints, write scope,
    or stop conditions - a Scout-shaped PM task is still read-only.
  board_truth: >-
    The primary checkout copy of this state.yaml is canonical while the goal runs,
    because the live board server watches that path. It is synced into the
    worktree and committed at each task boundary so the trail merges with the work.

active_task: T007

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Create the worktree and branch, and seed this board into it so the work and its trail land together."
    inputs:
      - "goal.md worktree + merge-target sections"
      - "git worktree list"
    constraints:
      - "Do not modify the primary checkout beyond docs/goals/frameless-testing-ci-v1/."
      - "Branch from main, not from the current checkout branch."
      - "Do not merge, rebase onto main, or force-push at any point."
    expected_output:
      - "Worktree created at .claude/worktrees/frameless-testing-ci-v1 on branch goal/frameless-testing-ci-v1"
      - "goal.md + state.yaml present inside the worktree"
      - "Confirmation the primary checkout is otherwise untouched"
    receipt:
      result: done
      summary: >-
        Worktree live at .claude/worktrees/frameless-testing-ci-v1 on branch
        goal/frameless-testing-ci-v1, based on main @ eb15408. Both this board and
        the frameless-testing-strategy-v1 audit that produced the plan are seeded
        inside it so the reasoning merges with the work. Primary checkout not
        modified by this goal.
      finding: >-
        MERGE-TARGET AMBIGUITY RESOLVED: land/stack-and-three-way-demo and main are
        the SAME commit (eb15408) - `git merge-base --is-ancestor` confirms land is
        an ancestor of main, and both rev-parse identically. The land branch was
        already merged, so the two merge targets named in goal.md collapse into
        one. This also means main already contains all shipped frameless work, so
        branching from main was correct and loses nothing.
      commands:
        - cmd: "git fetch origin && git rev-parse main origin/main"
          status: pass
          detail: "main == origin/main == eb15408; no divergence to reconcile."
        - cmd: "git worktree add .claude/worktrees/frameless-testing-ci-v1 -b goal/frameless-testing-ci-v1 main"
          status: pass
        - cmd: "git status --porcelain -- ':!docs/goals'"
          status: pass
          detail: >-
            Only the concurrent session's uncommitted Qwik edits appear
            (qwik/src/emitter/index.ts, qwik/test/emitter.test.ts, three
            qwik/generated/S*.jsx) plus its untracked docs/emitter-idiom-policy.md.
            None touched by this goal - confirms worktree isolation is working and
            re-confirms the worktree.collision_warning is live, not theoretical.
      changed_files:
        - "docs/goals/frameless-testing-ci-v1/ (new, primary checkout)"
        - ".claude/worktrees/frameless-testing-ci-v1/ (new worktree, gitignored path)"
      spawned_tasks:
        - T002

  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    executed_as: "Scout-shaped, read-only, PM fallback (see execution_mode)"
    objective: "Establish the cold-checkout verification baseline before any workflow is written."
    inputs:
      - "package.json scripts"
      - "vite.config.ts test.projects"
      - "scripts/e2e.mjs, scripts/demo.mjs"
      - "packages/frameworks/qwik/** (vite version constraint)"
      - "tsconfig.json"
    constraints:
      - "Read-only. Report what is true, including bad news."
      - "Do NOT fix anything found. Red is a finding, not a task."
      - "Report per-command wall-clock time - it decides matrix width."
    expected_output:
      - "Which of check/lint/test/test:browser/e2e pass from a cold install, and which do not"
      - "Per-command runtime and Playwright/browser provisioning needs"
      - "Whether the Qwik Vite 7.3.1 pin collides with the root Vite 8.0.16"
      - "What tsc over emitted .jsx would require (config, types, strictness)"
      - "Anything that would make a Linux runner behave differently from macOS"
    receipt:
      result: done
      note: notes/T002-cold-baseline.md
      summary: >-
        Baseline established in the fresh worktree. check (1.6s), lint (1.5s),
        test (2.3s, 35 files / 519 tests) and e2e (27.1s, 9/9 three-way cells
        equal) all PASS. pnpm test:browser FAILS. Total green-path wall clock is
        ~40s, so the T007 matrix is far cheaper than intake assumed - cost is not
        the constraint.
      findings:
        - id: "browser-lane-broken"
          severity: high
          detail: >-
            pnpm test:browser does not pass as written. Reproduced 4x: it dies
            after 95-246s with "Browser connection was closed while running
            tests" / "[birpc] rpc is closed" and reports "Tests  no tests" - zero
            tests execute. Isolated to DEFAULT FILE PARALLELISM: one file alone
            passes (4 tests, 1.78s); all 5 React files with --no-file-parallelism
            pass (45 tests, 4.98s); all 4 Solid files serial pass (44 tests,
            4.80s). Chromium launches fine standalone (145.0.7632.6) and no
            competing processes were running, so this is not provisioning. Cause:
            the browser configs declare a single chromium instance while vitest
            parallelises test files across it. A warm Vite dep-optimizer cache
            does NOT fix it. Consequence beyond CI: the README's "How We Test"
            guarantees rest on a command an outside contributor cannot currently
            run green. Fix is one setting (fileParallelism:false or the flag in
            the script); serial cost is ~5s per project so there is no speed
            argument for parallelism.
        - id: "qwik-blocker-is-vitest-not-vite"
          severity: high
          detail: >-
            CORRECTS THE INTAKE BLIND SPOT. @qwik.dev/core@2.0.0-beta.38 peer-requires
            vite ">=6 <9" and vitest ">=2 <4". Root resolves vite@8.0.16 - INSIDE
            Qwik's supported range, so the recorded "Qwik needs Vite 7.3.1"
            collision is not the blocker (only demos/qwik pins vite 7.3.1
            locally). The workspace runs vitest@4.1.5, which is OUTSIDE Qwik's
            declared peer range. That is why packages/frameworks/qwik has no
            browser project. T006 must be re-planned around a vitest major
            incompatibility, not a vite one.
        - id: "install-is-the-only-non-transferring-number"
          severity: medium
          detail: >-
            pnpm install --frozen-lockfile measured 2.3s ONLY because the local
            pnpm store is warm. A GitHub runner starts empty. This is the one
            figure in the baseline that will not transfer and the only one
            needing a cache strategy (actions/setup-node cache: pnpm).
        - id: "cross-engine-cheaper-than-assumed"
          severity: low
          detail: >-
            ~/Library/Caches/ms-playwright already holds firefox-1509 and
            webkit-2248 beside four chromium builds. T007's lowest-priority axis
            is worth attempting rather than pre-emptively cutting.
        - id: "jsdom-warning"
          severity: low
          detail: >-
            Solid browser run prints "MISSING DEPENDENCY Cannot find dependency
            'jsdom'" then passes all 44 tests. Non-fatal but will read as failure
            in CI logs.
        - id: "test-count-reconciliation"
          severity: info
          detail: >-
            The audit's 303 is written it()/test() call sites; vitest executes
            519 because suites loop over scenario and mutant tables. Both correct;
            future receipts should quote the executed number.
      commands:
        - cmd: "pnpm install --frozen-lockfile"
          status: pass
          detail: "2.3s, warm store"
        - cmd: "pnpm check"
          status: pass
          detail: "1.6s"
        - cmd: "pnpm lint"
          status: pass
          detail: "1.5s, 0 warnings 0 errors, 236 files"
        - cmd: "pnpm test"
          status: pass
          detail: "2.3s, 35 files, 519 tests, 1 skipped"
        - cmd: "pnpm test:browser"
          status: fail
          detail: "dies after 95-186s, zero tests executed - see browser-lane-broken"
        - cmd: "vitest run --project react-browser --no-file-parallelism"
          status: pass
          detail: "5 files, 45 tests, 4.98s"
        - cmd: "vitest run --project solid-browser --no-file-parallelism"
          status: pass
          detail: "4 files, 44 tests, 4.80s"
        - cmd: "pnpm e2e"
          status: pass
          detail: "27.1s, 9/9 three-way cells equal, all receipts written"
      spawned_tasks:
        - T003

  - id: T010
    type: worker
    assignee: Worker
    status: done
    executed_as: "Worker-shaped, PM fallback (see execution_mode)"
    reasoning_hint: medium
    sequence_note: >-
      Numbered T010 because it was created after the board was seeded, but it runs
      EARLY - immediately after T003 and before T004. It repairs the defect T002
      found, and every later browser-dependent lane (T005 calibration, T006 Qwik,
      T007 matrix, T008 e2e work) depends on it.
    objective: "Repair the browser lane so pnpm test:browser passes as written (blocks every later browser-dependent lane)."
    allowed_files:
      - "packages/frameworks/react/vitest.config.ts"
      - "packages/frameworks/solid/vitest.config.ts"
      - "demos/*/test/*/vitest.config.ts"
      - "package.json"
      # PM AMENDMENT during execution: the Solid lane exits 1 despite 44/44 tests
      # passing, because vite-plugin-solid probes for jsdom and the dependency is
      # absent. Fixing it needs the Solid package manifest. Squarely within this
      # task's objective ("passes as written"), so allowed rather than deferred -
      # recorded here instead of quietly overstepping the original scope.
      - "packages/frameworks/solid/package.json"
      - "pnpm-lock.yaml"
      # PM AMENDMENT 2: the browser job's timeout and its explanatory comment live
      # in the workflow, and both had to change once the real cause was known -
      # the lane hangs rather than errors, and the committed comment named the
      # wrong cause. Recorded rather than silently written outside scope.
      - ".github/workflows/**"
    verify:
      - "pnpm test:browser passes from a clean node_modules/.vite"
      - "the fix is a config/script change only - no test assertion is weakened or skipped"
      - "CI browser job goes GREEN, closing the red-to-green calibration pair opened by T004"
      - "the browser job timeout is tightened - the calibration run burned its full 20min budget hanging, which is the wrong failure mode to keep"
    stop_if:
      - "Serial execution does not actually fix the demo-kit browser projects the way it fixed react/solid."
      - "Making it pass requires changing a test assertion rather than a runner setting."
      - "Verification fails twice."
    receipt:
      result: done
      note: notes/T010-browser-lane.md
      summary: >-
        pnpm test:browser passes as written - 89 tests (45 React + 44 Solid),
        exit 0, from a cold Vite cache, under 9s. CI run 30218678278 is FULLY
        GREEN on all four jobs, closing the red-to-green calibration pair T004
        opened. No assertion was weakened, skipped, or excluded.
      corrections:
        - id: "T002-file-parallelism-diagnosis-was-wrong"
          detail: >-
            T002 blamed default file parallelism from a comparison that changed
            TWO variables at once - it added --no-file-parallelism AND switched
            from `vp test` at the root to the real vitest binary in the package
            dir. The decisive experiment run here (real vitest, package dir,
            parallelism left ON) passes 45/45 in 5.31s, so parallelism was never
            the cause. REAL CAUSE: vite-plus@0.1.20 bundles its own vitest runner
            while @vitest/browser resolves to 4.1.5 - "Running mixed versions is
            not supported" - and the mismatched pair breaks the browser RPC,
            which is why the symptom was a dropped connection with zero tests run
            rather than an assertion failure. The fileParallelism edits made under
            the wrong diagnosis were REVERTED rather than left in six config
            files encoding a false explanation.
        - id: "jsdom-was-not-a-stale-artifact"
          detail: >-
            Mid-task I recorded the jsdom probe as a stale node_modules artifact,
            because a local `pnpm install --force` made it vanish. CI run
            30218566637 did a clean --frozen-lockfile install and it came right
            back: React 45/45 exit 0, Solid 44/44 but EXIT 1. The --force
            reinstall had masked a real condition. Real cause: vite-plugin-solid
            injects environment:'jsdom' when it detects vitest; the browser lanes
            never use that environment but vitest still tries to resolve it and
            exits nonzero when it cannot, with every test green. Fixed by stating
            environment:'node' explicitly, which wins over the plugin injection.
            Two attempts to satisfy the probe with an actual jsdom dependency were
            reverted - both forked vitest's peer identity and broke pnpm check
            with "Types have separate declarations of a private property
            _clearScreenPending".
      lesson: >-
        Both wrong diagnoses in this task came from a local environment differing
        from a clean one in a way that hid the real condition, and CI corrected
        both. That is audit item 1's thesis demonstrated twice inside the task
        that implements it.
      commands:
        - cmd: "pnpm test:browser (cold vite cache)"
          status: pass
          detail: "89 tests, exit 0"
        - cmd: "pnpm check"
          status: pass
        - cmd: "pnpm test"
          status: pass
          detail: "35 files, 519 tests"
        - cmd: "gh run watch 30218678278"
          status: pass
          detail: "ALL FOUR JOBS GREEN - check+lint, node tests, browser lanes, e2e"
      changed_files:
        - "package.json"
        - "packages/frameworks/solid/vitest.config.ts"
        - ".github/workflows/ci.yml"
      changed_files_detail:
        package.json: "browser scripts route through the real vitest"
        packages/frameworks/solid/vitest.config.ts: "environment pinned to node"
        .github/workflows/ci.yml: "browser timeout 20m -> 10m; comment updated to the real cause"
      still_open: >-
        The demo browser projects (demos/{ui-kit,composition-kit}/test/*/vitest.config.ts)
        are declared in root vite.config.ts test.projects but NO script targets
        them - pnpm test filters to --project node and test:browser names only the
        two framework projects. Exercised indirectly by pnpm e2e, never as unit
        browser lanes. Handed to T007, which owns matrix breadth.
      run_urls:
        - "https://github.com/markless-dev/frameless/actions/runs/30218678278"

  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    executed_as: "Judge-shaped, read-only, PM fallback (see execution_mode)"
    objective: "Validate the owner's plan against Scout evidence and pin the slice order and matrix axes."
    inputs:
      - "T002 receipt"
      - "goal.md existing plan facts and blind spots"
    constraints:
      - "Do not implement."
      - "Preserve the owner's ranking unless evidence contradicts it; if it does, say so explicitly and justify the change."
      - "Decide matrix axes concretely - exact versions per framework, Node versions, OS set, whether Qwik gets an axis given its beta pin, and whether Firefox/WebKit survive."
      - "Rule on worktree.collision_warning: decide whether T006 runs now and accepts a merge conflict in packages/frameworks/qwik/, waits for frameless-idiom-policy-v1 to land, or is re-scoped to the non-contested parts (browser project registration, eslint-plugin-qwik) only."
    expected_output:
      - "Validated or amended slice order for T004-T009"
      - "Exact matrix cells, enumerated"
      - "Ruling on the CI-first ordering and shared-workflow-file contention"
      - "Ruling on how a generative-corpus miscompile finding gets escalated rather than fixed inline"
      - "Any plan item that Scout evidence says is infeasible as written"
    receipt:
      result: done
      note: notes/T003-plan-validation.md
      decision: approved_with_amendments
      full_outcome_complete: false
      rationale: >-
        The owner's plan survives with one item materially re-scoped and one new
        item inserted ahead of it. The risk ranking is preserved; the only
        reordering is by dependency, never by preference. Six rulings issued.
      rulings:
        - id: "ci-lands-first-and-is-expected-red"
          detail: >-
            T004 runs BEFORE T010. Its first run is expected to fail the browser
            job on the real defect T002 found. Rejected the tempting
            fix-then-automate order because it discards the best calibration
            artifact available: a red-to-green pair from a genuine pre-existing
            bug is stronger evidence that CI works than any planted mutant, and
            for CI itself a synthetic failure would be theatre. T004's verify is
            amended to require check/lint/test/e2e green and the browser job red
            FOR THE T002 REASON SPECIFICALLY - failing for any other reason is a
            stop condition, since that would mean a second unknown defect.
        - id: "qwik-browser-project-cancelled-not-deferred"
          detail: >-
            T006 no longer adds a Qwik browser test project. Decisive argument is
            interpretability, not caution: on vitest 4 (outside Qwik's declared
            "vitest >=2 <4" peer range) a red lane could not be attributed to our
            emitter versus the unsupported runner, and an unattributable test is
            this goal's recorded misfire in concrete form. Re-scoped to
            eslint-plugin-qwik adoption, gate policy parity, registering the
            existing node project in vite.config.ts test.projects, and
            documenting the gap. Unblock condition recorded: a @qwik.dev/core
            release whose peerDependencies.vitest admits 4.x. Behavioral Qwik
            coverage is NOT lost - pnpm e2e already proves resumption green
            across S1/S2/S3.
        - id: "collision-risk-drops-to-low"
          detail: >-
            Side effect of the Qwik re-scope: T006 now touches qwik/src/gate/,
            qwik/package.json and vite.config.ts, while the concurrent
            frameless-idiom-policy-v1 goal edits qwik/src/emitter/index.ts,
            qwik/test/emitter.test.ts and qwik/generated/S*.jsx. Nearly disjoint.
            worktree.collision_warning drops from high to low with no scheduling
            concession, so T006 runs in its planned position.
        - id: "matrix-cells-enumerated"
          detail: >-
            T002 measured the green path at ~40s, so the intake assumption that
            matrix width needs rationing does not hold - cost is no longer the
            constraint, per-cell interpretability is. Rejected the full cartesian
            product (108 cells) as mostly information-free and hard to attribute.
            Adopted Svelte's shape - broad on one OS, thin elsewhere: ubuntu x
            Node 20/22/24 full suite; macos + windows on Node 20; framework
            version axis (React 19.2.3 + latest 19.x, Solid 1.8.22 + latest 1.x)
            on ubuntu x Node 22; Qwik gets a SINGLE pinned cell and no axis,
            since a matrix across a pre-release measures upstream churn;
            dev + production modes; firefox + webkit on ubuntu x Node 22 only;
            a dedicated StrictMode lane.
        - id: "workflow-contention-accepted"
          detail: >-
            Six tasks touch .github/workflows/. Accepted with no structural
            mitigation: one_active_task and max_write_workers:1 make concurrent
            edits impossible, so splitting into six workflow files would
            over-engineer against a hazard that cannot occur and would fragment
            the CI story a newcomer must read. Carried instruction: each Worker
            ADDS a job rather than restructuring existing ones; a Worker
            rewriting T004's jobs has exceeded its slice.
        - id: "escalation-protocol-for-miscompiles"
          detail: >-
            T009 and possibly T008 will surface real compiler bugs. Protocol:
