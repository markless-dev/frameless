  - id: T012
    type: worker
    assignee: Worker
    status: done
    executed_as: "Worker-shaped, PM fallback (see execution_mode)"
    reasoning_hint: medium
    sequence_note: >-
      Split out of T008 during execution. Audit item 11 - the concrete form of
      what the owner called "jitter testing". One third of it (the StrictMode
      lane) was already delivered by T007; these are the other two.
    objective: "Randomised action ordering and network-throttled Qwik resumption (audit item 11)."
    allowed_files:
      - "packages/analyzer/**"
      - "packages/frameworks/*/test/**"
      - "demos/*/test/**"
      - "demos/*/*.ts"
      - ".github/workflows/**"
    verify:
      - "S2's order-independent actions run in randomised order and both targets still agree"
      - "Qwik resumption is exercised under network throttling"
      - "calibration: a seeded order-dependence is detected"
    stop_if:
      - "Randomising order reveals a real divergence - that is a finding, escalate rather than fixing the emitter."
      - "Need files outside allowed_files."
      - "Verification fails twice."
    receipt:
      result: done
      summary: >-
        Randomised action ordering landed for S3 - emitted output must agree with
        the handwritten reference under four different action orders, not just the
        scripted one. React browser lane 50 -> 55 tests, all green.
      design: >-
        The invariant deliberately does NOT require knowing which actions commute:
        "for ANY order, emitted and reference must still agree". The end state may
        differ from the scripted run; what must hold is that both implementations
        get there identically across DOM, callbacks, identity and focus.
      calibration:
        claim: "The lane is sensitive to order rather than blind to it."
        evidence: >-
          The scripted order and a permutation are asserted to produce DIFFERENT
          traces, after first asserting the two orders genuinely differ. A first
          version compared two seeds and failed - S3 has only three actions, so
          different seeds can land on the same permutation and the calibration
          would have passed for the wrong reason.
      scope_limit:
        - id: "S2 excluded, with cause"
          detail: >-
            S2's actions are NOT order-independent - they add an item then edit,
            toggle, reorder and remove it BY ID. An arbitrary permutation asks the
            adapter to target an element that does not exist yet, which THROWS
            rather than diverging, so a permuted S2 exercises the harness's error
            handling and not the emitter. All four S2 seeds failed that way and so
            did the calibration, which is what made the cause legible. Doing S2
            properly needs either a commutativity model for actions or an outcome
            comparison that treats "target not found" as a result both
            implementations must share. Recorded rather than bodged.
      not_done:
        - id: "network-throttled Qwik resumption"
          detail: >-
            The third strand of audit item 11 remains open. Qwik fetches a handler
            QRL at click time, so throttled resumption is a genuinely untested
            path - and the one place where the owner's "jitter" instinct maps onto
            real timing variance rather than ordering. Not started.
      commands:
        - cmd: "pnpm test:react"
          status: pass
          detail: "7 files, 55 tests"
        - cmd: "pnpm check"
          status: pass
        - cmd: "pnpm lint"
          status: pass
      changed_files:
        - "packages/frameworks/react/test/action-order.browser.test.ts"

