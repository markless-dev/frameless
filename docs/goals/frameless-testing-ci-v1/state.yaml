  - id: T005
    type: worker
    assignee: Worker
    status: done
    executed_as: "Worker-shaped, PM fallback (see execution_mode)"
    reasoning_hint: medium
    objective: "Type-check emitted output as an independent oracle, calibrated to prove it rejects a bad emit (audit item 2)."
    allowed_files:
      - "packages/frameworks/*/test/**"
      - "packages/frameworks/*/*.config.ts"
      - "packages/frameworks/*/package.json"
      - ".github/workflows/**"
    verify:
      - "pnpm test"
      - "the new lane rejects a deliberately broken emitted file"
    stop_if:
      - "Making the lane pass would require regenerating a committed golden."
      - "Need to change emitter behavior to make output type-check - that is a finding, escalate it."
      - "Verification fails twice."
    receipt:
      result: done
      summary: >-
        Emitted output is now type-checked by the real TypeScript compiler in both
        framework packages, running under pnpm test and therefore in CI. Full suite
        37 files / 531 tests green; CI run 30218967976 green on all four jobs.
      design: >-
        Both lanes assert EXACT EQUALITY against an ACCEPTED list in which every
        surviving diagnostic carries a written reason. Exact equality means a new
        diagnostic fails the lane AND a vanishing one fails it too, so the baseline
        cannot drift silently in either direction. Strictness is deliberately OFF:
        a first pass with strict:true produced 23 diagnostics that were almost all
        artifacts of inferring types for untyped JS (useRef(null) narrowing to
        never, event.target being EventTarget). A lane that reports 23 false
        positives is as useless as one that cannot fail, so it is tuned to the
        class that is meaningful for generated code - undefined identifiers,
        missing or misspelled imports, nonexistent framework APIs, invalid JSX.
      calibration:
        claim: "This lane can fail, and its calibrations are not self-satisfying."
        evidence: >-
          Three seeded defects per lane - a dropped hook/primitive import, a call
          to an API the framework does not have, an invalid JSX attribute value -
          each caught. Then the lane itself was BLINDED (diagnose() stubbed to
          return no diagnostics) and all three calibration cases plus the baseline
          assertion failed, proving the calibrations depend on the mechanism rather
          than passing incidentally.
      findings:
        - id: "findings-002-solid-attr-namespace"
          severity: medium
          note: notes/findings-002-solid-attr-namespace.md
          detail: >-
            NOT an inference artifact. Emitted Solid uses attr:value, which
            solid-js's own InputHTMLAttributes rejects - three diagnostics across
            S2 and S3, with no React equivalent. Not a runtime bug: pnpm e2e passes
            all nine three-way cells and the Solid browser lane passes 44/44,
            exercising these exact files. But it means Solid output does NOT drop
            cleanly into a TypeScript project, which is precisely the claim audit
            item 2 existed to test, and no pre-existing check could have caught it
            - the gate enforces rules we wrote, the browser lanes check behavior,
            and pnpm check never looked at emitted output. Recorded not fixed:
            choosing between an emitter change and an upstream typing gap is a
            behavior decision this goal's charter forbids from a testing task. Held
            in ACCEPTED labelled OPEN FINDING 002 under exact equality, so it
            cannot silently disappear.
      commands:
        - cmd: "pnpm test"
          status: pass
          detail: "37 files, 531 tests, 1 skipped"
        - cmd: "pnpm check"
          status: pass
        - cmd: "pnpm lint"
          status: pass
        - cmd: "gh run view 30218967976"
          status: pass
          detail: "all four CI jobs green"
      changed_files:
        - "packages/frameworks/react/test/emitted-typecheck.test.ts"
        - "packages/frameworks/solid/test/emitted-typecheck.test.ts"
      note_on_ci_wiring: >-
        No workflow change was needed - these are node-lane tests picked up by the
        existing root test project, so CI already runs them.
      spawned_tasks:
        - T006

  - id: T006
    type: worker
    assignee: Worker
    status: done
    executed_as: "Worker-shaped, PM fallback (see execution_mode)"
    reasoning_hint: medium
    objective: "Qwik gate parity per T003 Ruling 2: eslint-plugin-qwik, gate policy expansion, node-project registration, and document the browser-project gap. NO browser project - upstream blocked."
    allowed_files:
      - "packages/frameworks/qwik/**"
      - "vite.config.ts"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
      # PM AMENDMENT: adopting eslint-plugin-qwik necessarily writes the lockfile.
      # Recorded rather than written silently outside scope.
      - "pnpm-lock.yaml"
    verify:
      - "pnpm test"
      - "each new Qwik gate policy rejects a violating input"
      - "the Qwik node project appears in vite.config.ts test.projects and actually runs"
      - "the no-browser-project gap is documented in-repo with the unblock condition"
    prechecked_by_pm: >-
      Registry facts verified during T004's CI wait, both CONFIRMING T003 Ruling 2:
      (1) eslint-plugin-qwik publishes a beta tag at 2.0.0-beta.38, exactly matching
      @qwik.dev/core, and peers only on eslint "^8.57.0 || ^9.0.0 || ^10.0.0" -
      compatible with this repo's eslint ^9.39.2. The first stop_if below is
      therefore de-risked; use the beta tag, not latest (1.20.0, which is Qwik 1).
      (2) @qwik.dev/core@latest IS 2.0.0-beta.38 - there is no newer release, and it
      still declares vitest ">=2 <4". So the browser-project cancellation is not
      merely deferred pending an upgrade; no upgrade currently exists.
    stop_if:
      - "eslint-plugin-qwik does not support Qwik 2 - record the finding and complete the remaining parts rather than blocking the whole task."
      - "Tempted to add a Qwik browser project anyway - T003 Ruling 2 cancelled it; a lane whose failures cannot be attributed is not a test."
      - "Need files outside allowed_files."
      - "Verification fails twice."
    receipt:
      result: done
      note: notes/findings-003-qwik-async-preventdefault.md
      summary: >-
        The Qwik gate now runs 12 of Qwik's own eslint rules over emitted output,
        closing the framework-native-lint asymmetry with React and Solid. Qwik
        tests 9 -> 16. Full suite 37 files / 536 tests green; CI run 30219602903
        green on all four jobs. The no-browser-project decision is documented in
        packages/frameworks/qwik/README.md with its unblock condition.
      calibration:
        claim: "The new Qwik policies reject violating input."
        evidence: >-
          Four seeded violations - jsx-key, no-react-props, jsx-no-script-url,
          jsx-img - each proven to be reported under its own policy id, plus an
          assertion that the clean corpus does NOT trip those same rules, so the
          calibration cannot pass by the gate simply flagging everything.
      findings:
        - id: "findings-003-qwik-async-preventdefault"
          severity: high
          note: notes/findings-003-qwik-async-preventdefault.md
          detail: >-
            REAL EMITTER DEFECT, found on the first run of the new rules.
            generated/S3.jsx:38 puts event.preventDefault() inside an async QRL,
            where Qwik's own no-async-prevent-default rule says it cannot work -
            the handler is fetched and resolves after the browser has already
            dispatched the default action. Qwik's supported mechanism is the
            preventdefault: JSX attribute. React and Solid are unaffected because
            their handlers are synchronous. WHY IT WENT UNNOTICED: cancellation is
            an explicitly tested channel (analyzer/mutants.ts declares
            wrong-cancellation against S3), but that calibration runs only in the
            React and Solid BROWSER lanes, Qwik has no browser project, the Qwik
            gate had no framework-native rules, and e2e's three-way contract
            asserts text content and write counts rather than whether the default
            was prevented. Every lane that could have caught it was either absent
            for Qwik or not looking at cancellation. NOT FIXED - the charter
            forbids emitter changes from a testing task, and honestly the rule
            fired but a runtime divergence has not been demonstrated, only
            predicted. Recommended next step is written in the note: assert
            cancellation in all three frameworks, watch it FAIL for Qwik, then fix.
            Held as a known-failing expectation under exact equality so it cannot
            drift shut.
      corrections:
        - id: "T003-ruling-2-qwik-project-registration-was-wrong"
          detail: >-
            T003 Ruling 2 listed "register the Qwik node project in vite.config.ts
            test.projects" as a real gap. It is not. Qwik tests already run via the
            root node project's packages/frameworks/*/test/**/*.test.ts glob - the
            531 -> 536 test delta is exactly the 5 new calibrations, and the file
            count stayed at 37. Registering the config would have created a
            duplicate qwik-node project that double-runs those tests under any
            invocation not filtered to --project node. The change was made, tested,
            and REVERTED to a clean diff.
      deferred:
        - id: "type-aware-qwik-rules"
          detail: >-
            2 of 14 rules need type information and cannot run on plain .jsx:
            valid-lexical-scope and use-async-top. valid-lexical-scope is the
            costly omission - it catches non-serializable values captured across a
            QRL boundary, the defining failure mode of generated resumable code.
            Recorded in QWIK_ESLINT_RULES_REQUIRING_TYPES in the gate source rather
            than dropped silently. Unblocked by T011's per-package tsconfigs.
      commands:
        - cmd: "pnpm test"
          status: pass
          detail: "37 files, 536 tests"
        - cmd: "pnpm check"
          status: pass
        - cmd: "pnpm lint"
          status: pass
        - cmd: "gh run view 30219602903"
          status: pass
          detail: "all four CI jobs green"
      changed_files:
        - "packages/frameworks/qwik/src/gate/index.ts"
        - "packages/frameworks/qwik/src/eslint-plugins.d.ts"
        - "packages/frameworks/qwik/test/gate.test.ts"
        - "packages/frameworks/qwik/package.json"
        - "packages/frameworks/qwik/README.md"
        - "pnpm-lock.yaml"
      spawned_tasks:
        - T007

