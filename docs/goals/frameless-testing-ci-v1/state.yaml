      calibration:
        claim: "This workflow catches real defects, not planted ones."
        evidence: >-
          Run 1 (30216328175) failed 3 of 4 jobs and surfaced a defect NOBODY
          KNEW ABOUT - see findings-001. Run 2 (30216393897) browser job hung to
