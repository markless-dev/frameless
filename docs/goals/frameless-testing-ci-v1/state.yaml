        claim: "The properties can fail."
        evidence: "An unrecognised construct must be rejected, and a changed state literal must be detected as a non-rename edit."
      corrections:
        - id: "totality-regex-was-too-narrow"
          detail: >-
            The first draft asserted the rejection MESSAGE matched
            /Unsupported|cannot be represented/. It failed - but the compiler was
            failing closed correctly with its own authored diagnostic ("Code must
            be at the top of '@{ }'"); my regex was the bug. Rewritten to
            discriminate on error type, which is the property actually worth
            asserting.
        - id: "generator-emitted-invalid-for-syntax"
          detail: >-
            The first @for form was wrong, so keyed-repeat never compiled and the
            coverage property correctly reported it missing. The coverage property
            caught my own generator bug on its first run, which is a reasonable
            argument for having written it.
      findings:
        - id: "findings-006-rename-ordering"
          severity: unknown
          note: notes/findings-006-rename-ordering.md
          detail: >-
            RECORDED, NOT CONCLUDED. The whole-IR rename invariant holds exactly on
            all three fixtures but fails generatively once a program has several
            locals. Evidence points at a rename moving a name alphabetically and a
            name-ordered collection legitimately reordering - but that was NOT
            verified, and the alternative (genuinely unstable declaration order) is
            more serious. Property 3 was narrowed to template structure with a
            pointer to the note. Narrowing rather than deleting keeps it running;
            claiming the strong property holds generatively would have been false.
      commands:
        - cmd: "pnpm test"
          status: pass
          detail: "39 files, 548 tests"
        - cmd: "pnpm check"
          status: pass
        - cmd: "pnpm lint"
          status: pass
        - cmd: "gh run view 30220307268"
          status: pass
          detail: "green on all jobs"
      changed_files:
        - "packages/compiler/test/generative.test.ts"
        - "package.json"
        - "pnpm-lock.yaml"

