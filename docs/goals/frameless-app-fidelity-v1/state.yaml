    reasoning_hint: high
    objective: >-
      RULE THE GLOBALS ALLOWLIST for the angular and vue emitters. This is what costs S11 and S12
      their sixth lane, and it is our emitter, not the framework.
    WHAT_IS_MEASURED: >-
      ANGULAR HAS NO ALLOWLIST AT ALL: every identifier in a transplanted body must resolve to
      scope or a declared member, so Promise, setTimeout, Date, JSON and fetch are ALL refused -
      "The emitter throws rather than guessing whether it is a global." VUE HAS ONE AND IT IS
      INCOMPLETE: @vue/shared's GLOBALS_ALLOWED carries Date and JSON but NOT Promise or
      setTimeout, so vue emits `new _ctx.Promise(...)`, passes its gate, compileScript, tsc AND
      pnpm check, and THROWS IN THE BROWSER. SAME MISSING CONCEPT, TWO MATURITIES - and ANGULAR'S
      IS THE BETTER BEHAVIOUR, because loud and early beats silent until runtime.
    THE_DECISION_IS_WHICH_GLOBALS_COUNT: >-
      Promise, setTimeout, Date, JSON and Math are uncontroversial. fetch, localStorage and
      document touch the SSR and persistence boundaries this project has deliberately fenced -
      persistence has its own channel ruling and its own pre-paint contract. AND THERE IS A LIVE
      CONSTRAINT: S13 and S15 pass dates as LITERALS precisely because angular cannot name Date,
      so admitting Date changes what those fixtures could have been. RULE THE LIST AND SAY WHAT
      IT EXCLUDES.
    constraints:
      - "READ-ONLY. If your harness forbids report .md files, SAY SO and let your receipt be the ruling."
      - "MEASURE THE COST: what does admitting each candidate do to each lane's emitted typecheck, and does vue's runtime failure actually close if GLOBALS_ALLOWED is extended - or is that upstream's list rather than ours to extend? THAT DISTINCTION DECIDES WHETHER VUE IS FIXABLE HERE AT ALL."
