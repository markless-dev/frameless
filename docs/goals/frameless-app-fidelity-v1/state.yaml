# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless app fidelity: make the demos actually work like the things they copy"
  slug: "frameless-app-fidelity-v1"
  kind: recovery
  status: active
  tranche: >-
    Fix the five defects the owner found driving the qwik lane, close the globals hole that costs
    two apps their sixth lane, and INSTALL THE MISSING ORACLE: compare each app against the thing
    it copies, not against its other lanes.
  oracle:
    signal: >-
      THREE PARTS, ALL REQUIRED. (1) EVERY SHIPPED APP IS COMPARED AGAINST ITS REFERENCE, NOT ONLY
      AGAINST ITS OTHER LANES: a named reference, a RENDERED CAPTURE of it, and a measured
      feature-by-feature comparison. "SIX LANES AGREE" IS NOT EVIDENCE OF FIDELITY AND MAY NOT BE
      OFFERED AS ANY PART OF THIS ORACLE. (2) EVERY DEFECT THE OWNER FOUND IS EITHER FIXED OR
      REFUSED WITH A MEASURED REASON - all five, named individually, each with a browser
      observation at HEAD AFTER the change. (3) NOTHING REGRESSES: pnpm test at EXACTLY ONE
      failure; pnpm e2e stays 6 x 9; lint and check:citations clean. pnpm check MAY RISE only on a
      card that states the amount IN ADVANCE and justifies it.
    cadence: "after each fix, and at final audit"
    final_proof: >-
      Per app, the reference comparison ACTUALLY RUN; per owner-finding, the browser observation;
      per lane not shipped, the verbatim refusal; and the check budget's start and end values with
      every rise attributed.
  intake:
    original_request: >-
      The owner drove the qwik lane and found five things wrong - habits and contacts reading as
      dead, the board not dragging, HN links going nowhere, no per-item disclosure - then said
      "Fix it all."
    interpreted_outcome: >-
      The five findings closed, the globals hole ruled and landed, and an oracle that measures
      fidelity to the reference rather than agreement between lanes.
    input_shape: recovery
    proof_type: demo
    completion_proof: >-
      Five browser observations, one reference comparison per app, every refusal verbatim, every
      check-budget rise attributed.
    likely_misfire: >-
      FIXING THE FIVE FINDINGS AND LEAVING THE ORACLE HOLE OPEN. The findings are symptoms; the
      cause is that nothing ever compared a shipped app to the thing it copies.

active_task: T020

