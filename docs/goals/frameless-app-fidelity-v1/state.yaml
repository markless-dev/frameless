owner_decisions:
  - id: OD1
    subject: "S12 codex-clone and ORACLE PART 1"
    asked: >-
      S12's reference UI is recorded by T008 as login-walled, leaving only a public marketing
      page as its renderable surface. Exempt S12 by name, accept the marketing page as the
      named reference, or hold completion for owner-provided authenticated access?
    owner_verbatim: "Huh? Nothing should be behind a login but if it is then skip it"
    ruling: >-
      S12 IS EXEMPT FROM ORACLE PART 1 BY NAME. Part 1's "EVERY SHIPPED APP" is amended to
      "EVERY SHIPPED APP EXCEPT S12", and S12's absence of a rendered reference capture is a
      RECORDED EXEMPTION, NOT A SILENT GAP. Parts 2 and 3 bind to S12 unchanged.
    premise_honesty: >-
      THE PM DID NOT PROVE THE LOGIN WALL AND WILL NOT CLAIM IT DID. Unauthenticated curl of
      chatgpt.com/codex and openai.com/codex BOTH ANSWER 403, WHICH IS BOT-BLOCKING AND IS NOT
      EVIDENCE OF A LOGIN WALL. The exemption rests on T008's recorded measurement plus the
      owner's ruling. THE OWNER'S RULING IS CONDITIONAL BY ITS OWN WORDS - "nothing should be
      behind a login BUT IF IT IS" - so if any later card reaches the live Codex UI without
      authenticating, PART 1 REOPENS FOR S12 AUTOMATICALLY.
  - id: OD2
    subject: "/contacts type=url placeholder trap - the live silent submit dead-end"
    asked: >-
      s17-contacts.tsrx:1013-1017 ships `type="url"` beside `placeholder="example.com"`. The
      placeholder teaches an input the field's own native validation rejects, so submit
      dead-ends. Fix the placeholder, change the input type, add a hint, or record and ship?
    owner_verbatim: "Fix the placeholder"
    ruling: >-
      FIX THE PLACEHOLDER. `example.com` becomes a scheme-bearing value the field accepts.
      `type="url"` STAYS - the thirteen control kinds this page exists to demonstrate are not
      reduced to twelve to dodge a validation message, and NO NEW DOM IS ADDED. Owned by T010.
    scope_warning: >-
      THIS CHANGES ONE STRING IN ONE FIXTURE AND IS RE-EMITTED TO SIX LANES. It is the FIRST
      card on this board permitted to change WHAT AN APP DOES since T005. It does not license
      any other behavioural edit.

  - id: OD3
    subject: "Nine families of stale hand-written counts - how to fix the generator, not the symptoms"
    asked: >-
      T015 refused to half-close the seventh population and answered the convergence question:
      NOT CONVERGING. Nine families share ONE generator - a count derived from a table at
      authoring time and hand-written into prose no check recompiles. Keep hand-sweeping
      (~73+ sites, ~30 files, and it rots again at S18); MAKE IT A CHECK; accept a recorded gap;
      or close the demo layer only?
    owner_verbatim: "Make it a check"
    ruling: >-
      MAKE IT A CHECK. Rewrite the claims to STATE THE FACT WITHOUT THE FRAGILE POSITION - name
      the lanes, not the ordinal - and extend the guard to RECOMPILE genuinely load-bearing
      counts. This is the fix THIS REPO ALREADY APPLIED to citation line ordinals at
      scripts/check-citations.mjs after four hand-correction cards re-drifted. It is the only
      path on which S18 does not reopen all nine families.
    scope_warning: >-
      THIS IS THE FIRST CARD ON THIS BOARD PERMITTED TO CHANGE WHAT A CHECK DOES. Every record
      card since T008 has been prose-only. A guard that is not PROVEN RED-CAPABLE against REAL
      stale sites is worse than no guard, because it certifies the rot.
    sequencing: >-
      PROVE THE MECHANISM ON THE SMALLEST COMPLETE FAMILY FIRST (T017, family eight, 5 sites in 5
      files), THEN apply it to the large ones (family seven, 53 sites/21 files; family nine, ~15
      sites). Building the guard and adopting it nowhere would leave it unproven; adopting it
      across 21 files before it is proven would risk 21 files on an unvalidated instrument.

