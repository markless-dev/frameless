  - "state.yaml is board truth; goal.md is the charter."
  - "Exactly one active task unless disjoint write scopes are proven."
  - "Scout and Judge are READ-ONLY. Workers write only inside allowed_files and run their verify commands."
  - "Every completed, blocked or escalated task gets a receipt."
  - "The goal completes only through a final Judge audit recording full_outcome_complete: true."
  - "MEASURE, NEVER INHERIT. Every card across the last three boards corrected its dispatch, including four final audits."
  - "FIDELITY IS MEASURED AGAINST THE REFERENCE. Cross-lane agreement is a DIFFERENT claim and may not stand in for it."

