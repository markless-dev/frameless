      - "Assume this brief contains at least one error and find it."
    expected_output:
      - "the admitted list, with the deciding argument"
      - "what it excludes, stated plainly"
      - "whether vue's runtime throw closes here or upstream"
      - "worker spec if it should proceed"
    receipt: null

