# `git status --short` shows `M pnpm-lock.yaml`, `M pnpm-workspace.yaml` and
# `?? website/` - EXACTLY the three paths every stop_if forbids touching.
# VERIFIED BY THE PM: mtimes are 2026-07-28, three days before this session, and
# the last commit touching either file is d1ad075, long predating it. NO CARD
