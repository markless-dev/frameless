      - "All done task receipts"
      - "T011 structural gate run"
      - "T012 cold-agent artifact"
      - "In-repo concept art"
    constraints:
      - "Read-only."
      - "Be skeptical. The stated misfire is a plausible-looking folder that does not cohere — look for it specifically."
      - "Verify the generating agent truly had no conversation context. If that cannot be confirmed, the one-shot is void."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "Per-signal verdict with evidence"
      - "OWNER DECISIONS still outstanding"
      - "Missing evidence and next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      rationale: >-
        Both oracle signals hold under Judge's OWN verification rather than the receipts'.
        Judge re-ran the gate, read its source to confirm it recomputes rather than
        assertion-reads, and independently recomputed --step-3, the #2e6f66 derivation and four
        contrast ratios — all exact. It opened the cold-agent artifact in a browser and
        confirmed the lime law, the box-shadow ban, the trademark rule, mandatory sections and
        390px behaviour. It proved /human genuinely regenerates by mutating color.json in a
        scratch copy and watching the change propagate. The charter's named misfire — a tidy
        folder of plausible files no agent can build from — was specifically hunted and is not
        what is here.
      signal_1_cold_agent: >-
        PASS, stronger than the receipt claimed. The page lifts voice.md's RIGHT-column copy
        verbatim AND paraphrases its rules correctly elsewhere — pattern-matching, not copying.
        All four sha256 hashes it displays match the real files; its stated aperture
        measurement (208x139) is correct to the pixel. Judge initially measured three different
        aperture sizes and thought it had found a defect — it had walked into the exact
        getBoundingClientRect-on-a-rotated-element trap T009 documented. The page was right and
        Judge's first measurement was wrong.
      signal_2_structural_gate: >-
        PASS. Judge ran it and also audited its source rather than trusting the count,
        confirming the clamp checks regenerate from Utopia's line formula and the contrast
        checks run WCAG luminance on the hex pair. "This is an oracle, not a linter."
      weakness_found_and_FIXED: >-
        Judge proved by scratch-copy mutation that the gate stayed green while color.css drifted
        from color.json, human/index.html was hand-edited, and motion.css drifted from
        motion.json. The three generator --check modes caught all of it but were not WIRED INTO
        the gate, so the oracle's "/human and /agent describe the same system" clause was
        guarded by convention rather than deterministically. FIXED before closing: the three
        --check modes now run inside structural-gate.mjs. Gate is 23 checks, and the two drift
        scenarios Judge demonstrated are now mutation-verified as caught (7/7 mutations across
        both rounds).
      output_switcher_ruling: >-
        Right call, well handled. The slot copy states a REPOSITORY fact ("no captured output in
        this repository"), gives the command to fill it, and explains that a fabricated hash
        would turn the one inspectable claim on the page into an unverifiable one. No
        planned/partial language, so OD1 is not contradicted in letter. The honest cost, stated
        plainly: a reader who clicks VUE, SVELTE or ANGULAR learns there is no output for them
        here — the one place the six-shipped presentation is falsifiable by the artifact itself.
      missing_evidence:
        - "The original concept-art composite is unrecoverable (R1 fired at T001). Comparison was against surviving source layers, so the wordmark and badge treatments remain reconstructions, not measurements."
        - "Cross-browser unverified — Chromium only. -webkit-text-stroke, mask-image and color-mix() untested in Firefox/Safari."
      owner_decisions_outstanding:
        - "Confirm the output-switcher empty-slot treatment."
        - "Re-drop the concept art if it still exists — would upgrade the wordmark and badge from reconstruction to measurement. Non-blocking."
        - "docs/goals/frameless-website-v1 is still active with a queued Worker and is moot under OD5/OD6 — close or re-scope it."
        - "OD6 is unblocked: website/ deletion and the three-variant rebuild can start. Archive first — 46 of 47 files there are untracked."
