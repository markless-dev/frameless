  - id: T006
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Build the visual foundation of the kit: the documented #cce007 color system with
      measured contrast ratios and forbidden pairings, colors_and_type.css, the token
      specimens, the self-hosted font setup with its licensing note, and the promoted
      assets. Tokens must state intent — when and why a value is used — not just the value.
