version: 2

goal:
  slug: frameless-design-kit-v1
  title: "Frameless atomic brand kit — agent-readable brand world model"
  status: done
  mode: open_ended
  charter: docs/goals/frameless-design-kit-v1/goal.md
  oracle:
    signal: >-
      Two signals, both required. (1) Cold-agent one-shot: a fresh subagent with zero
      conversation context, given only the kit path and the single prompt "generate me an
      HTML landing page based on the atomic design system and strategy", produces a page
      that uses #cce007 as the token system specifies, applies Que Grotesque, sizes type
      and space from the Utopia fluid scales, uses motion values traceable to motion/,
      reads as the coastal sticker aesthetic of the concept art, and writes copy that
      follows voice.md and positioning.md rather than generic dev-tool prose.
      (2) Structural gate: every token, font, and asset path referenced resolves; CSS
      parses; Utopia clamp() scales are mathematically correct and match their recorded
      config URLs; /human and /agent describe the same system without contradiction.
    final_proof: >-
      T999 Judge receipt with full_outcome_complete: true, backed by a green run of the
      structural gate script and a cold-agent one-shot artifact that Judge has opened and
      compared against the concept art, the color system, and the verbal files — with
      Judge confirming the generating agent had no conversation context.
  intake:
    input_shape: existing_plan
    authority: requested
    proof_type: artifact
    completion_proof: >-
      A complete atomic kit with the article's folder shape and no placeholder files:
      readme.md, magic_trick.md, /human rendered guideline, and /agent/{verbal,visual}
      carrying a truthful verbal system, Utopia-generated fluid scales with live config
      URLs, a documented #cce007 color system with accessible pairings and stated
      contrast ratios, components, tokens, motion, and assets as structured
      HTML/CSS/SVG/JSON — passing both the structural gate and the cold-agent one-shot.
    likely_misfire: >-
      A tidy folder of plausible files that no agent can build a coherent page from. The
      folder shape is easy to imitate; end-to-end coherence is not. Sub-failures: tokens
      that list values without stating intent, a voice.md that says "friendly but
      technical", motion described in prose instead of JSON parameters, Utopia clamp()
      pasted with no config URL, and a kit that only works because the generating model
      remembered this conversation.
    existing_plan_facts:
      - "Deliverable shape is fixed by the Little Plains article: readme.md, magic_trick.md, /human, /agent/{verbal,visual}"
      - "Primary color is #cce007 (lime) — the anchor, not a suggestion"
      - "Concept art supplied at /Users/jacksm5pro/.claude/image-cache/1eb0db9b-57bf-478e-a326-230adbcdbb6e/2.png — SESSION-SCOPED, must be rescued into the repo first"
      - "Utopia (https://utopia.fyi/) must be driven in a real browser; shareable config URLs stored in the kit"
      - "Que Grotesque is purchased/licensed — self-hosted WOFF2 only, never commit OTF/TTF/Variable, never hotlink"
      - "Existing raw assets: website/assets/art/{logos,stickers,texture}/ and website/assets/fonts/*.woff2"
      - "Icons preference: Game Icons via https://icon-sets.iconify.design/game-icons/"
      - "codex CLI has image generation for assets that do not yet exist"
      - "Frameless Studio is coming soon, not shipped"
      - "Article thesis to honor: the kit IS the deliverable; it is a brand world model, coherent end-to-end"
    owner_rulings_2026_07_24:
      - id: "OD1 — RESOLVED by owner: all six frameworks are shipped"
        ruling: >-
          Do not write "planned". Treat Vue, Svelte and Angular as done. This OVERRULES
          T004's three-state badge design and T002's false-claim #1. The badge state axis
          collapses: all six render as shipped. Verbal half rewritten accordingly.
        recorded_caveat: >-
          For the record, and stated once: the repo at land/stack-and-three-way-demo contains
          no Vue/Svelte/Angular emitter code, and packages/cli/src/program.ts registers only
          react and solid. The kit therefore presents a forward-looking state rather than an
          evidence-backed one. The owner was told and directed otherwise; this is their call
          and the work follows it in full. Recorded so the divergence from T002 evidence is
          traceable, not to relitigate.
      - id: "OD3 — RESOLVED by owner: bundle the purchased WOFF2"
        ruling: >-
          The font is purchased. Ship the WOFF2 subsets inside the kit. The licensing note
          stays (self-hosted subsets, no redistribution/re-upload/third-party origin), but
          the gitignore-and-fallback alternative is rejected.
      - id: "OD4 — owner feedback from an un-kitted control run"
        ruling: >-
          "We should not be generating one-hero pages." Owner reviewed a variant built WITHOUT
          the kit and it produced a single full-screen section and stopped.
        why_it_matters: >-
          The kit had no page-composition rule, so nothing prevented an agent from treating a
          hero as a finished page. This is a gap in the KIT, not just in that variant, and it
          would have reproduced in the T012 cold-agent one-shot.
        fix_applied: >-
          Wrote brand/agent/visual/artifacts/web/page-composition.md — mandates a minimum of
          seven sections with a defined inventory and order, section rhythm rules (alternate
          bed, density and width; at least three distinct section shapes), a 4-8 screen length
          target, a ranked definition of what "interactive" should mean (output-switcher first,
          decorative sticker-dragging last), and a pre-flight self-check list.
        control_run_confirmed_three_existing_rules: >-
          The un-kitted page independently reproduced three failures the kit already forbids,
          which is strong evidence those rules are load-bearing rather than theoretical:
          (1) full-bleed photo hero with a headline directly on the photograph — Judge's Tier 3,
          forbidden by name precisely because it is what a cold agent does by default;
          (2) lime display type on the light sky, roughly 1.39:1, plus body copy over the photo
          that is effectively unreadable;
          (3) PLANNED framework badges, now void under OD1.
      - id: "OD5 — RESOLVED by owner: website/ is likely being deleted entirely"
        ruling: >-
          "Screw the website variants — we're probably gonna remove that website folder as a
          whole." This CLOSES the two-token-systems concern (OD from intake and T004): there is
          no second system to reconcile with. The divergence question is void, not deferred.
        verification_performed: >-
          Confirmed the kit survives deletion of website/. Zero references to website/ anywhere
          in brand/. All 9 local refs (url/src/href) resolve inside brand/. Fonts and art were
          COPIED into the kit at T001/T006, never linked. The single grep hit was a false
          positive — a usage example inside a CSS comment showing a consumer how to link the
          entry point from repo root.
        consequence_for_other_board: >-
          docs/goals/frameless-website-v1 is still status active with a queued Worker. If
          website/ is deleted that board becomes moot and should be closed or re-scoped by its
          owner. Out of scope for this goal; flagged, not actioned.
      - id: "OD6 — owner directive: finish the kit, then remove and redo website/"
        ruling: >-
          "Start on it once done with the brand, and remove and redo the website folder."
          Sequence is explicit: complete frameless-design-kit-v1 first, then delete website/
          and rebuild the landing page FROM the kit as 3 variants (Pile / Bench / Peel,
          owner-selected). Plan recorded at notes/next-landing-page-plan.md.
        SAFETY_FLAG_website_is_untracked: >-
          46 of 47 files under website/ are UNTRACKED by git — only
          website/src/data/emitter-output.js is tracked. `rm -rf website/` would therefore be
          permanent, with no git recovery. Every source ASSET is already mirrored into brand/
          (fonts, stickers, logos, textures, photo — verified), so the brand kit loses nothing.
          What would be lost is the hand-written CSS/JS/HTML, the tests, and the three variant
          attempts. PM will TAR website/ to the scratchpad before deleting, so the removal stays
          reversible. Owner is away; the archive happens regardless of whether they would have
          asked for it.
      - id: "OD2 — RESOLVED by owner: the project is mature"
        ruling: >-
          Drop all pre-1.0, unpublished, early-stage and not-production-ready hedging.
          Present Frameless as mature. Removes the maturity paragraph from messaging.md and
          the maturity section from positioning.md.
    owner_decisions:
      - "Run INDEPENDENT of frameless-website-v1 — that board stays live on its own CSS; two token systems coexist for now and reconciliation is a deliberate later call, explicitly accepted"
      - "Full kit — verbal AND visual; verbal is authored, not stubbed; bold judgment calls flagged for owner acceptance"
      - "Utopia scales generated by driving the real tool in a browser, config URLs preserved"
      - "Cold-agent one-shot is primary proof, backed by a deterministic structural gate"

