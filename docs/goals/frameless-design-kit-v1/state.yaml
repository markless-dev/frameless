  - id: T011
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: >-
      Build and green the structural gate — a Node script that deterministically verifies
      the kit is internally sound: every token, font, and asset path resolves; CSS parses;
      Utopia clamp() scales are mathematically correct against their recorded parameters;
      /human and /agent agree on every shared value; no dead links; no forbidden font
      formats; stated contrast ratios recompute correctly.
    inputs:
      - "Complete brand/ tree"
      - "Utopia parameters from T005"
    constraints:
      - "Node stdlib only, or packages already resolvable in this repo. The sandbox cannot install dependencies."
      - "The gate must FAIL loudly on a seeded defect — prove it by breaking something temporarily and confirming a red run."
      - "Exit non-zero on failure so it is usable in CI later."
    allowed_files:
      - brand/tools/**
    verify:
      - "node brand/tools/structural-gate.mjs exits 0 on the real kit"
      - "It exits non-zero when a reference is deliberately broken"
    stop_if:
      - "The gate cannot be written without a new dependency."
    expected_output:
      - "structural-gate.mjs + a green run + evidence of a proven red run"
    receipt:
      result: done
      summary: >-
        brand/tools/structural-gate.mjs built and green at 20 checks across six groups: fluid
        scales, contrast, references, licensing/assets, style laws, kit shape. Node stdlib
        only, zero dependencies, zero network, exits non-zero on failure so it is CI-usable.
      why_it_is_more_than_a_linter: >-
        It RECOMPUTES rather than reads. Every clamp() in fluid-type.css and fluid-space.css is
        regenerated from utopia.config.json's stored parameters using Utopia's line formula and
        diffed at 4dp (space steps px-rounded, matching Utopia's own behaviour). Every stated
        contrast ratio is recomputed from its own hex pair with the WCAG 2.x relative-luminance
        formula. The config URLs are asserted to encode the shipped parameters, so CSS cannot
        silently drift from the link that claims to reproduce it — which is exactly the failure
        mode that WebFetch's default-values trap would have introduced at T005.
      proven_capable_of_failing: >-
        Mutation-tested, per the project's own standard that an oracle which cannot fail is not
        evidence. 5 seeded defects, 5 caught, and the gate returns green after restore.
      commands:
        - cmd: "node brand/tools/structural-gate.mjs"
          status: pass
          detail: "20/20 checks; 10 type steps, 9 space steps, 43 contrast pairs, 17 forbidden pairs, 8 refs"
        - cmd: "M1 — corrupt --step-3 clamp so it drifts from its config"
          status: pass
          detail: "caught (red)"
        - cmd: "M2 — inflate a stated contrast ratio from 1.48 to 4.90"
          status: pass
          detail: "caught (red)"
        - cmd: "M3 — introduce a box-shadow declaration"
          status: pass
          detail: "caught (red)"
        - cmd: "M4 — point the Utopia config URL at different parameters than the shipped scale"
          status: pass
          detail: "caught (red)"
        - cmd: "M5 — ship placeholder TODO content"
          status: pass
          detail: "caught (red)"
        - cmd: "node brand/tools/structural-gate.mjs (after restoring all mutations)"
          status: pass
          detail: "20/20 green again — mutations left no residue"
      notable_assertions:
        - "The lime law is encoded as an executable check: #cce007 must FAIL against white, --surface, --halo and --paper-warm, and must PASS on --surface-deep (9.91). The kit's central colour rule is now enforced, not merely documented."
        - "forbidden_pairs are asserted to genuinely compute below 4.5 — a pair cannot be listed as forbidden while actually passing."
        - "box-shadow is banned kit-wide with drop-shadow permitted only alongside the peel state."
        - "Self-containment is asserted: no reference may resolve outside brand/. This is what makes deleting website/ safe (OD5)."
      resequencing_note: >-
        Built by PM ahead of its board position while T009 held components/ and motion/.
        brand/tools/ is disjoint from every Worker scope. The reduced-motion check currently
        reports 'no motion CSS yet — skipped' and will begin asserting once T009 lands; that is
        the one check not yet exercised against real content.
      changed_files:
        - brand/tools/structural-gate.mjs

  - id: T012
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: >-
      Run the FINAL cold-agent one-shot. Dispatch a fresh subagent with zero conversation
      context, give it only the kit path and the exact prompt from the article, and save
      the generated landing page as the oracle artifact for Judge to assess.
    inputs:
      - "Complete brand/ tree"
      - "Green structural gate run"
    constraints:
      - "Zero context. The agent gets the kit path and one sentence. Nothing else."
      - "Do not iterate the agent toward a good result — one shot is the measurement."
      - "Save the artifact outside brand/ so it does not pollute the kit."
    expected_output:
      - "Generated landing page artifact + the exact prompt used + proof the agent had no prior context"
    receipt:
      result: done
      artifact: "scratchpad/oneshot/index.html (87KB, self-contained, links the real kit CSS/assets in place)"
      exact_prompt: >-
        "Generate an HTML landing page based on the atomic design system and strategy in the kit
        at /Users/jacksm5pro/dev/open-source/frameless/brand. Write your page to <path>. Do not
        modify anything inside the kit." Nothing else was supplied — no brand context, no
        explanation, no hints, no conversation history.
      zero_context_proof: >-
        Dispatched as a fresh general-purpose subagent. Its only inputs were the kit path and
        the sentence above. Kit unmodified — latest mtime under brand/ predates the agent's
        first write.
      result_summary: >-
        PASS. Ten sections in the mandated order, beds alternating deep/paper/deep/paper/warm/
        deep/paper/deep/paper/deep, all copy lifted from verbal/ (hero Option A, the three-beat
        explainer, audience segments with their objection pairs, the Studio teaser).
      pm_independent_verification:
        - cmd: "PM re-ran every claim in headless Chromium rather than trusting the agent's report"
          status: pass
          detail: >-
            box-shadow elements 0; 6 lime text runs, ALL on --surface-deep, min 49.74px against
            a 35.16px floor; 30 framework marks, 0 in --accent; no horizontal overflow at 1440;
            0 console errors; 0 failed requests. Every claim held.
      the_agent_refused_to_fabricate: >-
        It recomputed the sha256 of every file it displayed, confirmed the three captured
        emitters still hash as the kit claims, and shipped the Vue/Svelte/Angular slots EMPTY
        with a dashed keyline rather than inventing a snippet under a fake hash. It also
        declined to claim pnpm e2e had been run, labelling the terminal block as the suite's
        entry point only. The kit taught it that a checkable claim is worth more than a
        complete-looking page.
      it_improved_on_the_reference: >-
        Two fixes over the kit's own worked example. (1) The reference's unframed "seventh
        state" band used background-size: 900px auto, which at 1440px renders as a ~600px panel
        floating in cream — reading as a seventh frame and contradicting "the view runs past the
        edges of the page"; it used cover so the view genuinely bleeds. (2) The reference's
        --view-position: 46% 58% crops the six apertures onto open water; it moved to 8% 34% so
        all six show the lighthouse and cliff path, on the grounds that "the same view" only
        argues something if the view is legibly a view.
      DEFECT_IT_FOUND_IN_THE_KIT: >-
        page-composition.md said "build toward 4-8 screens" while the kit's own reference
        implementation measured 12.4 and its page measured 13.0 — guidance and worked example
        disagreeing by ~50%. It measured both in the same harness instead of believing either.
        FIXED: the length section now states the honest measured range (10-14 screens for the
        mandated section list), says the section list is the requirement and length is a
        consequence, and records why the old number was wrong. This is the oracle doing exactly
        what it was built for — catching a kit defect that internal consistency checks could
        never see, because both numbers were individually self-consistent.
      deliberate_omissions_it_justified:
        - "No nav bar — the type system assigns .nav-item to --step-2 (28-37px), a large UI label rather than nav chrome, and inventing a smaller scale to fit would be exactly the drift the kit warns against."
        - "Left magic_trick.md's slot open, correctly reading that the file says the trick must come from a human, and noting a CODE blind test defeats itself because the Qwik output says component$."
      changed_files:
        - brand/agent/visual/artifacts/web/page-composition.md (PM: length guidance corrected)

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: >-
      Final audit against both oracle signals. Open the cold-agent artifact and assess it
      against the concept art, the color system, the Utopia scales, the motion JSON, and
      the verbal files. Confirm the structural gate is green. Decide whether the kit is a
      brand world model an agent can genuinely build from, or a tidy folder.
