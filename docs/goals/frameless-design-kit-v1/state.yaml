    receipt:
      result: done
      summary: >-
        Visual foundation built and verified in a real browser. color.json carries 12 tokens
        with role/intent/derived_from, 27 permitted_pairs and 18 forbidden_pairs, every ratio
        computed from scratch rather than copied. colors_and_type.css proven to load standalone
        headless: 12/12 requests 200, 0 console errors, 4/4 WOFF2 loaded, font-synthesis
        computes to none, dark-surface flip correct, box-shadow on zero elements.
      defects_caught_by_verification:
        - >-
          THE cqmax TRAP — the highest-value finding for T009. clamp(0.375rem, 3.2cqmax,
          1.5rem) fails SILENTLY in the obvious usage, because an element cannot query itself:
          with container-type on the sticker itself, cqmax resolves against the nearest
          ANCESTOR container, or the viewport if none exists. That produced a 24px halo (the
          clamp ceiling) instead of the correct 20.48px, with no error anywhere. The halo must
          be consumed by a DESCENDANT of the sized wrapper. Corrected pattern verified to
          reproduce the measured rule at three container sizes and documented in sticker.css.
        - "The focus ring permanently inflated every inline link by 4.00px horizontally. Fixed and re-verified at 0.00px."
      spec_corrections:
        - >-
          Ratio mis-binding reported rather than silently resolved: the task bound
          'lime + --halo cream' to 1.44, but --halo #fdf8e4 computes to 1.3858 (delta 0.054,
          over the 0.02 stop threshold). The 1.44 actually traces to T003's measured sticker
          cream #fefdea (recomputed as 1.4370). Worker recorded BOTH pairs with their own
          correct values, and added the other three measured creams so the file shows lime
          failing against all five (1.25-1.45). Correct call — it preserved the discrepancy
          instead of picking a winner.
        - >-
          Font glyph coverage RE-MEASURED, resolving a spec hedge: TM U+2122, (C) U+00A9 and
          (R) U+00AE are all present in all four weights, so footer-marks can set its
          trademark and copyright lines in Que Grotesque with no fallback and no SVG
          substitute. T003's 262-glyph figure confirmed exactly; the measurement adds 294
          mapped codepoints across 32 ranges. Fallback stack derived from actual coverage:
          complete for Western European, incomplete for Polish/Czech/Turkish/Romanian/
          Hungarian/Croatian/Vietnamese/Welsh, Greek and Cyrillic absent.
        - >-
          Judge's '#fdf8e4 is the median of the five creams' is imprecise — by relative
          luminance the median is #fcfcfa, per-channel it is #fdfcea. But #fdf8e4 IS pine's
          real measured pixel, which was Judge's actual load-bearing point, so the value ships
          unchanged.
      spec_gaps_open:
        - "No keyline-width token exists, though the keyline is load-bearing per T004 section 2. T009 will hardcode one unless added."
        - "T004 section 10 assigns no weight to --step-1."
      font_licence_resolved: >-
        RESOLVED by owner: Professional tier. Recorded in fonts/LICENSE.md; the tier hedging
        and the interim strictest-tier rule are removed. Closed, not carried forward.
      commands:
        - cmd: "node verify-ratios.mjs — recompute all 44 hex pairs plus all 44 ratios quoted in prose across every kit file"
          status: pass
          detail: "44 pairs, 0 mismatches at 2dp and 4dp; all 44 prose ratios traceable to a computed pair with no seeding"
        - cmd: "find brand -type f -name '*.otf' -o -name '*.ttf' -o -name '*.woff' -o -name '*.eot'"
          status: pass
          detail: "empty — WOFF2 only"
        - cmd: "resolve every url()/@import against disk"
          status: pass
          detail: "8 refs, 0 unresolved"
        - cmd: "sips -g bitsPerSample mushroom.png"
          status: pass
          detail: "8 (was 16); all 8 rasters under assets/ are 8 bits/sample"
        - cmd: "headless Chromium loads a bare page importing only colors_and_type.css"
          status: pass
          detail: "12/12 200, 0 console errors, 41 rules parsed, 4/4 WOFF2, font-synthesis none, dark flip correct, box-shadow on zero elements"
        - cmd: "browser probe: cqmax halo at 3 container sizes + focus ring on light/dark"
          status: pass
          detail: "400x640 -> 20.48px (3.2% of 640), 100x120 -> 6px floor, 1200x900 -> 24px ceiling"
        - cmd: "md5 + mtime of the three T005 Utopia files"
          status: pass
          detail: "unmodified"
      pm_followup_applied: >-
        Owner ruling OD1 landed while T006 was running, so its output encoded the superseded
        three-state badge. PM stripped the PLANNED pair from color.json (still valid JSON,
        zero remaining matches), and cleaned superseded state language from color.css,
        colors_and_type.css and assets/README.md — the six-mark rule there is now canonical
        order plus in-badge naming rather than a shipped/planned axis.
      changed_files:
