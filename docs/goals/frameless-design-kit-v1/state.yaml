      - "Contrast ratios must be computed and stated as numbers, not asserted."
      - "Font: WOFF2 only. Copy from website/assets/fonts/. Never add OTF/TTF/Variable. Include the licensing note."
      - "Structured formats only — CSS, SVG, JSON. No raster where structure would carry the logic."
