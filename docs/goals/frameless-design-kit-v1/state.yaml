risks:
  - id: R1
    note: >-
      Concept art lives in a session-scoped image cache that may be purged at any time.
      T001 rescues it into the repo before any other work. If it is already gone when
      /goal runs, T001 must stop and ask the owner to re-supply it rather than proceeding
      on a remembered description.
  - id: R2
    note: >-
      Driving utopia.fyi requires network. The Worker subagent sandbox has no network
      access (see prior goal findings), so T005 is a PM task rather than a Worker task —
      the PM thread has browser and fetch capability. Do not delegate T005 to a Worker.
  - id: R3
    note: >-
      Lime #cce007 on white is a contrast trap (roughly 1.4:1 for normal text). The color
      system must state real measured ratios and forbid the unsafe pairings explicitly,
      or every downstream generation will produce inaccessible pages at scale.

tasks:
  - id: T001
