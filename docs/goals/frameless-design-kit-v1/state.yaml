    inputs:
      - "/Users/jacksm5pro/.claude/image-cache/1eb0db9b-57bf-478e-a326-230adbcdbb6e/2.png"
      - website/assets/fonts/
      - website/assets/art/
    constraints:
      - "Do this before anything else — the image cache is session-scoped and may be purged."
      - "If the concept art is already missing, STOP and ask the owner to re-supply it. Do not proceed from a remembered description."
      - "Kit root is brand/ at repo root unless a conflict is found; record the decision."
      - "Copy assets, never move them — website/ is in-flight on another board."
    allowed_files:
      - brand/**
      - docs/goals/frameless-design-kit-v1/**
    verify:
