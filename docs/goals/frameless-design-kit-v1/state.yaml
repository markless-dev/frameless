        - brand/_source/concept/texture-paper.jpg
        - brand/_source/concept/texture-backing.jpg
        - brand/_source/concept/stickers/ (5 png)
        - brand/_source/concept/logos/ (6 svg)
        - docs/goals/frameless-design-kit-v1/notes/T001-concept-art-recovery.md
      owner_action_requested: >-
        Re-drop the concept art image if still available. Would upgrade the wordmark and
        badge treatments from reconstruction to measurement. Non-blocking.

  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: >-
      Ground the verbal half in what Frameless ACTUALLY ships today, so positioning does
      not overclaim. Answer with evidence: what is the authoring input, which framework
      emitters exist and genuinely work, what is proven about activation-neutrality
      (hydrate vs resume), what is shipped vs aspirational, who realistically benefits,
      and how Frameless honestly differs from Mitosis and from the frameworks it targets.
    inputs:
      - README.md
      - AGENTS.md
      - packages/
      - demos/
      - docs/goals/frameless-qwik-v1/state.yaml
      - docs/goals/frameless-composition-v1/state.yaml
      - docs/goals/frameless-ssr-v1/state.yaml
      - docs/goals/frameless-land-and-demo-v1/state.yaml
    constraints:
      - "Read-only."
      - "Separate PROVEN (has a receipt or a green test) from CLAIMED (README prose) from ASPIRATIONAL. Label every capability."
      - "Positioning that overclaims is worse than none — it gets amplified by every downstream generation."
    expected_output:
      - "Capability map: proven / claimed / aspirational, each with a file or receipt citation"
      - "Honest differentiation evidence vs Mitosis and vs framework-native authoring"
      - "Realistic audience segments with the pain each one has today"
      - "List of claims that would be FALSE if written into positioning.md"
    receipt:
      result: done
      note: notes/T002-capability-truth.md
      summary: >-
        Three emitters exist: React and Solid are the full product path (CLI targets,
        composition, persistence, SSR, all receipt-backed); Qwik is PROVEN BUT NARROW —
        S1/S2/S3 only, not a CLI target, no composition/persistence/SSR lane, on a beta
        dependency. Vue, Svelte and Angular have ZERO implementation; the only Vue
        reference in the repo is a CLI test asserting Vue is rejected. Activation-neutrality
        IS genuinely proven on official framework scaffolds and is the single most
        defensible differentiator, alongside a mutation-validated behavioral oracle.
        Produced a 12-item false-claims list.
      critical_finding: >-
        THE CONCEPT ART IS ITSELF AN OVERCLAIM. It shows six framework badges (React, Vue,
        Svelte, Solid, Angular, Qwik) under "Compile once, output anywhere" — three of which
        have no implementation. The brand's hero image encodes the #1 entry on the
        false-claims list. Unresolved, the kit would amplify a six-framework promise the
        compiler cannot keep into every downstream generation. Escalated as OWNER DECISION 1.
      owner_decisions_raised:
        - "OWNER DECISION 1: six badges vs three. Recommend a shipped/planned state axis on a stateful framework-badge component — preserves the art, makes the constraint a system feature."
        - "OWNER DECISION 2: maturity label — proven early-stage vs alpha vs research preview."
        - "OWNER DECISION 3: two live README overclaims (SSR-Qwik line; unqualified Composition row) that the kit would otherwise inherit. Correcting them is a write outside this goal's scope."
      spawned_tasks:
        - T004

  - id: T003
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: >-
      Ground the visual half. Extract the real palette from the concept art (sample actual
      pixel values — cream, black outline, sky, sea, foliage, sand — do not eyeball),
      inventory every usable asset with dimensions and format, confirm which Que Grotesque
      weights are present as WOFF2, and identify what the kit needs that does not exist yet.
    inputs:
      - "In-repo concept art path from T001"
      - "Asset inventory from T001"
      - frameless-website-prompt.md
    constraints:
      - "Read-only."
      - "Sample real pixel values from the image. A palette guessed from a description will drift from the art."
      - "#cce007 is the fixed primary — report how it relates to the lime actually present in the art."
      - "Note the framework logos are third-party marks; flag any usage-rights consideration for the kit README."
    expected_output:
      - "Measured palette with hex values and where each color appears in the art"
      - "Relationship between #cce007 and the art's lime; any reconciliation needed"
      - "Asset inventory: path, format, dimensions, kit-ready or needs-work"
      - "Gap list: assets the kit needs that must be generated"
      - "Confirmed Que Grotesque weights available as WOFF2"
    receipt:
      result: done
      note: notes/T003-measured-visual-evidence.md
      summary: >-
        Everything measured from real pixels; sips verified non-color-shifting by round-trip.
        16 environment colors + 5 accents extracted by large-block averaging (which
        integrates the halftone screen correctly). Fonts confirmed static Latin subsets at
        400/500/700/900, 262 glyphs, no variable source in repo — licensing clean. All six
        logos are clean single-path currentColor marks and third-party trademarks.
      brief_contradicted_in_five_places:
        - "Sky is SAGE #a9baa7, not blue — the whole print is aged and desaturated."
        - "Outlines are near-black and TINTED (#111010, #11160f, pine #115b2e); mushroom has no black keyline at all."
        - "NO drop shadow on any sticker — 0.00 dark-fringe px measured. The flower's fringe is a symmetric alpha artifact."
        - "Cream is inconsistent across sources (#faebcd..#fefdf8); no single value can be lifted verbatim."
        - "Lime cannot be used for display type on any light surface in the art."
      critical_finding: >-
        THE LIME LAW. #cce007 passes WCAG normal-text contrast against exactly two things:
        black (14.23) and the near-black sticker outline (12.88). It FAILS against white
        (1.48), sticker cream (1.44), sky (1.39) and every environment color. Against cloud
        cream it is 1.02 — effectively invisible. Only sea turquoise (3.38) and grass shadow
        (3.18) reach large-text/UI thresholds. This single fact governs the whole color
        system: any kit that permits lime on cream will generate inaccessible pages forever.
      finding_supporting_the_brand: >-
        #cce007 (H66 S94%) shares its hue with the art's natural olives (H51-60) within 6-7
        degrees, at 2.3-2.7x their saturation. It is the same hue family at synthetic
        saturation — which is a genuinely good reason for it to be the brand color: it
        belongs to the landscape without pretending to be of it.
      spawned_tasks:
        - T004

  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: >-
      Lock the brand direction before any kit files are authored. Decide the positioning
      thesis, the color system rules (including which #cce007 pairings are forbidden), the
      exact folder manifest, and the component inventory. Explicitly separate calls that
      are Judge's to make from bold calls the OWNER must accept or overrule.
    inputs:
      - "T002 receipt"
      - "T003 receipt"
      - docs/goals/frameless-design-kit-v1/goal.md
    constraints:
      - "Read-only."
      - "Reject any positioning claim T002 labelled aspirational or false."
      - "Every judgment call the owner should weigh in on must be listed separately and plainly — do not bury them."
    expected_output:
      - "Approved positioning thesis in one paragraph, with the claims it rests on"
      - "Color system rules: role of #cce007, forbidden pairings, required contrast ratios"
      - "Exact folder manifest — every file the kit will contain"
      - "Component inventory (target 8-12 primitives) with rationale"
      - "OWNER DECISIONS: the bold calls needing owner acceptance"
      - "Exact objectives, allowed_files, verify, and stop_if for T005-T007"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      note: notes/T004-locked-visual-system.md
      summary: >-
        All 13 visual decisions locked with concrete values, after independently recomputing
        every T003 contrast ratio, dimension, bit depth and SVG claim (all verified exactly).
        Organizing idea adopted: lime is a synthetic overlay on a desaturated natural bed,
        therefore LIME IS A SURFACE AND A MARK, NEVER AN INK — one sentence from which every
        color rule follows mechanically, so agents generalize correctly beyond the enumerated
        cases.
      key_rulings:
        - "Cream: --halo #fdf8e4 is the MEDIAN of five measured creams, not the mean (mean yields a cream present in no file). Halo-vs-surface is only 1.09:1, which makes the ink keyline load-bearing."
        - "Outline fork RESOLVED: pine's green outline is an inconsistency, normalized to --ink #11160f. A hue-derived outline rule is unimplementable (what is the subject hue of a button?) and would let a light subject dissolve its own keyline."
        - "Shadows FORBIDDEN outright — 0.00 dark fringe measured. Named as a hard prohibition because box-shadow is the #1 thing a generating model adds by reflex. Sole exception: drop-shadow on .is-peeling."
        - "Dark bed --surface-deep #1d2c22 over pure black: a desaturated deep green in the environment's own hue family. Gives lime 9.91:1 AAA."
        - "Two dark tokens strictly separated, with --ink on --surface-deep (1.25:1) named as a forbidden pair."
        - "--accent-deep #2e6f66 added BECAUSE lime cannot be an ink; without it the palette reads as monochrome-plus-a-highlighter."
        - "Badge planned state has NO HALO at all, not a dimmed shipped badge — an unprinted thing has no cut edge. Geometry differs, so it survives grayscale, cropping and screenshotting."
        - "Every badge state carries a TEXT LABEL inside the badge — the only treatment surviving a crop with no alt text."
      corrections_to_scout:
        - "T003 framed #777732 (4.04) and #337b71 (4.29) as good pairings; both FAIL AA normal text. Replaced with derived --ink-muted #6b6b2d (4.80) and --accent-deep #2e6f66 (5.05), labelled derived_from."
        - "T003's 'best environment pairings' are block averages and must never be read as licensing lime text over the photograph — local luminance swings 1.02 to 3.38. Closed by the mandatory scrim rule."
      stale_board_complaints_dismissed: >-
        Judge raised four board-truth defects (T002 active, T003 queued with null receipt,
        positioning.md unattributed, active_task stale). All were STALE — Judge read a
        snapshot taken before the T002/T003/T007 receipts landed. Verified against the
        checker: all four already correct, zero errors. No action taken; recorded so the
        correction is not re-applied.
      owner_decisions_raised:
        - "Is PLANNED truthful for Vue/Svelte/Angular, or is NOT SUPPORTED the honest label? Zero code exists; only the owner knows the roadmap."
        - "Zip-able kit + commercial font: bundling licensed WOFF2 in a distributable folder is a redistribution vector regardless of the licence note."
        - "Two coexisting token systems now concrete — --surface #f2efd4 will visibly diverge from frameless-website-v1."
      spawned_tasks:
        - T006

  - id: T005
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: >-
      Generate the Utopia fluid systems by driving https://utopia.fyi/ in a real browser.
      Tune the fluid type scale against Que Grotesque and the sticker display aesthetic,
      and the fluid space scale to match, then export the CSS and capture the shareable
      config URLs so every scale stays re-tunable by the owner.
    inputs:
      - "T004 approved type direction"
      - "T003 confirmed Que Grotesque weights"
    constraints:
      - "PM task, NOT a Worker task — the Worker sandbox has no network (risk R2)."
      - "Config URLs are mandatory. Baked clamp() with no reopenable config fails owner intent."
      - "Record min/max viewport, base sizes, and scale ratios as parameters alongside the CSS, so the scales are reproducible even if the URLs rot."
      - "The display scale needs to go large — this is a sticker/poster brand, not a docs site."
    allowed_files:
      - brand/agent/visual/tokens/**
      - brand/agent/visual/colors_and_type.css
      - docs/goals/frameless-design-kit-v1/**
    verify:
      - "Every clamp() in the exported CSS is valid and recomputes correctly at min and max viewport"
      - "Config URLs open and reproduce the stored scales"
    stop_if:
      - "utopia.fyi is unreachable — record it, and queue a follow-up rather than silently falling back to hand-computed math."
    expected_output:
      - "Fluid type scale CSS + config URL + parameters"
      - "Fluid space scale CSS + config URL + parameters"
    receipt:
      result: done
      note: notes/T005-utopia-mechanics.md
      summary: >-
        Both fluid scales generated by driving utopia.fyi in a real browser, with
        reopenable config URLs stored in utopia.config.json. Shipped config is
        c=320,18,1.25,1440,21,1.333,7,2 — fluid 320->1440px, base 18->21px, Major Third
        to Perfect Fourth, 7 up / 2 down. Step 7 reaches 157px at 1440 (poster scale).
      resequencing_note: >-
        Run ahead of T004 by PM decision. T005 is the long pole (needs network + a real
        browser) and its parameters are driven by the charter's display-scale requirement
        rather than by T004's output, so serialising it behind Judge would have cost time
        for no decision quality. T004 may still overrule the parameters; retuning is one
        calculator visit plus a re-export.
      critical_findings:
        - >-
          WEBFETCH IS UNSAFE FOR UTOPIA. Fetching a config URL returns the page's DEFAULT
          scale, because config is applied client-side by JS. The first fetch silently
          returned Utopia's stock values (--step-0 identical to the documented default,
          5 steps instead of 8). Pasting those would have shipped CSS that did not match
          its own config URL. This vindicates the owner's "drive it in a browser" call and
          is why the browser lane is mandatory, not stylistic.
        - >-
          The obvious config (max ratio 1.5, 8 steps up) is DEFECTIVE in two ways the CSS
          alone does not reveal, both caught only by the live tool. (1) WCAG SC 1.4.4
          failures on steps 5-8 — text not resizable to 200%% across wide viewport bands.
          (2) Inverted down-steps: --step--2 came out clamp(0.5556rem, 0.767rem +
          -0.2349vw, 0.72rem) — a NEGATIVE vw slope, meaning small text shrinks as the
          viewport grows. Raising maxFontSize 20->21 and lowering maxTypeScale 1.5->1.333
          eliminates both. Shipped config emits no WCAG warning and every slope is positive.
