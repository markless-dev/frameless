        elements.
      standout_work:
        - >-
          THE WORDMARK OUTLINES ARE REAL QUE GROTESQUE CONTOURS, not a redrawing.
          build-wordmark.mjs decodes the WOFF2 with Node stdlib only — Brotli, then the
          transformed-glyf triplet reconstruction — and emits true outlines. Validated against
          live Chromium text: summed advance of "frameless" at a 1000px em is 4992.69px
          computed vs 4987.80px measured, a 0.098% delta attributable to GPOS kerning the
          generator does not apply. Pixel overlay confirms identical letterforms.
        - >-
          Both generators ship a --check mode that byte-compares their output against
          regeneration from source. motion.css/specimen.html and all 5 wordmark artefacts are
          byte-identical. The kit can prove its generated files match their generators.
        - >-
          six-frames identity proven by sha256: 6 apertures captured at a common device-pixel
          origin, 1 distinct hash, 1 distinct box. The device's whole claim is that the view
          does not change — now machine-verified rather than asserted.
      defects_caught_by_own_verification:
        - "The six-frames identity check itself was wrong (not the crops): it used getBoundingClientRect(), which returns the axis-aligned box of a ROTATED element. Fixed to offsetWidth/offsetHeight."
        - "The wordmark keyline was cream on cream — --wordmark-keyline: var(--ink) resolves to #fdf8e4 on --surface-deep, so the die-cut edge vanished into the halo. Does not look broken, just softer. Fixed via data-surface=light rather than a hardcoded hex, because a lime fill IS a light surface."
        - "Grids collapsed to one column inside the flex .spec__stage, silently turning three-up specimens into stacks."
        - "4 of 12 components overflowed horizontally at 390px before fixes; 12/12 clean after."
      gate_caught_a_real_defect: >-
        The pre-existing structural gate found two unresolvable hrefs in a wordmark.css doc
        comment — a relative path inside a CSS comment resolves against that file, not the
        page. The gate earned its keep on its first exposure to new work.
      pm_followup_applied: >-
        --sticker-keyline (2px, plus -bold 3px, -hair 1px, -ratio 0.014) MOVED from
        components/component-tokens.css into tokens/sticker.css beside --sticker-halo, per the
        Worker's own recommendation; components/ left a pointer comment. Verified in a real
        browser that the token still resolves through colors_and_type.css (2px/3px/0.014).
        Gate still 20/20; both --check modes still byte-identical. The gate's reduced-motion
        check now ASSERTS against real motion CSS instead of reporting "skipped".
      keyline_rationale: >-
        A keyline is a stroke, not a band, so the measured 1.4%-of-longest-edge ratio produces
        0.6px on a 44px button — deleting the only thing separating a die-cut element from the
        page, which is the keyline's own justification. 2px specifically because it equals
        --focus-width, which keeps colors_and_type.css's existing promise that a focused
        die-cut component shifts by exactly zero pixels (measured 0.00px).
      OWNER_DECISION_PENDING: >-
        OUTPUT-SWITCHER SHIPS THREE EMPTY SLOTS. React, Solid and Qwik carry verbatim emitted
