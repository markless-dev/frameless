  kind: specific
  tranche: >-
    Diagnose the two structural defects and NAME their causes; repair the async axis across
    the lanes that can express it, recording a lane limit for any that cannot; then land S8
    as the corpus scenario that PINS the repair behaviourally - and stop.
  status: done
  CLOSED_COMPLETE_2026_07_29: >-
    T999 ruled complete, full_outcome_complete TRUE, with all three oracle parts REPRODUCED
    INDEPENDENTLY at f290b12 rather than read off receipts. 12.2 closed in react - the only
    lane it reaches - at BOTH the unit and served-payload level; S8 in the corpus at 9
    scenarios / 54 red mutants / e2e 6x9 all equal; check held at exactly 267 and S8
    contributes ZERO of them; S7 named and untouched; P1 ruled.
  THE_AUDITS_STRONGEST_EVIDENCE_WAS_SOMETHING_NOBODY_POINTED_IT_AT: >-
    At db6e275, BEFORE the repair, the same test file ALREADY contained a calibration arm
    asserting 0|pending / 2|done / 3|done over a hand-written live handler. The diff moves
    the emitted arm to those numbers and NEVER TOUCHES THE CALIBRATION LINES. The target moved
    to numbers A FIXED INDEPENDENT CONTROL WAS ALREADY REPORTING - the opposite shape to a
    goalpost move, and why "the corpus changed so the test changed" was not sufficient grounds
    for suspicion here.
  OWED_TO_THE_SUCCESSOR_named_by_the_audit: >-
    (1) A RED MUTATION ROW for the react (suspension segment, setter) boundary - two calls to
    one setter inside a single segment. The code enforces it; NOTHING PINS IT, and by this
    board's own standard an unmeasured boundary is a claim. (2) S7's IR cell-type field, which
    needs resolving handler-local bindings out of records.events. (3) P1 TS7017, owned by the
    emitted artifact. (4) The 12.2 v-limit: a post-await read of a cell OTHER than the one
    being written. (5) Entry 14's residue: notifyAfterSuspension does not descend into nested
    functions. (6) pnpm check at its inherited 267.
  oracle:
    signal: >-
      THREE PARTS, ALL REQUIRED. (1) DEFECT REPAIR: DEFECTS.md 12.2 is CLOSED on a WITNESSED
      BEFORE-AND-AFTER BEHAVIOURAL MEASUREMENT IN EVERY LANE THE DEFECT ACTUALLY REACHES -
      which T001 MEASURED TO BE REACT ALONE, NOT four of six with two silent: that PM figure
      was FALSE and unsatisfiable as written, inverting T043's "emits CORRECTLY in four of
      six". toConstSsa is 4x in react and 0x in all five others (PM confirmed) and DEFECTS.md
      says "React alone". A recorded RED before and a GREEN
      after, not a green suite; S7's cause is NAMED (IR, scenario, or lane) BEFORE anything
