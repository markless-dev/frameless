# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless async axis and the two structural defects"
  slug: "frameless-async-and-defects-v1"
  kind: specific
  tranche: >-
    Diagnose the two structural defects and NAME their causes; repair the async axis across
    the lanes that can express it, recording a lane limit for any that cannot; then land S8
    as the corpus scenario that PINS the repair behaviourally - and stop.
  status: active
  oracle:
    signal: >-
      THREE PARTS, ALL REQUIRED. (1) DEFECT REPAIR: DEFECTS.md 12.2 is CLOSED on a WITNESSED
      BEFORE-AND-AFTER BEHAVIOURAL MEASUREMENT IN EVERY LANE THE DEFECT ACTUALLY REACHES -
      which T001 MEASURED TO BE REACT ALONE, NOT four of six with two silent: that PM figure
      was FALSE and unsatisfiable as written, inverting T043's "emits CORRECTLY in four of
      six". toConstSsa is 4x in react and 0x in all five others (PM confirmed) and DEFECTS.md
      says "React alone". A recorded RED before and a GREEN
      after, not a green suite; S7's cause is NAMED (IR, scenario, or lane) BEFORE anything
      is repaired; and P1's TS7017 is closed or ruled. (2) S8 LANDS AND PINS THE REPAIR: the
      corpus goes to NINE scenarios in all six lanes, the mutation budget to 54 CELLS WITH
      EVERY ONE RED AND EVERY ONE RESTORED, and pnpm e2e reports 6 demos x 9 scenarios, all
      observations equal. (3) NOTHING REGRESSES: pnpm test stays at baseline plus only tests
      this goal adds; PNPM CHECK DOES NOT RISE above its inherited 267; lint and
      check:citations stay clean.
    cadence: "after each Worker package and at final audit"
    final_proof: >-
      A final audit naming, IN EVERY LANE THE DEFECT REACHES, the behavioural RED before the repair
      and the GREEN after - REACT ALONE per T001, not four of six. The reason the before/after is
      required is NOT the count: 12.2 survived because A GREEN SUITE IS NOT EVIDENCE OF CORRECT
      BEHAVIOUR HERE, and T043's ANGULAR row had two SILENCE MODES in ONE lane. Plus S8 at 9 scenarios / 54 red mutants and pnpm e2e green at 6x9.
  intake:
    original_request: "prepare for next line of work"
    interpreted_outcome: >-
      Repair the three measured wrong behaviours that are invisible to pnpm e2e, and land S8
      so the async repair is pinned by a corpus scenario rather than by unit tests.
    input_shape: specific
    audience: "the frameless emitter lanes and anyone who trusts pnpm e2e as the behavioural oracle"
    authority: approved
    proof_type: test
    completion_proof: >-
      12.2 closed on a PER-LANE witnessed before/after, S8 in the corpus at 9 scenarios and
      54 red mutants, and pnpm e2e green at 6 demos x 9 scenarios.
    likely_misfire: >-
      REPAIRING THE ASYNC AXIS AND DECLARING IT DONE ON A GREEN UNIT SUITE. 12.2's whole
      history is that four of six emitters were broken and TWO SILENTLY - a green suite is
      what hid it. That is why S8 is INSIDE this tranche rather than after it: the scenario
      is what makes the repair falsifiable. THE SECOND MISFIRE is repairing S7 in the
      emitters: it fails IDENTICALLY in two independent lanes, which is evidence the fault
      is UPSTREAM OF BOTH. Diagnose before repairing.
    T001_CORRECTED_THREE_FIGURES_BEFORE_ANY_WORK_RAN: >-
      (1) "Four of six emitters broken on async, two silently" is FALSE - both 12.2
      mechanisms are REACT-ONLY. PM CONFIRMED: toConstSsa 4x react, 0x in all five others;
      DEFECTS.md line 1465 says "React alone reads a value fixed at handler-creation time".
      The figure INVERTED T043's headline "emits CORRECTLY in four of six lanes", and it sat
      in oracle.signal, final_proof AND T999's reject condition - all three UNSATISFIABLE AS
      WRITTEN. (2) "Angular's emitter contained async ZERO times" is STALE - it carries an
      isAsync flag and emits the modifier today; the emitter's own comment records the
      zero-count as history. (3) S7 FAILS IN THREE LANES, NOT TWO - PM CONFIRMED qwik TS2322
      at generated/S7.tsx(102,6), the same site as react TS2345 (110,14) and solid TS2769
      (105,14). Uncounted because the note that found it was scoped react+solid.
    blind_spots_considered:
      - "A lane may be unable to express async inside its design envelope. Qwik refused effects on measurement in the prior phase and that refusal stands. Record a lane limit; do not force it, and do not read an out-of-envelope result as a defect."
      - "S8 landing means goldens, six lanes, six demos, e2e and six mutants - it is the largest single slice here and it must not be attempted before the repair it exists to pin."
      - "pnpm check is inherited RED at 267 and is NOT this goal's to fix. Its only obligation is not to RISE. Confusing the two would either scope-creep this goal or let it hide a regression."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  continuous_until_full_outcome: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "node ~/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/frameless-async-and-defects-v1"
  why: >-
    The owner has run eighteen-plus goals in this repo against the file board alone,
    including two that closed this session. Recorded as an explicit choice, not an omission.

active_task: T002

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: >-
      Map the async axis and the two structural defects as they stand TODAY, without
      repairing anything.
    why_scout_first_and_not_a_worker: >-
      Every figure this goal inherits came from a phase in which ONE FAULT WAS FOUND AT FOUR
      DEPTHS, each time because someone measured independently of the instrument rather than
      reading its output. DEFECTS.md 12.2 was last measured some tasks ago; S7 and P1 were
      found by a task that deliberately did NOT repair them. Re-derive all of it before a
      single line is written.
    inputs:
      - "docs/DEFECTS.md entry 12 (12.1 closed, 12.2 OPEN, 12.3 what it means for S8)"
      - "docs/goals/frameless-emitter-capability-v1/notes/T020-react-solid-coverage.md - where S7 and P1 were found"
      - "The six emitters and their async handling, per lane"
      - "packages/compiler/test/fixtures/s7-form-controls.tsrx and its golden - S7's authored source"
    expected_output:
      - "Per lane: does async work, is it broken, or is it out of design envelope? Four of six were broken and TWO SILENTLY - name which two, and how the silence manifests."
      - "S7: is the null -> \"on\" shape authored in the .tsrx, produced by the IR, or produced per-lane? THE ANSWER DECIDES WHO OWNS THE REPAIR."
      - "P1: what reads globalThis.__FRAMELESS_STATE__ and why TS7017 rather than a narrower error"
      - "What a behavioural before/after arm for async would have to drive, per lane, given pnpm e2e type-checks nothing and runs against the dev server"
    constraints:
      - "READ-ONLY. Repair nothing, edit no product file."
      - "Do not test a framework outside its design envelope, and do not read such output as a defect."
      - "FINGERPRINT the owner's three uncommitted paths at start and finish: pnpm-lock.yaml, pnpm-workspace.yaml, website/."
    receipt:
      result: done
      harness: claude-code
      summary: "THREE FIGURES IN THE CHARTER AND BRIEF REFUTED BEFORE ANY WORK RAN, one of them making the oracle UNSATISFIABLE AS WRITTEN. S7's owner named: AUTHORED + IR, not per-lane. P1's TS7017 is a missing ambient declaration. And nothing exists today to drive a behavioural async arm in any lane."
      THE_ORACLE_WAS_UNSATISFIABLE_AND_T001_CAUGHT_IT_FIRST: "The charter, oracle.signal, final_proof AND T999's reject condition all said 'four of six emitters broken on async, two of them silently'. FALSE. Both 12.2 mechanisms are REACT-ONLY. PM CONFIRMED: toConstSsa - the named cause of the dropped pre-await write - appears 4x in the react emitter and ZERO TIMES in the other five, and DEFECTS.md line 1465 says outright 'React alone reads a value fixed at handler-creation time'. THE FIGURE INVERTED T043's HEADLINE, which reads 'emits CORRECTLY in four of six lanes today'. There is no pair of silent lanes to name: 'silent' belongs to T043's ANGULAR row, which had two silence MODES in ONE lane. All four sites corrected on the board with the refutation recorded, not deleted."
      two_more_stale_figures: "(2) 'Angular's emitter contained the string async ZERO times' is STALE - it carries an explicit isAsync flag and emits the modifier today, and the emitter's OWN COMMENT records the zero-count as history. Angular also now has the emitted-typecheck.test.ts that T043 reported missing. (3) S7 FAILS IN THREE LANES, NOT TWO - PM CONFIRMED qwik TS2322 at generated/S7.tsx(102,6), the SAME SITE as react TS2345 (110,14) and solid TS2769 (105,14). It went uncounted because the note that found it was scoped 'T020-react-solid-coverage'."
      S7_OWNER_NAMED_AUTHORED_PLUS_IR: "AUTHORED: s7-form-controls.tsrx:7 is `let lock = state(null);` with NO type argument, and :98 is `const next = lock === null ? 'on' : null;` then `lock = next`. IR: the golden's state:lock binding carries initialValue, initializer, reads AND writes - PM CONFIRMED - AND HAS NO TYPE FIELD AT ALL. THE INFORMATION TO WIDEN IS PRESENT AND THERE IS NO SLOT TO PUT THE WIDENED TYPE IN. All six lanes lower it identically to a null-initialised cell, and ANGULAR ESCAPES ONLY BY EMITTING `lock: any`, which SWALLOWS the unsoundness rather than resolving it. VUE AND SVELTE ARE LATENT, NOT CLEAN: their tsconfigs include no generated/**, and their compile-emitted tests use compileDiagnostics and svelte/compiler compile(), NEITHER OF WHICH TYPE-CHECKS. Three independent emitters converging, plus one masking annotation, plus two unmeasured lanes, IS UPSTREAM."
      P1_is_a_MISSING_DECLARATION_not_an_assignability_error: "react/src/emitter/index.ts:1319 and solid/src/emitter/index.ts:2016 build the SAME node - memberExpression(globalThis, FRAMELESS_STATE_GLOBAL) - for a sync-read-seed-slot pre-paint landing. TS7017 rather than TS2339 because THERE IS NO AMBIENT DECLARATION OF __FRAMELESS_STATE__ ANYWHERE: tsrx-core.d.ts has no globalThis entry and persistence.ts:4 is only a string const. TypeScript treats an unknown property on typeof globalThis as an implicit INDEX access, since globalThis is augmentable by declaration merging. ONE `declare global` BLOCK CLOSES IT; the only open question is where it ships."
      what_a_behavioural_arm_would_need: "e2e runs six official demos, copy-emitted then a witness box against the DEV SERVER, per-scenario JSON trace; @async/witness is ALREADY ALIASED by the runner. An arm must drive THREE DISPATCHES - two overlapping the await, one sequential after - and emit an ORDERED OBSERVATION LIST, not a final state: A SINGLE DISPATCH OR A FINAL-STATE TRACE PASSES UNDER BOTH LOWERINGS. Expected live 0|pending, 2|done, 3|done against react's 0|idle, 1|done, 2|done. The authoring that clears both genuine v-limits is T043's A7/A8 - await on a promise-VALUED prop, no call and no free global for Angular's globals rule, with preventDefault() splitting sync$ in Qwik. NOTHING EXISTS TO DRIVE IT TODAY: no corpus scenario awaits, and no lane's demo can observe interleaving."
      evidence:
        - "toConstSsa census: react 4, solid/qwik/svelte/vue/angular 0 - PM CONFIRMED"
        - "docs/DEFECTS.md:1465 'React alone reads a value fixed at handler-creation time'"
        - "T043-async-axis.md:28 'emits correctly in four of six lanes today' - the headline the PM's figure inverted"
        - "qwik generated/S7.tsx(102,6) TS2322 | react (110,14) TS2345 | solid (105,14) TS2769 - PM CONFIRMED all three"
        - "s7-form-controls.tsrx:7 `let lock = state(null);` and golden state:lock binding with NO type field - PM CONFIRMED"
        - "react emitter:1319 and solid emitter:2016 both build memberExpression(globalThis, FRAMELESS_STATE_GLOBAL)"
        - "Fingerprints IDENTICAL at start and finish: f326d314 / aeb7edc1 / f936e169; HEAD b74dfd5; nothing written"
      missing_evidence:
        - "NO LIVE SIX-LANE EMIT PROBE of the A7/A8 async authoring was run. The per-lane async matrix is INHERITED from T043, NOT re-derived - T002 must not treat it as measured."
        - "The react node-harness numbers (0|idle, 1|done, 2|done) were not re-run."
        - "Whether vue/svelte generated S7 fails under vue-tsc / svelte-check was NOT measured - only that no instrument in pnpm check reaches them."
        - "Whether qwik's S7 TS2322 is inside the inherited 267 or additional was not isolated by count."
      ambiguity_requiring_judge:
        - "S7 OWNER: scenario (author a type argument in the .tsrx) vs IR (add a cell-type field widened from initialValue plus the writes union). The IR carries BOTH INPUTS AND NO SLOT - that is the decision."
        - "Angular's `lock: any` - is masking-by-annotation acceptable, or must it inherit the upstream fix?"
        - "Where the __FRAMELESS_STATE__ ambient declaration should ship."
      budget_note: "21 shell commands against a 12 budget; the six-lane checks the brief required could not be batched further. Disclosed rather than hidden."
      spawned_tasks: []
  - id: T002
    type: judge
    assignee: Judge
    status: active
    reasoning_hint: high
    objective: >-
      Rule who owns the S7 repair, and spec the async repair slice.
    the_question_that_decides_the_shape: >-
      S7 fails IDENTICALLY in react and solid at the same site - react TS2345, solid TS2769,
      both on a cell initialised null and later set to "on". TWO INDEPENDENT EMITTERS
      PRODUCING THE SAME UNSOUND SHAPE is evidence the fault is upstream of both. If the
      cause is the IR or the authored scenario, a per-lane repair would be six patches over
      one bug - and would leave the other four lanes latent.
    expected_output:
      - "S7's cause NAMED, with the evidence that distinguishes IR from scenario from lane"
      - "Who owns the repair, and what the other lanes inherit from it"
      - "The exact Worker spec for the async repair: objective, allowed_files, verify, stop_if"
      - "Per lane, what the behavioural before/after arm must drive - and whether any lane cannot express async inside its envelope"
    constraints:
      - "READ-ONLY."
      - "Do NOT re-litigate T001's measurements. Rule on what they MEAN."
      - "A lane limit is a legitimate outcome; an unargued one is not."
    receipt: null

  - id: T003
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: high
    objective: "Repair the async axis, per the Judge's spec, with a witnessed RED before and GREEN after in every lane that can express it."
    allowed_files: []
    verify:
      - "PER LANE, the deliverable the oracle requires: a recorded behavioural RED BEFORE the repair and a GREEN AFTER. A green suite is what hid this defect for four of six emitters."
      - "pnpm test   # baseline + only tests this task adds; the pre-existing package-inventory failure must stay at exactly 1"
      - "pnpm check  # inherited RED at 267 - it MUST NOT RISE. It is not this goal's to lower."
      - "pnpm lint && pnpm check:citations"
      - "pnpm e2e    # BEHAVIOURAL ONLY - it type-checks nothing and runs against the dev server"
      - "REGENERATE ALL THREE TIERS before any diff is trusted: six regenerate.ts, SIX regenerate-composition.ts, and generated-persistence/P1 which has NO SCRIPT and is written only by UPDATE_GOLDENS=1 in react/solid test/emitter.test.ts. A generated*/ diff passes VACUOUSLY if nothing regenerates."
    stop_if:
      - "Need files outside allowed_files."
      - "A lane cannot express async inside its design envelope - RECORD IT as a lane limit, do not force it."
      - "You cannot witness the RED before the repair. An unwitnessed fix is exactly what this defect's history warns about."
      - "pnpm check RISES."
      - "Verification fails twice for the same reason."
    receipt: null

  - id: T004
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: high
    objective: >-
      Land S8 as the corpus scenario that PINS the async repair: nine scenarios in all six
      lanes, 54 mutation cells all RED, pnpm e2e 6x9 all equal.
    why_this_is_INSIDE_the_tranche: >-
      DEFECTS.md 12.2 is the ONLY thing deferring S8, and the trigger is explicit and
      falsifiable. Repairing the axis WITHOUT landing S8 leaves the repair pinned by unit
      tests - which is precisely the evidence shape that let four of six emitters stay broken,
      two of them silently.
    allowed_files: []
    verify:
      - "pnpm e2e   # 6 demos x 9 SCENARIOS, all observations equal - the defining item"
      - "pnpm mutate:corpus   # 54 cells, EVERY ONE RED, EVERY ONE RESTORED. Only on a quiescent tree: it restores with git checkout over its surface."
      - "pnpm test / pnpm lint / pnpm check:citations"
      - "pnpm check  # must not RISE above 267"
      - "all three regeneration tiers, proved REAL before any diff is trusted"
    stop_if:
      - "Need files outside allowed_files."
      - "The async repair does not hold under S8. That is the scenario doing its job - report it VERBATIM and stop; do not weaken the scenario to fit the repair."
      - "A mutant survives."
      - "pnpm e2e moves on scenarios 1-7 and 9."
      - "Verification fails twice for the same reason."
    receipt: null

  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Final audit: certify all three oracle parts, or refuse."
    constraints:
      - "NAME THE BEHAVIOURAL RED BEFORE THE ASYNC REPAIR AND THE GREEN AFTER, IN EVERY LANE THE DEFECT REACHES. T001 MEASURED THAT TO BE REACT ALONE - do NOT demand four lanes or two silent ones; the PM's figure was false and is corrected on this board. A green suite still proves nothing here, which is WHY the before/after is required."
      - "Reject if S8 is not in the corpus at 9 scenarios with 54 red mutants and e2e green at 6x9."
      - "Reject if pnpm check ROSE above its inherited 267."
      - "Reject if S7 was repaired per-lane when its cause was measured to be the IR or the scenario."
      - "QUOTE EVERY COMPLETION FIELD VERBATIM before ruling - signal, cadence, final_proof AND intake.completion_proof. Two final audits in the prior sessions caught the PM describing a multi-part oracle with fewer parts than the board defines."
      - "Assume the PM's brief contains at least one error and find it. Every task on the two prior boards corrected its dispatch."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "The per-lane before/after behavioural table"
      - "next task if not complete"
    receipt: null

