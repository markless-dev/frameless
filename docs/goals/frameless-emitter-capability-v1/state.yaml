        - "Step 0's one prop-type pair (string/number) does not cover the onTrace CALLBACK prop every scenario carries. Whether a function type survives @tsrx/core -> IR -> six emitters is UNMEASURED and is Step 2's risk."
        - "Whether annotating s1-render-once.tsrx disturbs per-lane gate.test.ts or mutate:corpus is unmeasured; pnpm test in Step 1's verify is the instrument."
