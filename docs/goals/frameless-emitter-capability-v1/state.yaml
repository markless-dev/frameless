      was never written for it. PM VERIFIED the mechanism: neither tsconfig's `include` names
      generated*/ at all, so the files arrive TRANSITIVELY because browser tests import them. You
      therefore cannot fix this by narrowing `include`; `exclude` is the only lever.
    and_the_instrument_that_DOES_own_them_is_the_stronger_one: >-
