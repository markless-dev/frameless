      - "A number in the plan that is wrong is a FINDING, not a typo to fix in passing. Name it, say what it changes, and let the PM record it."
    expected_output:
      - "The ACTUAL set of files that must move with the schema change, enumerated"
      - "Feasible in one slice, or a proposed split with its seam"
      - "Confirmation the @tsrx/core type source exists as the plan assumes"
      - "Any plan premise that measurement now refutes"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      rationale: "Plan premise SURVIVES; its DANGER MODEL IS REFUTED. Measured by planting PropDestructuringEntry.type on all 8 IR goldens and running each lane's own emit(): ONLY react and solid throw. qwik/svelte/vue/angular accept silently and emit byte-identical output 8/8; resolveModuleSet accepts it too. Step 1 is far smaller than chartered and feasible in one slice. Two blockers the plan does not see: no .tsrx in the live corpus carries a prop type annotation, so Step 1 as written proves nothing; and ComponentPropExpression.type has no annotation source."
      summary: "Step 1 approved, RE-SCOPED to PropDestructuringEntry.type plus one annotated fixture. Seven findings; the extension/lang migration must become its own step between Step 1 and Step 2."
      IT_RAN_THE_PLANS_PREMISES_AS_EXPERIMENTS_INSTEAD_OF_READING_THEM: "The card asked it to enumerate a file set. It PLANTED THE FIELD ON ALL EIGHT GOLDENS AND RAN EVERY LANE'S REAL emit(). That is the difference between a grep and a measurement, and the two answers disagree."
      THE_BLAST_RADIUS_IS_SMALLER_AND_THE_FEAR_POINTED_AT_THE_WRONG_FILES: "Charter: 'all validateEnrichedIr copies move in the same slice or EVERY LANE HARD-THROWS'. MEASURED: exactly TWO validators reject the field - react/src/emitter/index.ts:330 and solid/src/emitter/index.ts:659. Four lanes and resolveModuleSet accept it SILENTLY with byte-identical output. AND THE 'NINE exactKeys FILES' COUNT IS WRONG IN BOTH DIRECTIONS: three of the nine (analyzer expectations.ts, analyzer trace-io.ts, cli receipts.ts) validate TRACES and RECEIPTS, not EnrichedIR - while the single most affected file, the REACT EMITTER, IS NOT AMONG THE NINE AT ALL, because its checker is an inline closure named `keys`. PM CONFIRMED: grep -c exactKeys in the react emitter returns ZERO. Every grep-derived count in this charter - including mine at prep - has missed the one file that actually breaks."
      THE_FINDING_THAT_MATTERS_MORE_THAN_THE_COUNT: "NOT ONE .tsrx IN THE LIVE CORPUS CARRIES A PROP TYPE ANNOTATION - PM CONFIRMED, 0 of 43 non-poc files. @tsrx/core 0.1.32 DOES preserve annotations and buildEnrichedIr already ACCEPTS typed props; it drops them at build.ts propsEntries(). So the supply channel is real, but STEP 1 AS CHARTERED WOULD SHIP A FIELD THAT IS undefined IN 100% OF THE CORPUS, move no golden byte, and prove nothing. Worse, T004's own verify line - 'the Step 0 probe now goes RED against EMITTED output' - IS UNREACHABLE until a corpus source is annotated, AND NO STEP IN THE PLAN OWNS THAT AUTHORING CHANGE."
      IT_REFUTED_THE_PMs_DISPATCH_TEXT: "I wrote that vue/svelte need lang=\"ts\" flipped IN THE SAME EDIT as the type, 'so a split edit turns it red'. MEASURED FALSE IN THE DIRECTION THAT MATTERS: @vue/compiler-sfc compileScript on <script setup lang=\"ts\"> with UNTYPED source is clean, and svelte/compiler 5.56.8 on <script lang=\"ts\"> untyped is clean in BOTH client and server modes with zero warnings. Only type-WITHOUT-lang throws. THE COUPLING IS ONE-DIRECTIONAL - which is precisely what makes a Step 1.5 migration a legal seam. My second premise was also incomplete: program.ts:164 is 1 of NINETY-THREE .jsx references, so moving Step 5's extension map earlier would NOT have unblocked Step 2."
      TWO_MORE_PLAN_PREMISES_REFUTED: "(1) ComponentPropExpression.type HAS NO ANNOTATION SOURCE: build.ts:1321-1357 builds it from the parent's JSX attribute, which carries no annotation, and NOT ONE of Step 0's six negative arms types a call site - every measured RED came from the CHILD DECLARATION alone. Struck from Step 1. (2) THE ONE-EXPORT GUARD IS NOT IN resolveModuleSet AT ALL - PM CONFIRMED zero occurrences in module-set.ts. It lives in solid:495, svelte:724, vue:1101, angular:1275, and REACT AND QWIK HAVE NONE. T999 currently says 'reject if the one-export guard was weakened', which points an auditor at module-set.ts where they would find nothing and could certify a weakened guard as intact."
      THE_REPOS_OWN_ANTI_DRIFT_TESTS_ARE_FALSE_COMFORT: "angular/test/emitter.test.ts:600, svelte:277 and vue:473 each claim 'a schema addition cannot pass silently' - and all three plant newField at the TOP LEVEL of EnrichedIR, which every lane checks. NONE plants it on a NESTED PropDestructuringEntry, which is exactly what Step 1 adds and exactly what four lanes accept silently. THAT IS WHY THE PLAN BELIEVED THE VALIDATORS WERE SYMMETRIC."
      resequencing_ruling: "DO NOT reorder the phase and DO NOT split Step 2. INSERT A STEP 1.5 owning the extension map, the .jsx -> .tsx rename across 93 referencing files, and the vue/svelte lang=\"ts\" flip, with NO type printing - verifiable as behaviour-neutral precisely because the coupling is one-directional. Cost: those 93 files include emitted-typecheck.test.ts's exact diagnostic strings and all four demo apps pnpm e2e drives."
      missing_evidence:
