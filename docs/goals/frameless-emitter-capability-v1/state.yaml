      `exclude` to both tsconfigs. IT DOES NOT REPRODUCE. The PM applied exactly that exclude and
      re-ran pnpm check: 73 ERRORS, UNCHANGED. The reason is TypeScript semantics - `exclude` only
      filters what `include` globs would pull in; A FILE REACHED BY AN IMPORT IS IN THE PROGRAM
      REGARDLESS. Neither tsconfig's `include` names generated*/ at all, so exclude was never the
      lever. The no-op edit was REVERTED rather than left in as a decorative config entry. This is
      the same class of error the board keeps finding, and this time the PM made it.
    WHAT_IS_ACTUALLY_HAPPENING: >-
      The browser tests import '../generated/S3.jsx'. That .jsx SPECIFIER resolves to S3.tsx through
      TypeScript's JS-to-TS substitution - the very mechanism T011 deliberately relied on to keep
      emitted bytes unchanged. So the rename enrolled emitted output into the strict program through
      the test imports, exactly as T011 diagnosed; only its proposed remedy was wrong.
    THE_RULING_STEP_2_OWNS_THIS_NOT_A_CONFIG_FLAG: >-
      PM MEASURED THE ERROR CLASSES: TS7006/TS7031/TS7034/TS7005 = 40 of 73, THE IMPLICIT-ANY
      FAMILY, which is precisely what printing types deletes. The other 33 (TS2339, TS18046, TS2322,
      TS2571) are narrowing and assignment classes. So the dominant half is repaired BY STEP 2
      ITSELF, and the remainder is a measurement Step 2 must take anyway - its own oracle requires
      emitted output to be type-clean apart from the deliberate wrong-typed error. Suppressing this
      with a config flag would hide the exact signal Step 2 exists to produce.
    superseded_reasoning_kept_for_the_record: >-
      EXCLUDE generated/**, generated-composition/** and generated-persistence/** from both
      projects. THIS RESTORES EXACTLY THE COVERAGE THAT EXISTED BEFORE THE RENAME, it does not
      reduce it: those artifacts were .jsx under checkJs:false, so `pnpm check` NEVER checked them.
