version: 2

goal:
  title: "Frameless composition v1: children/slots, shared state, refs"
  slug: "frameless-composition-v1"
  kind: specific
  tranche: "Ship the composition surface on the proven v0 pipeline: children/slots (cross-file composition), shared() lowered idiomatically per framework, refs — dossiers first, emitters implementing them, gates enforcing them, cross-target equivalence receipts covering composition scenarios, fresh-checkout command still green."
  status: active
  oracle:
    signal: "From a fresh checkout, the documented command compiles a multi-component demo TSRX library (children/slots, shared() state across components, refs) into React 19 and Solid packages passing each gate, with green cross-target equivalence receipts in headless Chromium whose scenarios exercise composition (slot rendering, shared-state propagation across boundaries, ref-driven focus); every v0 product suite and poc evidence suite stays green."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge audit runs the fresh-checkout flow plus all suites and records full_outcome_complete: true."
  intake:
    original_request: "Yes give us this [composition surface: children/slots, context, refs — what library authors actually need], and make sure we're doing it the idiomatic way. I don't know if React Compiler makes it fast or not when doing context — context used to be pretty inefficient in React. Either way our shared function should make the conversion simple because they should have the info the framework needs for shared state."
    interpreted_outcome: "Library authors can write multi-component TSRX with slots, shared state, and refs, and get idiomatic, behaviorally-equivalent React 19 and Solid packages with receipts — the same proven pipeline, one surface tier up."
    input_shape: specific
    audience: "The user (markless/Frameless author); library authors are the target beneficiary of this surface."
    authority: requested
    proof_type: test
    completion_proof: "Fresh-checkout documented command green over a composition demo; cross-target receipts include composition scenarios; v0 + poc suites green; final audit records full_outcome_complete: true."
    likely_misfire: "React shared-state lowering chosen by taste (context adopted or rejected without evidence, React Compiler impact assumed instead of validated); shared() conversion guessing at semantics instead of consuming IR records; composition demo that is single-file theater; scope creep into SSR/vendor-refresh/Solid-2/Qwik."
    blind_spots_considered:
      - "The PINNED vendored markless (0.1.1 tarballs) may not compile children/slots/shared/refs — upstream moved (slot/passthrough work) but the pin predates it; vendor refresh is gated on the user's markless fixing board. First Scout must establish pinned capability; insufficient support blocks that slice, not the goal."
      - "React context performance: historical re-render propagation cost; React Compiler's effect on context consumers must be validated with evidence (user explicitly flagged uncertainty)."
      - "Refs cross framework models: React 19 ref-as-prop vs Solid ref props/element access; markless element() handles are the authoring source — lowering must be evidenced per dossier protocol."
      - "EnrichedIR/1 was locked for one component per file with no cross-file imports (v0 limit, fail-closed) — composition REQUIRES lifting that deliberately via a versioned /2 contract, both compiler-side and emitter-side validation."
      - "Cross-target equivalence for shared state needs scenarios where two components interact through shared() — the oracle's scenario vocabulary (actions/observations) may need extension; analyzer changes are critique-mandatory."
    existing_plan_facts:
      - "USER GATE (2026-07-20): the React shared-state lowering tradeoff must be fully worked out BEFORE emitter work proceeds — T004 must weigh executed perf evidence x generated-output idiomaticity (would a human write it) x concurrent-rendering semantics (uSES sync-flush opt-out) x validated React Compiler behavior, and the PM presents the tradeoff + recommendation to the owner as a plain decision menu before cutting shared-lowering Worker packets."
      - "v0 charter recorded: 'Composition surface (children/slots, shared->context, refs) is the NEXT tranche' — 'shared->context' was a sketch, not a decision; the dossier decides the actual React lowering with evidence."
      - "User design principle (2026-07-20): markless shared()'s semantic records carry the info frameworks need for shared state — emitters consume recorded read/write granularity; the conversion should be simple BECAUSE the IR is rich, not because the emitter guesses."
      - "Candidate React idioms to weigh: context + memo discipline, context selectors, useSyncExternalStore external store, prop threading; React Compiler interplay validated not assumed."
      - "Queued-behind-gates (NOT this tranche): SSR tests (sketch at ../frameless-product-v0/notes/ssr-tranche-sketch.md), vendor refresh + IR upstreaming (markless fixing board), Solid 2 migration (beta.9 blocker overturn trigger), Qwik v2 target."
      - "Process carry-over from v0: crew dispatch with PM diff-review, effort medium default, <15-min units, 2-wide worktree parallel for disjoint contracts, second-model critique for emitter/architecture packages, honest receipts, fresh-clone verification for anything dependency-shaped."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

