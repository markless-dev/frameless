# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless: Land the Stack + Newcomer Three-Way Demo (v1)"
  slug: "frameless-land-and-demo-v1"
  kind: existing_plan
  tranche: "Three work packages, continuous: (1) land the working tree on a pushed branch, (2) finish the S1/S2/S3 equality matrix across React/Solid demos, (3) ship a one-command newcomer demo proving one source -> hydrate/hydrate/resume with identical behavior."
  status: active
  oracle:
    signal: "From a fresh clone of the pushed branch, the documented single command boots all three official demos and a newcomer observes identical S1/S2/S3 behavior across React (hydrate), Solid (hydrate), and Qwik (resume)."
    cadence: "after each Worker package and at final audit"
    final_proof: "A Worker/Judge receipt showing the command run against a clean checkout of the pushed branch, with per-framework per-scenario observed behavior recorded, plus the README walkthrough that points at the shared IR source and the three emitted outputs."
  intake:
    original_request: "Land the stack (commit uncommitted work in clean changesets and push), finish the equality matrix (wire S2/S3 into the React/Solid demos), then the newcomer demo: side-by-side one source -> React hydrates / Solid hydrates / Qwik resumes, identical behavior."
    interpreted_outcome: "The proven Frameless work is declared on a pushed branch and a newcomer can reproduce the three-way activation-neutrality comparison with one command."
    input_shape: existing_plan
    audience: "Newcomers evaluating Frameless; owner is the operator"
    authority: approved
    proof_type: demo
    completion_proof: "Fresh clone of the pushed branch -> one command -> identical S1/S2/S3 behavior observed across all three demos."
    likely_misfire: "Treating 'commits exist' or '520 tests pass' as the outcome and closing before a newcomer can run the three-way comparison; or building the demo on an unpushed tree so the proof is not reproducible from a fresh clone."
    blind_spots_considered:
      - "demos/* are official scaffolds with their own lockfiles and heavy node_modules; workspace membership and what gets committed is an unresolved decision that shapes both the changesets and fresh-clone reproducibility."
      - "Qwik requires vite 7.3.1; a fresh-clone demo must pin it or it breaks for exactly the audience the demo serves."
      - "The 5 pre-existing unpushed commits become public in the same push."
      - "Booting three dev servers from one command needs deterministic non-colliding ports."
      - "The matrix is asymmetric until S2/S3 land in the React/Solid demos; Qwik already has all three."
    existing_plan_facts:
      - "Owner order: land -> equality matrix -> newcomer demo. Breadth (Angular/Vue/Svelte) and gated follow-ons (persistence-on-Qwik, composition-on-Qwik) are explicitly out of this tranche."
      - "Starting state: branch main, 5 unpushed local commits (compiler cleanup + storage-ergonomics), ~40 uncommitted paths (persistence tranche, __framelessWrite fix, Qwik emitter, 3 demos, board/memory updates)."
      - "Everything is reported green: 520 tests, and demos/react-official + demos/solid-official + demos/qwik all show kit:2 -> kit:4 on click."
      - "Equality-matrix work is described by the owner as mechanical: S2/S3 already exist in Qwik, need wiring into the React/Solid demos."
      - "Demo shape chosen by owner: local side-by-side runner (one command boots the three demos and prints URLs) plus a README walkthrough. NOT an embedded single-page harness, NOT a recorded walkthrough."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

git_authority:
  # Granted by the owner during intake for this goal only.
  branch_from: main
  may_commit: true
  may_push_branch: true
  may_push_main: false
  may_merge: false
  may_open_pr: false
  may_force_push: false
  may_rewrite_history: false
  notes: "main is untouchable. Never amend/squash/reorder the 5 pre-existing unpushed commits. Nothing may be discarded from the working tree to make a changeset clean."

agents:
  # installed | bundled_not_installed | missing | unknown
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: none
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/frameless-land-and-demo-v1"

active_task: T003

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the working tree into a proposed set of clean changesets and surface every decision the landing Worker will hit, without changing anything."
    inputs:
      - "git status / git diff --stat across the repo"
      - "git log origin/main..main (the 5 unpushed commits)"
      - "demos/react-official, demos/solid-official, demos/qwik (structure, lockfiles, .gitignore coverage, node_modules size)"
      - "packages/frameworks/qwik, packages/*/persistence.ts, packages/frameworks/*/generated-persistence/"
      - "pnpm-workspace.yaml, root package.json scripts, .gitignore"
      - "docs/goals/frameless-persistence-v1, docs/goals/frameless-qwik-v1"
    constraints:
      - "Read-only. Do not stage, commit, stash, clean, checkout, or edit anything."
      - "Running verification commands (pnpm e2e, pnpm test) is allowed and encouraged; mutating git state is not."
      - "Do not propose deleting any untracked path. If something looks like it should not be committed, report it as a question, not a decision."
      - "Report concrete paths, not categories."
    expected_output:
      - "Proposed changeset grouping: an ordered list of commits, each with its exact paths and a one-line message"
      - "Which of the ~40 untracked paths are generated/vendored vs. authored, with evidence"
      - "Whether demos/* are gitignored, workspace members, carry their own lockfiles, and what a fresh clone would need to run them"
      - "Whether generated-persistence/ and .goalbuddy-board-style artifacts belong in git"
      - "Current verification status: exact commands run and their results"
      - "Open questions that need an owner ruling before landing"
    receipt:
      result: done
      note: notes/T001-landing-map.md
      summary: "Tree splits into three clean streams (persistence / qwik emitter / official demos) and the modified tracked files split along the same seams. Both verifications green. Three landing hazards found, 11 open questions raised."
      verification:
        - cmd: pnpm e2e
          status: pass
          detail: "exit 0; ui-kit 3/3, composition-kit 4/4, trace pairs equal; SSR 13 witness boxes pass 0 fail; persistence 7 pass 0 fail; ~15s"
        - cmd: pnpm test
          status: pass
          detail: "exit 0; 35 files, 520/520 — confirms the owner's figure; the new qwik package is already inside the 520 via the root test glob"
      key_findings:
        - "Every modified tracked file except package.json (whitespace-only engines reformat) and pnpm-lock.yaml is persistence work. ZERO modified files mention qwik — the emitter is purely additive."
        - "CORRECTION to intake: __framelessWrite is not a separable fix. It lives in the react/solid emitters and their goldens, wholly inside the persistence changeset."
        - "CORRECTION to intake: '~40 uncommitted paths' counts directories; git status -uall is 26 modified tracked files plus ~85 untracked files across 8 groups."
        - "All four demos are pnpm workspace members via `demos/*`; NONE has its own lockfile; all resolve through the single root pnpm-lock.yaml. node_modules are gitignored symlink farms — no commit risk."
        - "Qwik's vite 7.3.1 pin SURVIVES a fresh clone (exact pin in demos/qwik/package.json, specifier recorded at pnpm-lock.yaml:139, coexists with root vite 8.0.16). But nothing documents why 7.3.1 is required, so a catalog bump could silently break it."
        - "HAZARD: demos/qwik/server/ is 260K of un-gitignored Qwik SSR build output (content-hashed q-*.js chunks). demos/qwik has no .gitignore; the root only ignores dist/."
        - "HAZARD: demos/qwik copy-emitted omits mkdirSync (unlike react-official/solid-official), so a fresh clone breaks with ENOENT unless src/emitted is committed or a .gitkeep exists."
        - "HAZARD: demos/qwik has no dev/preview/start script at all — running it needs a manual build then `node demos/qwik/server/entry.preview.js`."
        - "ORACLE GAP: scripts/e2e.mjs covers only demos/{ui-kit,composition-kit,ssr,persistence}. The three new demos have no automated lane; the 'kit:2 -> kit:4 in all three' claim is manual-observation-only and not reproducible by any repo command."
        - "BISECTABILITY: demos/* are workspace members, so commits 3/6/8 each add a lock importer. The lock is one +3115/-158 file and cannot be partially committed — granular commits leave non-installable intermediates."
        - "PACKAGING: packages/frameworks/qwik/package.json lists @eslint/js, eslint, globals, oxfmt under runtime `dependencies`, and @qwik.dev/core as a hard dep not a peer. @frameless/qwik is also absent from the `pack` array in vite.config.ts despite declaring publishConfig exports at ./dist."
      spawned_tasks:
        - T010

  - id: T010
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Rule on the 11 landing questions Scout raised and rewrite T002 into an unambiguous, executable landing spec."
    inputs:
      - "notes/T001-landing-map.md"
      - "T001 receipt"
      - "goal.md non-negotiable constraints and git_authority block"
    constraints:
      - "Do not implement. Do not stage, commit, or edit anything outside this state file."
      - "Rule on every one of the 11 open questions. A question left open re-trips T002's stop_if and stalls the board."
      - "Prefer the ruling that makes a FRESH CLONE work, since that is the goal oracle. Repo tidiness is secondary to reproducibility."
      - "Do not propose deleting or discarding any untracked path."
      - "Scope discipline: landing is package 1 of 3. Fixes that are prerequisites for a runnable fresh clone belong in T002; everything else belongs in T003/T005 or an explicit deferred list."
      - "Escalate to the owner ONLY what genuinely needs owner taste. Anything decidable from the charter constraints must be decided here, not deferred."
    expected_output:
      - "A ruling for each of the 11 questions, with one-line rationale"
      - "Final ordered commit list with exact paths, ready to execute"
      - "Lockfile strategy, stated explicitly"
      - "The exact set of pre-landing fixes T002 is authorised to make (if any), and what is deferred to T003/T005"
      - "Rewritten T002 allowed_files, verify, and stop_if"
      - "Any question that genuinely needs an owner ruling, stated as a single concrete question"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      note: notes/T010-landing-rulings.md
      rationale: "All 11 questions ruled, so T002's ambiguity stop_if no longer trips. Rulings favour fresh-clone reproducibility: emitted copies and goldens are committed, regenerable Qwik SSR output is gitignored (not deleted), and three minimal fixes make the landed branch actually runnable. Nine commits, lockfile last-but-one."
      corrections_to_scout:
        - "Q3 premise wrong: packages/frameworks/{react,solid}/scripts/ DO contain regenerate.ts and regenerate-composition.ts. Only a persistence-specific one is missing."
        - "Q4 premise partly wrong: oxfmt IS a correct runtime dependency (src/format-emitted.ts imports { format } from it). Only eslint/@eslint/js/globals are scaffold leakage."
        - "Q8 inference wrong: `node server/entry.preview.js` cannot work — entry.preview.tsx default-exports createQwikRouter middleware which does not self-listen. frameless-qwik-v1 T999 records vite-preview as the proven serve path."
      authorised_pre_landing_fixes:
        - "F1: new demos/qwik/.gitignore containing server/, .qwik/, tmp/"
        - "F2: demos/qwik/package.json copy-emitted gains mkdirSync('src/emitted',{recursive:true}), verbatim from the react/solid form"
        - "F3: demos/qwik/package.json gains \"preview\": \"pnpm build && vite preview\""
      deferred:
        - "T003: e2e lanes for demos/{react-official,solid-official,qwik} — closes the T001 oracle gap"
        - "T005: README Qwik row + More-frameworks row + three-way walkthrough; document WHY demos/qwik pins vite 7.3.1; runner ports"
        - "out of tranche: qwik dep hygiene (eslint/@eslint/js/globals to devDeps, @qwik.dev/core to peer); add @frameless/qwik to the pack array; scripts/regenerate-persistence.ts"
      owner_question_non_blocking: "@frameless/qwik packaging hygiene before the branch is public — (a) land as-is and fix out-of-tranche [default, T002 proceeds on this], or (b) insert a chore commit before the lock commit, accepting a lockfile regeneration and a mid-landing pnpm e2e re-run."
      board_updates_applied:
        - "T002 allowed_files/verify/stop_if replaced"
        - "T003 verify gains the e2e-lane requirement"
        - "T005 objective gains README + vite-pin documentation"

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Land the stack: cut branch land/stack-and-three-way-demo off main, apply the three authorised fixes, commit the tree as the nine T010 changesets, and push the branch."
    inputs:
      - "notes/T010-landing-rulings.md — the commit list, lockfile strategy, and the three authorised fixes (AUTHORITATIVE)"
      - "notes/T001-landing-map.md — the underlying survey"
      - "goal.md git_authority block and non-negotiable constraints"
      - "Owner question resolved to default (a): land @frameless/qwik packaging as-is."
    allowed_files:
      - "<git index, branch, and remote state: branch creation, staging, commits, push -u>"
      - "demos/qwik/.gitignore   # NEW — fix F1 only"
      - "demos/qwik/package.json # fixes F2 (mkdirSync) and F3 (preview script) ONLY"
      - "docs/goals/frameless-land-and-demo-v1/state.yaml"
      - "# No other working-tree file content may change. Everything else is staged exactly as-is."
    verify:
      - "pnpm e2e green BEFORE the first commit — record exit code and lane counts"
      - "git rev-parse --abbrev-ref HEAD returns the new branch, never 'main'"
      - "pnpm --dir demos/qwik preview serves; S1 (/), S2 (/s2), S3 (/s3) each return 200 with the expected SSR markup via curl (proves F1+F2+F3 from a build-output-free tree). PM amendment to the T010 spec: the Worker has no browser, so the kit:2 -> kit:4 CLICK assertion is NOT verifiable here and moves to T003's automated lanes. Do not simulate, infer, or claim a click result."
      - "git status --porcelain -uall is EMPTY after commit 9"
      - "git status --porcelain --ignored -uall lists demos/qwik/server/** as ignored and still present on disk"
      - "git log --oneline origin/main..HEAD shows 06285f0, 3acb272, acf1d81, 87eb926, 869ea33 with UNCHANGED hashes, plus exactly 9 new commits"
      - "git diff origin/main...HEAD --diff-filter=D --stat is empty (zero deletions)"
      - "pnpm install --frozen-lockfile exits 0 at HEAD"
      - "pnpm e2e green AFTER commit 9"
      - "git push -u origin land/stack-and-three-way-demo succeeds; git rev-parse origin/main unchanged from its pre-run value"
    stop_if:
      - "pnpm e2e is not green before committing — do not commit a red tree."
      - "Any operation would touch main, force-push, merge, open a PR, or amend/squash/reorder the 5 pre-existing commits."
      - "Any step requires deleting, discarding, stashing, or git-cleaning a working-tree path."
      - "pnpm install --frozen-lockfile fails at HEAD — STOP; do NOT regenerate or hand-edit pnpm-lock.yaml. (Failures at INTERMEDIATE commits are EXPECTED — ignore them.)"
      - "git diff --diff-filter=D shows any deletion at any point."
      - "Stock `vite preview` cannot serve demos/qwik without adding vite config or a hand-written server — commit the demo WITHOUT the preview script, record it deferred to T005, and do NOT hand-roll a harness."
      - "Any file outside allowed_files has content changes at the end of the run."
      - "The push fails for any reason other than a missing upstream that -u resolves."
    receipt:
      result: done
      branch: land/stack-and-three-way-demo
      cut_from: "main @ 869ea33"
      origin_main_before: 895d187b1cd9b3f2d3fee62c7c91028c52a8779b
      summary: "Branch cut off main, the three authorised fixes applied, and the working tree landed as the nine T010 changesets. Nothing deleted, nothing discarded, no file outside allowed_files changed. pnpm e2e green before the first commit and again at the lockfile commit; pnpm install --frozen-lockfile exits 0 with the lock in. Stock vite preview serves all three Qwik routes."
      authorised_fixes_applied:
        - "F1: demos/qwik/.gitignore (server/, .qwik/, tmp/) — server/ is now ignored and still present on disk (8 paths)"
        - "F2: demos/qwik copy-emitted gains mkdirSync('src/emitted',{recursive:true}), verbatim from the react/solid form"
        - "F3: demos/qwik gains \"preview\": \"pnpm build && vite preview\" — F3 is KEPT; stock vite preview works, no vite config change and no hand-rolled harness"
      commits:
        - "a24552a docs(goals): frameless-persistence-v1 board"
        - "a7ef296 feat(persistence): render-time localStorage reads with pre-paint seed and write-through"
        - "b48f99e test(persistence): witness demo and e2e persistence lane"
        - "ab72b8c docs(goals): frameless-qwik-v1 board"
        - "de78128 feat(qwik): @frameless/qwik emitter, gate, and checked-in S1/S2/S3 goldens"
        - "97538a2 demo(qwik): official pnpm-create-qwik app proving resume neutrality"
        - "2941d7e demo(react,solid): official vite SSR scaffolds proving hydrate neutrality"
        - "540aedf chore(deps): lockfile for the persistence, qwik and official-demo workspaces"
        - "(this commit) docs(goals): frameless-land-and-demo-v1 board"
      verification:
        - cmd: pnpm e2e
          when: before the first commit
          status: pass
          detail: "exit 0; ui-kit react 3 / solid 3, composition-kit react 4 / solid 4, trace pairs equal 3 + 4; SSR 13 boxes pass 0 fail (pre react 12/12, solid 12/12); persistence 7 boxes pass 0 fail"
        - cmd: git rev-parse --abbrev-ref HEAD
          status: pass
          detail: "land/stack-and-three-way-demo before the first commit and at every commit; never main"
        - cmd: pnpm --dir demos/qwik preview + curl
          status: pass
          detail: "vite 7.3.1 preview on :4173 after a full pnpm build. / -> 200 (SSR text 'kit:2 increment'); /s2 -> 301 to /s2/ -> 200 (keyed rows data-oracle-row-key a, b; 'add remove remove reorder clear'); /s3 -> 301 to /s3/ -> 200 ('submit 0'). All three carry q:container=\"paused\" — resumed, not hydrated. NOT VERIFIED HERE: the kit:2 -> kit:4 click, which needs a browser and belongs to T003's automated lanes."
        - cmd: pnpm install --frozen-lockfile
          status: pass
          detail: "exit 0 with the lockfile commit in; pnpm-lock.yaml left unmodified. Intermediate commits are knowingly not installable, as stated in the lockfile commit body."
        - cmd: pnpm e2e
          when: after the lockfile commit
          status: pass
          detail: "exit 0; same lane counts as the pre-landing run"
        - cmd: git diff origin/main...HEAD --diff-filter=D --stat
          status: pass
          detail: "empty — zero deletions across all nine commits"
        - cmd: git log --oneline origin/main..HEAD
          status: pass
          detail: "06285f0, 3acb272, acf1d81, 87eb926, 869ea33 unchanged, plus the nine new commits"
      notes:
        - "demos/qwik/server/** was regenerated by the mandated preview build (new content hashes) and is ignored, not removed. demos/qwik/dist/** stays ignored by the root rule."
        - "Owner question resolved to default (a): @frameless/qwik packaging hygiene landed as-is."
        - "Deferred as ruled: e2e lanes for the three official demos -> T003; README Qwik row, vite 7.3.1 rationale, runner ports -> T005."

  - id: T003
    type: worker
    assignee: Worker
    status: active
    reasoning_hint: medium
    objective: "Close the equality matrix: wire S2 and S3 into demos/react-official and demos/solid-official so all three official demos run all three scenarios, AND add automated e2e lanes so the three-way identical-behavior claim is proven by a repo command rather than manual observation. Commit the slice on the existing branch."
    inputs:
      - "demos/qwik (reference — already runs S1/S2/S3 at /, /s2, /s3)"
      - "packages/frameworks/{react,solid}/generated/{S1,S2,S3}.jsx (all tracked; the demos currently copy S1 only)"
      - "demos/persistence and demos/ssr — the existing @async/witness box pattern the new lanes should follow"
      - "notes/T001-landing-map.md (oracle gap section)"
    allowed_files:
      - "demos/react-official/**"
      - "demos/solid-official/**"
      - "demos/qwik/** (only if an e2e lane needs a hook there; no vite.config.ts changes)"
      - "scripts/e2e.mjs"
      - "docs/goals/frameless-land-and-demo-v1/state.yaml"
      - "<git index and branch state: commit + push on land/stack-and-three-way-demo ONLY>"
    verify:
      - "Each demo builds and serves"
      - "S1 behaves identically in all three (the known kit:2 -> kit:4 on click)"
      - "S2 and S3 produce the same observable outcome in React, Solid, and Qwik"
      - "scripts/e2e.mjs gains automated lanes for demos/{react-official,solid-official,qwik} so the three-way claim is reproducible by a repo command, not manual observation (closes the T001 oracle gap)"
      - "pnpm e2e"
      - "No console errors or hydration/resume warnings in any demo"
      - "git status --porcelain -uall empty after the commit; branch still land/stack-and-three-way-demo; origin/main unchanged"
    stop_if:
      - "The wiring turns out not to be mechanical — a scenario needs emitter or compiler changes to work in React/Solid."
      - "Making a scenario work would require hand-rolling a build/SSR harness instead of using the official scaffold."
      - "Serving S2/S3 would require adding a router or any other new runtime dependency — escalate instead."
      - "A behavioral difference between frameworks appears that is not explainable by the intended hydrate-vs-resume distinction. Report it; do NOT paper over it to make the matrix look equal."
      - "Any operation would touch main, force-push, merge, open a PR, or alter existing commits."
      - "Verification fails twice."
    receipt: null

  - id: T004
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Phase boundary: confirm the matrix is genuinely equal across 3 frameworks x 3 scenarios, and specify the exact demo runner + walkthrough the next Worker must build."
    inputs:
      - "T002 and T003 receipts"
      - "goal.md oracle"
    constraints:
      - "Do not implement."
      - "Be skeptical about 'identical': require per-framework, per-scenario observed evidence, not an assertion that tests pass."
      - "Any behavioral difference must be explicitly attributed to the intended hydrate-vs-resume distinction or treated as a defect."
      - "Specify port assignment, dependency pinning (vite 7.3.1 for Qwik), and fresh-clone requirements in the Worker spec."
    expected_output:
      - "Decision: matrix equal | not equal (with the specific gaps)"
      - "Exact Worker objective for the demo runner and README walkthrough"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Any owner question that must be escalated"
    receipt: null

  - id: T005
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: medium
    objective: "Build the newcomer demo: one documented command that boots all three official demos and prints their URLs, plus a README walkthrough showing the shared IR source and the three emitted outputs. Also carries the deferred README work — the Qwik row, the stale 'More frameworks: Planned' row — and a comment documenting WHY demos/qwik pins vite 7.3.1 (guards against a silent catalog bump)."
    inputs:
      - "T004 Judge spec"
      - "T010 deferred list (README rows, vite 7.3.1 rationale, runner ports)"
    allowed_files:
      - "(set by T004 Judge — expected: root package.json scripts, scripts/**, README.md, demos/**/README.md, docs/**)"
      - "docs/goals/frameless-land-and-demo-v1/state.yaml"
    verify:
      - "The single command starts all three demos on deterministic non-colliding ports and prints reachable URLs"
      - "Each URL serves the working demo; S1/S2/S3 behave identically across the three"
      - "The walkthrough names the one shared source and the three emitted outputs by path, and those paths exist"
      - "Ctrl-C cleanly stops all three processes"
      - "pnpm e2e"
    stop_if:
      - "The runner would require hand-rolling a build or SSR harness."
      - "A new runtime dependency is needed — escalate to the owner instead of adding it."
      - "The command cannot be made to work from a clean checkout without undocumented manual setup."
      - "Verification fails twice."
    receipt: null

  - id: T006
    type: worker
    assignee: Worker
    status: queued
    reasoning_hint: low
    objective: "Oracle run: verify the demo from a genuinely fresh clone of the pushed branch. PM amendment — T003 and T005 now commit and push their own slices as they go (so undeclared work never re-accumulates), leaving this task as the oracle run plus any README fix the fresh clone proves necessary."
    inputs:
      - "T005 receipt"
      - "goal.md oracle"
    allowed_files:
      - "<a scratch clone outside the repo, plus git index/branch/remote state in the repo — no working-tree file content changes except fixes required by the fresh-clone run>"
      - "README.md"
      - "docs/goals/frameless-land-and-demo-v1/state.yaml"
    verify:
      - "git clone the pushed branch into a scratch directory"
      - "Follow the README from that clone verbatim; record every command and its result"
      - "Record observed behavior per framework per scenario (S1/S2/S3 x React/Solid/Qwik)"
      - "git status --porcelain empty after the final push"
      - "git log --oneline origin/main..HEAD"
    stop_if:
      - "The fresh clone needs a step the README does not document — fix the README and re-run rather than proceeding."
      - "Any operation would touch main, force-push, or alter earlier commits."
      - "The fresh-clone run fails twice for the same reason."
    receipt: null

  - id: T999
    type: judge
    assignee: Judge
