tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: active
    reasoning_hint: medium
    objective: "Map the official Svelte scaffold, its activation model, and the exact version boundaries that make IR-4 load-bearing."
    inputs:
      - "The current official Svelte scaffold (npx sv create) - contents and pinned versions"
      - "Svelte 5 docs and source: runes, event attributes, the removal of modifiers, $bindable, snippets"
      - "scripts/e2e.mjs - the activation matrix and its vocabulary"
      - "demos/react-official and demos/solid-official - the shape a fourth official demo must match"
      - "packages/compiler/src/schema.ts - IR-1, IR-3, IR-4, IR-5, IR-6, IR-7 as they stand"
      - "poc/09-storage/svelte - prior in-repo assumptions"
    constraints:
      - "Read-only. Do NOT scaffold anything yet."
      - "Enumerate the VERSION BOUNDARIES precisely: which construct needs which minimum Svelte version, and what the scaffold actually pins. This is the evidence IR-4 will be ruled on."
      - "Report how Svelte 5's removal of event modifiers interacts with IR-5's preventDefault|stopPropagation - specifically what the emitter must generate instead."
      - "Report whether svelte-check covers what pnpm check does not."
    expected_output:
      - "Official scaffold contents and pinned versions"
      - "Svelte's activation model and whether the e2e vocabulary covers it"
      - "Version boundary table: construct -> minimum version -> what the scaffold pins"
      - "How IR-5's two modifiers must be emitted with modifiers removed in Svelte 5"
      - "Whether svelte-check covers emitted output"
      - "Which IR gaps block S1/S2/S3 versus only sugar"
    receipt: null

  - id: T002
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Ratify the Svelte adapter contract and rule on whether IR-4 is closed by this board or deferred."
    inputs:
      - "T001 receipt"
      - "docs/emitter-idiom-policy.md - especially Gate 6's version corollary"
    constraints:
      - "Do not implement."
      - "Rule on IR-4 EXPLICITLY. If closed, the design must be a general facility usable by the Vue and Angular boards - not a Svelte-shaped hack. If deferred, state the consequence for those boards."
      - "Rule on how IR-5's two modifiers are emitted given Svelte 5 removed modifiers."
      - "Separate what S1/S2/S3 activation neutrality requires from what Svelte idiom sugar would be nicer with."
      - "Do NOT rule bind: into scope. It is different-in-kind on two axes and its failure mode is a dev-only console warning; if it is wanted, it needs its own package with its own proof."
    expected_output:
      - "IR-4 ruling: closed here (with design) or deferred (with consequence)"
      - "IR-5 emission ruling"
      - "S1/S2/S3 scope for the first Worker package"
      - "Exact Worker objective, allowed_files, verify, stop_if"
    receipt: null

  - id: T003
