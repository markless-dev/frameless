      - "poc/09-storage/svelte/App.svelte - the prior in-repo assumption"
      - "pnpm-workspace.yaml:16 - vite ^8.0.16, matching the scaffold pin"
      note_correction: "The T001 receipt originally cited notes/T001-scaffold-and-versions.md, which was never written. Caught by T002. The inline receipt below IS the record; the citation is withdrawn rather than back-filled, because writing the note now would be reconstructing evidence after the fact. A receipt citing evidence that is not there is the board-level form of instrument rule 2."
      summary: "Mapped the sv@0.16.6 minimal scaffold: SvelteKit 2.63 / svelte ^5.56.1 / vite ^8.0.16 - the SAME vite as the root catalog, so Svelte does not repeat Qwik's vite-pinning problem. Svelte hydrates, so e2e needs no third activation term. Every construct S1/S2/S3 needs is Svelte 5.0 baseline, so IR-4 blocks no lane. IR-5 needs no schema change - modifiers were removed, so the actions emit as ordinary in-body statements; the live question is DELEGATION, not modifiers."
      scaffold:
        command: "npx sv create, sv@0.16.6, minimal + TypeScript"
        pins: "@sveltejs/kit ^2.63.0, svelte ^5.56.1, @sveltejs/vite-plugin-svelte ^7.1.2, vite ^8.0.16, svelte-check ^4.6.0, @sveltejs/adapter-auto ^7.0.1"
        vite_alignment: "^8.0.16 is byte-identical to the root catalog (pnpm-workspace.yaml:16). The cheapest good news on the board - no Qwik-style vite-7.3.1 pinning problem."
        notable: "The minimal template has NO svelte.config.js; the adapter is configured inline in vite.config.js. Its own +layout.svelte is ALREADY runes plus snippets - `let { children } = $props()` and `{@render children()}` - so snippets are the scaffold's default-children mechanism, not optional sugar."
      activation:
        model: "SvelteKit SSRs then hydrates. activation: 'hydrate' already exists; NO third e2e term needed. The Activation union in three-way-contract.ts is closed on framework names and needs 'svelte' added to the hydrate arm - a widening, not a weakening."
        friction_1: "The hydrate branch asserts the served HTML contains the literal '/src/entry-client.jsx'. SvelteKit owns its client entry and instead emits an inline __sveltekit_* bootstrap importing a kit-generated module. Making the literal per-demo keeps the assertion specific; relaxing it to 'any module script' would weaken it. JUDGE CALL."
        friction_2: "There is no demo-owned entry-client to set data-frameless-activated. The nearest scaffold-preserving sites are a root +layout.svelte $effect/onMount or src/hooks.client.ts. Both are scaffold-shaped; neither is a hand-rolled harness."
      structural_tension_requiring_a_ruling: "react-official and solid-official each HAND-WIRE server.js + ssr-handler.js + express, with a frameless-demo-ssr vite plugin injected by scenarios.box.ts. SvelteKit's own plugin already does SSR, so demos/svelte-official would have NO server.js and NO ssr-handler.js, and its routes become src/routes/+page.svelte etc. 'Official scaffold only' and 'match the shape of the existing three demos' are in DIRECT TENSION here and one must yield. The charter's own constraint points at SvelteKit."
      version_boundary_table:
        at_or_below_5.0_baseline: "runes $state/$derived/$effect/$props, onclick={} event attributes, on() from svelte/events, $bindable(), snippets {#snippet}/{@render}"
        above_baseline_but_satisfied_at_5.56: "<svelte:boundary> 5.3, class attribute as object/array via clsx 5.16.0, $props.id() 5.20.0, writable/reassignable $derived 5.25.0, attachments {@attach} 5.29.0"
        unavailable: "Event modifiers (on:click|preventDefault) - 3.x/4.x ONLY, removed in 5.0. The on:click DIRECTIVE survives but is deprecated in 5 and slated for removal in 6."
        ir_4_consequence: "At ^5.56.1 EVERY version-gated Svelte construct under discussion is already above its floor, so the Svelte lane produces NO FORCING CASE for IR-4. The policy's version corollary needs both 'lockfile pins >= N' AND 'the emitter can know the version'; Svelte satisfies the first and not the second. Whether the first alone suffices is exactly the T002 question - and Svelte hands the Judge the EASY end of it, which is worth saying plainly because Vue's defineModel (3.4+) and Angular's signal input()/output() (>=17.1/17.2) may not have the same slack."
      ir_5:
        no_schema_change: "Svelte 5 removed modifiers, so there is no |preventDefault spelling to target. Svelte 5 event attributes receive the native DOM Event, so the emitter generates exactly what React and Solid already generate: onclick={(event) => { event.preventDefault(); ...rest }}. No lowering, no vocabulary extension, for S1/S2/S3."
        the_real_question_is_delegation: "Svelte 5 delegates a fixed event set (click, input, change, keydown...) to the root, so a stopPropagation inside a delegated handler may not stop what an author expects; Svelte's docs direct to on() from svelte/events. That is PRECISELY the repair already recorded in idiom-policy worked example 6 - narrow the attribute-form domain to events whose declared actions exclude stopPropagation, and route the rest through on()."
        what_not_to_assume: "The Qwik failure was QRL LAZINESS - the handler arrived ~58ms after dispatch - NOT delegation. A Svelte delegated listener is in the bundle and runs synchronously during dispatch, so preventDefault from it should still avert the default action. That reasoning is DOCUMENTARY. Per instrument rule 1 it must be MEASURED on the S3 cancel-submit before any claim is filed either way."
      blocking_vs_sugar:
        blocks_s1_s2_s3: "None of IR-1, IR-3, IR-4 or IR-6."
        needs_a_ruling_but_blocks_nothing_structurally: "IR-5, to get S3 right."
        the_sleeper: "IR-7 is the only gap with real S1/S2/S3 exposure. Purity is never asserted - ExpressionSite.expression is an arbitrary AST node - while $derived expects a pure re-runnable expression, and Svelte reports violations as state_unsafe_mutation / effect_update_depth_exceeded, SOME OF THEM DEV-ONLY. S1's derived is trivial so it will pass, WHICH IS EXACTLY WHY this is the gap most likely to be silently wrong later."
        sugar_only: "IR-1 ($bindable/bind:, explicitly out of scope), IR-3 (snippets beyond the default slot - TemplateDefaultSlotProjection maps cleanly onto {@render children?.()}, so IR-3 only bites if the lane extends to the composition kit), IR-4, IR-6."
      svelte_check: "YES, materially beyond the shared lane, and the shared lane CANNOT substitute: tsc cannot parse .svelte at all, so a packages/frameworks/svelte emitted-typecheck twin would have nothing to read. svelte-check adds invalid rune usage, state_referenced_locally, non-reactive derived misuse, invalid {@render} targets, unknown component props, wrong handler signatures. Cost: needs svelte-kit sync plus a project tsconfig, and emits warnings the Solid lane's exact-equality ACCEPTED pattern would have to absorb. Cheaper independent oracle worth weighing: svelte/compiler's compile() returns a warnings array with no project scaffolding at all."
      contradictions_found:
        confirmed_and_fixed_by_pm: "state.yaml still carried the two STALE standing gaps verbatim while goal.md had been corrected - and state.yaml is declared to WIN. This was a PM miss in T010: correction fields were added without amending the original existing_plan_facts entries. Corrected in all THREE adapter boards, not just Svelte."
        confirmed_needs_ruling: "'Official scaffold only' versus 'match the existing demo shape' cannot both hold for SvelteKit."
        NOT_confirmed: "The Scout reported worked example 9 duplicated line-for-line in docs/emitter-idiom-policy.md. PM CHECKED: it is not - a single occurrence of the heading and of the 'Sanctioned set, stated first' paragraph. Instrument rule 1 applies to Scouts too; recorded so the claim does not propagate."
      ambiguity_requiring_judge:
        - "IR-4: does 'the lockfile pins >= N' satisfy the version corollary on its own, or must the emitter be handed the version? Svelte cannot force the answer and gives the easy end; rule knowing Vue and Angular inherit it."
        - "IR-5 emission: in-body statements for both actions, versus worked example 6's repair routing stopPropagation-carrying events through on(). Needs MEASUREMENT of Svelte 5 delegation first."
        - "Whether widening the Activation union and making the served-payload literal per-demo counts as weakening an activation-neutrality check. T999 is instructed to reject on exactly this, so rule up front rather than defending after."
        - "Whether demos/svelte-official is a SvelteKit app (official, structurally unlike the other three) or a bare vite + plugin-svelte SSR setup mirroring react-official (structurally matching, but hand-rolled - the exact thing frameless-qwik-v1 exists to forbid)."
      disclosed: "Used 18 commands against a 12-command budget. The task named eight separate inputs plus upstream version verification."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Ratify the Svelte adapter contract and rule on whether IR-4 is closed by this board or deferred."
    inputs:
      - "T001 receipt"
      - "docs/emitter-idiom-policy.md - especially Gate 6's version corollary"
    constraints:
      - "Do not implement."
      - "Rule on IR-4 EXPLICITLY. If closed, the design must be a general facility usable by the Vue and Angular boards - not a Svelte-shaped hack. If deferred, state the consequence for those boards."
      - "Rule on how IR-5's two modifiers are emitted given Svelte 5 removed modifiers."
      - "Separate what S1/S2/S3 activation neutrality requires from what Svelte idiom sugar would be nicer with."
      - "Do NOT rule bind: into scope. It is different-in-kind on two axes and its failure mode is a dev-only console warning; if it is wanted, it needs its own package with its own proof."
    expected_output:
      - "IR-4 ruling: closed here (with design) or deferred (with consequence)"
      - "IR-5 emission ruling"
      - "S1/S2/S3 scope for the first Worker package"
      - "Exact Worker objective, allowed_files, verify, stop_if"
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      rationale: "The demo-shape tension is SMALLER than T001 stated: demos/qwik is already a stock official scaffold with no server.js, no express and no frameless-demo-ssr plugin, so SvelteKit follows a landed precedent rather than breaking a three-demo uniformity. Union widening approved as a REQUIRED per-demo field, not a relaxation. IR-4 deferred: Svelte produces no forcing case, and a general facility designed against zero forcing cases is folklore. IR-5 needs measurement, not documents - and the corpus contains ZERO stopPropagation, which relocates the real risk."
      ruling_1_demo_shape:
        verdict: "demos/svelte-official IS a SvelteKit app from the official scaffold."
        the_tension_was_weaker_than_reported: "'Match the shape of the existing three demos' is not in the charter, and it is ALREADY FALSE. demos/qwik has no server.js, no ssr-handler.js, no express and no vite plugin overlay - its scenarios.box.ts says verbatim 'No config overlay and no middleware: qwikRouter() already renders on the server in dev. This is the stock pnpm create qwik pipeline.' Only 2 of 3 demos hand-wire SSR, and the third - landed by the goal that exists to FORBID hand-rolled harnesses - is structurally identical to what SvelteKit needs."
        what_must_actually_match: "Not the server wiring. The CONTRACT PROTOCOL: scenarios.box.ts importing three-way-contract.ts, assertServedActivation + runScenario over scenarioIds, the JSON three-way-results receipt note, a copy-emitted script, and an officialDemos row in scripts/e2e.mjs."
        cost_of_the_losing_constraint: "Three, stated so they are not discovered later. (a) Emitted components are wired through SvelteKit's route conventions, so a convention change breaks this lane in a way react/solid are immune to. (b) No shared createSsrHandler between pnpm dev and the box, so react-official's 'no second harness exists to drift' property is unobtainable - SvelteKit's own dev server is the single path instead, equivalent by a different argument. (c) modes:['dev'] means the vite build + adapter path is never exercised, identical to the still-true standing gap for qwik."
      ruling_2_activation_union:
        verdict: "Widening APPROVED, does not weaken activation neutrality - conditionally."
        analysis: "assertServedActivation's hydrate arm makes THREE claims. The two negatives - forbidInServedPayload(['q:container', ACTIVATION_MARKER]) - are framework-agnostic and ARE the neutrality claims; they do not change. The positive, contains '/src/entry-client.jsx', is NOT a neutrality claim; it is a LANE-IDENTITY claim, shared by react and solid only because both scaffolds happen to name their entry identically. Parameterising it per demo preserves the identical claim at each demo's own literal. Relaxing it to 'any module script' would weaken it and is REJECTED."
        conditions:
          - "The literal must be a REQUIRED field on the hydrate arm (e.g. readonly servedClientEntry: string) so the type forbids a lane omitting it. An optional field is a silent opt-out and is rejected."
          - "The Svelte literal must be MEASURED from what SvelteKit dev actually serves, not guessed, and must be a framework-owned module string."
          - "Instrument rule 3: the chosen literal must be SHOWN able to go red - a recorded run pointed at a string the payload does not contain, or a negative control. A served-payload literal never observed failing is not a check."
          - "The activation marker must be set in Svelte's OWN post-mount signal - onMount in the root +layout.svelte - NOT hooks.client.ts init, which runs before hydration completes. Imperative, never a template attribute binding, or SSR would emit it and forbidInServedPayload would correctly fail."
        mechanical_test_for_T999: "For react, solid and qwik, the SET of assertions run and the exact strings asserted must be byte-unchanged after the Svelte lane lands. Moving react's literal from a helper constant into its own activation object is not a weakening; changing, softening or making it optional is."
        forward_note_for_T004: "runScenario computes navigations = resume ? 1 : 0. If SvelteKit's client router records a history entry on initial load (qwik's does), the permitted repair is the SAME KIND of widening - a per-demo declared expected count, still asserted exactly. Relaxing to 'any number' is not permitted. Decide by measurement."
      ruling_3_ir4:
        verdict: "IR-4 DEFERRED. The version corollary is NOT amended - both conjuncts stand. 'The lockfile pins >= N' alone does NOT satisfy it."
        why_deferred: "Svelte produces no forcing case; at ^5.56.1 every construct is above its floor. Designing a general facility against ZERO forcing cases is the Gate 4 error transposed up to the IR schema. And generality is undecidable today - neither the Vue nor Angular board has run, so the SHAPE is unknown: a version string per target, a lockfile-resolved map, or (probably right, unprovable today) a CAPABILITY set, since emit sites want 'supports reassignable-derived', not scattered semver comparisons."
        why_the_lockfile_pin_alone_is_insufficient: "Frameless is a PUBLISHED compiler - vite.config.ts packs @frameless/react and @frameless/solid, and packages/cli builds for consumers. The lockfile pin is THIS repo's test-lane version, not the consumer's framework version. An emitter assuming its own dev repo's pin will emit 5.25+ syntax into a consumer app on 5.10. That is the instrument-fault pattern verbatim - measuring through a proxy whose stability the product never promised - moved from tests into SHIPPED OUTPUT. The two conjuncts answer different questions: 'can a regression be caught here?' and 'is the emitted output valid there?'. Collapsing them from the comfortable case is the trap T001 named."
        the_second_conjunct_is_satisfiable_two_ways: "(a) an explicit target-version or capability input on EnrichedIR, or (b) an emitter that emits ONLY baseline-version-safe forms, in which case there is no version-gated sugar and the corollary never engages. Svelte is (b) today. Recording (b) explicitly is what lets T003 proceed without IR-4 and lets T005 resolve honestly rather than by shrug."
        binding_on_vue_and_angular: "Neither may invent a local answer. Both inherit: IR-4 deferred, emit baseline-safe forms, record 'DEFERRED - no target-version input' at Gate 6 for any version-gated sugar."
        reopen_trigger: "Falsifiable, not 'someday': the first construct where (i) the baseline-safe form is materially worse AND an official scaffold pins below the sugar's floor, or (ii) frameless ships to a consumer whose framework version differs from this repo's lockfile."
      ruling_4_ir5:
        schema: "NO change. Svelte 5 removed modifiers and its event attributes receive the native DOM Event, so the actions emit as ordinary in-body statements exactly as React and Solid already emit them."
        measurement_is_mandatory: "Gate 1 records FAIL when the only evidence is documentary AND a build of the target framework is in the lockfile - and T003 is the package that puts Svelte there. T001 was right to call its own reasoning documentary."
        the_risk_is_not_where_T001_put_it: "VERIFIED against the goldens: s1/s2/s3 contain ZERO occurrences of stopPropagation (preventDefault 4x, syncPolicy 2x, all in s3). Worked example 6's G4 counterexample has NO INSTANCE in T003's corpus. The risk that actually bites is different: (i) preventDefault() inside a DELEGATED click handler on a <button type=submit> must still avert the real GET navigation assertS3 checks by Document-request count; and (ii) S3's emitted output puts an onClick on the FORM ITSELF reading event.target.dataset.action === 'submit', so the lane depends on a click BUBBLING from button to form. Under Svelte 5 both are delegated to the root and propagation is simulated. That pair is the measurement."
