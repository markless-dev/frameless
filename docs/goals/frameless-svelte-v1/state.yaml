  - id: T005
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "With a Svelte lane at a pinned version, re-run the idiom policy on at least one version-gated Svelte sugar question and record whether the version corollary now resolves."
    inputs:
      - "docs/emitter-idiom-policy.md worked example 6 (Svelte onclick, currently deferred after repair)"
      - "The landed Svelte lane and the IR-4 ruling"
    constraints:
      - "Do not implement. Rule."
      - "This is the direct test of the policy's version corollary. If IR-4 was closed, a version-gated sugar should now resolve; if it was deferred, say plainly that it still cannot and why."
      - "Record the ruling in the policy's own format so it can be folded back into docs/emitter-idiom-policy.md."
    expected_output:
      - "Six gate outcomes for at least one version-gated Svelte sugar question"
      - "Whether the version corollary resolved, with evidence"
      - "Whether docs/emitter-idiom-policy.md needs updating"
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      note_citation_withdrawn: "The T005 receipt cited notes/T005-svelte-sugar.md, which was NEVER WRITTEN - the same class as T001's withdrawn citation. T008 created a file at that path but its first line states it is NOT the Judge's note and reconstructs nothing; it holds only T008's own measurements. Citation withdrawn rather than back-filled. This receipt is the ruling of record."
      rationale: "Re-ran all six gates on worked example 6 against the real emitter at svelte 5.56.8. IT DOES NOT RIPEN INTO PASS - it becomes DENIED. G1 FAIL (the on() arm is documentary while the framework is in the lockfile and measurement is demonstrably possible - the Judge compiled both on() vehicles clean) and G5 FAIL (the repair prescribes a MIXED-MECHANISM component, a routing difference the compiler cannot see, directly contradicting T002 ruling 4's 'never a mix'). The grounds only became visible once the emitter existed, which is the OPPOSITE of a deferral quietly ripening."
      the_headline: "The repair recorded in worked example 6 was WRONG WHEN IT WAS RATIFIED, not merely unverified. Its per-event-record narrowing MANDATES a mixed-mechanism component - S3 carries four events - while T002 independently reached 'never a mix' without anyone noticing the contradiction. Nobody caught it because there was no emitter."
      measurements_pm_verified:
        on_click_in_runes: "CONFIRMED by the PM at 5.56.8: warns event_directive_deprecated. So the zero-warning sanctioned set has exactly one no-obligation member, and onname= is the BASELINE."
        mixing: "CONFIRMED by the PM: on:click + onclick in one component is a HARD ERROR, mixed_event_handler_syntaxes."
        use_plus_on: "Judge measured use: + on() and {@attach} + on() both compile with an empty warning set - so the on() arm was NEVER blocked by IR-4, only by never having been measured."
        destructured_props: "Judge measured `let { label } = $props()` lowering to a live $$props.label read inside template_effect - which REFUTES worked example 7's G5 first limb."
      pm_correction_to_this_receipt:
        what_the_judge_reported: "That an unknown <!-- svelte-ignore code --> WARNS unknown_code, making the emitter's suppression codes a version-floor surface."
        pm_correction_was_itself_the_wrong_arm: "T008 reproduced BOTH reports and found the variable neither named: `if (runes)` at svelte/src/compiler/utils/extract_svelte_ignore.js:38. In a RUNES component an unrecognised code DOES warn unknown_code, and a Svelte 4 dash-case spelling warns legacy_code; in a RUNES-FREE component there is no diagnostic at all. In both, the annotation suppresses nothing. PM RE-VERIFIED both arms and the deciding line. THE PM'S TEST USED A RUNES-FREE COMPONENT, WHICH IS NOT WHAT THE EMITTER PRODUCES - the emitter emits runes components - so the JUDGE'S ORIGINAL CLAIM WAS THE RELEVANT ARM and the PM's contradiction was measured on the wrong shape. The line below is preserved as written; read it as true only for runes-free."
        what_the_pm_measured_ON_A_RUNES_FREE_COMPONENT: "FALSE at 5.56.8. An unknown code produces an EMPTY warning array. On an element carrying real a11y warnings it silently FAILS TO SUPPRESS them - both warnings still fire - but no unknown_code diagnostic is emitted. Verified three ways: unknown code with nothing to suppress, unknown code on an element with real warnings, and the correct codes on that same element."
        the_conclusion_survives_and_is_sharper: "The Judge's argument was that svelte-ignore codes are an unasserted precondition over a growing set. That STANDS, and the failure mode is WORSE than reported: it is SILENT rather than announced. A consumer on a minor where one of those codes was renamed gets the a11y noise with no diagnostic pointing at the cause. The baseline form inventory is therefore MORE justified, not less."
        why_this_is_recorded_here: "The Judge's own dissent warned that this board withdrew a receipt once for citing evidence that was not there. The instruction to T008 is explicit: do NOT write 'unknown_code warns' into the policy."
      six_gates_worked_example_6:
        G1: "FAIL. The attribute arm is measured exhaustively (T003 triangulation, Q1/Q2 standing checks with a planted-member calibration, exact-empty warning set x4 modes). The on() arm's ENTIRE justification is Svelte's docs - documentary, with the framework in the lockfile and measurement now demonstrably possible. That is Gate 1's named FAIL clause verbatim. DEFERRED is NOT available: the absent-framework cause is discharged."
        G2: "PASS. Both arms self-scoped; the Gate 2 import-scoping paragraph names `on` from svelte/events and decides it PASS."
        G3: "PASS. Trigger is the declared SyncPolicyBranch.actions. syncPolicyGuard() reads handler bodies only to REFUSE a mismatch, never to decide - the same posture as worked example 10."
        G4: "UNKNOWN (= no) for the rule AS WRITTEN; PASS for the rule AS SHIPPED. The shipped emitter does not implement example 6's repair: syncPolicyGuard() (svelte/src/emitter/index.ts:382-411) THROWS on a declared stopPropagation. Totality is discharged by NAMED REFUSAL - the correction worked example 10 carries - with an independent gate row no-stop-propagation reading emitted output."
        G5: "FAIL. The repair narrows PER EVENT RECORD, so a mixed-mechanism component is the NORMAL case, not an edge - S3 carries four. Delegated-vs-attached is an event-ROUTING difference and mixed_event_handler_syntaxes does NOT fire for on(), so the compiler cannot see it."
        G6: "PASS (attribute arm) / FAIL (on() arm). assertS3 asserts exactly one Document request after the cancel click on the official SvelteKit scaffold at 5.56.8. No check can exist for a path the emitter refuses to emit."
        ruling: "FAIL at G1 and G5 -> DENIED, not deferred. The entry must be REWRITTEN, not amended - the policy forbids amending an old outcome."
      on_the_two_lazy_answers:
        domain_has_no_instance: "NOT USED. The shipped rule's totality rests on a throw that fires for any excluded input REGARDLESS of the corpus, plus a gate row that re-checks emitted output. Corpus emptiness is relevant to exactly one thing: it is why T002 forbade BUILDING the on() arm, which is what makes the repaired rule's second arm unverifiable rather than merely unbuilt."
        the_test_was_unfair: "NOT INVOKED. The lint ruling runs the OTHER way - an instrument is ruled MISSING, not a test unfair."
      ir_4: "Conclusion HOLDS, reason has DEGRADED. The emitter's surface is 5.0 baseline throughout and assertPlainAttributeName fences the whole colon-namespaced surface. But T003 added two svelte-ignore codes AFTER T002 ruled, so 'emits only baseline-safe forms' - the thing satisfying the corollary's second conjunct the other way - is now an UNASSERTED PRECONDITION over a GROWING set. That is instrument rule 2 at the emitter. Not a forcing case: it argues for a declared FLOOR, which is what T002's own dissent predicted. IR-4 stays deferred and is STRENGTHENED."
      what_else_gate_6_now_clears:
        the_corollary_engaged_and_refused: "First time it has been live. {@attach} (5.29), $props.id() (5.20), reassignable $derived (5.25) and <svelte:boundary> (5.3) all satisfy conjunct 1 at 5.56.8 and fail conjunct 2 ALONE. Before the lane this was moot. THE VERSION COROLLARY RESOLVED, AND IT RESOLVED TO NO."
        never_touched_by_a_lane: "bind:/$bindable (G2 FAIL by construction), snippets/IR-3, class:/IR-6."
        newly_denied: "The {value} attribute shorthand - compiles clean, but its only justification is source readability, which nothing checks. Gate 6 FAIL clause. Recorded as an OPEN QUESTION rather than a ruling, because the Judge ran only part of its gates."
      lint_arbiter: "REAL GAP, carry it. react, solid and qwik gates each import a third-party plugin at src/gate/index.ts:5; the Svelte gate imports only parse and frameless-owned policies. NOT a Gate 1 gap - compile() IS the framework's own toolchain at the pin - but a gap in ARBITER INDEPENDENCE and in the forced-lowering evidence base. The missing class is 'compiles clean and is WRONG', which is not hypothetical: it is defect 1, named by eslint-plugin-qwik's no-async-prevent-default. PM PRE-INSTALLED eslint-plugin-svelte@3.22.0 and queued it as T009."
      binding_on_vue_and_angular: "A lane discharges ONLY the Gate 1 absent-framework deferral and the Gate 6 no-lane deferral. It does NOT touch G2, G3, G4 or G5, and it does NOT satisfy the version corollary's second conjunct."
      dissent:
        - "The Judge holds that worked example 6's repair was WRONG WHEN RATIFIED, not merely unverified. If a reviewer thinks G5 FAIL is too strong, the honest fallback is NOT PASS - it is that the repaired rule was never coherent enough to gate."
        - "Uneasy that ruling the shipped emitter's refusal a G4 PASS is comfortable. The check applied: the throw fires for constructed inputs independent of the corpus, AND a second independent gate policy re-reads emitted output. If either were absent it would have recorded UNKNOWN."
        - "The svelte-ignore finding is LOW SEVERITY and deliberately not inflated - reported because the CLAIM it undermines is load-bearing for the IR-4 deferral, not because the symptom is serious. (PM note: the Judge's specific mechanism was wrong; see pm_correction_to_this_receipt.)"
        - "Not verified whether any Svelte 5 minor actually lacks either a11y code. If none does, the inventory gate guards a population of zero TODAY - which this board has called out as a way to acquire instruments. Ordered anyway because its population is FUTURE EMITTED FORMS, non-empty by construction: T003 already grew the set once."
  - id: T006
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Rule where the S3 value-attribute conflict is repaired: the Svelte emitter, or the three-way contract - and whether the contract's assertion is fair to Svelte at all."
    inputs:
      - "T004 receipt on this board - the root cause, both proven repairs, and the fairness question"
      - "notes/T004-svelte-demo.md"
      - "demos/react-official/three-way-contract.ts assertS3"
      - "svelte 5.56.8 src/internal/client/dom/elements/attributes.js remove_input_defaults"
      - "docs/DEFECTS.md finding 5 - the structural twin, Solid's attr:value"
    constraints:
      - "Do not implement. Rule, and spec the Worker package."
      - "THE FACT, verified by the PM: svelte 5.56.8's remove_input_defaults() deletes the value/checked ATTRIBUTES on hydration BY DESIGN, guarded by `if (!hydrating) return` and deferred to an idle callback for performance. SSR emits value=\"hello\" correctly; the client removes it and preserves the PROPERTY. This is why T003's direct-mount browser lane never saw it - this demo is the first instrument in the repo that HYDRATES Svelte."
      - "REPAIR A, emitter: emit defaultValue={text} alongside value={text}; set_attributes then skips the removal. PROVEN by T004 on the copied component - the entire lane passes with the contract UNMODIFIED, S3 reporting byte-identical observations to the other three. Cost: it needs a six-gate ruling of its own, including a version floor against the deferred IR-4, and it is the structural twin of Solid's attr:value (finding 5), which was settled as upstream-and-required."
      - "REPAIR B, contract: read the value PROPERTY rather than the attribute. Cost: it changes the strings react/solid/qwik assert, which T004's card lists as an explicit stop_if and which T999 tests mechanically for byte-equality."
      - "THE QUESTION THAT DECIDES IT, raised by T004 and not decided: instrument rule 1 says a finding that reproduces on a stock official scaffold with NONE OF OUR CODE is evidence the TEST is unfair rather than the framework wrong. This DOES reproduce on stock SvelteKit, the attribute is not user-visible, and all four frameworks display 'hello'. So repair B may be the correct WIDENING rather than a weakening - but that inverts a stop_if, which is why only a Judge may say so."
      - "If you rule B, say precisely what makes it a widening and not the weakening T999 is instructed to reject, and how T999 should tell them apart. The mechanical byte-equality test was written before this conflict was known; if it is now the wrong test, say so explicitly rather than leaving T999 to fail a correct repair."
      - "Consider a third option before settling: assert BOTH the attribute and the property per lane, declared per demo the way servedClientEntry and expectedNavigations already are. That preserves every existing assertion byte-for-byte while letting Svelte declare what it actually serves."
    expected_output:
      - "Ruling: A, B, or a third option, with the cost stated"
      - "If B or the third option: what distinguishes it from a weakening, and the corrected instruction for T999"
      - "Whether Solid's attr:value precedent (finding 5) binds here"
      - "Exact Worker objective, allowed_files, verify, stop_if"
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      rationale: "Ruled OPTION D, not A, B or C. Read the value attribute out of the SERVED PAYLOAD rather than the post-activation live DOM. A is forbidden by this board's OWN T002 ruling 3 and reintroduces the bug Svelte's code exists to fix. B is not merely costly, it is IMPOSSIBLE through the sanctioned API. C puts a per-lane exemption inside the cross-lane equality set. D is uniform, exact, and strictly stronger."
      ruling: "OPTION D. Move measureAttribute from page.content() to served.text and delete the live-DOM value assertion. Uniform across all four lanes, no per-lane declaration, observed strings byte-identical."
      two_corrections_to_the_pm_brief:
        repair_b_is_not_proven_it_is_impossible: "The brief said 'two proven repairs'. Only A was ever probed. PageHandle (@async/witness 0.7.0 index.d.mts:163-189) exposes route, url, reload, content, networkRequests, emulateNetwork, click, trackEvents - NO evaluate. evaluate exists only on the internal WitnessBrowserPage (:104-108), never handed to a box. PageExpectApi (:523-540) has no property accessor, and page.content() is documented as serialized HTML, so properties are invisible to it BY CONSTRUCTION. No box can read a DOM property."
        the_instrument_fault_is_real_but_t004_named_the_wrong_reason: "T004 argued 'not user-visible, reproduces on a stock scaffold, therefore unfair'. That is WEAK standing alone: 'not user-visible' would excuse many real defects, and 'reproduces on a stock scaffold' is satisfied by any framework behaviour including genuinely bad ones. Instrument rule 1 is a rule about EVIDENCE, not a licence. The argument that carries is narrower and independently checkable: three-way-contract.ts:454 reports `server-rendered text` while :452 reads `await page.content()` - the POST-ACTIVATION DOM. The name and the site disagree, provable from the contract source alone WITHOUT any reference to Svelte, and true before Svelte existed."
      why_A_rejected_three_independent_grounds:
        1_violates_this_boards_own_ruling: "T002 ruling 3 deferred IR-4 and bound the emitter to emit ONLY baseline-version-safe forms. defaultValue attribute support is a Svelte 5.x feature, NOT 5.0 baseline - and the exact floor is UNVERIFIED, which is itself the point: A would ship a version-gated form with no way to know the consumer's version."
        2_it_reintroduces_the_bug_svelte_fixed: "RegularElement.js:615-640 routes defaultValue to the safe set_default_value helper ONLY beside a STATIC TEXT value attribute. S3's value={text} is an EXPRESSION, so defaultValue={text} falls through to a bare property assignment. Svelte's own comment at :624 says why that is wrong: updating the default value while the input is pristine also updates the current value. A would make every emitted Svelte form reset to CURRENT state rather than the original default - in exactly the area remove_input_defaults exists to get right."
        3_it_is_invisible_to_the_server: "server/visitors/shared/element.js:78-79 omits defaultValue/defaultChecked from SSR output entirely. A changes nothing the server sends; it is a purely client-side attribute-restoration hack performed for the benefit of one test read."
      why_C_is_a_dodge: "servedClientEntry and expectedNavigations are per-lane PRECONDITIONS - they sit OUTSIDE the observed array that scripts/e2e.mjs compares across lanes. A per-lane declared value expectation would sit INSIDE the equality claim. Categorically different, and precisely the mechanism by which any future lane declares its way out of a real failure. The boundary to police is not 'is it declared per lane' but 'is it inside the cross-lane equality set'."
      what_makes_D_a_widening:
        - "STRICTLY STRONGER: under the current read, a lane that client-side-rendered the input from scratch would still show value='hello' in the live DOM and PASS. Under D the string must be in the server's actual bytes. This repo's thesis is inert-markup-plus-activation, and the served payload is the thesis's own measurement site - assertServedActivation already fetches it."
        - "UNIFORM: same site, same predicate, same exact string for all four lanes. No exemptions."
        - "The observed string stays byte-identical: 'server-rendered text = hello with writes = 0'."
        - "What is lost maps to NO product claim. The attribute survives SSR parse independently of framework state in every lane, so it never witnessed client state in ANY lane."
      pre_existing_heterogeneity_found: "The value attribute has been measuring THREE DIFFERENT THINGS across the incumbents - frozen SSR markup for React, a signal-tracking attribute for Solid (DEFECTS.md finding 5 measured exactly that), and deliberate removal for Svelte. Nobody noticed because all three agree at 'hello' and the read happens before any interaction. This predates the Svelte lane entirely."
      does_finding_5_bind:
        answer: "It binds AGAINST repair A, not toward it. A is NOT its structural twin; it differs in kind on three axes."
        public_meaning: "Solid's attr: is a general documented namespace whose entire meaning is 'write the content attribute'. Svelte's defaultValue is a named form-semantics feature meaning 'the form-reset value'. A would use a semantic feature for its side effect on an unrelated internal code path."
        idiom_vs_invention: "Finding 5's DECISIVE evidence was that the handwritten Solid references use attr:value too - the emitter was reproducing a house idiom, not inventing one. No handwritten Svelte reference emits defaultValue={text}, and no Svelte author writes it. A would have the emitter INVENT an idiom, the exact thing finding 5 certified it was not doing."
        the_holding_is_inverted: "Finding 5's holding was 'the emitter is right, do not change emitted output'. A is the opposite move. Citing finding 5 for A inverts it."
      t999_correction_required: "T002's byte-equality instruction is a PROXY masquerading as a measurement - the recurring shape this board keeps catching - and it would FAIL A CORRECT REPAIR, which is its own instrument fault. Replaced with a three-part widening test (uniform / non-decreasing in strength with a two-sided control and a written statement of what is lost / still inside the equality set and still exact), plus the precondition-versus-observed boundary and two new rejection grounds. Applied to the board."
      carried_forward_loss: "After D, NOTHING in S3 observes the `text` state in the LIVE DOM in any lane. Emitted S3 surfaces text only through value={text}, and no sanctioned witness API can read an input's live value. S3's live coverage of text narrows to the submit handler's onTrace payload. REVEALED by the ruling, not caused by it. Re-open trigger recorded on T999."
      latent_twin_recorded: "Svelte's remove_input_defaults strips `checked` identically. S3's checkbox carries checked={checked} and is not asserted today, so there is no impact - noted so it is not rediscovered as a new finding."
      missing_evidence:
        - "The exact Svelte minor that introduced defaultValue attribute support is UNVERIFIED - the installed package ships no CHANGELOG and the Judge did not go to the network. Load-bearing for ground 1 against A, but grounds 2 and 3 are independent, so the rejection stands regardless."
        - "T004's 'the served Svelte payload contains value=hello' rests on its curl plus the Judge's reading of the server visitor. T007's negative control converts this into a standing check."
      dissent:
        - "The Judge believes the STRONGEST repair is one it did NOT order, because it needs out-of-scope emitter work: give S3 a text-rendered projection of `text` so expect.page.text can observe it live in all four lanes. That would CLOSE the gap D leaves rather than merely recording it. It is a corpus change touching the compiler goldens and all four emitters, so ordering it here would be the opposite of a bounded slice. Flagged for a future package, not smuggled into this one."
        - "The Judge is UNEASY that this board has now ruled 'instrument' five times out of seven, and guarded against it by REFUSING T004's offered reasoning and grounding the ruling on a name/site mismatch provable from the contract source alone. If a reviewer thinks that distinction is too fine, the honest fallback is NOT repair A - it is accepting that S3's text channel cannot be observed live under the current witness API, and saying so."
        - "Repair A WORKS, and the temptation to take a proven green over a ruled-correct red is real. A is rejected precisely because a green obtained by shipping a form-reset bug into every consumer's Svelte output is the instrument fault pattern MOVED INTO THE PRODUCT."
        - "Not verified: whether SvelteKit's SSR of an input with an EXPRESSION value emits the attribute under every render path (streamed, error boundary, deferred). If the Svelte row ever flakes on this observation, look here before touching the contract again."
  - id: T007
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: high
    spec: "T006 receipt - AUTHORITATIVE. Option D."
    objective: >-
