version: 2

goal:
  title: "Frameless Svelte adapter v1"
  slug: "frameless-svelte-v1"
  kind: specific
  tranche: "Land a Svelte 5 lane end to end - official scaffold, emitter, gate, goldens, demo, e2e row asserting S1/S2/S3 equality - then rule on IR-4, the target-framework-version input the whole policy's version corollary depends on."
  status: active
  oracle:
    signal: "pnpm e2e includes a Svelte row driving an official Svelte scaffold at the pinned lockfile version, and its S1/S2/S3 observations are ASSERTED equal to demos/react-official, demos/solid-official and demos/qwik under the same matrix."
    cadence: "after each Worker package and at final audit"
    final_proof: "A green pnpm e2e receipt naming the Svelte row, plus an explicit IR-4 ruling: either the target-version input is implemented and at least one version-gated sugar question resolves through it, or IR-4 is deferred with the reason recorded AND the consequence for the Vue and Angular boards stated."
  intake:
    original_request: "Owner asked, during frameless-idiom-policy-v1: 'I'm also wondering if we should start the goals for Vue, Angular, and Svelte.' This board is the Svelte answer, prepped after the idiom policy was ratified."
    interpreted_outcome: "Svelte 5 becomes a frameless target with proven activation neutrality on official tooling, and the version-pinning problem it surfaces gets a decision rather than a workaround."
    input_shape: specific
    audience: "frameless maintainers and future adapter authors"
    authority: requested
    proof_type: test
    completion_proof: "Svelte row green in pnpm e2e with asserted S1/S2/S3 equality, plus an explicit IR-4 ruling."
    likely_misfire: "Implementing bind: because it looks like the idiomatic Svelte spelling, without noticing it is different-in-kind on two axes - and a wrong bind: surfaces as a DEV-ONLY console warning, so it can pass tests and be wrong in production."
    blind_spots_considered:
      - "Svelte is where the version pin stops being a detail. onclick (Svelte 5) vs on:click (Svelte 4) is the SAME lexical substitution flipping category across a major; reassignable $derived needs 5.25+; and Svelte 5 REMOVED event modifiers, which interacts directly with IR-5. The policy found that same-in-kind is a property of a sugar PLUS a pinned version, and this is where that bites hardest."
      - "IR-4 (no target-framework-version input) is arguably this board's most consequential decision, and the other two adapter boards inherit whatever it decides. The policy's version corollary explicitly names adding that input as an adapter-board concern - this is that board."
      - "A wrong bind: call fails as a dev-only ownership_invalid_mutation console warning, not a build error. Absence of a red test is not evidence of correctness here."
    existing_plan_facts:
      - "docs/emitter-idiom-policy.md governs every emission-site form choice. Run the six gates; record outcomes."
      - "Official scaffold only (npx sv create or current official equivalent), as it ships. No hand-rolled harness - see docs/goals/frameless-qwik-v1/."
      - "IR gaps biting Svelte: IR-1 no bindable prop kind (blocks $bindable/bind:), IR-3 default slot only (blocks snippets), IR-4 no framework-version input (blocks reassignable $derived 5.25+ and the onclick/on:click split itself), IR-5 modifier vocabulary is exactly preventDefault|stopPropagation while Svelte 5 REMOVED modifiers, IR-6 no class/style binding vocabulary (blocks class: directives), IR-7 purity never asserted while $derived expects a pure expression."
      - "ALREADY SURVEYED: bind: is DIFFERENT-IN-KIND from the Qwik $ case on two independent axes - it requires an LVALUE (the IR's path-based and handler-local-alias writes are not lvalues), and bindability is declared by the CHILD while frameless emits one module at a time from one EnrichedIR. Do not treat it as a formatting choice."
      - "GATE 6 DEFERRED: every Svelte sugar ruling is deferred-not-denied until this board lands a lane at a pinned lockfile version."
      - "If this board closes IR-4 it must do so as a GENERAL facility, not a Svelte-shaped hack - Vue needs it for defineModel (3.4+) and Angular for signal input()/output() (>=17.1/17.2)."
      - "poc/09-storage/svelte exists from earlier work and took cheap lexical sugar with classic lifecycle shapes. Prior in-repo assumption, not validated decision."
      - "STANDING GAP inherited: pnpm check does not typecheck generated/. Svelte's own svelte-check may cover part of this - confirm rather than assume."
      - "STANDING GAP inherited: pnpm e2e pins dev mode only; pnpm test:browser hangs at the repo root (pre-existing, per-package scripts work)."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
