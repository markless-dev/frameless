# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless app axes: recursion, drag, six-lane fan-out, forms - and Hacker News"
  slug: "frameless-app-axes-v1"
  kind: existing_plan
  status: active
  tranche: >-
    Measure FOUR UNTESTED AXES by building the cleanest probe of each - recursion (HN item
    page), drag and drop (task management), six-lane fan-out (habit tracker), form input types
    (contacts) - plus the HN front page the owner asked to carry over. Fix the front door first.
    STOP AT EACH REFUSAL AND RECORD IT VERBATIM.
  supersedes: >-
    The OPEN app cards on frameless-real-apps-v1 - HN front page, HN item page, pnpm demo, and
    React emitter greppability - so HN is not split across two boards. That board's COMPLETED
    receipts (T001, T006, T007) stay as record and are not reopened.
  oracle:
    signal: >-
      THREE PARTS, ALL REQUIRED. (1) EVERY AXIS GETS A VERDICT: recursion, drag-and-drop,
      six-lane fan-out and form input types each measured in ALL SIX LANES with a witnessed
      per-lane result - emits / refuses-with-verbatim-message / emits-but-misbehaves. A PROBE
      VERDICT IS NOT A LANE VERDICT (re-run each lane's own gate) and FIVE STATIC GATES ARE NOT
      A LANE VERDICT EITHER (run it in a browser) - both rules were bought with defects.
      (2) EVERY APP THAT SHIPS IS AUTHORED ONCE, EMITTED SIX WAYS, LOOKS LIKE ITS REFERENCE, AND
      IS FINDABLE: one .tsrx source, NO hand-written per-lane app code proved BY DERIVATION, a
      documented and ACTUALLY-RUN command per lane, a visual match to a NAMED reference recorded
      BEFORE the build, and AN ENTRY IN pnpm demo. A lane that cannot be generated is left
      UNBUILT with its verbatim refusal. (3) NOTHING REGRESSES: pnpm test at EXACTLY ONE failure
      (the foreign package-inventory ARM B); pnpm check DOES NOT RISE above 267; pnpm e2e stays
      6 x 9; lint and check:citations clean.
    cadence: "after the tooling card, after each app, and at final audit"
    final_proof: >-
      The FOUR AXIS VERDICTS stated per lane; then, for each shipped app, the launch command that
      was RUN, its pnpm demo entry, and a visual comparison against its NAMED reference. For every
      lane NOT shipped, the VERBATIM refusal. "Six lanes" means SIX ATTEMPTED, not six shipped: a
      missing lane WITH a verbatim refusal is a satisfied oracle, one WITHOUT is a rejection. AN
      AXIS QUIETLY SUBSTITUTED FOR AN EASIER INTERACTION IS A REJECTION EVEN IF THE APP LOOKS RIGHT.
  intake:
    original_request: >-
      The owner listed the Square UI demos and asked what else was worth building, then chose:
      "I want #2 but with hacker news too" - #2 being a new board for task management (drag),
      habit tracker (six-lane fan-out) and contacts (forms).
    interpreted_outcome: >-
      Four capability axes measured across six lanes, each probed by the app that tests it most
      cleanly, with Hacker News carried over from the superseded board.
    input_shape: existing_plan
    proof_type: demo
    completion_proof: >-
      Four axis verdicts per lane, every shipped app browsable AND listed in pnpm demo with a
      run launch command and a named-reference visual match, every refusal verbatim, baselines
      unmoved.
    likely_misfire: >-
      SHIPPING FOUR APPS AND MEASURING THREE AXES. The apps are the INSTRUMENT, not the product.
      If the habit tracker takes its date from Date and loses angular, the six-lane claim
      evaporates. If drag refuses and is quietly replaced by click-to-move, the axis goes
      unmeasured while the demo looks complete.

active_task: T001

rules:
  - "state.yaml is board truth; goal.md is the charter."
  - "Exactly one active task unless disjoint write scopes are proven."
  - "Scout and Judge are READ-ONLY. Workers write only inside allowed_files and run their verify commands."
  - "Every completed, blocked or escalated task gets a receipt."
  - "The goal completes only through a final Judge audit recording full_outcome_complete: true."
  - "MEASURE, NEVER INHERIT. Every card on the predecessor board corrected its dispatch, including both audits."

agents:
  scout: installed
  judge: installed
  worker: installed

visual_board:
  enabled: false

tasks:
  - id: T001
    type: worker
    assignee: Worker
    status: active
    reasoning_hint: medium
    objective: >-
      Restore greppability to the React emitter, and list every shipped app in `pnpm demo`.
      TOOLING FIRST, because every later card on this board reads that emitter and every later
      card ships an app that must become findable.
    WHY_THIS_IS_FIRST: >-
      packages/frameworks/react/src/emitter/index.ts CONTAINS ONE NUL BYTE, so grep exits 1 with
      NO OUTPUT AT ALL - a sweep reports "no matches" when it means "NOT SEARCHED". Traced:
      db6e275 = 0 NULs and `grep -c import` = 44; 61a6779 = 1 NUL and grep returns nothing. It
      is in T003's suspension-segment map key. Until it is gone every card must use Python for
      that file, and one already read a false zero because of it.
    AND_THE_FRONT_DOOR_IS_THREE_YEARS_STALE: >-
      MEASURED: scripts/demo.mjs lists THREE OF SIX LANES (react, solid, qwik) and THREE OF
      TWELVE SCENARIOS (S1-S3). S10 TodoMVC, S11 TodoMVC Advanced and S12 Codex clone are
      INVISIBLE, as are svelte, vue and angular entirely. The only record of how to launch S11
      and S12 is a table buried in a note. EVERY APP THIS BOARD SHIPS MUST APPEND HERE.
      Qwik routes keep their TRAILING SLASH - /codex answers 301 -> /codex/ and a browser
      follows it silently, which is why driving a lane never surfaces a missing slash.
    allowed_files:
      - "packages/frameworks/react/src/emitter/**"
      - "packages/frameworks/react/test/**"
      - "scripts/demo.mjs"
      - "docs/emitter-idiom-policy.md"
      - "docs/goals/frameless-app-axes-v1/notes/T001-tooling.md"
    verify:
      - "grep -c import on the React emitter RETURNS A NUMBER, not exit 1 with no output. Show the before and after."
      - "The emitted React output is BYTE-IDENTICAL after the NUL removal - regenerate all lanes and shasum. THE FIX MUST NOT CHANGE A SINGLE EMITTED BYTE."
      - "pnpm demo lists ALL SIX LANES and EVERY scenario that exists, S1-S12, with qwik's trailing slashes correct"
      - "LAUNCH AT LEAST ONE LANE FROM THE pnpm demo OUTPUT and confirm the URL it printed actually answers 200"
      - "pnpm test at exactly 1 / pnpm check not above 267 / pnpm e2e 6 x 9 / lint / check:citations"
      - "git diff --exit-code over packages/frameworks/*/generated, PAIRED WITH git status --short"
      - "fingerprint the owner's three paths at START and FINISH - SORT THE WHOLE shasum OUTPUT LINES"
    stop_if:
      - "Need files outside allowed_files."
      - "Removing the NUL changes ANY emitted byte. That is a different card; report it."
      - "You are about to renumber or soften docs/emitter-idiom-policy.md's census instead of re-deriving it."
      - "pnpm check rises above 267, pnpm test exceeds exactly 1 failure, or pnpm e2e leaves 6 x 9."
      - "NEVER pkill -f on a broad pattern. Port 5175 is held by FOREIGN node PID 64413."
      - "Verification fails twice for the same reason."
    receipt: null

