      THE_BRIEF_INHERITED_A_CLAIM_THAT_IS_TOO_STRONG: "T002's 'IR-8 has no lowering for TSArrayType, so NO PROP SHAPE CAN CARRY A LIST' is FALSE AS STATED: Array<string> LOWERS IN FIVE LANES where string[] refuses. typeNode() accepts TSTypeReference with type arguments and simply has no TSArrayType case. THE LIMIT IS THE SPELLING, NOT ARRAYS."
