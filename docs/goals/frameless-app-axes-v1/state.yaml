      ONLY by UPDATE_GOLDENS=1 with NO npm script of its own, and NO .tsrx FIXTURE AUTHORS IT.
      A SHIPPED CAPABILITY AT 2/6 LANES WITH NO APP EXERCISING IT IS THE SAME SHAPE AS THE
