  - id: T012
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: >-
      DESIGN RULING: how should persistence be AUTHORED? T007 proved there is no authoring
      surface at all, so no fixture edit on any board can make an app survive a refresh.
    WHAT_T007_MEASURED: >-
      @markless/core declares state<T>(initial: T) WITH ONE PARAMETER, and pinned Markless
      0.1.1's SemanticGraphBinding HAS NO `storage` FIELD. All 23 buildable corpus fixtures
      produce ZERO persistence records. packages/compiler/src/persistence.ts is a REAL and
      TESTED design - baked keys, a __FRAMELESS_STATE__ pre-paint seed, a vendor storage-fact
      boundary - WITH NOTHING ABLE TO FEED IT. react and solid EMIT from a synthesised record;
      qwik/svelte/vue/angular REFUSE verbatim, and those four are the BEST-GUARDED part of the
      axis (explicit throw + gate policy + shipped mutation test).
    THREE_CONSTRAINTS_ANY_DESIGN_MUST_ANSWER: >-
      (1) THE CONTRACT IS SCALAR-STRING-ONLY AND THE EMITTERS DO NOT ENFORCE IT - only the inert
      vendor boundary does, so an array or numeric binding LOWERS CLEANLY AND CORRUPTS. A todo
      list is an ARRAY, which is why S11 could not have been persisted even with a surface.
      (2) REFUTED BY T012 - THE READ HALF IS GENERATED, NOT HOST-OWNED: packages/cli/src/persistence.ts emits it in closed form with a contentSha256 and a cspHash. Only a ONE-LINE <script> include per shell is host-owned, and it is absent from all six (0 of 6 install
      __FRAMELESS_STATE__), so persistence shipped without the shell half WRITES AND NEVER READS.
      (3) REFUTED BY T012 - THE PIN DOES NOT BIND: Markless 0.1.1 silently accepts and ignores a second state() argument with the binding unchanged. The question is still worth answering, but it was never a blocker. Decide whether the channel goes in Markless
      (correct, slower, and the owner is upstream) or in the frameless compiler (faster, and a
      second place for semantics to live).
    constraints:
      - "READ-ONLY. Your only write is your note. Do NOT edit the authoring surface."
      - "THE OWNER FOUND THIS BUG by refreshing /todomvc-advanced. Say plainly what they would have to accept for it to be fixed, and what it costs."
      - "A DESIGN THAT ONLY WORKS FOR SCALARS IS A LEGITIMATE ANSWER - say so and name what it excludes, rather than designing an array channel nobody asked for."
      - "Assume this brief contains at least one error and find it."
    expected_output:
      - "the recommended authoring shape, with the deciding constraint named"
      - "Markless or frameless-compiler, and why"
      - "what it excludes, stated plainly"
      - "the worker spec if it should proceed"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      summary: "RULING: author persistence as a SECOND ARGUMENT on the state() call - state('all', { storage: 'markless:filter' }) - implemented in the FRAMELESS COMPILER, not Markless. THE DECIDING CONSTRAINT IS SCALAR-STRING-ONLY, NOT THE PIN. Excludes arrays, objects, numbers, booleans, non-literal initializers, cross-tab, SSR, and four of six lanes. THE OWNER'S BUG IS NOT FIXED BY THIS: todos is an array."
      THE_STRAIGHT_ANSWER_TO_THE_OWNER: "THIS DESIGN DOES NOT FIX THE BUG YOU FOUND. /todomvc-advanced forgets the COMPLETED state, which is `todos = state([...])` - AN ARRAY OF OBJECTS. A scalar-string channel would persist filter, draft, query, editing, remoteStatus and syncNote; it would NOT persist todos, next (number) or serverFails (boolean). TO FIX THE LITERAL BUG YOU MUST ACCEPT AN ARRAY CHANNEL: authoredInitial stops being a string, __framelessWrite grows JSON.stringify, the seed and pre-paint script grow JSON.parse with a corruption fallback, and the data-markless-* anti-flash attribute - WHICH WOULD STRINGIFY THE WHOLE TODO LIST ONTO <html> BEFORE PAINT - needs a different mechanism. AND EVEN THEN ONLY REACT AND SOLID CAN CONSUME IT. That is a separate, explicitly-costed decision the owner must take."
      THREE_ERRORS_IN_THE_PMs_BRIEF_ALL_MEASURED: "(1) 'THE READ HALF IS HOST-OWNED' IS FALSE. packages/cli/src/persistence.ts ALREADY GENERATES the pre-paint script in closed form via generatePrePaintPersistenceScript(), with a contentSha256 AND a cspHash, written by node-runtime.ts. The file in demos/persistence is THAT GENERATOR'S OUTPUT, not hand-written. What is host-owned is ONE <script src> TAG PER SHELL - a one-line change in six files, not a feature. (2) 'THE PIN BINDS' IS FALSE. Measured through the real buildEnrichedIr against pinned Markless 0.1.1: state('light', { storage: 'markless:theme' }) BUILDS CLEANLY and the binding is IDENTICAL to baseline - valueKind 'scalar', initialValue 'light', NO DIAGNOSTIC. Markless SILENTLY IGNORES a second argument. (3) 'ONLY THE INERT VENDOR BOUNDARY ENFORCES STRING-ONLY' IS A NAMING ARTIFACT. MarklessStorageSourceFact and its validator live in packages/compiler/src/persistence.ts - FRAMELESS-OWNED CODE. Markless ships nothing there."
      THE_WRAPPER_SHAPE_IS_DISQUALIFIED_BY_MEASUREMENT: "state(persist('light', ...)) yields valueKind 'unknown' with initialValue GONE - IT DESTROYS THE FACT THE CONTRACT NEEDS. The on-the-call second argument survives intact. That is why the shape is decided by measurement rather than taste."
      WHY_THE_DECIDING_CONSTRAINT_IS_SCALAR_NOT_THE_PIN: "authoredInitial is a string and __framelessWrite calls localStorage.setItem(key, value) WITH NO ENCODER, so the channel must be REFUSABLE PER BINDING AT MINT TIME - which the on-the-call form supports (the binding is right there with its valueKind) and a module-level manifest form does not. buildPersistenceRecords ALREADY cross-checks each fact against the enriched binding: THE SCALAR GUARD IS AN UNWRITTEN `if` AT A CHOKE POINT THAT ALREADY EXISTS."
      COST_OF_CHOOSING_FRAMELESS_STATED_PLAINLY: "The second argument is invisible to state<T>(initial: T)'s types - SEMANTICS IN TWO PLACES until Markless 0.1.2. Mitigated by keeping the shape BYTE-IDENTICAL to what Markless would adopt, SO MIGRATION IS A DELETION IN FRAMELESS, not a rewrite of any app. And .tsrx is in no tsconfig include, so pnpm check never sees it - the 267 baseline is unaffected."
      ONE_DEFECT_BLOCKS_AND_ONE_DOES_NOT: "SOLID'S DROPPED WRITE-THROUGH BLOCKS. Confirmed BY MECHANISM: appendPersistenceWrites only rewrites an ExpressionStatement whose expression is a CallExpression with an Identifier callee - the signal setter - and a handler-only binding lowers to a plain `let` assigning via AssignmentExpression, WHICH NEVER MATCHES. Open the channel and solid is 1 of only 2 consuming lanes, SEEDING FROM STORAGE AND NEVER WRITING BACK, WITH NO REFUSAL. THE INITIALIZER SWAP DOES NOT BLOCK: for a genuine string binding authoredInitial EQUALS initialValue, and the real extractor throws on a non-string, so it is UNREACHABLE today - it is THE ARRAY CHANNEL'S TRIPWIRE, not pre-work."
      A_TRAP_THE_WORKER_MUST_NOT_WALK_INTO: "A PERSISTED FIXTURE CANNOT ENTER THE s(\\\\d+) CORPUS. Four lanes throw on persistence-bearing IR so their regenerate.ts would break, and the /^s(\\\\d+)-[\\\\w-]+\\\\.json$/ inventory is asserted exactly and moves the vue gate's derived census. generated-persistence/ ALREADY EXISTS as the two-lane escape hatch."
      rationale: "Three brief errors, all measured rather than argued. The channel goes in frameless NOW, in the shape Markless would later adopt, making migration a deletion. Scalar-only is the honest scope and it excludes the owner's array. Solid's write-through hole blocks because solid is one of only two consuming lanes. T007's own correction is upheld and confirmed by mechanism: the four refusing lanes each carry an explicit emitter throw, a persistence-render-lowering gate policy AND a shipped mutation test - BEST-guarded, not unguarded."
      evidence:
        - "MEASURED via real buildEnrichedIr, pinned Markless 0.1.1: state('light', { storage: ... }) BUILDS; binding IDENTICAL to baseline. state('light','markless:theme') identical too. NO DIAGNOSTIC"
        - "MEASURED same probe: state(persist(...)) yields valueKind 'unknown', initialValue ABSENT - wrapper shape disqualified"
        - "packages/cli/src/persistence.ts generatePrePaintPersistenceScript() emits the closed-form seed with contentSha256 and cspHash; node-runtime.ts writes it. THE READ HALF IS GENERATED"
        - "packages/compiler/src/build.ts helperCallArgument() already locates the state(...) CallExpression and returns arguments[0]; parseModule proves frameless already reparses author source"
        - "packages/compiler/src/persistence.ts adaptPersistenceFacts and validateSourceFact are FRAMELESS-OWNED; buildPersistenceRecords already correlates each fact to the enriched binding, which carries valueKind"
        - "Markless 0.1.1 d.ts: SemanticGraphBinding has NO storage field but DOES carry valueKind and initialValue - confirming T007 and supplying the scalar guard"
        - "solid/src/emitter/index.ts appendPersistenceWrites only rewrites a CallExpression-with-Identifier-callee statement; a handler-only plain-let binding never matches. T007's defect confirmed BY MECHANISM"
        - "react and solid persistenceSeed return t.stringLiteral(record.authoredInitial) whenever lowering is not pre-paint - unreachable through the real extractor"
        - "Root tsconfig.json includes only packages/*/src/**/*.ts - .tsrx is TYPE-CHECKED BY NOTHING in pnpm check"
        - "s11-todomvc-advanced.tsrx: todos = state([...]) ARRAY; next = state(4) NUMBER; serverFails = state(false) BOOLEAN; filter = state('all') STRING"
        - "__FRAMELESS_STATE__ appears ONLY under demos/persistence - 0 of 6 official shells. packages/cli depends only on @frameless/react and @frameless/solid, so the CLI is a TWO-LANE pipeline BY CONSTRUCTION"
        - "Gate policy persistence-render-lowering present in qwik, angular, vue and svelte gates - T007's correction upheld"
      missing_evidence:
        - "UNMEASURED: whether @markless/typescript-plugin red-squiggles state(initial, options) in the OWNER'S EDITOR. pnpm check is proven unaffected; THE EDITOR EXPERIENCE IS NOT."
        - "UNCHECKED: whether react has an equivalent handler-only write-through hole on SHARED/store cells, as opposed to the component-local path T007 measured."
        - "UNMEASURED: SSR interaction. The seed reads globalThis.__FRAMELESS_STATE__ and localStorage, both client-only."
      remaining_blockers:
        - "THE OWNER'S LITERAL BUG IS NOT FIXED BY THIS DESIGN - see the straight answer above. An array channel is a SEPARATE, EXPLICITLY-COSTED decision the owner must take."
        - "EVEN WITH THE ARRAY CHANNEL, /todomvc-advanced ONLY SURVIVES IN REACT AND SOLID."
        - "THE SHELL WIRING IS A SECOND SLICE: one <script src> tag in two index.html files plus routing those demos through the pre-paint emitter. Small and mechanical, but OUT OF SCOPE for the channel card."
        - "SOLID'S DROPPED WRITE-THROUGH must be closed or refused INSIDE the channel card, and still needs a docs/DEFECTS.md entry."
        - "THE JUDGE'S HARNESS FORBIDS REPORT .md FILES - its receipt IS the ruling, as T009's was."
      verification_attempts: 1
      stopped_because: null
