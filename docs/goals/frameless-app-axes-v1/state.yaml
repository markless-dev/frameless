      and S12 is a table buried in a note. EVERY APP THIS BOARD SHIPS MUST APPEND HERE.
      Qwik routes keep their TRAILING SLASH - /codex answers 301 -> /codex/ and a browser
      follows it silently, which is why driving a lane never surfaces a missing slash.
