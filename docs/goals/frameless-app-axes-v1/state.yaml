      harness: claude-code
      verification_attempts: 1
      note: notes/T001-tooling.md
      summary: "Removed the single NUL from the React emitter by spelling the segment separator as the \\\\u0000 ESCAPE - AN IDENTICAL RUNTIME STRING - restoring `grep -c import` to 44, matching db6e275. Rewrote scripts/demo.mjs from 3 lanes/3 scenarios to 6 lanes/12 scenarios with qwik trailing slashes and angular's two refusals stated, plus a port preflight that NEVER KILLS. Launched all six lanes: 70/70 routes 200, ALL BODIES DISTINCT. Baselines unmoved."
      THE_FIX_CANNOT_MOVE_AN_EMITTED_BYTE_BY_CONSTRUCTION: "The separator is now `${segmentOf.get(statement) ?? 0}\\\\u0000${variable}` - the ESCAPE, not the raw byte - so it is THE SAME RUNTIME STRING. Proved with a PRE-FIX delete/regenerate CONTROL first (present-after-delete = 0, then 102/102 byte-identical), so the post-fix 102/102 compared REBUILT FILES rather than two empty sets - the exact vacuous-proof trap a prior card fell into."
      PNPM_DEMO_WAS_NOT_MERELY_STALE_IT_WAS_LYING: "MEASURED BASELINE: `pnpm demo` EXITED 1 and served nothing, because qwik was hardcoded to foreign-held port 5175 - AND IT PRINTED ITS FULL SUCCESS BANNER FIRST, because waitForAll ACCEPTED THE FOREIGN SERVER'S 200 AS QWIK BEING READY. IT WAS ADVERTISING A URL SERVING A STRANGER'S APP. The rewrite adds a port preflight that confirms each port EMPTY BEFORE SPAWN - which is what makes a later 200 attributable to us - skips occupied ports reporting the holder, and never kills."
      THE_MOST_CONSEQUENTIAL_CATCH_A_VERIFICATION_THAT_COULD_PASS_WHILE_MEASURING_NOTHING: "A NEGATIVE CONTROL SHOWED REACT, SOLID AND VUE RETURN 200 FOR ANY PATH (they fall through to S1), so the card's stated check - 'the URL answers 200' - IS SATISFIABLE BY A NONEXISTENT ROUTE. Replaced with per-route BODY HASHING: 12/12 distinct bodies per lane, 10/10 for angular. svelte, qwik and angular 404 correctly."
