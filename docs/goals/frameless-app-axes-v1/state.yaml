    status: queued
    reasoning_hint: high
    objective: >-
      THE FIFTH AXIS: PERSISTENCE. Make TodoMVC Advanced (S11) survive a refresh, in every lane
      that can, and record the verbatim refusal in every lane that cannot.
    WHY_THIS_CARD_EXISTS_THE_OWNER_FOUND_IT: >-
      The owner opened /todomvc-advanced and asked why the completed state was lost on refresh.
      MEASURED: s11-todomvc-advanced.tsrx has ZERO localStorage, ZERO __FRAMELESS_STATE__ and
      ZERO persistence hits. "Synced" simulates a server round-trip that never writes anything.
      Persistence was NOT among the axes S11 was built against (fetch, optimistic updates, local
      filter + remote query, IN-MEMORY state), so S11 met its spec - BUT A TODO APP THAT FORGETS
      ON REFRESH READS AS BROKEN, AND THE OWNER IS RIGHT TO FLAG IT.
    THE_CAPABILITY_EXISTS_AND_NOTHING_USES_IT: >-
