version: 2

goal:
  slug: markless-storage
  title: "storage() in the markless compiler, consumed by frameless"
  status: active
  charter: goal.md
  kind: specific
  tranche: "Implement storage(key, fallback) as a compiler-known declaration in markless (dedicated branch; suite green), wire the unified seed channel (payload for native, early script for browser targets), then consume it in frameless (React first) with executed end-to-end proof on both sides; critique at API/cross-repo boundaries; owner checkpoints on key-identity and consent-API details."
  oracle:
    signal: "One authored source using storage('theme','light') proven executed on BOTH sides: markless-native (seed in graph before runtime start, reactive round-trip, consent deferral; repo suite green) AND frameless-compiled React (seed script in SSR output, no-flash at first paint, zero double reads, round-trip via storage-poc contract assertions)."
    cadence: "at each worker receipt and both boundary reviews"
    final_proof: "Final audit maps executed both-sides evidence to the original ask; full_outcome_complete requires executed browser/native proof, not compiling code."
  intake:
    original_request: "The markless compiler needs to support storage, so let's figure out how this is going to work directly in markless, then consume that in frameless"
    interpreted_outcome: "storage() implemented in the markless compiler+runtime on a dedicated branch, seeded via the unified channel, consumed by frameless React output with the identical executed contract."
    input_shape: specific
    audience: "owner (Jack); markless + frameless users downstream"
    authority: "requested; markless WRITE ACCESS GRANTED by owner 2026-07-21 (intake answer: 'Yes — write markless now'), superseding the session read-only constraint; markless main remains untouchable without explicit owner confirmation"
    proof_type: test
    completion_proof: "Executed proof both sides + suites green + boundary critiques + boards receipted."
    likely_misfire: "Stale-pin confusion (implementing against wrong markless); scope creep into promotion/driver zoo; inventing unratified details (key namespacing, consent surface) without owner checkpoints; compile-green-but-never-executed completion."
    existing_plan_facts: "Ratified direction from qds-primitives loop (storage() only new API; auto seed from reachability; consent switch; inert/lazy/landing-slot contract). P1 probe: payload seeding worked without core changes on the old pin. P5: MARKLESS_FRAMEWORK_IMPORT_REQUIRED; accepted-import-sources now unlockable markless-side. storage-poc runner (65/65) = executable contract reference. T009 SSR probe = React emission pattern. Frameless vendors a pinned markless; vendor-refresh question must be settled early."
    non_goals:
      - "attach-promotion implementation (separate future goal; keep channel compatible)"
      - "Driver zoo / non-string values (v1 = localStorage + strings)"
      - "markless main-branch writes without explicit owner confirmation"
      - "Qwik/Svelte/Angular frameless emitters (React first, Solid stretch)"

policies:
  one_active_task: true
  parallel_workers: "crew serial in-checkout per repo (worktrees lack node_modules); disjoint-repo slices may overlap only with PM approval per dispatch"
  max_consecutive_tiny_tasks: 2

agents:
  scout: installed
  worker: installed
  judge: installed

