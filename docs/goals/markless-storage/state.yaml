    objective: "Map the markless integration surface (crew, read-only): where declarations (state/shared/element) are recognized in the compiler (symbol/module handling), the payload/resume seed channel internals, SSR/HTML emission points for a browser seed script, runtime cell/graph implementation + notify contract (T004b atomic-write context), package layout for a new declaration, accepted-import-sources / import-validation site (P5 fix location), and test conventions."
