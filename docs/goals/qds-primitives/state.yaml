version: 2

goal:
  slug: qds-primitives
  title: "Audit Qwik Design System; determine needed primitives"
  status: active
  charter: goal.md
  kind: audit
  tranche: "Sweep the entire QDS component library for imperative browser-machinery patterns (inline/minified scripts, observers, measurement, focus/scroll, visible tasks), characterize why each exists, classify into primitive-requirement classes, assess attach-fit per class, and deliver an owner-facing 'what we need' menu — suggestions only, owner ratifies."
  oracle:
    signal: "Owner reads the audit dossier + primitive-requirements menu and can decide what to build without re-doing the research; every QDS claim cites file:line; every requirement traces to audited cases; open questions are options with tradeoffs."
    cadence: "at each scout/judge receipt and at the final delivery"
    final_proof: "Final audit confirms the inventory was full-library (not just carousel), the why-per-case survived classification, the menu was delivered, and nothing was presented as decided."
  intake:
    original_request: "I want you to audit Qwik Design System and figure out what is needed primitive wise to solve the problems there... carousel I think had a script that gets minified and it does it through some browser API... to prevent flashes... there may even be use cases with a Resizer, Mutation Observer, etc. ... figure out if attach makes sense, or if something else is needed etc. So do the audit, then let me know what we need"
    interpreted_outcome: "Source-backed full-library QDS audit of imperative browser-machinery patterns, classified by why they exist, mapped to the markless/frameless primitive surface: what existing/planned primitives cover, what gaps need something new — delivered as an owner decision menu."
    input_shape: audit
    audience: "owner (Jack) — decides which primitives to build for markless/frameless"
    authority: requested
    proof_type: source_backed_answer
    completion_proof: "Owner-facing 'what we need' menu delivered, backed by a cited full-library inventory with per-case why and per-class attach-fit assessment; final audit records delivery and the no-ratification misfire check."
    likely_misfire: "Presenting primitive choices as decided; stopping at the carousel example; collapsing distinct why-classes (flash-prevention vs measurement vs observation vs lifecycle) into one requirement; requirements not traced to cited cases."
    existing_plan_facts: "Owner's recollection to VERIFY (and correct honestly if it differs): carousel has a minified script using a browser API, believed flash-prevention. Expected classes: ResizeObserver, MutationObserver. Open question named by owner: does attach fit, or is something else needed. Prior evidence: storage-tradeoff T006 corpus notes (QDS/Qwik UI theme = pre-slot sync script, configurable key, CSP nonce, no useVisibleTask$ for initial read); recommended storage() contract + green 4-framework POC (poc/09-storage) as settled evidence input, not re-opened."
    non_goals:
      - "Implementing any primitive (out of tranche)"
      - "QDS or markless repo changes (both read-only)"
      - "Re-opening the storage()/device-state decision (cross-reference only)"
      - "Ratifying primitive designs — owner decides"

policies:
  one_active_task: true
  max_consecutive_tiny_tasks: 2

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: T005

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Full-library QDS pattern inventory (crew, read-only): sweep every component in the local qwik-design-system checkout for imperative browser machinery — inline/injected/minified scripts (verify the owner's carousel recollection against source: which script, which browser API, minified how, flash-prevention or not), useVisibleTask$/useTask$ with DOM access, ResizeObserver/MutationObserver/IntersectionObserver, measurement reads (getBoundingClientRect/offsetWidth), focus/scroll management, event-listener wiring outside JSX, matchMedia, rAF loops — each with file:line, when it runs (SSR/pre-paint/resume/visible), WHY it exists (flash prevention, measurement, reactive observation, a11y/focus, lifecycle), and what breaks without it."
    expected_output:
      - "notes/T001-qds-inventory.md: full pattern inventory with citations, per-case why, frequency counts, carousel recollection verified/corrected"
    receipt:
      result: done
      note: notes/T001-qds-inventory.md
      summary: "Crew scout, full-library, read-only, all claims cited. HEADLINES: (1) owner recollection CORRECTED — the carousel script (view-navigation.script.ts, injected via dangerouslySetInnerHTML after the slot, minified by a bespoke rolldown plugin with oxc-minify) is primarily PRE-RESUME LAYOUT MEASUREMENT (parse-time elementsFromPoint + getBoundingClientRect via document.currentScript, retry on load/fonts.ready) landing results on window.carouselState for resumed code; flash-prevention (CSS-hidden nav triggers revealed on measure) is a side effect. (2) ZERO ResizeObserver/IntersectionObserver in the whole library; one shared MutationObserver exists only as an unmount-cleanup hack (use-unmount). (3) .browser.tsx = Playwright test files, not shipped code. (4) Duplication: roving focus in 12 families, 3 TreeWalker routines, 18 getBoundingClientRect sites with caching only in carousel, global pointer tracking in 3 inconsistent forms. (5) Explicit Qwik friction: menu sync key suppression (v1 serialization), select render-order label tradeoff naming a script tag as the avoided alternative, visible-task eagerness hacks with in-code warnings. Static-read limits recorded (T001 note F)."
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Primitive-surface map (PM/crew, read-only): establish what 'attach' and the adjacent surface actually are today — element-scoped behaviors/refs (ElementHandle/Behavior/HandleCall) in the frameless enriched IR + composition notes, markless-side equivalents (read-only), the recommended storage() contract — and characterize each primitive's execution timing/capabilities so T003 can honestly assess fit per audited class."
    expected_output:
      - "notes/T002-surface-map.md: current + planned primitive surface with execution-timing semantics, cited to repo sources"
    receipt:
      result: done
      note: notes/T002-surface-map.md
      summary: "PM-executed (quick-lookup class, done while crew swept). attach = element() handle + attach={(node)=>cleanup}: IR BehaviorRecord (serialized AST, host binding, provenance-tracked inputs, cleanup flag, order), HandleCall for structured method calls. TIMING (the load-bearing facts): React lowers behaviors into ONE useCallback callback ref (commit-time = pre-paint on client mounts, but first run on SSR content is at HYDRATION — after the user saw server HTML); Solid = onMount/onCleanup class. storage() seed family is the ONLY surface reaching HTML-parse/pre-first-paint on SSR. BehaviorRecord is single-run+cleanup; no re-run-on-input-change semantics in emitters (flagged). Timing ladder written for T003 scoring."
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Synthesis: classify the T001 inventory into primitive-requirement classes (by WHY, never collapsing classes), assess per class whether attach/existing surface covers it (with timing semantics from T002), name the gaps that need something new (e.g. pre-paint element-scoped script, observer primitive, measure primitive), and produce the owner-facing 'what we need' menu — options with tradeoffs where open, SUGGESTIONS ONLY."
    expected_output:
      - "notes/T003-what-we-need.md: requirement classes -> covered/gap verdicts -> owner menu"
    receipt:
      result: done
      decision: approved
      note: notes/T003-what-we-need.md
      summary: "Synthesis (PM as Judge; classes kept distinct; every requirement traced to citations). VERDICTS: R1 parse-time element work = THE one true primitive gap (carousel script + select avoided-script-tag + menu sync gate + eagerness hacks all live there; attach is structurally too late on SSR; QDS hand-built a 5-part compiler pipeline for one script; same landing-slot architecture as our storage seed) -> owner chooses attach-variant vs distinct early-script primitive, sharing the seed machinery either way. R2 observers/lifecycle = attach CONFIRMED as host (cleanup-tracked records delete the use-unmount MutationObserver hack + leak-suspects); riders: eagerness hint vs inference, single-run semantics sufficient today. R3 reactive measurement = std-lib size/rect cell over attach, not a language primitive. R4 focus/roving-tabindex = std-lib focus-group behavior (biggest duplication: 12 families). R5 animation/gesture math = no primitive need. Corrections banked: carousel = measurement-first; zero observers exist to generalize from (need inferred from 2 stale-layout gaps, labeled)."
  - id: T004
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Deliver the 'what we need' answer to the owner in plain language (per decision-menu rules: understandable without goal context) and record their decision or named follow-up."
    receipt:
      result: done
      summary: "Delivered. Owner engagement (2026-07-21, verbatim anchors): 'So what is this primitive?' -> early() sketch delivered; 'Seems like a lot of steps here? Surely this can be simplified' -> simplified to early(handle, fn, fallback) with defaults-not-options; 'early is still weird, yeah ideally no new api?' -> zero-new-API design surfaced: attach+cell with COMPILER PROMOTION (3 statically-checkable rules: serializable body, static-inputs-only via BehaviorRecord provenance, returnsCleanup=false; promoted -> parse-time inline script seeding cells via landing slot; demoted -> unchanged attach; correct either way, promotion buys no-flash). PM revised its explicit-boundary lean on the record: that evidence came from library-land without compilers; promotion is on-thesis for markless. NAMED FOLLOW-UP (owner, verbatim): 'Yeah do some more research then get back with the result, and should we still need storage? etc.' -> T005-T008 spawned."
  - id: T005
    type: scout
    assignee: Scout
    status: active
    reasoning_hint: medium
    objective: "Promotion prior-art research, two halves: (a) crew mines the LOCAL qwik checkout for the $ serialization contract (what may cross a QRL boundary, captured-scope rules, unserializable-capture error modes, resume mechanics, any inline-script emission in core) as the direct constraint model for promotion rules; (b) PM-direct web research on the implicit-vs-explicit compiler-boundary track record: Marko automatic partial hydration (closest prior art to promotion), Qwik $ explicitness DX reception, Svelte's implicit-reactivity -> explicit-runes reversal (counter-datapoint), React Compiler auto-memoization reception."
    expected_output:
      - "notes/T005-promotion-prior-art.md"
    receipt: null
  - id: T006
    type: pm
    assignee: PM
    status: queued
    reasoning_hint: medium
    objective: "Executed promotion probe: extend the poc/09-storage harness with a promoted-attach emulation — SSR HTML containing an element followed by a compiler-style inline script (measures children, corrects DOM, lands value in an element-scoped slot), runtime adapter consumes the seeded cell without re-measuring; assert pre-paint correction + zero duplicate measurement + storage-as-same-channel."
    expected_output:
      - "runner output banked in notes/T006-promotion-probe.md"
    receipt: null
  - id: T007
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Synthesis: refined promotion design (rules, diagnostics, failure modes priced from T005 constraints + T006 execution) AND the storage-survival analysis — does storage() remain a primitive, become a compiler-known std-lib cell over the same promotion channel, or collapse entirely (write-back/cross-tab/consent/key-identity accounted); owner menu, SUGGESTIONS ONLY."
    expected_output:
      - "notes/T007-promotion-and-storage.md"
    receipt: null
  - id: T008
    type: pm
    assignee: PM
    status: queued
    reasoning_hint: medium
    objective: "Deliver the research result + storage answer to the owner in plain language; record decision or next follow-up."
    receipt: null
  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Final audit: was the inventory full-library with per-case why; were classes kept distinct; was every requirement traced to cited cases; was the menu delivered and nothing presented as decided; record owner response state and full_outcome_complete accordingly."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "owner decision or named follow-up"
    receipt: null

checks:
  dirty_fingerprint: "board prepped on worktree-storage-poc (docs-only)"
  last_verification: null
