  - id: T008
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Rule on the two policy defects the T006 cold-agent test exposed: inconsistent Gate 1 scoring when the target framework is absent from the lockfile, and undefined Gate 4 scoring for an emitter that does not exist yet."
    inputs:
      - "notes/T006-cold-agent.md (both defects, with the agent's own wording)"
      - "notes/T004-policy-decision.md (the ratified gates and worked examples)"
      - "docs/emitter-idiom-policy.md (as shipped)"
    constraints:
      - "Do not implement. Rule, and specify the exact edit for T009."
      - "The ruling must make the policy SELF-CONSISTENT: either worked example 5's G1 PASS is wrong, or Gate 1's FAIL conditions are incomplete. Decide which, do not paper over it."
      - "Whatever Gate 1 rule you land on must give a defensible answer for a framework wholly absent from the lockfile - which is the situation for Vue, Angular AND Svelte today."
      - "Do NOT weaken Gate 1 into passability-by-documentation. The gate's whole point is that docs are a hypothesis. If the honest consequence is that no absent-framework sugar can pass Gate 1 until a lane exists, say so plainly - that is a real answer, and it is what Gate 6's DEFERRED outcome is for."
      - "Re-check the H3 ruling under your amended gates. If the amendment would flip it, the amendment is wrong - the cold-agent test is already banked and must not be retro-invalidated."
      - "Contamination is no longer a concern: H3 has been tested and the result recorded. You may name Angular APIs freely."
    expected_output:
      - "Ruling on defect 1, with the exact replacement text"
      - "Ruling on defect 2, with the exact replacement text"
      - "Confirmation that H3 still rules no-sugar under the amended gates"
      - "Exact T009 Worker objective, allowed_files, verify, stop_if"
      - "Whether any other worked example changes outcome under the amendment"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      note: notes/T008-policy-amendment.md
      summary: "Ruled BOTH defects, and found a deeper one underneath. The worked examples are wrong, not Gate 1 - its documentary-evidence clause already FAILs absent frameworks. But FAIL alone made Gate 6's DEFERRED branch UNREACHABLE for every framework it was written for: dead text. So Gate 1 is re-partitioned by cause (absent -> DEFERRED, never PASS) and Gate 4 is scored falsifiable-but-not-verifiable without an emitter. Machine-verified: 11/11 anchors unique and verbatim, ZERO rulings flip, examples 1 and 8 byte-identical, Qwik ruling untouched."
      defect_1:
        ruling: "The worked examples are the defect, not the gate. THREE of eight are wrong: example 2 records G1 PASS while admitting in the same sentence that the evidence is 'documented shorthands... to be re-measured when a Vue lane exists' - documentary-only evidence recorded as a pass, in the gate whose entire purpose is that documentary evidence is not evidence. Example 5 records a bare G1 PASS with no justification. Example 4 omits Gate 1 entirely, against the procedure's own instruction."
        deeper_finding: "Correcting them all to G1 FAIL would make the policy self-consistent and SELF-DEFEATING. Gate 6's DEFERRED describes exactly one situation - a framework this repo does not carry. That framework also has no measurable build, so Gate 1 FAILs, and any FAIL -> no-sugar, denied. Gate 6's DEFERRED outcome was unreachable for every framework it was written for."
        amendment: "Gate 1's FAIL conditions re-partitioned BY CAUSE, not weakened: framework IN the lockfile with documentary-only evidence -> FAIL (measurement was possible and not made); framework ABSENT -> DEFERRED - framework absent. Gate 1 can never be PASS for an absent framework, and documentary evidence never passes it anywhere, ever."
        plain_consequence: "Stated plainly as the card required: NO sugar for an absent framework can ship, full stop, until that framework has a lane at a pinned lockfile version. DEFERRED changes zero emitted bytes; it changes the record and the re-opening rule."
      defect_2:
        ruling: "Right outcome, wrong name. UNKNOWN -> no-sugar produces the correct emission and the wrong label: 'denied' asserts something was found against the sugar, and nothing was. The correct force is 'not yet'."
        asymmetry: "With no emitter, Gate 4 is FALSIFIABLE BUT NOT VERIFIABLE. Worked example 6 proves the falsifiable half - its G4 FAIL was found in SyncPolicyBranch.actions in the IR schema with no Svelte emitter in existence. That is decidable, and an absent emitter does not excuse it. The verifiable half is unavailable: 'applies to every instance' is a claim about a function nobody has written, and recording PASS there is the folklore-domain failure the gate's own phrasing requirement bans, arriving by the back door."
        amendment: "Counterexample found -> FAIL (repairable); no counterexample and no emitter -> DEFERRED - emitter absent; never PASS."
      gate_1_vs_gate_6: "They genuinely duplicate for an absent framework - same cause (no lane), same cure (an official-scaffold lane at a pinned version). One fact observed twice, not independent evidence. Kept deliberately as a FEATURE, on one condition: both gates must report the same label. As a cross-check it has teeth - G1 PASS next to G6 DEFERRED means you measured against a build this repo does not ship, which is a Gate 1 FAIL under its third clause. Worked example 2 is that exact contradiction sitting in the ratified document, uncaught until a stranger ran the procedure. It becomes a DEFECT the moment the labels disagree, because the combination rule takes the harsher one and the deferral silently disappears. Hence a coupling clause: for an absent framework they must agree, and disagreement is diagnosed rather than averaged."
      regression_check:
        lockfile_verified: "Vue absent (0 matches), Angular absent (0), Svelte absent (only @sveltejs/acorn-typescript@1.0.11, an acorn plugin). Qwik, React, Solid present."
        h3: "UNCHANGED - still no-sugar, still denied-not-deferred. G5 FAIL (reactivity depth, throw behavior) is untouched and FAIL outranks DEFERRED, so G5 alone carries it."
        h3_disclosure: "Stated openly rather than buried: the amendment DOES move H3's G1 cell from FAIL to DEFERRED. That is not retro-invalidation - the T006 scoring band was 'no-sugar on substantially G1 and/or G5 grounds', the agent named G5 as the strongest and least ambiguous failure, and BOTH the agent and the PM independently flagged that exact cell as uncertain before the amendment existed. The amendment resolves an ambiguity both derivations surfaced; it overturns nothing either relied on."
        qwik_shipped_ruling: "UNCHANGED, not unruled. Both amended clauses are conditioned on absence. Qwik is present (@qwik.dev/core@2.0.0-beta.38), G1 was measured on the bundled qwikVite, and G4's domain names emitEvent - a function that exists and shipped."
        worked_examples: "ZERO of eight flip. 1 Qwik sugar (no cells changed), 2 Vue shorthands deferred, 3 Vue defineEmits no-sugar, 4 Angular [(prop)] no-sugar, 5 Angular @if/@for deferred, 6 Svelte onclick deferred-after-repair (pre-repair G4 FAIL STANDS), 7 Svelte $props() no-sugar, 8 React onChange sugar (no cells changed). Every correction lands on a cell that was unearned or unrecorded, with the outcome already carried by a gate the amendment does not touch."
        simulation: "Judge simulated the full amendment outside the repo: all 11 replace-anchors match verbatim exactly once, the eight ruling headings and all six gate headings byte-identical after, examples 1 and 8 byte-identical after."
        non_mechanical_judgement: "Worked example 6's pre-repair G4 FAIL preserved deliberately - a lazier Defect-2 rule would defer Gate 4 unconditionally and evaporate it, taking the repair step's only illustration with it."
      dissent:
        - "Worked example 4 still records no G3 outcome, violating the policy's own 'record an outcome for every gate' instruction. T003 evidence suggests a G3 FAIL is plausible (two-way binding must infer a canonical-assignment handler), but the Judge deliberately did not invent a substantive ruling outside its remit. FLAGGED FOR PM, not queued."
        - "H3 deserves to be worked example 9 - contamination is moot and it is the only case the policy was tested on by a stranger. Not authorized in T009 to keep that package tight; recommended as a separate small package. PM DECISION PENDING - deliberately not auto-queued, since it changes the ratified record's content."
        - "Judge cannot fully evidence H3's G4 cell: it scored DEFERRED - emitter absent, but the PM's pre-registered caveat about @Input() setters the IR does not express is arguably an exhibitable counterexample, making it FAIL. Either reading gives the same ruling."
        - "The ratification's real weakness beyond these two defects: four of eight worked examples were never scored against a gate they could actually run. Examples 2-5 and 7 reason about frameworks this repo does not have. Legitimate for a policy that must generalize, but it means five-eighths of 'the record' is a rehearsal, not a record. The amendment makes that VISIBLE by labelling it, which is an improvement, not a fix."
        - "T005's pnpm test:browser hang is still unresolved and is cited by worked example 8's G6. Did not affect this ruling - example 8 also cites pnpm e2e, which is green - but a Gate 6 that names a command nobody can run is a Gate 6 that will quietly stop pinning things."
      spawned_tasks: []

