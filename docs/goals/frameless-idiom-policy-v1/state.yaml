  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the Qwik $-prop mechanics and the frameless Qwik emitter surface that would have to change."
    inputs:
      - "Qwik source/types for implicit$FirstArg and QRL prop handling in node_modules"
      - "The frameless Qwik emitter and its event/handler prop code paths"
      - "demos/qwik and any fixture using onInput$ / handler props"
    constraints:
      - "Read-only. Do not edit implementation files."
      - "Ground findings in actual Qwik source, types, or observed emitted output - not on a plausible reading of the docs."
      - "Answer concretely: which prop shapes does implicit$FirstArg cover, which does it NOT, and what happens to an explicit inner $() when the prop is already $-suffixed (redundant-but-harmless, or double-wrapped)."
      - "Identify the exact emitter file(s) and functions that would need to change, and estimate the blast radius."
    expected_output:
      - "How implicit$FirstArg actually resolves $-suffixed props, with file/line evidence"
      - "Whether the current explicit-$() output is redundant, harmful, or load-bearing"
      - "Exact emitter files/functions that would change, with blast radius"
      - "Verification commands that would prove a change safe (e2e / activation neutrality)"
    receipt:
      result: done
      summary: "implicit$FirstArg does NOT cover JSX event props - the Rust optimizer rewrites those at build time; implicit$FirstArg only wraps arg0 of $-suffixed API functions, unconditionally, with no isQrl guard. Verdict on our output is MIXED: explicit $() inside an implicit$FirstArg API is a hard optimizer error C03, but frameless never emits that; on JSX event props (the only place we emit $()), explicit and raw compile to identical chunk count and identical symbol hash with zero diagnostics, differing only in capture strategy. Raw is marginally better. Not load-bearing. Blast radius is ONE call site."
      current_output_verdict: mixed
      verdict_detail:
        jsx_event_props: "Benign, not a no-op. A/B through the optimizer: identical chunk count (3), identical module paths, same symbol hash (s_1jmhDujIw3U), zero diagnostics either way. Explicit $() produces a per-instance QRL wrapped with .w([draft, props]) reading _captures; raw produces a capture-free, shareable QRL carrying captures on q:ps (jsx flags 2 vs 6). Same lazy-load boundary. Marginally better resumability payload for raw."
        implicit_first_arg_apis: "HARMFUL. useTask$($(() => { s.value })) => optimizer DIAG error C03 'Qrl($) scope is not a function, but it is capturing local identifiers', plus a broken extra chunk referencing an out-of-scope binding. Frameless already emits useTask$(async () => {...}) raw (generated/S1.jsx:5), so we do not hit this - but it is a trap the policy must not license."
      emitter_blast_radius:
        call_sites: 1
        change: "packages/frameworks/qwik/src/emitter/index.ts:592-598 emitEvent - return `handler` instead of `call(identifier('$'), [handler])` and drop `context.imports.add('$')` at :596. eventAttributeName (:444) already produces the $-suffixed prop name and is unchanged."
        goldens_to_regenerate:
          - "packages/frameworks/qwik/generated/S1.jsx:20"
          - "packages/frameworks/qwik/generated/S2.jsx (15 occurrences of `$(`)"
          - "packages/frameworks/qwik/generated/S3.jsx:11,20"
        tests_asserting_current_shape:
          - "packages/frameworks/qwik/test/emitter.test.ts:41,54,55 - regex asserts on `$(`"
          - "packages/frameworks/qwik/test/emitter.test.ts:26 - byte-exact golden freshness check"
        unaffected: "packages/frameworks/qwik/test/gate.test.ts - its mutation anchor does not reference $(), so the gate and its 77 mutants survive unchanged. demos/qwik copy-emitted re-copies generated S1/S2/S3 on every dev/build, so demos pick the change up automatically."
      verify_commands:
        - "pnpm --dir packages/frameworks/qwik regenerate"
        - "pnpm --dir packages/frameworks/qwik test"
        - "pnpm test"
        - "pnpm check"
        - "pnpm test:browser"
        - "pnpm e2e"
      activation_matrix: "scripts/e2e.mjs:31-33 - react/hydrate -> demos/react-official, solid/hydrate -> demos/solid-official, qwik/resume -> demos/qwik, with S1/S2/S3 enforced by the 'recorded no observations' guard at :104-107."
      qwik_versions: "@qwik.dev/core 2.0.0-beta.38 everywhere (demos/qwik on the vite-7.3.1 peer variant, others vite 8.0.16); @qwik.dev/router 2.0.0-beta.38; @qwik.dev/optimizer 2.1.0-beta.5."
      unknowns:
        - "PROVISIONAL: the A/B was driven against @qwik.dev/optimizer@2.1.0-beta.5 directly. core 2.0.0-beta.38's qwikVite may bind a different optimizer build. The capture-strategy claim must be re-confirmed against a real `pnpm --dir demos/qwik build` before it is treated as settled."
        - "component$ is not in the implicit$FirstArg consumer list and is defined via componentQrl (core.mjs:15941); the doc-comment equivalence component$(fn) == component($(fn)) is unverified from source."
        - "The q:ps capture mechanism and jsx flags 2 vs 6 were read off optimizer output, not traced through core.mjs runtime consumption."
        - "Not verified: whether a raw function on a $-prop works when the optimizer is bypassed (runtime-only JSX). Source suggests no coercion exists, so it would likely fail - but frameless demos always run the optimizer."
      ambiguity_for_judge: "The raw form is marginally better (capture-free shareable QRL via q:ps) but the delta is small and current output is correct. Whether that ergonomic delta justifies emitter-owned sugar is a policy call, not a technical one. T002 explicitly declines to rule."
      evidence:
        - "demos/qwik/node_modules/@qwik.dev/core/dist/core.mjs:3007 (implicit$FirstArg), :15887 ($), :15897 (dollar alias), :266 (isQrl - not used as a guard)"
        - "demos/qwik/node_modules/@qwik.dev/core/dist/core-internal.d.ts:1750"
        - "demos/qwik/node_modules/@qwik.dev/core/dist/core.mjs:16892 useTask$ = implicit$FirstArg(useTaskQrl), +12 siblings"
        - "demos/qwik/node_modules/@qwik.dev/core/dist/core.mjs:7807 unwrapEventHandlerQrl, :12557 setEvent (runtime assumes a QRL)"
        - "packages/frameworks/qwik/src/emitter/index.ts:592-598"
        - "scripts/e2e.mjs:31-33, :104-107"
      spawned_tasks: []

  - id: T003
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Survey the equivalent idiom-sugar tension in Vue, Angular, and Svelte 5 so the policy has more than one framework to generalize over."
    dispatch:
      concurrent_with: T002
      board_status_note: "This card was dispatched at the same time as T002 and ran while T002 was the active task; it was held at 'queued' until T002's receipt landed because the checker enforces exactly one active task. It is now correctly active."
      rationale: "PM decision: T002 and T003 are both read-only with disjoint outputs (T002 = qwik emitter + qwik node_modules; T003 = compiler IR, poc/09-storage, official framework docs). No write scope on either. one_active_task applies to write-capable work; running two read-only Scouts in parallel does not risk board truth."
      assignee_substitution: "Dispatched to a general-purpose agent under read-only Scout rules, because Vue/Angular/Svelte are not installed in this repo and the dedicated goal-scout agent has no web tools. Recorded here so the receipt is not read as a goal-scout receipt."
    inputs:
      - "Vue 3: v-model, defineEmits/emits, prop-vs-event conventions"
      - "Angular: signals, input()/output(), template binding syntax"
      - "Svelte 5: runes ($state, $derived, $props), event attribute conventions"
      - "The frameless IR and existing react/solid/qwik emitters, for what the IR can and cannot express"
    constraints:
      - "Read-only. One package covering all three frameworks - do not split into three tasks."
      - "For each framework, name at least one concrete case where an emitter could add sugar and one where sugar would be wrong or lossy."
      - "Flag any case where the frameless IR cannot currently express what the idiom needs - that is an expansion-board input, not a policy input."
      - "Prefer official framework docs/source over blog-post idiom claims."
    expected_output:
      - "Per framework: 1+ candidate sugar case and 1+ counter-case, with citations"
      - "Which cases are structurally the same as the Qwik $-prop case and which are different in kind"
      - "IR gaps that belong to the expansion boards rather than this policy"
      - "A shortlist of candidate 'unseen cases' usable for the cold-agent replication test"
    receipt:
      result: done
      note: notes/T003-cross-framework-idioms.md
      summary: "All three frameworks' flagship sugar (Vue v-model, Angular model()+banana, Svelte bind:+$bindable) is the SAME feature - two-way binding - and all three are different-in-kind from the Qwik $-prop case on the same two axes: they are cross-component contracts, and they require inferring that a handler is merely the canonical assignment. Only lexical substitutions (Vue :/@/#, Svelte onclick, Svelte {value}, Angular @if/@for) are same-in-kind. Two findings reshape the policy: same-in-kind is a property of a sugar PLUS a pinned framework version, not of a sugar alone; and Angular has no naive-literal form at all, so a policy phrased 'prefer literal' has no referent there."
      axes: "T003 extracted five axes from the Qwik fingerprint - locality, inference, totality, semantic delta, version binding - and sorted every candidate against them."
      same_in_kind:
        - "Vue :prop / @event / #slot shorthands"
        - "Svelte 5 onclick (vs Svelte 4 on:click)"
        - "Svelte {value} attribute shorthand"
        - "Angular @if / @for control flow blocks"
      different_in_kind:
        - "Vue v-model - cross-component contract + requires inferring canonical-assignment handlers"
        - "Angular model() + [(banana)] - same two failures"
        - "Svelte bind: + $bindable - needs an lvalue (IR path-based / handler-local-alias writes are not), and bindability is declared by the CHILD, which frameless emits from a separate EnrichedIR"
      strongest_counter_cases:
        vue: "s2-keyed-todo.tsrx has an adjacent input whose handler does four things - v-model cannot express it. Worse: generated-persistence/P1.jsx proves a LATER compiler pass silently adds a statement to a handler, which would flip a previously-matching handler out of v-model eligibility after the fact."
        angular: "Angular template expressions forbid const, arrow functions, destructuring and ++ (angular.dev/guide/templates/expression-syntax), so handlers must become class methods regardless. The naive literal emission does not exist."
        svelte: "bind: requires an lvalue and a child-declared $bindable, crossing the module boundary frameless emits from separately."
      held_out_candidates:
        - "H1 Vue same-name :id"
        - "H2 Svelte $derived"
        - "H3 Angular input()/output() vs decorators - flagged as the trap: reads identical to the Qwik case, structurally is not"
        - "H4 Vue v-model on the favourable handler"
        - "H5 Svelte bind: to an emitted child"
      held_out_note: "Expected answers deliberately NOT recorded by T003, and must not be recorded in any repo file the cold agent could read."
      ir_gaps_for_expansion_boards:
        count: 7
        highlights:
          - "No bindable prop kind"
          - "No emits concept"
          - "Default-slot-only"
          - "No target-version input - which the version-binding axis makes load-bearing, not cosmetic"
        handling: "Carried to T007 as expansion-board intake facts. NOT inputs to the idiom policy."
      prior_art: "poc/09-storage vue and svelte both took cheap lexical sugar and kept classic lifecycle shapes - consistent in-repo precedent."
      unresolved: "Source conflict on Angular model() stability: api/core/model says 'stable since v19.0', the v20 announcement says v20."
      assignee_substitution_honesty: "This receipt is from a general-purpose agent operating under read-only Scout rules, not from the goal-scout agent. Its only file write was the note above; git status confirms no other changes."
      spawned_tasks: []

  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Ratify the emitter idiom-sugar policy and decide the Qwik $-prop case in one direction, with an exact bounded Worker objective."
    inputs:
      - "T002 receipt"
      - "T003 receipt"
      - "goal.md constraints"
    constraints:
      - "Do not implement."
      - "Both directions are acceptable: implement $-prop inference, OR keep the literal explicit-$() form with a documented rationale. Choose on evidence, not on which is more work."
      - "The policy must be a decision procedure someone with no context can run, not a description of this one case."
      - "The policy must produce a defensible answer for at least one Vue, one Angular, and one Svelte case from T003."
      - "Reserve one T003 candidate case as the held-out cold-agent test case and name it here without recording the expected answer in any file the cold agent could read."
      - "Pick the largest safe useful slice with clear allowed_files, verify commands, and stop conditions."
    expected_output:
      - "Decision: sugar | no-sugar, with rationale grounded in T002 evidence"
      - "The policy's decision procedure, in a form a Worker can write down verbatim"
      - "Exact Worker objective for T005"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Held-out cold-agent test case (named, expected answer withheld from repo files)"
    receipt:
      result: done
      decision: sugar
      full_outcome_complete: false
      note: notes/T004-policy-decision.md
      summary: "Ruled SUGAR - emit the raw handler - after overturning T002's central A/B on measured evidence from the shipped build. Ratified a six-gate decision procedure with a repair step, a later-pass rider, and DEFERRED as a first-class outcome. The procedure yields sugar on its own instance case, so it is not a preference wearing a procedure's clothes."
      overturned_t002:
        what: "T002 claimed explicit and raw produce identical symbol hash and identical chunk count."
        why_wrong: "T002 drove @qwik.dev/optimizer@2.1.0-beta.5 directly. demos/qwik/vite.config.ts imports qwikVite from @qwik.dev/core/optimizer, and @qwik.dev/optimizer is not resolvable from demos/qwik (MODULE_NOT_FOUND). The demo builds with the optimizer bundled inside @qwik.dev/core@2.0.0-beta.38 (dist/optimizer.mjs, a separate 142KB artifact)."
        measured_on_shipped_build:
          explicit: "symbol s_4v8OrUB0hCk, ctxKind function, ctxName '$', captures true, 7 bundles"
          raw: "symbol s_qlHKEUv0vBw, ctxKind eventHandler, ctxName 'onClick$', captures false, 8 bundles"
          real_manifest_before: "{emittedSymbols:18, eventHandler:0, eventNames:[], dollarNamed:12, capturing:15} - zero eventHandler symbols in the entire manifest"
        why_it_matters: "The optimizer's own symbol-priority sort puts eventHandler symbols first, ranked by an event list beginning with 'click'. function symbols rank against a list that does not contain '$'. The current output places every interactive handler at the BOTTOM of that ordering. T004 measured no latency benefit and claims none; the case is classification correctness plus capture elimination."
      policy:
        location_commissioned: docs/emitter-idiom-policy.md
        shape: "Six gates, all run, no short-circuit. Any FAIL or UNKNOWN -> no-sugar. Gate 6 DEFERRED with the rest passing -> deferred, not denied. All pass -> sugar."
        gates:
          - "G1 Sanctioned and measured - docs are a hypothesis, not evidence; measure against the lockfile build."
          - "G2 Locality - nothing asked of another module or the build graph."
          - "G3 Declared trigger - no inference over contents, with a hard later-pass rider."
          - "G4 Totality over a stated, emitter-decidable domain - plus a repair step (narrow the domain using declared facts, re-run) and a phrasing requirement banning folklore domains."
          - "G5 Behavioral neutrality - artifact shape is explicitly NOT a G5 failure; that is G6's business."
          - "G6 Pinned by a standing check against the shipped build - three outcomes including DEFERRED."
        angular_fix: "The baseline is THE MOST PERMISSIVE SANCTIONED FORM, never 'the literal form'. Angular's forced lowering (no const, arrow functions, destructuring, ++ in templates) is declared out of the procedure's scope entirely. This is what makes the rule applicable in a framework with no naive-literal form."
      policy_tested_against:
        - "Qwik $-prop: sugar (its own instance case)"
        - "Vue shorthands: deferred"
        - "Vue defineEmits: no-sugar (G5)"
        - "Angular [(prop)]: no-sugar (G2+G5)"
        - "Angular @if/@for: deferred"
        - "Svelte onclick: deferred after repair"
        - "Svelte $props() fallbacks: no-sugar (G5)"
        - "Retro-validation: existing React onChange/className rulings come out sugar, G6 passes"
      later_pass_hazard:
        sharpened: "T003 said 'a later compiler pass silently mutated a handler'. More precisely: buildPersistenceRecords (packages/compiler/src/build.ts:420) lands records on the IR (schema.ts:476), and the React emitter injects __framelessWrite(...) during ITS OWN lowering (packages/frameworks/react/src/emitter/index.ts:1246). The mutation happens downstream of where a content-matcher would run, from an IR channel orthogonal to EventHandlerRecord."
        rule: "Gate 3 forbids content triggers outright. If one is ever admitted it must run on FINAL LOWERED OUTPUT and ship a fail-closed enumeration of contributing channels."
        qwik_exposure: "None today - the Qwik emitter fails closed on persistence-bearing IR (packages/frameworks/qwik/test/emitter.test.ts:81-85)."
      held_out_case:
        id: H3
        description: "Angular's whole-component member-declaration form choice."
        why_chosen: "The only shortlist case where a plausible wrong heuristic is available and directional - it reads rhetorically identical to the Qwik case and is structurally a different granularity, so a wrong answer is diagnostic rather than noise. It resolves on G2/G4/G5 substantively rather than on a single gate, and it forces the 'baseline is not literal' fix to do real work. T003 independently rated it the sharpest discriminator."
        expected_answer: "DELIBERATELY NOT RECORDED, here or in any repo file. T006 must re-derive it independently."
        contamination_guard: "Part C.2 of the note forbids docs/emitter-idiom-policy.md from mentioning Angular input()/output()/@Input()/@Output()/EventEmitter or the decorator-vs-signal choice in any form. Worked example 4 says 'two-way capable' rather than naming the API."
      dissent:
        - "T004 overrode T002's central A/B finding on measured evidence. T002's VERDICT SHAPE - declining to rule, flagging the caveat as PROVISIONAL - was right, and is what made the catch possible."
        - "T004's raw-side numbers are one component, production mode, in a scratch build; the explicit side is from the real build. T005 verify step 9 confirms the raw side on the real build - that is why it is in the package."
