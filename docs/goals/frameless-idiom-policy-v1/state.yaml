    inputs:
      - "The policy document written in T005 (docs/emitter-idiom-policy.md)"
      - "Held-out case: H3 - Angular's whole-component member-declaration form choice (named in the T004 receipt; expected answer recorded nowhere)"
    constraints:
      - "The agent must receive the policy document and the case only - no conversation history, no board access, no goal.md, no other frameless docs."
      - "Do not hint the expected answer in the prompt."
      - "Record the exact prompt, the agent's verdict, and its reasoning verbatim in notes/T006-cold-agent.md."
      - "A wrong or hedged verdict is a real failure: it means the policy is not transferable. Spawn a policy-revision Worker task and re-run rather than rationalizing the result."
      - "Re-running after a revision requires a fresh agent and, if the case is now contaminated, a fresh held-out case."
