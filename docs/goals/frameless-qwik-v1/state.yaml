    objective: "Evidence map the Qwik v2 EMITTER seam (read-only; build on SSR T001 §4, do not re-derive the resume model): (1) how the frameless enriched IR maps to a Qwik v2 component — the authoring surface (state/computed/element/events/keyed @for/conditional @if/controlled input) -> Qwik component$/useSignal/useStore/QRL listeners; what the emitter must PRODUCE so the Qwik optimizer serializes state + emits q-e:* listeners + no eager work; (2) the Qwik v2 SSR container — renderToStream/renderToString from @qwik.dev/core beta.38, the vite plugin/optimizer lane (analogous to Solid generate:'ssr'), what a demo app consuming CLI-built Qwik output looks like; (3) how the demos/ssr + demos/persistence witness harness extends for RESUME (activation:resume): the no-eager-chunk assertion (networkRequests, console), first-interaction-wake split, the eager-wake calibration; (4) how the existing persistence-render-lowering gate + activation:hydrate|resume schema apply to Qwik; (5) open risks (beta.38 API surface, optimizer/vite integration, QRL chunking in a test build). Record the exact emitter contract + the resume-proof plan for the Judge."
    inputs:
      - "docs/goals/frameless-ssr-v1/notes/T001-witness-ssr-evidence.md §4 (Qwik v2 resume model)"
      - "docs/goals/frameless-composition-v1/notes/persistence-design-input.md (no-eager-visible-task rule)"
      - "packages/frameworks/{react,solid} (emitter + gate + vite lanes as the pattern); packages/compiler (enriched IR); demos/ssr + demos/persistence (witness harness); node_modules/@qwik.dev/core beta.38 OR npm/QwikDev-qwik main-branch source READ-ONLY"
    constraints:
      - "Read-only. Qwik v2 ONLY (beta.38 / main-branch source); NEVER v1/@builder.io/qwik (v1 facts are misleading). Markless repo + poc/** strictly untouched."
      - "Honor the resume-not-hydrate discipline (T001 §4's 6 broken assumptions)."
    expected_output:
      - "notes/T001-qwik-emitter-seam.md: the IR->Qwik-v2 emitter contract, the SSR/vite lane, the resume-witness plan (no-eager-chunk + first-interaction-wake + eager-wake calibration), the gate/schema application, and open risks for the Judge."
    receipt:
      result: complete
      summary: >-
        BUILDABLE, no beta.38 hard blocker. component$/$/useSignal/useStore/useComputed$/Slot +
        renderToString/renderToStream + qwikVite all exported (cited file:line into node_modules).
        IR->Qwik contract: scalar->useSignal(.value), object/array->useStore (proxy-preserving
        mutation, reject unrepresentable whole-replacement), computed->useComputed$, event->$-suffixed
        inline QRL (captures must be serializable), keyed->.map+key (experimental Each deferred),
        conditional->nested ternary+null (Show deferred), controlled->explicit value+onInput$ QRL
        (bind:* deferred pending S2/S3 order calibration), children->Slot. NO useVisibleTask$/onQVisible$
        anywhere (eager-wake anti-pattern). SSR: renderToString/renderToStream + qwikVite two-plugin
        lane; build order is CLIENT-then-SSR (client manifest must exist before SSR serializes QRL
        listener URLs) -- OPPOSITE of Solid's SSR-first config. Witness resume plan: (1) pre-interaction
        HTML string-asserts qwik/json + q:container=paused + q-e:click + NO q-e:qvisible; (2) load-time
        zero-eager via networkRequests classified by the BUILD MANIFEST (not filename regex; a preload
        request counts as eager FAILURE); (3) first-interaction wake resolves a manifest-mapped QRL
        chunk + behavior passes; (4) eager-wake CALIBRATION FIRST (project.edit injects a useVisibleTask$,
        prove q-e:qvisible + eager chunk detected). Gate: reuse persistence-render-lowering + add a Qwik
        source check forbidding seed reads in useVisibleTask$/onQVisible$; ui-kit source forbids ANY
        visible task (resume oracle is stricter). SCHEMA BOUNDARY: PersistenceLanding = markless/React/Solid
        only -> the Qwik emitter must FAIL CLOSED on persistence-bearing IR (persistence-on-Qwik is
        follow-on); v1 proves resume on the NON-persistence ui-kit corpus. Receipt uses activation:'resume'
        (already in schema; no hydration-mismatch field). RISKS (Judge): (1) Witness+qwikVite orchestration
        (client-then-SSR handoff, manifest to preview) -- material integration risk, T003's first proof;
        (2) QRL resolution under preview (q:base/base/outDir must agree; a first-click 404 is not resume
        evidence); (3) callback-prop naming (authored onTrace must be a QRL -> $-suffix native contract);
        (4) DOM-identity proof surface -- PageHandle.content()/no-evaluate() can't prove node identity ->
        needs an inline non-app classified probe OR a witness API extension (proof-surface risk, not a Qwik
        blocker); (5) entry strategy smart-vs-segment for deterministic chunk topology; (6) dependency skew
        (repo Vitest 4.1.5 vs qwik peer <4 -> keep the proof in the Vite/Witness lane, no qwik testing
        import). Pin: @qwik.dev/core 2.0.0-beta.38 + @qwik.dev/optimizer 2.1.0-beta.5 (installed pair).
      changed_files:
        - docs/goals/frameless-qwik-v1/notes/T001-qwik-emitter-seam.md
