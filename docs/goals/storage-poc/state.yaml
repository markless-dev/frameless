version: 2

goal:
  slug: storage-poc
  title: "POC of storage() across Angular, React, Svelte, Vue"
  status: done
  charter: goal.md
  tranche: "Build a hand-authored runtime POC of the recommended storage() contract (cell + seed script + landing slot + per-framework adapter) in a fresh git worktree, prove it with one shared browser assertion set executed green in all four frameworks, and audit the evidence against the original ask — WITHOUT presenting POC success as API ratification."
  oracle:
    signal: "One runner output showing the shared assertion table green per framework (seed-before-first-paint + no-flash, zero extra driver reads via landing slot, reactive write-back + persistence round-trip, inert import) for angular, react, svelte, vue."
    cadence: "at each framework-pair receipt and at the final audit"
    final_proof: "Final audit maps the green (or honestly-blocked) per-framework evidence to the original ask; full_outcome_complete requires executed browser proof, not code that merely compiles."
  intake:
    original_request: "ok I want you to make a POC of the storage function across several different frameworks, angular, react, svelte, vue, and see if it works. Do this in a new git worktree"
    interpreted_outcome: "Working POC of the recommended storage() runtime contract in Angular, React, Svelte, and Vue with executed browser evidence per framework, built in a new dedicated git worktree."
    input_shape: specific
    audience: "owner (Jack) — evidence feeding the still-open storage-tradeoff API decision"
    authority: requested
    proof_type: demo
    completion_proof: "Shared assertion set executed green in all four frameworks (or 3 green + one honest specific blocked receipt), receipted with runner output; POC committed on the goal worktree branch."
    likely_misfire: "Treating POC success as API ratification (owner has ratified nothing); scope inflation into compiler/emitter work; hand-waving Angular instead of executing or honestly blocking it."
    existing_plan_facts: "Contract + harness are design inputs from docs/goals/storage-tradeoff/notes/ (T003 fallback-then-patch, T008 seed-ordering probe harness: playwright-core + cached Chromium hs-1228 + esbuild, T009 SSR shape). Locally available deps proven: react@19.2.7 (oxc-tsrx), esbuild (react-to-qwik); vue/svelte/@angular availability to be verified in T001. Owner directive: new git worktree."
    non_goals:
      - "Compiler/emitter integration (runtime POC only this tranche)"
      - "Shipping storage() into product packages"
      - "API ratification — POC is evidence for the owner's decision, not the decision"
      - "markless repo changes (read-only)"

policies:
  one_active_task: true
  parallel_workers: "crew two-wide only with disjoint file contracts (framework pairs are disjoint by construction)"
  max_consecutive_tiny_tasks: 2

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null  # GOAL COMPLETE — T999 audit recorded full_outcome_complete: true

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Stage the goal: create the fresh git worktree from main (owner directive), cross-link this commission as the owner's named gap on the storage-tradeoff board, verify local availability of vue/svelte/@angular packages (PM installs with network into the POC workspace if absent — never inside crew sandboxes), and scaffold the shared POC skeleton: neutral-named core (storage cell + seed-script generator + landing-slot handshake, ported from the T008/T009 probe patterns) plus the shared browser assertion runner, proven by executing the runner against a bare no-framework page."
    expected_output:
      - "Worktree path + branch name"
      - "Dependency inventory (found locally vs installed)"
      - "Shared core + runner committed; runner executes green on the bare page"
    receipt:
      result: done
      summary: "Worktree .claude/worktrees/storage-poc (branch worktree-storage-poc) created from main (which now includes composition-v1 GOAL COMPLETE). Cross-link recorded earlier via storage-tradeoff T010/T999. Deps INSTALLED into poc/ with network (none of vue/svelte/angular were local): react@19.2.8 react-dom vue@3.5.40 svelte@5.56.7 @angular/{core,common,platform-browser,compiler}@22.0.7 rxjs tslib esbuild@0.28.1 esbuild-svelte playwright-core@1.61.1 (matches cached Chromium hs-1228). Scaffold committed: poc/core/storage.js (cell: inert-at-creation, lazy driver read, landing-slot consumption, write-back + root-attr maintenance), poc/core/seed.js (compiler-derived seed emulation), poc/runner/run.mjs (shared 4-case assertion set: cold/warm/write+round-trip/inert), poc/bare (no-framework target). Runner EXECUTED GREEN on bare: 13/13 assertions (fallback+stored value at first paint, exactly 1 driver read seeded, round-trip after reload, ZERO reads inert). Two runner bugs found+fixed during bring-up (summary aggregation let PASS overwrite FAIL; snapshot raced first paint)."
  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "React + Vue adapters: idiomatic cell bindings (React hook, Vue ref) over the shared core, one demo page each, wired into the shared assertion runner; both frameworks green on the full assertion set. Crew dispatch two-wide (disjoint adapter dirs) or one unit if sizing says under ~15min each."
    allowed_files:
      - "poc/09-storage/react/**"
      - "poc/09-storage/vue/**"
    verify:
      - "shared runner: react green, vue green (all 4 assertions each)"
    stop_if:
      - "Need changes to shared core contract (escalate to PM instead)"
      - "Verification fails twice on the same assertion"
    receipt:
      result: done
      changed_files:
        - poc/09-storage/react/main.jsx
        - poc/09-storage/react/build.mjs
        - poc/09-storage/vue/main.js
        - poc/09-storage/vue/build.mjs
      commands:
        - cmd: "node runner/run.mjs react vue"
          status: pass
      summary: "Crew unit poc-react-vue (serial shared-checkout dispatch after crew refused parallel without worktree isolation). React: useSyncExternalStore binding (most idiomatic), READY via useEffect, inert mounts Ready-only tree. Vue: shallowRef + subscribe in setup, h() render functions (no template compiler in bundler build), inert mounts null-render app. Both import the single shared core. Unit verified green in-sandbox; PM re-verified in full table; Judge re-executed independently. Committed d69146a."
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Svelte + Angular adapters: idiomatic cell bindings (Svelte store/rune, Angular signal with zoneless standalone bootstrap) over the shared core, one demo page each, wired into the shared runner; both green on the full assertion set. Angular is the named high-risk leg: if its build tooling cannot be made to work without the CLI within the slice, return blocked with the exact obstacle rather than a degraded fake."
    allowed_files:
      - "poc/09-storage/svelte/**"
      - "poc/09-storage/angular/**"
    verify:
      - "shared runner: svelte green, angular green (all 4 assertions each)"
    stop_if:
      - "Need changes to shared core contract (escalate to PM instead)"
      - "Angular requires a fundamentally different harness (blocked receipt with specifics)"
      - "Verification fails twice on the same assertion"
    receipt:
      result: done
      changed_files:
        - poc/09-storage/svelte/App.svelte
        - poc/09-storage/svelte/main.js
        - poc/09-storage/svelte/build.mjs
        - poc/09-storage/angular/main.ts
        - poc/09-storage/angular/build.mjs
      commands:
        - cmd: "node runner/run.mjs svelte angular"
          status: pass
      summary: "Crew unit poc-svelte-angular. Svelte 5: runes ($props/$state), subscription in onMount, inert skips mount() entirely (cell creation still module-level). Angular 22: EXECUTED GREEN, not excused — standalone JIT component (import @angular/compiler), provideZonelessChangeDetection, signal synced via cell.subscribe, @if(!inert) never instantiates the reading component; TS decorators via tsconfigRaw. Unit was honest-partial in sandbox (macOS seatbelt blocked browser; build-only fallback passed); PM executed the browser table: one real finding — Angular zoneless renders on a later frame, runner given bounded 2s settle-wait on the write UI assertion (assertions still fail on non-settle; attr+driver writes are synchronous). Judge ruled the settle-wait honest eventual-consistency. Committed d69146a."
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Cross-framework audit: same contract, same assertions, all four frameworks — verify the runner output is real (executed, not mocked), the shared core wasn't forked per framework, per-framework deviations are named honestly, and the receipts keep SUGGESTION framing (POC success is evidence, not ratification). Name what the POC does and does not prove for the storage-tradeoff decision."
    receipt:
      result: done
      decision: approved
      summary: "Judge (goal-judge agent, independent) RE-EXECUTED the runner: SUMMARY bare/react/vue/svelte/angular all GREEN, exit 0, 65/65. No core forking, no DOM mocks, no runner bypass — all five targets import ../core/storage.js and assertions live only in the runner against real Chromium. Settle-wait ruled honest (bounded eventual-consistency for UI text; attr+driver sync; still fails on non-settle) with recorded caveat: write UI assertion is now updates-within-2s for all frameworks. Deviations recorded per framework (Angular JIT+zoneless+@if inert; Svelte mount-skip inert + onMount subscribe gap; Vue manual shallowRef bridge; React useEffect READY). PROVES: recommended contract implementable idiomatically in all four with identical observable behavior. DOES NOT PROVE: ratification (artifacts correctly disclaim), SSR beyond React, real compiler emission, Solid/Qwik (frameless primary targets untested), multi-cell/non-string/async drivers/cross-tab/consent."
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Final audit: does the executed evidence satisfy the original ask ('POC across angular, react, svelte, vue, and see if it works... in a new git worktree')? full_outcome_complete requires executed browser proof per framework (or honest blocked receipt), POC committed on the goal worktree branch, and the storage-tradeoff cross-link recorded."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "per-framework works/blocked verdict"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "Original ask fully mapped: POC of storage() built and independently executed green in real Chromium for angular/react/svelte/vue (each WORKS, none blocked) via one shared assertion runner; work committed on worktree-storage-poc in the fresh dedicated worktree per owner directive; storage-tradeoff T010/T999 cross-link recorded. Angular executed, not excused. POC remains EVIDENCE for the still-open API decision — nothing ratified. Second-model branch critique skipped with reason: medium effort, no public API/protocol/security surface, verification executed independently by Judge, workers in scope."

