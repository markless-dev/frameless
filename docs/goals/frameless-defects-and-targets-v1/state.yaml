    type: worker
    assignee: Worker
    status: done
    reasoning_hint: high
    spec: "T031 receipt FINDING 2 and notes/T031-corpus-s8-async.md - AUTHORITATIVE."
    objective: >-
      Make the React emitter FAIL CLOSED, LOUDLY on a state write it cannot lower, instead of
      emitting a raw assignment to a const. Proof before fix: land a test that fails for the RIGHT
      reason - the TS2588 on emitted output - BEFORE the repair.
    why_this_is_urgent_and_is_NOT_about_async: >-
      THIS IS A LIVE CORRECTNESS HOLE IN SHIPPED REACT OUTPUT AND IT HAS NOTHING TO DO WITH ASYNC.
      packages/frameworks/react/src/emitter/index.ts:1775 is `for (const statement of fn.body.body)`
      - write-lowering walks ONLY TOP-LEVEL STATEMENTS. So a state write inside ANY nested function
      is emitted as a raw assignment to the const that useState destructured, and toConstSsa
      additionally renames the nested WRITE TARGET as if it were a version read before freezing it
      with const. Verbatim from tsc 5.9.3 on emitted output:
      "react-then.jsx(20,7): error TS2588: Cannot assign to 'ticks' because it is a constant."
      T031 REPRODUCED IT WITH A PLAIN CALLBACK PROP AS WELL AS WITH .then, SO IT IS ABOUT NESTING,
      NOT PROMISES. The corpus has simply never contained a nested write - that is the ONLY reason
      this is undetected, and it is precisely the class the corpus-breadth phase exists to surface.
    constraints:
      - "PROOF BEFORE FIX, the charter's non-negotiable. Register the failing case FIRST and watch it fail for the RIGHT reason - the TS2588 on emitted output - before repairing anything."
      - "THE MINIMUM FIX IS A THROW, NOT A LOWERING. Do NOT attempt to make nested writes lower correctly in this card - that is a design change and Solid already does it, so a later ruling can port the approach. Emitting a NAMED ERROR is the whole deliverable, and it converts a silent miscompile into a loud refusal."
      - "FAIL CLOSED, LOUDLY - the T033 and T039 precedent. The error must name the write, the enclosing function, and WHAT WOULD OTHERWISE HAVE HAPPENED, because the failure mode is silent and a bare throw teaches nothing."
      - "Do NOT touch packages/frameworks/react/src/emitter/index.ts:161 (replaceFreeNames / the await re-parse). T031 ruled explicitly that repairing that LOUD symptom before this SILENT one would make the silent one harder to find."
      - "No existing golden may move. The current corpus contains no nested write, so a correct repair is invisible to it - which is exactly why the planted case is mandatory."
