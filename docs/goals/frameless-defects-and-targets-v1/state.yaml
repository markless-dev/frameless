        collision_2_is_a_spec_refinement_not_a_defect: "Under a BARE-mutant key the invariant also fires on 'index key AST -> index-key' vs 'index key plugin -> eslint:react/no-array-index-key' - the SAME mutant asserted against two DIFFERENT policies. That pair is DELIBERATE and LEGITIMATE: one bypass shape, two independent detectors. Dropping either loses a detector assertion."
        the_proposed_fix: "Key the mutant dimension on (mutant, policy) as ONE COMPOSITE, not the mutant alone. It still catches all three T018 duplicates, since a copied row copies its policy too - and it RECONCILES WITH T018's OWN ARITHMETIC: 47 rows, 44 distinct, exactly three. A bare-mutant key would have reported four. Recorded rather than applied unilaterally, since it refines T021's 'keyed on both name and mutant'."
      invariant_ready_but_withheld:
        keys: "two independent: row NAME, and (mutant, policy) as one composite"
        exemption_list: "none, and none proposed"
        calibration: "FOUR-sided against a synthetic table, all four observed: clean -> no fires; name collision -> fires on names; mutant collision at same policy -> fires on mutants; same mutant at DIFFERENT policies -> deliberate NON-fire, documenting the key shape by test rather than by comment."
        real_table_results: "solid mutationCases GREEN, solid compositionMutationCases GREEN, react compositionMutationCases GREEN after the forEach rewrite. react mutationCases: two fires, above."
        source: "recorded verbatim in notes/T021-duplicate-mutants.md section 3, ready to paste"
      copier_rule_landed: "Rule 5 in T018's note: a mutation TABLE carries the no-duplicate invariant FROM THE DAY IT HAS TWO ROWS - not from the day someone notices. Two independent keys, with the reasoning for each: NAME because test.each %s makes it the vitest title, so colliding names make a red unattributable AND mutant-keyed scans are structurally blind to it; MUTANT-AND-ITS-POLICY as one key, because two rows asserting different policies against one mutant are two detectors on one shape, not a duplicate. No exemption list. States explicitly that neither Svelte nor Qwik has a table today, so the rule reaches them, Vue and Angular through the NOTE rather than through a copied test."
