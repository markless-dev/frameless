  - id: T043
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    spec: "T031 receipt and notes/T031-corpus-s8-async.md - AUTHORITATIVE."
    depends_on: ["T044"]
    objective: >-
      Rule on the async-handler axis across all six emitters: what each lane must do, in what order,
      and whether S8 can ever land as ratified - or whether Phase F's eighth scenario should be
      re-specified.
    the_structural_result_to_rule_on: >-
      An async boundary is either (a) async/await or (b) a continuation function. SOLID REFUSES
      EVERY ASYNC ARROW and REACT MISCOMPILES EVERY WRITE INSIDE A NESTED FUNCTION, so between them
      they exclude the whole space. That is a proof, not a survey - and it means S8 as ratified is
      unlandable until at least two emitters change.
    the_five_findings: >-
      (1) ANGULAR HAS NO CONCEPT OF ASYNC - PM verified the string does not occur once in its
      emitter; an authored async handler silently becomes synchronous and every instrument passes.
      (2) REACT's top-level-only write lowering - silent, live today, unrelated to async, owned by
      T044. (3) React's replaceFreeNames await re-parse - loud. (4) SOLID's undocumented bare throw
      at :1174, with no dossier ref, no test and no docs, in a lane whose framework supports async
      listeners natively - the hardest blocker. (5) QWIK forbids awaiting a callback prop, i.e.
      forbids authoring the exact await its own emitter generates.
      QWIK IS THE ONLY LANE THAT GETS THIS RIGHT, including the sync$ split generalised on its first
      try from Defect 1's single synchronous site.
    constraints:
      - "Do not implement. Rule."
      - "NONE OF THIS IS UPSTREAM. React, Solid and Angular all support async event handlers natively; every failure is in OUR emitters. So none of it is covered by the owner's autonomy-grant exclusion on outward-facing filings."
      - "Rule on FINDING 1 with particular care: Angular does not REFUSE, it silently changes meaning, and it is the only lane where an instrument-clean output is semantically wrong. Weigh whether a fail-closed throw is enough or whether async must be lowered."
      - "Rule on FINDING 4: Solid's refusal is a bare undocumented throw in a lane whose framework supports the construct. Is it a considered v-limit that was never written down, or an accident? The answer changes the repair."
      - "Say explicitly whether S8 should be RE-SPECIFIED to an axis today's emitters can express, or whether it stays as ratified and Phase F closes at seven with a documented refusal. T028 needs that answer and must not have to infer it."
      - "These are DEFECTS in frameless's own emitted output. Rule on which belong in docs/DEFECTS.md and whether any extends half 1's oracle - T038 ruled the whitespace finding did NOT."
    expected_output:
      - "Per lane: the ruling, the repair, and its order"
      - "Whether S8 is re-specified or Phase F closes at seven"
      - "Which findings become DEFECTS.md entries, and whether half 1's oracle extends"
      - "Worker packages, or an explicit hand-off to the capability goal"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      note: notes/T043-async-axis.md
      rationale: "T031's IMPOSSIBILITY PROOF IS REFUTED. It is valid arithmetic over INVALID PREMISES - it treats two emitter BUGS as fixed points and never enumerated the one authoring that clears both REAL v-limits. Awaiting a promise-valued prop emits correctly in qwik, svelte and vue TODAY; only React (one boolean in a discarded scratch wrapper) and Solid (an accidental flag check, blame-traced to an abandoned commit) refuse. So S8 is RE-SPECIFIED, not dropped, and Phase F closes at EIGHT if the three repairs land. Angular's finding is WORSE than briefed: the lane typechecks NONE of its emitted TypeScript, so the instrument gap IS the defect and a throw would not close it. LOWER, DO NOT REFUSE."
      summary: "Re-derived every finding and overturned the headline. S8 is re-specified around Angular's globals rule and Qwik's callback rule - both AFFIRMED, neither weakened - and lands in six lanes after three small repairs, now carded as T045, T046 and T047."
