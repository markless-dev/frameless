      same_shape_scan: "domcontentloaded / waitUntil / networkidle appears EXACTLY ONCE in the repo - throttled-resume.mjs:52. One caveat recorded: the three-way contract deliberately does NOT wait for Qwik resumption before the cancel click, but that is INSIDE Qwik's envelope, because sync$ QRLs are serialized inline and contracted to run during dispatch. That is the discriminator between a fair test and an unfair one."
      pattern_ruling_rule_4:
        verdict: "T007's three rules are NECESSARY BUT NOT SUFFICIENT."
        evidence: "T018 found a fifth CRLF-fragile search T007's own scan structurally could not see - T007 grepped .replace() STRING literals; R-SH1 is a REGEX literal. The shape was right; the enumerating instrument was narrower than the shape. This audit found TWO MORE instances: step-level conclusion (an unreliable proxy replaced by a second proxy of the same kind, unasserted), and 'an observed green cell' (a single sample as proxy for 'fixed', with nothing asserting the sample was representative)."
        rule_4: "An instrument that establishes a SET or issues a VERDICT must be calibrated against a KNOWN MEMBER. Before trusting a scan's 'these are all N instances', plant an instance it should find. Before trusting a status field, read it on a case whose true value you already know. Before treating a green cell as a verdict, establish the cell's variance."
        not_redundant_with_rule_2: "Rule 2 would have had T007's scan assert THAT IT RAN, not that it COVERED THE SHAPE IT NAMED. T018 found the fifth search via a different pass - its CRLF probe over all 37 disk-read searches - which is Rule 4 in action without being named."
        placement: "Belongs on all three adapter charters beside rules 1-3."
      missing_evidence:
