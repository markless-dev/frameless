        5: "Upstream solid-js. Measured divergent, 33/13 DOM divergences."
        6: "Instrument fault, repaired. Witnessed: YES - the permuting cases assert both that the new view holds AND that the old positional comparison fails."
      witnessed_failure_audit: "PASSES, with one disclosed exception - defect 3 cause A, honestly labelled in T008's receipt rather than concealed."
      flag_rulings:
