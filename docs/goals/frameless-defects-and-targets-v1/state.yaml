    reasoning_hint: medium
    spec: "notes/T015-cancellation-observability.md sections 4 and 5, plus the pm_refinement_defect_1_is_misnamed block on T002's receipt"
    objective: >-
      Close defect 1: emit the array + sync$() form so T002's witnessed failure turns green, AND
      add a frameless-owned gate policy that rejects preventDefault() inside an async QRL while
      allowing it inside a sync$() QRL, so the released expectation is not a green vacuum.
    owner_correction: >-
      CORRECTED MID-FLIGHT by the repo owner, who is on the Qwik core team. The earlier instruction
      to emit preventdefault:click was WRONG. Qwik event props accept an ARRAY of QRLs, run in
      order: onClick$={[handleClickSync$, handleClick$]}. The first element is a SYNC QRL made with
      sync$() - serialized inline into the HTML, so it executes synchronously during dispatch,
      before resumption, which is exactly why preventDefault() works there. The second is a normal
      async QRL carrying the rest of the body. The correct lowering is therefore to SPLIT the
      handler, not to swap in a JSX attribute.
    lowering_for_s3:
      - "cancel-submit: body is only event.preventDefault(), so it becomes a single sync$() QRL."
      - "The original type=button submit handler: body is event.preventDefault(); writes = 1; writes = 2; onTrace(...). This is the real case - sync$((event) => event.preventDefault()) first, then $(async () => { writes... }). The sync part cancels; the async part does the state writes."
    allowed_files:
