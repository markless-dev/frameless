  - id: T011
    type: judge
    assignee: Judge
    status: done
    dispatch:
      concurrent_with: T008
      rationale: >-
        Judge tasks are read-only, so there is no write scope to collide. Its inputs - the T003 and
        T005 receipts and docs/emitter-idiom-policy.md - are all already on disk and are not in
        T008's allowed_files, so T008 cannot move them underneath it.
      board_status_note: "Queued for the one-active-task invariant; genuinely dispatched."
    reasoning_hint: high
    objective: "Rule on how the IR represents conditional cancellation - the half of defect 1 deliberately deferred from T003."
    inputs:
