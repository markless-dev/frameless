      finding_stronger_than_the_diagnosis: "The old loop's failure mode on a non-compositing engine was NOT a 500ms throw - it was a HANG. Parked on `await new Promise(r => requestAnimationFrame(...))`, the `while (performance.now() < deadline)` check could never be reached, so with frames stubbed off entirely both lanes died at 'Test timed out in 15000ms' rather than reporting anything. That is stronger than T006's 240/260ms-per-frame tolerance measurement, was not previously on record, and is now pinned by a test."
