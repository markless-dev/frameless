        specced_as: "T016, queued before the adapter work on the Judge's recommendation"
        already_satisfied: "The decision-site comment requirement is met at packages/frameworks/qwik/src/emitter/index.ts:470-486. Only the worked example is outstanding."
        third_gap_nobody_flagged: "docs/DEFECTS.md defect 2 is UNTOUCHED by T004 and now stale: still reads 'Status: diagnosed', still instructs 'Do this first: reproduce on an untouched pnpm create qwik app' (work that is done), and still repeats the 'zero network requests' claim T004 explicitly corrected. It was outside T004's allowed_files."
      pm_call_a_qwikloader_inline:
        ruling: "NO. demos/qwik does not adopt qwikLoader: 'inline'."
        reasoning: "The entire asset of frameless-qwik-v1 is that activation neutrality was proven on official tooling AS IT SHIPS. This is a non-default render option; setting it converts the demo from 'what a newcomer gets' into 'what a newcomer gets after we tuned it', specifically to hide a defect we just proved real. That is the charter's likely_misfire arriving through a config knob instead of a raised timeout. It would also buy a green lane that measures nothing - the lane exists to detect this regression class. A red-but-annotated lane costs one line of CI noise; a demo that quietly diverges from the default scaffold costs the one claim frameless makes that is hard to make."
