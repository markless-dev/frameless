      - demos/qwik/src/emitted/KeyedTodo.jsx
      - demos/qwik/src/emitted/EventForm.jsx
      - docs/DEFECTS.md
      - docs/goals/frameless-defects-and-targets-v1/notes/T003-upstream-eslint-qwik.md
    verify:
      - "pnpm check"
      - "pnpm test"
      - "pnpm test:browser"
      - "pnpm e2e"
    stop_if:
      - "Need files outside allowed_files."
      - "You are about to key the new gate policy on `async`. Do NOT - see the constraint below; that would reproduce upstream's blind spot in our own gate."
      - "You are about to revert the emission shape to $(handler) to satisfy the upstream rule. That inverts frameless-idiom-policy-v1."
      - "The change would require deciding how the IR represents CONDITIONAL cancellation. That is T011/T012 - stop here."
      - "pnpm e2e is still red for Qwik after the change - report rather than weakening the assertion T002 just built."
      - "React or Solid regress in any lane."
      - "Verification fails twice for the same reason."
    constraints:
      - "UNCONDITIONAL case only. Both S3 preventDefault sites qualify: the original type=button handler and the new cancel-submit handler, each calling preventDefault as the first/only statement with no guard."
      - "HARD CONSTRAINT on sync$(): its body CANNOT close over reactive state - no signals, no stores, nothing from component scope. It runs before the container resumes and may only read what is synchronously on the event, such as event.target attributes. If the sync part would need a signal, STOP - that is conditional cancellation and belongs to T011/T012."
      - "GREEN-VACUUM WARNING from T015: flipping the qwik gate.test.ts expectation to [] is NOT sufficient, because [] is ALREADY what unfixed main produces - the upstream rule matches $() ancestry and never checks async, so it cannot fire on the raw-handler shape. A flip alone ships a gate that would pass identically if the emitter were never touched."
      - "Therefore, IN THE SAME CHANGE: add a frameless-owned Qwik gate policy rejecting preventDefault() inside any emitted event-handler body, mutation-tested in the pattern of gate.test.ts:93-110, and only THEN release the known-failing expectation. Do not split these."
      - "THE POLICY MUST NOT KEY ON `async`. T002 proved defect 1 is misnamed: the emitted cancel-submit handler was `onClick$={(event) => {...}}`, fully SYNCHRONOUS, and it failed anyway. The cause is QRL LAZINESS - the segment is not resident when the event fires - not the handler being async."
      - "Key instead on WHICH KIND OF QRL the call lands in: reject preventDefault() inside an async/regular QRL body, ALLOW it inside a sync$() QRL body. The owner correction makes this sharper, not looser - sync$() is precisely the construct that makes the call legitimate, so the policy has a principled line to draw rather than a keyword to match."
      - "Do NOT revert the emission shape to $(handler)."
      - "docs/emitter-idiom-policy.md governs the emission-site form choice - now the array + sync$() form. Run the six gates and record the outcomes. Note Gate 1 is genuinely satisfiable here, unlike for the absent frameworks: Qwik is in the lockfile, so both forms can be measured against the shipped build."
      - "RIDER - file the upstream gap against eslint-plugin-qwik in notes/T003-upstream-eslint-qwik.md for the owner to submit: no-async-prevent-default matches $() ancestry only, misses bare onClick$={...} JSX props, and never checks `async` at all despite its name. Verified against eslint-plugin-qwik@2.0.0-beta.38 dist/index.js. Include that a synchronous handler fails identically, so the rule's name is also wrong."
      - "RIDER - apply the six docs/DEFECTS.md corrections in notes/T015-cancellation-observability.md section 5, PLUS a seventh from T002: defect 1 is misnamed, since a synchronous QRL handler fails identically. The lowercase rename is NOT needed - the PM corrected the board and charter references to docs/DEFECTS.md instead."
      - "Expected end state: pnpm e2e FULLY green including Qwik, pnpm test 552/552 with the gate expectation released and replaced by the new policy's own tests."
