          note: "FALSIFIES THE BRIEF - the throttled step reads conclusion=success while its log ends '##[error]Process completed with exit code 1'"
        - cmd: "windows cell traced across four post-T008 runs via logs"
          status: pass
          note: "e04b823 RED, dfa9350 green, 0cf937b RED, 39c8a6d green"
        - cmd: "webkit cell traced across 30 CI runs"
          status: pass
          note: "five consecutive greens BEFORE T017; all eight reds cluster in two contention windows"
