      the_premise_it_was_told_to_check_and_falsified:
        what_the_pm_said: "Verify the CI cells at STEP level, because a continue-on-error JOB reports success."
        measured_truth: "Step level is ALSO unreliable. GitHub reports conclusion: success for a FAILED continue-on-error STEP, not just a job. The qwik-throttled step is the control that proves it - findings-007 says it fails, and it does: the step object reads success while the log ends '##[error]Process completed with exit code 1'."
