      DEFECT 2 IS NOT A DEFECT. It is an instrument measuring "is the page interactive with no JS",
      whose answer is no, everywhere. The upstream filing is RETRACTED and must not be sent.
      Three parties missed this - the Worker, the Judge at T005, and the PM - by never asking
      whether the instrument was fair before interpreting its output.
    reasoning_hint: medium
    objective: "Determine whether defect 2 (clicks dropped under throttling) is upstream Qwik or frameless, by reproducing on an untouched pnpm create qwik app."
    allowed_files:
