      summary: "Deliverable 1 LANDED AND GREEN: scripts/corpus-mutation.mjs (root mutate:corpus) mutates packages/frameworks/<lane>/generated/<S>.<ext>, runs the lane's box, requires red, records the site, then restores and verifies across twelve tracked directories. TWO-SIDED CALIBRATION ON THE EXISTING CORPUS: 18/18 RED, every one at the lane's own in-box assertion. A further 6/6 calibrate the harness's second verdict path. Deliverable 2 STOPPED: S4 is not capability-free - @markless/compiler 0.1.1 leaves the inner repeat's collectionGraphNodeId unset when the collection comes from the enclosing repeat item, seven nested-row sites lower to reads: [], and Solid throws."
      THE_STOP_CONDITION_THAT_OUTRANKED_THE_PHASE_PASSED: "This was the single most important measurement in Phase F, and it came back clean. The card said plainly: if the existing corpus cannot be killed, the 18 observation strings were never measuring the corpus, and that finding would outrank all of Phase F. THE EXISTING CORPUS IS KILLABLE - 18 of 18 mutants went RED, one per lane per scenario across all six lanes. The oracle this project has been building for weeks does measure what it claims to measure. PM independently ran the harness's dry-run arm and confirms all 18 mutants anchor UNIQUELY and every one CHANGES BYTES, and that the harness refuses to issue a verdict in dry mode."
      S4_LANDS_IN_ZERO_OF_SIX_NOT_FIVE_OF_SIX_AND_THAT_IS_THE_FINDING: "FIVE LANES EMITTED SUCCESSFULLY AND THAT IS EXACTLY THE PROBLEM. React, Qwik, Svelte, Vue and Angular all produced output - Angular produced the repo's FIRST nested call site, onH9Click(group, row, $event), outermost first, precisely as ruling 3d specifies. But collectEventScopes walks node.item down the template and never consults the reads, so those five printed the AUTHORED EXPRESSIONS OVER AN IR THAT IS WRONG. Correct-looking output for the wrong reason. Only Solid, which validates key semantics, threw and exposed it. HAD THE WORKER SHIPPED THE FIVE GREEN LANES AND FILED SOLID AS AN EMITTER BUG, THE CORPUS WOULD HAVE BEEN SILENTLY POISONED with a scenario whose IR carries seven zero-read sites - and every future mutation-budget cell over S4 would have been measuring nothing."
      root_cause_measured_not_inferred: "PM VERIFIED BOTH SITES IN SOURCE. packages/compiler/src/build.ts:987-992 reads `const repeatItems = new Map(environment.repeatItems); if (repeat.collectionGraphNodeId) { repeatItems.set(repeat.itemName, ...) }`. For a nested repeat over group.rows the vendored @markless/compiler 0.1.1 graph NEVER SETS collectionGraphNodeId, so the guard is skipped, the inner item `row` is never registered in repeatItems, and every row.* site downstream silently lowers to reads: []. It FAILS CLOSED, which is the right instinct and the wrong outcome here - it fails closed into silence rather than into an error. packages/frameworks/solid/src/emitter/index.ts:1062 then throws `TemplateKeyedRepeat repeat:1 has unconsumed key semantics`."
