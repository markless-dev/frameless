  - id: T021
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: medium
    objective: "Adjudicate the three duplicated React mutation rows T018 found and deliberately did not delete."
    inputs:
      - "notes/T018-mutation-no-op-audit.md finding F3"
      - "packages/frameworks/react/test/gate.test.ts - the three rows, each marked in place with a comment naming its twin"
    constraints:
      - "Do not implement; rule and spec."
      - "AUTONOMY: the owner granted continuous execution to goal end on 2026-07-27 and is unavailable. This is a Judge ruling, not an owner decision - rule it on the evidence and record the reasoning. Do not defer it upward."
      - "THE SERIOUS ONE: 'direct listener iteration notify-per-write shared tear' is byte-identical to 'notify-per-write shared tear', while its two siblings ARE distinct shapes. So R-SH3 is guarded against two bypasses where the names claim three - one fewer shape covered than the corpus advertises. Rule whether to rewrite it to the distinct shape its name promises, or drop it."
      - "The other two - 'computed-member setter' duplicated verbatim, and 'react import allowlist' identical to 'unused import' - are not vacuous; each mutates and exercises its policy. Rule whether they are harmless redundancy or the same copied-and-half-edited mechanism."
      - "T018 left them in place because deletion is a COVERAGE decision and its card forbade dropping mutations. That was the right call; the coverage decision is yours."
      - "Consider whether a no-duplicate-mutant invariant test should exist. It would fail today on exactly these three, so it lands with the adjudication or not at all."
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      rationale: "T018's F3 was OVER-READ: 'direct listener iteration' is exactly what its twin already does, so rewriting to 'direct' would have made a THIRD near-duplicate - the outcome the T021 card explicitly warned against. The real find is next door: invokesListenerSet's .forEach branch is exercised by nothing in either corpus. Plus a class T018's mutant-only scan could not see - duplicate row NAMES make two pairs of test.each verdicts unattributable. Rewrite all three to branch-grounded shapes and land a calibrated name+mutant invariant with an EMPTY exemption list."
      the_over_read_and_where_it_originated:
        what_t018_said: "'the distinct shape that row's name promises was never written' and 'R-SH3 is guarded against two bypasses where the names claim three'."
        what_is_actually_true: "PM VERIFIED alongside the Judge: the twin at gate.test.ts:588-595 injects `for (const listener of countListeners) listener();`. That IS direct listener iteration. Four rows cover THREE distinct shapes, and no name promised anything unwritten."
        the_harm_it_would_have_caused: "A Judge accepting it at face value would have dispatched a Worker to write 'direct listener iteration' - producing exactly the third near-duplicate the card warned about. The card inherited the error from the note; the NOTE is where it originated, and that is now recorded on T018's own receipt."
      the_real_find:
        unexercised_detector_branch: "invokesListenerSet's .forEach(cb) branch, packages/frameworks/react/src/gate/custom-policies.ts:1133-1152, including its recursion into the callback. PM VERIFIED: grep forEach returns ZERO across both react and solid gate.test.ts, while the branch exists at :1135. Solid's gate has no equivalent branch, so this is React-only."
        why_it_matters: "This is new DETECTION CAPABILITY, not tidying. It is what moves the package from 'record it, leave it' to worth doing."
      fourth_instance_of_the_recurring_pattern:
        what: "T018's duplicate scan compared MUTANTS. Names collide too: 'computed-member setter' x2 and 'dynamic computed-member setter' x2 - the latter pair having DISTINCT mutants."
        consequence: "test.each(mutationCases)('rejects the %s bypass mutation') at :716 makes the row name the vitest title, so those are two pairs of identically-titled tests and a red cannot be attributed to a row. Solid has zero duplicate names."
        the_pattern: "Instrument narrower than the shape it enumerates - after T007's string-literal scan blind to a regex literal, and the PM's literal grep for continue-on-error blind to the expression form. Rule 4's family."
      the_mechanism_is_witnessed_not_inferred: "gate.test.ts:272-295 is a copied PAIR whose first row was never edited (byte-identical to :255) while its sibling WAS - `({ run: setValue })[key](1)` vs `({ [key]: setValue })[key](1)`. Half-edited, literally."
      rulings:
        item_1: "REWRITE to the forEach shape, NOT to 'direct listener iteration'. The R-SH3 notify family then maps 1:1 onto the detector's four branches - for-of, forEach, helper-forwarding, member-method helper - which is the mapping a copier should inherit instead of a name list."
        item_2: "SAME copied-and-half-edited mechanism, not harmless redundancy. Renaming alone would hide a byte-identical row under a fresh name, so REWRITE both to shapes that reach real branches: identifier-object resolution combined with a constantString-folded computed access, and the !imported default-React-import branch that only 'forwardRef member' reaches incidentally and never asserts."
        item_3: "YES to the invariant, keyed on BOTH name and mutant, with an EMPTY exemption list. The card's objection - a test suppressed for three known cases is its own vacuity risk - is exactly why rewriting beats leaving: after the rewrite there is nothing to suppress. Calibrated three-sided against a synthetic table, since on the real tables it will only ever be green."
        svelte_and_qwik: "NO, and a premise needs correcting. Svelte's corpus copied T018's mutate/mutateAll idiom but NOT the table shape - it is 14 hand-written tests with no mutationCases array and no test.each. Qwik likewise. So 'the three adapter boards inherit React's mutation-table idiom' is only HALF TRUE. The durable carrier is a fifth rule in T018's 'rules for copiers': a mutation TABLE carries the invariant from the day it has two rows. That is what reaches Vue and Angular."
      is_it_worth_doing: "The count gap alone - 47 advertised, 44 distinct, 6% - would NOT have justified a package, and the Judge says it would have ruled 'record it, leave it'. Two things move it: the unexercised forEach branch (new detection capability) and the unattributable duplicate test titles (a verdict-attribution defect of exactly the family Rule 4 exists for). The count correction is the least valuable third."
      missing_evidence:
        - "The Judge is read-only and did NOT run the forEach mutant. That the gate catches it via invokesListenerSet rather than the object-method notification rule at custom-policies.ts:982-1028 is INFERRED from writeCount being an arrow in a VariableDeclarator. The stop_if on the exact violation message is what converts that inference into evidence."
        - "Whether the second 'dynamic computed-member setter' reaches a different traversal from the first. Both appear to fall to the null-name fallback loop, making them behaviourally equivalent though textually distinct. Recorded so a future audit does not mistake textual distinctness for branch distinctness."
      dissent:
        - "The strongest case against this package is that three rows in 126 is noise and this board's live failure mode is fixing everything it notices. The Judge accepts that case for the count correction alone and rejects it once the forEach branch and the unattributable titles are in frame, because both change what the suite can DETECT rather than what it reports."
        - "T018's F3 framing would have caused harm if accepted. Recorded that the note, not the card, is where the error originated."
        - "'Leave the two lesser rows' was a defensible alternative and the Judge nearly took it. What tipped it: leaving them forces the invariant to carry a suppression list, which is its own vacuity risk. Deletion would also give an empty list at lower cost; rewrite was chosen only because each rewrite buys a real, named, source-grounded branch rather than just an honest count."
