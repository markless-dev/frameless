        cause: "boundedQuiescence bounds wall-clock time over a loop whose progress is gated entirely on three requestAnimationFrame callbacks. rAF's contract is 'before the next repaint'; a headless browser that never composites owes no repaint and therefore no callback on any schedule. 500ms silently encodes a >4fps floor - two rAF intervals must complete within it - that no specification provides."
