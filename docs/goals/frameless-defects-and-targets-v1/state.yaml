    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Ratify the corpus-breadth contract: which scenarios land, in what order, and the cross-lane mutation budget that decides when the corpus is ENOUGH rather than merely bigger."
    depends_on: ["T013", "T014"]
    pm_discharged_the_T014_dependency_in_substance: >-
      2026-07-27, ON OWNER INSTRUCTION to continue and to prioritise more scenarios. T013 is DONE.
      T014 is still open, but the SUBSTANTIVE reason T024 was sequenced behind it is already
      satisfied: the dependency existed so that a new scenario would pay out across every lane at
      once rather than being retrofitted later. ALL SIX LANES NOW EXIST AND ARE GREEN - react,
      solid, qwik, svelte, vue and angular, with 18 byte-identical observation strings, verified by
      the PM at commit a90a2ea. T014's remaining work is the two adapter boards' documentation and
      gate-MESSAGE folds, which touch no corpus, no fixture, no golden and no emitter output. There
      is nothing left in T014 that could change what this ruling should say.
      RECORDED RATHER THAN SILENTLY OVERRIDDEN, because a depends_on edge that gets stepped over
      without explanation is how a board stops meaning anything.
    lane_count_corrected: >-
      This card and the Phase F worker cards were written when there were FIVE targets. There are
      SIX. Every "all five lanes" has been corrected to SIX, including the stop_if that rejects a
      partial matrix. A scenario landing in five of six is now the broken-matrix case the cards
      were always trying to describe.
    why_this_exists: >-
      THE CORPUS IS THREE SCENARIOS. 10 fixtures, 3 IR goldens - S1, S2, S3 - and every emitter,
      gate, golden and e2e row is that same corpus in different costumes. frameless-testing-audit
      called it "great oracle, tiny corpus" and T018 called the corpora "sound by circumstance, not
      design". The oracle is now strong enough that new scenarios pay out across FIVE targets at
      once, which is what makes breadth the highest-value remaining investment.
    the_selection_principle_binding_on_this_task: >-
      PICK BY DIVERGENCE AXIS, NOT BY FEATURE COUNT. Activation neutrality can only break where
      frameworks actually disagree, so a scenario that re-exercises a covered axis buys nothing.
      Today's three cover: S1 derived state + single handler + text interpolation; S2 keyed list +
      loop-variable closures + list mutation; S3 forms + preventDefault/syncPolicy + delegation and
      bubbling + multiple handlers per host. Every divergence this project has actually been bitten
      by falls OUTSIDE those or on their edges.
    the_nine_proposed_ranked_by_evidence:
      - "1. PARENT -> CHILD COMPOSITION (an emitted component consuming another emitted component). THE SINGLE HIGHEST-VALUE ADDITION. Every golden today is STANDALONE, which is exactly why the wrong-typed-prop hole (IR-8) is invisible and why vue-tsc and Angular strictTemplates were BOTH ruled to have 'a population of zero'. This one scenario converts three deferred instruments into live ones."
      - "2. CONDITIONAL RENDERING WITH BRANCH TEARDOWN. Block-based (Svelte/Vue) vs reconciliation (React/Solid) vs resumed (Qwik) diverge hardest here. T020 already found a guarded control that stayed CORRECT while its guard had stopped being consulted."
      - "3. FULL FORM CONTROLS - radio, select, textarea, multi-checkbox. In one night this repo hit React's defaultValue attribute rewrite, Svelte's remove_input_defaults and Solid's attr:. Three frameworks, three different behaviours, on the ONE control currently tested."
      - "4. ASYNC EVENT HANDLERS. Defect 1 was exactly this - Qwik QRL laziness, repaired with the sync$ array form. Currently proven at ONE site."
      - "5. NESTED LISTS (a loop variable inside a loop variable). Angular T002 ruling 3d explicitly specifies 'every enclosing @for variable, outermost first' and the corpus has ZERO instances. A rule with no instances is folklore."
      - "6. EFFECTS WITH CLEANUP (mount/unmount ordering). Teardown ordering is where frameworks differ most and where nothing is asserted today."
      - "7. BOOLEAN AND DYNAMIC ATTRIBUTES (disabled, hidden, aria-*). Notorious present-vs-absent-vs-\"false\" divergence, adjacent to the exact bug class Option D spent two audits on."
      - "8. WHITESPACE-SENSITIVE TEXT. Vue's SFC compiler defaults to whitespace:'condense', a DIFFERENT rule from Svelte's. LIVE RISK: the Vue T002 judge flagged S2's '1/2' possibly rendering as '1 /2'."
      - "9. REFS / DIRECT DOM ACCESS. An untouched escape hatch that every framework spells differently."
    target_number: >-
      TWELVE total for the current IR surface (the three that exist plus these nine). Roughly SIXTEEN
      at full IR maturity, once IR-1 two-way binding, IR-2 custom events, IR-3 slots and IR-6
      class/style bindings are closed - each adds one axis. NOT THIRTY: a scenario now costs five
      emitters, five goldens, five demo routes and e2e wiring, so past ~15 the repo pays 5x per unit
      for axes already covered.
    the_caveat_that_outranks_the_number: >-
      SCENARIO COUNT IS A PROXY, AND THIS PROJECT HAS BEEN BURNED BY PROXIES REPEATEDLY - four of six
      original defects were instrument faults, and the T999 re-audit found the same fault recurring
      one layer up IN THE DOCUMENTATION. A corpus of 12 that nothing mutates proves LESS than a
      corpus of 6 with two-sided calibration. So this task must also ratify a CROSS-LANE MUTATION
      BUDGET: for each scenario, at least one mutation PER EMITTER that must go RED in the e2e
      matrix. The model is T009's require-each-key result - an unkeyed {#each} compiles clean,
      reconciles wrong, and drew EXACTLY ONE violation across the whole gate. That single measurement
      said more about coverage than a hundred passing assertions. CONFIDENCE ARRIVES WHEN A MUTATION
      CANNOT SURVIVE, NOT WHEN A FILE COUNT HITS A NUMBER.
    constraints:
      - "Do not implement. Rule."
      - "Rule the ORDER, not just the set. Scenario 1 (composition) is claimed to be highest-value; confirm or overturn with reasoning."
      - "Reject any scenario that cannot be shown to exercise an axis the existing three do not. Adding volume is not the goal."
      - "Slice into Worker packages sized so one package lands one coherent vertical - emitter change plus goldens plus demo routes plus e2e wiring across ALL FIVE targets. A scenario landed in three lanes and not five is a broken matrix, not progress."
      - "Any scenario requiring an IR change must be separated out and justified, not folded in silently."
    expected_output:
      - "Ratified scenario set with per-scenario divergence axis and the evidence it is uncovered"
      - "Landing order with reasoning"
      - "The cross-lane mutation budget, concretely: what mutation, which lane, what must go red"
      - "Worker slicing with exact objective, allowed_files, verify and stop_if per package"
      - "The stopping rule - what evidence closes Phase F"
