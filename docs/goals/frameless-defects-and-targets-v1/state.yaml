        form_choice_between_the_two_sanctioned_forms: "Never gated. Settled by the owner's correction, which the Judge does not overturn. Two facts recorded so it is not reopened: the array carries the rest of the handler body, which preventdefault:click cannot, so the split is needed regardless at the type=button site; and preventdefault:click is element-level while SyncPolicy is per-event-record."
        preamble_must_be_sharpened: "The preamble currently defines forced lowering purely by EXPRESSIBILITY (Angular templates forbid arrow functions). That does not cover a form that is perfectly legal and merely wrong. Without the addition, each adapter re-improvises T003's argument and one will improvise it wrong - most likely by reframing a genuine G5 FAIL as forced lowering to push a change through. Naming the test is what stops forced lowering becoming an escape hatch. Svelte's stopPropagation-with-delegation (worked example 6) is the same species."
      gate_2_assessment:
        verdict: "T003's judgement call UPHELD; closed as no longer re-openable"
        three_grounds: "The gate's own question is about the SINGLE MODULE being emitted; every other item in its failure list is an obligation on a third party, so the import clause read self-scoped would be the only one out of family. Worked example 1 already passes G2 with $ in the baseline's import list, so the literal reading would retroactively invalidate a shipped ruling. And the emitter already manages its own framework imports for useSignal/useStore/useComputed$."
        fix_the_wording: "It should not have required a judgement call. Scope the clause to 'an added import list entry IN ANOTHER MODULE'. The same ambiguity would otherwise bite Vue's defineModel, Angular's input()/output(), and Svelte's `on` from svelte/events - which worked example 6 already commits to and which fails G2 under the literal reading."
