# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Frameless defects and new targets"
  slug: "frameless-defects-and-targets-v1"
  kind: existing_plan
  tranche: >-
    Five phases, each ending in its own Judge audit: integration (merge the
    testing branch), Phase A emitted-output correctness (defects 1-2), Phase B
    diagnose the undiagnosed (defects 4, 6, 3-B), Phase C portability and
    consumption (defects 3, 5), then Phase D/E the shared IR foundation and the
    three adapters via their existing boards.
  status: active
  oracle:
    signal: >-
      TWO halves, both required. (1) DEFECTS: all six defects in docs/DEFECTS.md
      closed or explicitly ruled non-issues with receipts; the three-way contract
      asserts the default action is prevented in ALL THREE frameworks and Qwik
      passes it; every continue-on-error flag left by the testing goal
      (qwik-throttled throttled step, Windows cell, WebKit cell) is removed or
      carries a receipt justifying why it stays. (2) TARGETS: pnpm e2e includes
      Svelte, Vue and Angular rows on official scaffolds at pinned lockfile
      versions, with S1/S2/S3 observations ASSERTED equal to the existing three.
    cadence: "at every phase audit, and at final audit"
    final_proof: >-
      A final audit receipt that certifies the phase audits rather than
      re-deriving everything, and enumerates: per defect, the fix or ruling and
      the test that failed for the right reason before it; the current state of
      each continue-on-error flag; and a green pnpm e2e naming all six framework
      rows. A receipt listing green checks without a witnessed prior failure per
      fix does not close this goal.
  intake:
    original_request: >-
      Setup a goal ready to start the work for vue, angular and svelte once the
      testing goal is done and merged, based on the board we discussed - and on
      top of that, look at docs/DEFECTS.md.
    interpreted_outcome: >-
      Close the six open defects, then add Vue, Angular and Svelte as targets, in
      that order because the defect work strengthens the harness and settles the
      IR decisions the adapters inherit.
    input_shape: existing_plan
    audience: "frameless maintainers, Windows contributors, and consumers of emitted Solid/Qwik output"
    authority: approved
    proof_type: test
    completion_proof: "Both oracle halves, certified by a final audit over the phase audits."
    likely_misfire: >-
      Treating the defects list as a checklist and fixing symptoms. Three of six
      are explicitly NOT diagnosed. The fastest way to fail this goal is to raise
      the WebKit timeout, make the rename comparison order-insensitive, and call
      two defects closed - converting two possible real findings into silence.
    blind_spots_considered:
      - "SECOND MISFIRE: starting the adapters first. Defect 1's fix extends the three-way contract to assert cancellation; add three frameworks before that and you retrofit cancellation assertions into three adapters instead of inheriting one stronger bar."
      - "Defect 1 has two halves and they are separate changes. The preventdefault:click emission is bounded; the IR's representation of CONDITIONAL cancellation (sync$ lowering, a gate policy proving a sync$ body reads no reactive state, a fail-closed v-limit) is a design decision that must not be rushed into the same change."
      - "Defect 2 may be entirely upstream. The board must be able to close it as 'filed against Qwik' without that counting as a failure - emitted components carry no bootstrap logic of their own."
      - "OWNER OVERRODE the prep recommendation of two separate goals, preferring a single board. The unbounded-tranche risk is real and is mitigated structurally: every phase ends in its own Judge audit and full_outcome_complete stays false until the last one. If the board starts sprawling, the PM should propose splitting rather than pushing on."
    existing_plan_facts:
      - "SOURCE: docs/DEFECTS.md, a ranked six-defect summary produced by frameless-testing-ci-v1. Full per-defect notes live in docs/goals/frameless-testing-ci-v1/notes/findings-002 through findings-007."
      - "ALL line references in docs/DEFECTS.md are on branch goal/frameless-testing-ci-v1, UNMERGED. A botched merge silently invalidates the input document. This is why T001 exists."
      - "Defect 1 (highest): Qwik emits preventDefault() inside an async QRL at packages/frameworks/qwik/generated/S3.jsx:38. Diagnosed BY RULE (Qwik's no-async-prevent-default); runtime divergence NOT yet demonstrated. Fix per the owner, who is on the Qwik core team: unconditional cancellation -> the preventdefault:click attribute; conditional -> sync$(), which CANNOT close over reactive state. S3 is the unconditional case (s3-event-form.tsrx:37, first statement, no guard)."
      - "Defect 1 ordering is prescribed: (1) extend the three-way contract to assert the default action is prevented in all three frameworks, (2) WATCH IT FAIL for Qwik, (3) emit preventdefault:click and watch it pass. Step 2 is not optional - the rule fired but no runtime failure has been demonstrated."
      - "Defect 2: Qwik drops clicks under 300ms/400kbit throttling on a PRODUCTION build - zero network requests issued after the click, so the handler QRL is never even requested. The click is LOST, not delayed. Dev-bundle size ruled out. First action is to reproduce on an untouched pnpm create qwik app to separate upstream from frameless; upstream looks more likely."
      - "Defect 3: 35 tests failed across 8 files on windows-latest/Node 24 (501 passed); macOS clean on the same run. Cause A CONFIRMED: format-emitted.test.ts uses execFileSync('npx', ...) and Windows npx is npx.cmd, unresolvable without shell:true; affects both the React and Solid copies. Cause B SUSPECTED ONLY: solid/test/gate.test.ts:610 expected [] to include 'S-SH7', most likely CRLF line endings. Labelled a guess in the source doc; confirm before fixing."
      - "Defect 4: react-browser (webkit) adapter-input.browser.test.ts - 'Observable DOM did not quiesce within 500ms'. Firefox and Chromium pass everything; only WebKit, only this test. TWO READINGS not yet separated: the 500ms boundedQuiescence bound was chosen against Chromium and never tested elsewhere, OR WebKit genuinely handles React controlled inputs differently. DO NOT RAISE THE TIMEOUT FIRST - it makes the symptom vanish under either reading."
      - "Defect 5: emitted S2.jsx and S3.jsx use attr:value, which solid-js's InputHTMLAttributes does not declare. Three type errors. NOT a runtime bug - e2e passes all nine cells and the Solid browser lane passes 44/44. Already mitigated by solid-attr-namespace.d.ts declaring attr:${string}. Open question: is attr: necessary (a compiler-behavior question) or is this solid-js's typing gap (upstream)? Informative wrinkle: the HANDWRITTEN Solid references use attr:value too, so the emitter reproduces a house idiom rather than inventing one - which makes the upstream reading more plausible."
      - "Defect 6: metamorphic.test.ts's whole-IR rename invariant holds on all three checked-in fixtures but fails generatively once a program has several locals. Counterexample fast-check seed 20260726: three state locals, one text node, rename epsilon9 -> zpsilon9. HYPOTHESIS ONLY: the rename moves that name from first to last alphabetically and something orders locals by name. NOT VERIFIED. The alternative - declaration order genuinely unstable under renaming - is more serious."
      - "Three defects are currently HELD so a fix cannot land silently: defect 1 as an exact-equality known-failing expectation in qwik/test/gate.test.ts; defect 2 as the qwik-throttled job (unthrottled control NOT continue-on-error, throttled step is); defects 3 and 4 as continue-on-error matrix cells."
      - "CARRIED-OVER CONSTRAINT from the source doc: every fix should be preceded by a test that fails for the right reason. That discipline is what found all six."
      - "findings-001 (engines.node '>=20' was false) is FIXED and closed - set to >=22 from what the matrix proved green."
      - "ADAPTERS: three per-framework boards already exist and are NOT re-specified here. This goal hands off to docs/goals/frameless-svelte-v1, -vue-v1 and -angular-v1. All three currently read status: active / active_task: T001 with nothing running them, which misleads a future /goal; fixing that is part of this board."
      - "Svelte runs first because it owns the IR-4 ruling (target-framework-version input) that Vue's defineModel (3.4+) and Angular's signal input()/output() (>=17.1/17.2) both inherit. The lanes are independent; the sugar rulings are not."
      - "docs/emitter-idiom-policy.md governs every emission-site form choice in both phases."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/frameless-defects-and-targets-v1/"
    command: "node ~/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/frameless-defects-and-targets-v1"

active_task: T003

tasks:
  - id: T001
    type: pm
    assignee: PM
    status: blocked
    reasoning_hint: medium
    objective: "Merge goal/frameless-testing-ci-v1 into main, prove main is green, and continue only if both are clean."
    inputs:
      - "goal/frameless-testing-ci-v1 (39 ahead of main; main 13 ahead of it - genuinely diverged)"
      - "docs/goals/frameless-testing-ci-v1/state.yaml T999 receipt (decision: complete, full_outcome_complete: true)"
    constraints:
      - "The owner explicitly authorised merging and continuing."
      - "Inspect before acting. The branches have diverged; expect conflicts in packages/frameworks/qwik/ (its T006 did Qwik gate parity, main carries the raw-handler emitter change) and in CI config."
      - "Do not rewrite published history. No force-push."
      - "EVERY line reference in docs/DEFECTS.md points at this branch. If the merge mangles a referenced file the input document is silently invalidated - spot-check the referenced locations after merging."
      - "The two testing-goal board directories are deliberately untracked. Do not sweep them into a commit; use explicit paths, never `git add docs/goals`."
    expected_output:
      - "Merge commit sha, or a blocked receipt naming the conflict"
      - "Full suite on merged main: pnpm check, pnpm test, pnpm test:browser, pnpm e2e"
      - "Spot-check that docs/DEFECTS.md's referenced locations still exist"
    stop_if:
      - "The merge conflicts and resolution is not obvious and mechanical."
      - "main is red after the merge on any lane that was green before."
      - "A file referenced by docs/DEFECTS.md no longer exists or moved without explanation."
    receipt:
      result: blocked
      harness: claude-code
      blocked_reason: "The merge itself succeeded cleanly, but T001's second half - 'prove main is green' - failed. pnpm test is 551/552 with one deliberate tripwire firing: the known-failing expectation guarding defect 1. Per this card's stop_if ('main is red after the merge on any lane that was green before'), T001 does not get a done receipt. The failure is a genuine finding, not a merge error, and Phase A is where it gets resolved."
      summary: "Merged goal/frameless-testing-ci-v1 into main as 42f9e35. Clean merge - zero files touched by both sides, no conflicts. Two blockers were cleared first: an untracked docs/DEFECTS.md and untracked copies of the two testing board directories, all verified byte-identical to the branch versions before removal. Installing the merged lockfile fixed two import-level failures (fast-check, eslint-plugin-qwik). What remains is one failing assertion that is the point of the whole exercise: defect 1's detection has disappeared, and main's own emitter change is the likely cause. A second finding then emerged while speccing T002: S3's preventDefault() sits on a type=button and is inert in all three frameworks, so the scenario never tested cancellation behaviorally. That changes T002's scope beyond what the PM should decide alone, so T015 (Judge) was inserted."
      merge:
        commit: 42f9e35
        conflicts: "none - git merge-tree predicted none, and the set of files touched by both sides was empty"
        divergence_at_merge: "main 13 ahead, branch 41 ahead"
        blockers_cleared:
          - "docs/DEFECTS.md was untracked in the working tree and tracked on the branch; verified byte-identical, then removed so the merge could land the tracked copy."
          - "docs/goals/frameless-testing-ci-v1 and -strategy-v1 were untracked here and tracked on the branch (correctly - they are that goal's own artifacts). frameless-testing-strategy-v1 was identical; frameless-testing-ci-v1 differed only by a gitignored .goalbuddy-board/ viewer directory. Removed exactly the branch-tracked paths, left the live viewer in place."
          - "pnpm install --frozen-lockfile - the merge brought fast-check and eslint-plugin-qwik, which were not in local node_modules. Before installing, generative.test.ts and qwik gate.test.ts failed at import level."
      commands:
        - cmd: "git merge --no-edit goal/frameless-testing-ci-v1"
          status: pass
          note: "42f9e35, clean"
        - cmd: "pnpm check"
          status: pass
          note: "now runs three passes - root, plus the new per-package react and solid tsconfigs from the merged work"
        - cmd: "pnpm test"
          status: fail
          note: "551 passed, 1 failed. Sole failure: qwik gate.test.ts 'discovers and accepts the clean S1/S2/S3 emitted corpus'. See finding below."
        - cmd: "pnpm test:browser"
          status: pass
          note: "55/55 and 44/44 - T010's browser-lane repair works on merged main. This command hung at root before the merge."
        - cmd: "pnpm e2e"
          status: pass
          note: "Three-way: 3 demos x 3 scenarios, all observations equal; react/solid hydrate, qwik resume"
      finding:
        headline: "Defect 1's DETECTION disappeared, and main's own emitter change is the likely cause. The tripwire caught it, exactly as it was designed to."
        assertion: "qwik/test/gate.test.ts expects violations to equal [{file: generated/S3.jsx, line: 38, policy: eslint:qwik/no-async-prevent-default}]. Actual: [] - empty."
        why: "main carries the frameless-idiom-policy-v1 change that emits raw handlers instead of $(handler). generated/S3.jsx:37 now reads onClick$={async (event) => { event.preventDefault(); ... }} rather than onClick$={$(async (event) => ...)}. Qwik's no-async-prevent-default rule appears to match only the $(async ...) shape."
        critical_reading: "The handler is STILL async and still becomes a QRL - the async keyword is right there in the emitted output. So the runtime defect is almost certainly unchanged and only its detection was lost. This is the strong hypothesis, NOT a verified fact; T002 is the task that settles it."
        consequence_for_T002: "The lint rule can no longer serve as evidence for defect 1. A runtime assertion in the three-way contract is now the ONLY available detector, which raises T002 from 'prescribed first step' to 'the sole remaining way to know'."
        alternative_reading_considered: "That the raw-handler change accidentally FIXED defect 1. Rejected as implausible without evidence - removing the $() wrapper does not make an async handler synchronous - but T002 will distinguish them empirically rather than by argument."
      defects_md_spotcheck:
        result: "all referenced locations intact"
        note: "docs/DEFECTS.md is UPPERCASE on disk; the charter and board refer to docs/DEFECTS.md. macOS is case-insensitive so both resolve, but Linux CI would not. Recorded for correction."
        verified:
          - packages/frameworks/qwik/generated/S3.jsx
          - packages/frameworks/qwik/test/gate.test.ts
          - demos/qwik/throttled-resume.mjs
          - packages/frameworks/solid/test/solid-attr-namespace.d.ts
          - packages/analyzer/src/mutants.ts
          - "docs/goals/frameless-testing-ci-v1/notes/findings-001 through findings-007"
      finding_2:
        headline: "S3's preventDefault() is inert in ALL THREE frameworks, not just Qwik - the scenario does not behaviorally test cancellation at all."
        evidence: "packages/compiler/test/fixtures/s3-event-form.tsrx:33-37 declares <button type=\"button\"> whose onClick calls event.preventDefault() as its first statement. A type=button inside a form has NO default action, so there is nothing to prevent - in React, in Solid, or in Qwik. All three emitters faithfully reproduce type=\"button\" (react/generated/S3.jsx:39, solid/generated/S3.jsx:36, qwik/generated/S3.jsx:35)."
        consequence: "T002 as written could not have produced its required witnessed failure. A cancellation assertion on S3 as it stands would pass for Qwik - which is T002's own stop_if - because there is no default action to lose. The card's premise that extending the contract is sufficient is false."
        challenges_the_input_document: "docs/DEFECTS.md argues defect 1's severity partly on the grounds that the project 'already decided this channel matters - and then shipped a Qwik emitter that appears to get it wrong in the one scenario built to test it'. S3 contains a preventDefault call but does not exercise cancellation behaviorally. The defect may well be real for a real app that cancels a real default action; the evidence base is not what the document assumes. Flagged for the Judge, not resolved by the PM."
        action: "T002 amended so it cannot run on the stale premise; T015 inserted as a Judge task to rule on how cancellation becomes observable and to spec T002. T015 is now active."
  - id: T015
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Rule on how to make cancellation observable at runtime, given that S3's preventDefault() is inert in all three frameworks, and spec the T002 Worker package."
    inputs:
      - "T001 receipt, findings 1 and 2"
      - "packages/compiler/test/fixtures/s3-event-form.tsrx"
      - "demos/react-official/three-way-contract.ts (assertS3 at :269, resumeSymbols at :123)"
      - "docs/DEFECTS.md defect 1"
      - "packages/analyzer/src/mutants.ts (the wrong-cancellation mutant class)"
    constraints:
      - "Do not implement."
      - "TWO facts from T001 reframe defect 1 and must both be addressed. (a) The lint detection has disappeared on merged main - the raw-handler emission means Qwik's no-async-prevent-default rule no longer matches, so the gate tripwire fires empty. (b) S3's preventDefault() is on a type=\"button\", which has no default action, so it is a no-op in React and Solid too - the scenario does not behaviorally test cancellation at all."
      - "Fact (b) undercuts a claim in docs/DEFECTS.md: that the project 'shipped a Qwik emitter that appears to get it wrong in the one scenario built to test it'. Assess honestly whether S3 ever tested cancellation behaviorally, and say so plainly if it did not. The defect may still be real for a real app; the evidence base is not what the document assumes."
      - "Rule on how to obtain a genuinely cancellable default action: change the fixture (type=\"submit\" so the form submits and navigates), add a new scenario, or assert on a different channel. Each option has a different blast radius - a fixture change moves goldens for all three emitters, the analyzer corpus, and e2e observations."
      - "Weigh whether changing S3 damages what S3 currently proves. It is an existing passing scenario in a three-way equality matrix; do not trade a working oracle for a new one without saying what is lost."
      - "The witnessed-failure discipline is non-negotiable: whatever you choose must be able to FAIL for Qwik before any fix, or defect 1 cannot be demonstrated at all."
      - "Also rule whether the vanished lint detection should be restored - a gate that silently stops detecting is worse than one that never detected."
    expected_output:
      - "Ruling on how cancellation becomes observable, with the blast radius stated"
      - "An honest assessment of whether S3 ever tested cancellation behaviorally"
      - "Ruling on restoring the lost lint detection"
      - "Exact T002 Worker objective, allowed_files, verify, stop_if"
      - "Whether docs/DEFECTS.md defect 1 needs its severity or evidence restated"
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      note: notes/T015-cancellation-observability.md
      rationale: "S3 never tested cancellation behaviorally: the only preventDefault sits on a type=button, and the wrong-cancellation mutant is detected solely through event.defaultPrevented - a flag recording that the call happened. That channel is structurally blind to defect 1. Reading the eslint rule source promotes finding 1 from hypothesis to verified fact: it matches $() ancestry and never checks async. Ruling: add one type=submit button to S3, clicked last, asserted through the Document-request instrument the contract already runs. Non-destructive to calibration, preserves S3's existing oracle, and can fail for Qwik."
      s3_cancellation_assessment:
        verdict: "S3 never tested cancellation behaviorally. Verified."
        fixture: "packages/compiler/test/fixtures/s3-event-form.tsrx:33-41 - the only preventDefault() in the corpus is on <button type=\"button\">, which has no activation behavior inside a form. Reproduced verbatim by all three emitters."
        mutant_is_weaker_than_documented: "packages/analyzer/src/mutants.ts:9 declares wrong-cancellation on channel callback, realised as missing-prevent-default (react/test/reference.tsx:198, solid/test/reference.solid.tsx:216) - the mutant merely OMITS the call. The analyzer's only cancellation observation is `defaultPrevented: event?.defaultPrevented ?? null` (packages/analyzer/src/run.ts:41), compared at compare.ts:71. That is a flag recording that preventDefault() was CALLED, not that a default action was averted."
        load_bearing_consequence: "Qwik's late async handler still CALLS preventDefault(), so it would still record defaultPrevented: true. The existing cancellation channel is STRUCTURALLY BLIND to defect 1. docs/DEFECTS.md attributes the miss to the absent Qwik browser lane; that attribution is wrong - even with the lane, wrong-cancellation would have passed. (Inferred from the DOM event model; untestable here as no Qwik browser project exists.)"
      finding_1_now_verified:
        was: "hypothesis - the raw-handler shape probably stops the lint rule matching"
        now: "verified fact, by reading eslint-plugin-qwik@2.0.0-beta.38 dist/index.js"
        rule_behavior: "no-async-prevent-default walks ancestors for a CallExpression whose callee is the Identifier '$'. It NEVER inspects `async` at all, despite its name and message. onClick$={async (e) => {e.preventDefault()}} has no $() ancestor, so it cannot fire."
        refutes: "The alternative reading that the raw-handler change accidentally FIXED defect 1. The rule's silence is a parser miss, not a semantic change."
        upstream_gap: "The rule's intent - preventDefault inside a QRL - is right; its implementation detects QRL-ness only via the explicit $() wrapper and misses the JSX-prop form the optimizer also turns into a QRL. Worth filing."
      observability_ruling:
        chosen: "Add one <button type=\"submit\" data-action=\"cancel-submit\"> to S3, clicked only by the three-way e2e contract, as the last step."
        why:
          - "Real default action - a form submit with no action attribute is a GET to the current URL, a genuine resourceType 'Document' request."
          - "The instrument already exists and is already load-bearing: three-way-contract.ts:326-333 already throws unless exactly one Document request served the page; :354-368 already asserts navigations per framework."
          - "Two independent failure signals for Qwik: the extra Document request, and the reload resetting data-writes from 2 to 0 - which the existing measured observation already reads."
          - "It cannot fail for React or Solid: waitForInteractive (:187-204) blocks on the activation marker before any click. Qwik deliberately does not wait - that asymmetry is the thesis and is what makes it fail."
          - "Non-destructive: the analyzer's S3 action list (scenarios.ts:56-60) does not click it, so calibration, emitted-smoke, action-order and strictmode never trigger a submit."
          - "S3's existing oracle is fully preserved - clicking last means every current assertion still runs and passes first. Nothing is traded; a channel is added."
          - "data-action=\"cancel-submit\" is not \"submit\", so the form's bubble guard does not fire and expectedCallbacks is unchanged."
        rejected:
          type_submit_swap: "Cheapest delta, but it makes the wrong-cancellation mutant DESTRUCTIVE - react/src/adapter.ts:56-62 dispatches real cancelable MouseEvents and relies on native activation, so missing-prevent-default would genuinely submit and navigate the vitest page away. The calibration lane would crash instead of reporting a divergence."
          new_s4_scenario: "Correct but the largest bill: new fixture, IR golden, three generated files, three demo copies, three routes, analyzer scenario, two references, a resumeSymbols entry, a README row, a new e2e row - then inherited three more times by Svelte/Vue/Angular. Marginal safety over the ruling is small."
          checkbox_channel: "The existing checkbox's toggle is what the check action depends on. A new checkbox is observable only via the :checked property, which page.content() cannot serialize, so it could not feed the cross-lane measured-observation diff."
        blast_radius: "The fixture and its IR golden; enriched-ir.test.ts:32-39 (one ['button','data-action'] row); three generated/S3.jsx; two handwritten references, which emitted-smoke.browser.test.ts:27 compares node-for-node; both size.test.ts files, which hard-code S3 at physicalLoc 69/51 and structuralNodes 307/226; three demo EventForm.jsx copies (auto-derived by copy-emitted); the contract. Possibly the two emitted-typecheck.test.ts expected-error lists."
      lint_restoration_ruling:
        decision: "Restore it in T003 as a frameless-owned gate policy. Do NOT revert the emission shape to $(handler) to satisfy a rule that does not check what its name says - that would invert frameless-idiom-policy-v1 and let an upstream heuristic dictate emitted output."
        sharp_edge: "T003 must flip gate.test.ts:73-82 from one expected violation to []. But [] is ALREADY what unfixed main produces. Flipping alone ships a green gate that would pass identically if the emitter were never touched - exactly the green-vacuum failure mode this board worries about."
        requirement: "In the same change, add a frameless-owned Qwik gate policy rejecting preventDefault() inside any emitted event-handler body regardless of $() wrapping, mutation-tested in the pattern of gate.test.ts:93-110, and only THEN release the expectation. Not a separate package - splitting risks the green vacuum landing first. This is also the natural home for T011/T012's fail-closed conditional-cancellation limit."
        still_load_bearing: "For defect 1, no - the runtime assertion is strictly stronger. In general, yes."
      defects_md_corrections_recommended:
        - "Keep the #1 rank; restate the basis - the suites detect the ABSENCE OF THE CALL via event.defaultPrevented; no default action is exercised anywhere in the corpus (lines 55-61)."
        - "Correct the 'why nothing caught it' attribution (63-68): the channel is structurally blind, so the absent Qwik lane would not have caught it either."
        - "Correct the code snippet (38-43): on merged main generated/S3.jsx:37-38 has no $() wrapper, and the rule matches $() ancestry while never checking async, so it can no longer serve as evidence."
        - "Downgrade 'diagnosed by rule' to 'undiagnosed' - with the rule silent and the runtime divergence undemonstrated, defect 1 currently has ZERO demonstrated evidence."
        - "State plainly that the repo has never emitted or exercised a real cancellation in any target."
        - "Rename to lowercase or update every reference - docs/DEFECTS.md is uppercase on disk and Linux CI will not resolve docs/DEFECTS.md."
      severity_opinion: "Still #1, and the inertness of S3 makes it MORE worrying, not less. The mechanism is deterministic - a QRL costs at minimum a microtask and the default action runs immediately after dispatch; preventDefault() on a submit button is the single most common cancellation in web apps; and Svelte, Vue and Angular are about to inherit an IR whose preventDefault() lowering has never been behaviorally validated in ANY target."
      missing_evidence:
        - "Whether @qwik.dev/router leaves a plain <form> submit uninterrupted. Inferred from demos/qwik/src/routes/s3/index.tsx using neither <Form> nor an action; T002 must confirm empirically."
        - "Whether the compiler accepts a handler body consisting only of event.preventDefault(). Not exercised by any existing fixture."
        - "Whether a Qwik calibration lane would confirm that a late preventDefault still records defaultPrevented: true. Grounded in the DOM event model but untestable - no Qwik browser project exists (blocked upstream by @qwik.dev/core's vitest '>=2 <4' peer range)."
  - id: T002
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    spec: "notes/T015-cancellation-observability.md (Judge ruling, authoritative)"
    objective: >-
