  - id: T007
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Phase B audit: rule on all three diagnoses and spec the resulting fixes or closures."
    inputs:
      - "T006 receipt"
      - "docs/DEFECTS.md defects 3-B, 4 and 6"
    constraints:
      - "Do not implement."
      - "For each: rule real-finding, harness-assumption, or non-issue - and say what closes it."
      - "A ruling of 'raise the bound' or 'compare order-insensitively' is ACCEPTABLE here, but only if T006's instrumented evidence supports it. Reject it if the experiment did not actually run."
      - "Where a defect turns out to be a real compiler finding, spec it as its own Worker package rather than folding it into the portability work."
      - "THE PATTERN NOW DEMANDS A RULING. Counting the owner's T004 overturn, FOUR of the six defects have turned out to be instrument problems rather than product defects: 2 (harness clicks before any framework installs listeners), 4 (a wall-clock bound over an rAF-gated loop), 6 (an invariant contradicting a declared canonicalisation), and 3-B (a mutation literal that silently no-ops on CRLF). Only defect 1 was a real product defect. Rule on whether docs/DEFECTS.md's framing - 'defects the testing work uncovered' - survives, and say what it should say instead."
      - "Do NOT treat 'instrument problem' as 'no work required'. Defect 3-B's silently-no-op mutation is a green vacuum in the test suite, the exact failure mode this board already polices elsewhere."
      - "GUARDRAIL CORRECTED BY T007 - the version the PM copied here from T006 was FALSE. T006 said records.stateWrites is 'writes unsorted, authored write order'. It is not: build.ts:342 is `const writes = sortWrites(...)` and sortWrites (2740-2752) keys on componentId then graphNodeId, both name-derived. A Worker obeying the original guardrail verbatim would have reproduced the same false finding from a second collection. T006's list was also incomplete - it omits module.exports (build.ts:464, sorted by exportedName) and a per-component id array (629). The corrected rule is on T008."
      - "Defect 4 has NO reproduction on the failing platform - macOS WebKit passes with 11x headroom and the CI cell is ubuntu headless WebKitGTK. The rAF-cadence experiment on Chromium is a substitute. Decide whether that is sufficient to act on, or whether the bound should be changed only alongside something that can observe the real cell."
      - "Rule on the THIRD Windows cause T006 found unprompted and findings-004 never had: the compiler goldens bake AST BYTE OFFSETS, so a CRLF checkout breaks enriched-ir.test.ts's golden-dump tests and CRLF-ising the golden does not fix it. Fold it into T008's scope or spec it separately."
      - "full_outcome_complete stays false."
    expected_output:
      - "Ruling per defect, with the evidence it rests on"
      - "Exact Worker objective, allowed_files, verify and stop_if for T008 and for any escalated finding"
      - "Which continue-on-error flags can now be removed"
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      phase: "B complete - defects 4, 6, 3-B diagnosed and ruled"
      note: notes/T007-phase-b-audit.md
      rationale: "All three T006 diagnoses stand on evidence the Judge re-derived rather than accepted. Defects 4 and 6 are instrument defects; 3-B is a real test-suite defect and a green vacuum. 'Raise the bound' REJECTED - nothing settles at any number. 'Compare order-insensitively' APPROVED, but T006's guardrail is FALSE: stateWrites IS name-sorted at build.ts:342. Found a fourth Windows cause and a third vacuous green. No continue-on-error flag comes off."
      commands:
        - cmd: "pnpm check"
          status: pass
        - cmd: "pnpm test"
          status: pass
          note: "561/561, 39 files"
        - cmd: "pnpm test:browser"
          status: pass
          note: "react 55/55, solid 44/44"
        - cmd: "pnpm e2e"
          status: pass
          note: "3 demos x 3 scenarios, all observations equal"
        - cmd: "repo-wide scan for .replace() search literals containing a newline"
          status: pass
          note: "FOUR, not one: react/test/gate.test.ts:251,259,375 and solid/test/gate.test.ts:473"
        - cmd: "empirical CRLF template-literal normalisation probe (scratchpad)"
          status: pass
          note: "verified rather than recalled: ECMAScript normalises CRLF to LF inside template literals, which is why the three React rows are safe"
        - cmd: "read build.ts sort sites 326, 342, 428-431, 464, 629, 2079, 2725, 2740"
          status: pass
          note: "stateWrites and module.exports are name-keyed; T006's guardrail is wrong"
        - cmd: "inspect goldens/s1-render-once.json bindings"
          status: pass
          note: "one state binding - the fixture-level rename invariant CANNOT exhibit defect 6"
      defect_4:
        verdict: "HARNESS ASSUMPTION - instrument defect, real work required"
        raise_the_bound: "REJECTED. The instrumented evidence explicitly does not support it: nothing settles, so there is no settle time to raise the bound to. T006 declined it; ratified."
        load_bearing_claim_is_structural: "stable>=2 needs three rAF deliveries; rAF promises ordering-before-repaint and no rate; so 500ms silently encodes a >4fps floor. Readable in react/src/adapter.ts:65-78. T006's nine-run measurement supplied the part that could have refuted it and did not - distinctDomDuringLoop=1 everywhere, first snapshot == final DOM, byte-identical innerHTML across engines."
        what_closes_it: "Bound on the quantity CONSUMED - ticks, or a delivery-contracted primitive - with wall clock kept only as a runaway guard, in all three adapters, shipped with a calibration proving the loop still throws on a genuinely non-quiescing DOM. Specced as T017."
        reading_2_unsupported: "Identical DOM across engines; blast radius 1 of 55 versus 42 of 55 under sustained starvation; two sibling tests pass on the identical mechanism."
      defect_6:
        verdict: "HARNESS ASSUMPTION - order-insensitive view APPROVED, guardrail CORRECTED"
        t006_guardrail_is_false: "T006 said records.stateWrites is 'writes unsorted, authored write order'. build.ts:342 is `const writes = sortWrites(...)`, and sortWrites (2740-2752) keys on componentId then graphNodeId - both name-derived. A Worker obeying that guardrail verbatim would reproduce the same false finding from a second collection. T006's list also omits module.exports (build.ts:464, by exportedName) and a per-component id array (629). THE PM HAD COPIED THIS GUARDRAIL ONTO THE BOARD VERBATIM; it is now corrected in place."
        corrected_rule: "Apply the view only to a collection whose exact build.ts sort line the Worker can CITE as name-keyed, recording the line number. Compare as a MULTISET of whole entries after structural() blanking - never sorted-then-compared, because offsets travel inside the entry so a real reorder is still caught. Span-keyed sorts (326, 2079) stay order-sensitive. stateWrites requires a WITNESSED permutation before inclusion."
        s_sh7_not_threatened: "S-SH7 is a Solid gate policy over emitted source, not a compiler-IR test. T006 conflated them. The real guard is that metamorphic.test.ts:192-213 calibration must still fail."
      defect_3b:
        verdict: "REAL FINDING in the test suite - a green vacuum, not a non-issue"
        verified: "solid/test/gate.test.ts:470-478 - the search literal embeds \\n\\t\\t, and `shared` is read from disk at :42-45. Rows C and D exonerate the gate because both sides pass through formatEmitted with endOfLine:'lf'."
        t006_claim_refined: "'Exactly one CRLF-fragile row' survives, but for a reason T006 did not state. FOUR such literals exist repo-wide; the three in react/test/gate.test.ts operate on an IN-FILE template literal, and ECMAScript normalises CRLF to LF inside template literals - verified empirically, not from memory. The real discriminator is disk-read source PLUS an escaped-\\n search literal, which is the shape the three adapter boards will reproduce."
        what_closes_it: "Two things, not one: make the row CRLF-proof, AND assert the mutation actually changed the source."
      fourth_windows_cause_found_in_this_audit:
        evidence: "react/test/emitter.test.ts:133-134,141,150 and solid/test/emitter.test.ts:153,162 assert readFile(generated/*.jsx) === emit(ir) byte-for-byte while formatEmitted hard-codes endOfLine:'lf'. Every freshness assertion fails on a CRLF checkout."
        honest_status: "A HYPOTHESIS from reading assertions, not an observation from a Windows log."
        accounting: "findings-004 reports 35 failures across 8 files. Causes A + B + third account for roughly 6 across 4. About 29 across 4 files remain unexplained."
        root_fix: "The repo has NO .gitattributes. `* text=auto eol=lf` plus a renormalise closes B, third and fourth at once. LF is already a house invariant everywhere except where it is decided."
      pattern_ruling:
        defects_md_framing: "DOES NOT SURVIVE. 'Nothing in this list is unfinished testing work' is false - three of six ARE test-suite defects (3, 4, 6). 'The suite that found them is complete and green' is false twice: the adjudicated tally is one product defect, one non-defect, three test-suite defects, one open question - and some of the green is vacuous."
        third_vacuous_green: "metamorphic.test.ts's rename invariant - the one DEFECTS.md says 'holds exactly on all three checked-in fixtures' - runs on ONE fixture (:60-68 defines renames only for s1; s2/s3 are [] and hit `continue`), and that fixture's golden has one state binding, so it cannot exhibit defect 6. It passed because it was structurally incapable of failing."
        common_shape: "Every one measured the product through a PROXY whose stability the product never promised, and asserted nothing about the proxy. Defect 2: 'interactive' proxied by domcontentloaded - no framework promises listeners at DCL. Defect 4: 'settled' proxied by wall clock - rAF promises ordering, never rate. Defect 6: 'unchanged but for names' proxied by array position - the IR declares those arrays sorted BY NAME. Defect 3-B: 'mutated' proxied by replace() having been called - replace promises to return a string, not to have matched."
        the_root: "Not that assumptions were made; instruments cannot avoid them. That each assumption was SILENT - nothing asserted the precondition it depended on, so when the precondition broke, the instrument reported a PRODUCT defect instead of an INSTRUMENT fault. A silent precondition converts every one of its own violations into a false finding about something else."
        three_rules:
          - "RULE 1 - two-variable triangulation before any finding is filed: vary one instrument parameter and one product parameter, confirm the signal tracks the PRODUCT. All four would have been caught in minutes. This is what T004 and T006 each eventually did; it must be a gate, not a virtue."
          - "RULE 2 - every instrument asserts its own preconditions: a mutation harness asserts the source changed; a readiness wait blocks on the framework's OWN signal, never a browser lifecycle event that predates it; a positional comparison cites that the collection is order-significant; a repo-wide byte invariant is asserted by a test."
          - "RULE 3 - two-sided calibration for HARNESSES, not only gates. This repo proved its gates can go red and proved nothing about its harnesses."
        load_bearing_for_the_adapters: "Svelte, Vue and Angular each add four new instruments. Rules 1-3 are now standing constraints on all three charters via T010, and T018 must land before T013 because the adapters will copy whatever mutation-table idiom they find."
      continue_on_error_ruling:
        summary: "NO flag comes off in this phase. All three stay, each with a removal gate that is an OBSERVATION, not an argument."
        windows: "STAYS. Gate: an observed green windows-latest/node 24 cell on a real run - not 'both causes fixed', since named causes explain ~6 of 35 failures. ci.yml:69-74 currently states a known-FALSE reason ('fails a hash assertion, almost certainly CRLF'); T006 refuted it - no hash assertion, gate is CRLF-robust, the fault is a silently no-op mutation literal. Correct the comment in T008."
        webkit: "STAYS. Gate: an observed green webkit cell AFTER the T017 repair. The flag is the ADJUDICATING INSTRUMENT - the repair is self-falsifying on the real cell, because a genuine engine divergence would still fail a tick-bounded loop. Removing it first discards the only evidence that can settle it."
        qwik_throttled: "NOT re-litigated - owner-ruled; rescoping moved with the CI file out of T016."
      parallel_safety: "NOT SAFE to run T008, T017 and T018 in parallel. T008 and T018 both touch solid/test/gate.test.ts; T008 and T017 both touch ci.yml; T008 and T016 both listed docs/DEFECTS.md until this audit removed it from T016. Sequential order required: T008 -> T017 -> T018 -> T009 -> T016."
      missing_evidence:
        - "Whether the ~29 unaccounted Windows failures share the CRLF root. The fourth-cause hypothesis fits the file count but is an inference from reading assertions, not a Windows log. Only the CI cell can settle it - which is why the flag stays."
        - "Whether the CI WebKit incident had the frame-cadence cause. Formally unexcluded. The T017 repair is self-falsifying on the real cell, which is the sequencing that resolves it."
        - "Whether records.stateWrites actually permutes under a realistic rename. sortWrites keys on graphNodeId so it should; T006's sweep did not report it at top level, possibly because its programs rarely write to two differently-named nodes. T008 must witness it or exclude it."
        - "Whether module.exports (build.ts:464) is reachable by the rename invariant. Renames target locals, so probably not - but 'probably not reachable' is exactly the shape of assumption this audit ruled on. T008 cites or excludes."
        - "T006's Chromium rAF-cadence experiment and 200-run sweep ran in a prior session's scratchpad and are not re-runnable. The mechanism for both was independently re-derived from source here, so neither ruling turns on them."
