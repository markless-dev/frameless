      - "docs/DEFECTS.md defect 1, the 'separate design decision' section"
      - "docs/emitter-idiom-policy.md"
    constraints:
      - "Do not implement."
      - "The IR currently treats preventDefault() as just another statement in the handler body - correct for React and Solid, wrong for Qwik."
      - "Rule on: sync$() lowering; a gate policy that PROVES a sync$ body references no reactive state; and a fail-closed path for what Qwik genuinely cannot express, namely a conditional cancel depending on signal state. That last is a new v-limit in the family of unknown-template-node.test.ts."
      - "HARD CONSTRAINT: sync$() cannot close over reactive state - no signals, no stores. It runs before the container resumes and may read only what is synchronously on the event."
      - "This decision is inherited by every future adapter. Rule it as a general IR question, not a Qwik patch."
      - "HARDENING ITEM carried from T005: frameless/no-handler-prevent-default currently ALLOWS preventDefault() inside a sync$() nested within a lazy $() element, which is broken at runtime. The ancestor walk asks 'is there a sync$ between call and prop', not 'is that sync$ a DIRECT element of the event prop'. The emitter cannot produce that shape today, so it is not a live defect - but conditional-cancellation lowering is exactly the work that could start producing it."
    expected_output:
      - "IR representation ruling"
      - "Gate policy specification"
      - "The fail-closed v-limit definition"
      - "Exact Worker objective, allowed_files, verify and stop_if"
    receipt:
      result: done
      harness: claude-code
      decision: approved
      full_outcome_complete: false
      note: notes/T011-conditional-cancellation.md
      rationale: "The IR already represents conditional cancellation completely; NO schema change. Three premises were wrong and the Judge measured each. (1) Conditional cancellation does NOT reach a fail-closed throw - emitEvent returns a bare lazy QRL, silently re-emitting defect 1; only the gate catches it. (2) stopPropagation is an unfixed hole of the same class that NOTHING catches. (3) Solid refuses conditional policies whose validator masks two real bugs. The gate must PROVE closure-freedom, not detect signals."
      premise_in_the_pm_brief_falsified:
        what_the_pm_said: "That hoistsPreventDefault() returning false for conditional cases means they 'reach the fail-closed throw instead'."
        measured_truth: "FALSE. qwik emit() on an event-equals IR returned onClick$={(event) => { if (event.key === 'Enter') { event.preventDefault(); } }} with NO throw. emitter/index.ts:701 returns normalized.handler when hoistsPreventDefault() is false; the throw at :587-590 only fires when hoisted===true. Conditional cancellation is therefore SILENTLY RE-EMITTING DEFECT 1 today, caught only by the gate."
        provenance: "The PM propagated this from T005's deferred_scope_still_correct wording. T005's own sentence was about the declared-but-unlocatable case and is defensible; the propagation into T011's brief was not."
      new_defect_found_stopPropagation:
        severity: "A genuine unfixed defect of defect 1's class that NOTHING catches today."
        measured: "Via checkSources: unconditional AND conditional stopPropagation in a bare lazy QRL each produce ZERO violations. PM VERIFIED: gate/index.ts matches only callee.property.name === 'preventDefault'; stopPropagation appears nowhere in the file."
        consequence: "The gate's own name, frameless/no-handler-prevent-default, becomes a lie the moment stopPropagation is in scope. Renamed to frameless/no-handler-sync-action."
        recording: "T008 owns docs/DEFECTS.md end to end, so this entry lands after T008 rather than inside T012."
      solid_bugs_masked_by_its_own_validator:
        bug_1: "normalizeHandler (solid/src/emitter/index.ts:2264-2271) unshifts an unconditional event.preventDefault() whenever actions.length is non-zero, IGNORING when. For a conditional policy the authored call is nested in an IfStatement so the strip-filter misses it - the result is a cancellation that fires ALWAYS plus the authored conditional call. PM VERIFIED by reading the source."
        bug_2: "It also unshifts preventDefault when the declared action is ['stopPropagation']."
        why_hidden: "The validator currently refuses every shape that would expose them. Widening the validator WITHOUT fixing normalizeHandler would ship an always-firing cancel - which is why that is a stop_if on T012."
      ir_representation:
        verdict: "NO SCHEMA CHANGE. SyncPolicy (schema.ts:24-39) plus EnrichedEventRecord.syncPolicy (:318-325) is already the general representation."
        vocabulary_closed_by_measurement: "buildEnrichedIr on authored .tsrx produced event-equals, graph-truthy, not, and, and constant-truthy. event.target.tagName is REFUSED UPSTREAM with MARKLESS_SYNC_POLICY_UNEXTRACTABLE - so the brief's 'event.target attributes' case does not exist. eventFieldName requires object===eventParam and a static property, so only a flat event field vs a literal can ever arrive."
        branches_form_clarified: "Arises IFF the event prop carries >=2 handler functions each contributing a policy. It is NOT a way to express two conditions on one handler."
        design_pivot: "A sync$ body SYNTHESIZED from a graph-truthy-free condition tree is pure over the event parameter and JSON literals BY CONSTRUCTION. Closure freedom becomes a property of the generator rather than a conclusion of an analysis."
        general_rule_for_all_adapters: "The IR declares WHEN and WHAT; the adapter decides WHERE. An adapter partitions the declared condition tree into its synchronous pre-activation channel and the rest; if the partition is not total for a declared action it REFUSES to emit. An adapter must never narrow the IR to what it supports."
        rejected: "A syncBody/cancelExpression AST field on the IR - puts a target-shaped artifact in a target-neutral contract and inverts frameless-idiom-policy-v1. Splitting SyncPolicy into static/dynamic variants - exports Qwik's weakness to Svelte, Vue and Angular, none of which have it."
      gate_policy:
        rule_1: "frameless/no-handler-sync-action - widened to both action names, and HARDENED per T005: walking outward, the FIRST ancestor that is either a sync$() call or a JSX event attribute decides, and sync$ is allowed only in DIRECT position - the value of the event JSXExpressionContainer, or a direct element of the array that is that value."
        rule_2: "frameless/sync-qrl-must-be-closed - NEW. It does not try to decide 'is this a signal', an undecidable name-based heuristic. It PROVES the strictly stronger DECIDABLE property that the sync$ argument references no binding other than its own parameters, via ESLint scope analysis, as an ALLOWLIST so an unforeseen construct fails closed."
        backed_by_qwiks_own_invariant: "core.mjs:15905 - 'Synchronous QRLs functions can't close over any variables, including exports' - and in dev Qwik enforces it by round-tripping through new Function at :15911-15920, turning a captured reference into a ReferenceError at dispatch."
        mutants_measured_silent_today: "Unconditional stopPropagation in a bare lazy QRL; conditional stopPropagation; sync$ nested inside $(); sync$ nested inside a bare lazy handler; a sync$ body reading locked.value. All five currently produce ZERO frameless violations."
      v_limit:
        location: "The Qwik emitter's validateEnrichedIr, NOT packages/compiler - the limit is Qwik's and the shared contract must not learn about it. Qwik currently validates syncPolicy NOT AT ALL; that is the gap."
        refusals: "V1 graph-truthy in any branch's condition tree. V2 the branches form. V3 a statically-false constant-truthy guard. V4 a declared action whose authored call cannot be located - widening the existing throw to BOTH actions and to guarded positions. V5 a synthesized sync$ body that would reference anything but the event parameter."
        v3_reasoning: "Refuse rather than silently delete. Stripping the authored call is equivalent only if the constant fold is right, and silently disables a real cancellation if it is wrong."
        v5_is_the_emitter_asserting_its_own_precondition: "T007 rule 2. It can never fire today; its test constructs an unknown condition type and proves the refusal rather than mutating a reachable input."
        explicitly_refused_alternative: "Mirroring graph state into a data- attribute for sync$ to read. It synthesizes a reactive DOM binding not present in the IR, depends on flush-before-event guarantees the IR does not make, and converts a clean refusal into a subtle timing bug - the exact trade defect 1 was. Reopen only with a two-sided behavioural proof on official tooling plus an IR-level declaration of the mirror. Not a Worker decision."
      lowering_per_framework:
        qwik: "Synthesize the guard from the condition tree: constant-truthy true -> no guard, byte-identical to T003's shipped shape; event-equals -> event.<field> === <literal>; not/and/or -> !/&&/||. The lazy element keeps the authored guard minus the located action calls - the condition is evaluated twice, which is sound precisely because it is pure."
        react: "NOTHING TO DO, but UNPINNED. Measured: React emits the authored guard unchanged for event-equals, graph-truthy and branches alike, and its validator already accepts the full grammar. No test asserts this, so T012 adds one."
        solid: "Widen the validator to React's grammar AND fix the two bugs above. Strip-and-renormalize ONLY for single-branch constant-truthy-true; otherwise leave the authored body untouched exactly as React does; give the branches form a named refusal."
        absent_adapters: "Svelte and Vue handlers are synchronous and resident - the React/Solid case. Angular's forced lowering is orthogonal and still synchronous. Only Qwik is expected to need the split; all inherit the refusal obligation."
      missing_evidence:
        - "The Qwik optimizer's treatment of a sync$ body containing an IF STATEMENT is UNMEASURED. S3 proves only that a single-call body survives. This is why step 1 of T012 is a measurement, not an implementation."
        - "No behavioural proof exists that a conditional cancel fires for the declared key and does NOT fire for another. Emitted text plus a gate is exactly the evidence base defect 1 defeated. Queued as T020."
      parallel_execution: "Ran read-only, concurrently with T008 (11 paths) and T016 (one path). Based its ruling on committed source where a file was mid-edit."
