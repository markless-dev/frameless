      - "Audit the process failure this exposed: an instrument was built outside the framework's design envelope, and three parties interpreted its output as a product defect without first asking whether the test was fair. Check whether any other lane in this repo has the same shape."
      - "Every continue-on-error flag must be removed or carry a receipt justifying why it stays. A flag that quietly persists is a defect that quietly persists."
      - "T007 RULED ALL THREE FLAGS STAY, each with a removal gate that is an OBSERVATION, not an argument. Audit against observed CI cells, not against 'the causes were fixed'. WINDOWS: gate is an observed green windows-latest/node 24 cell on a real run - the named causes explain only ~6 of 35 failures across 4 of 8 files. WEBKIT: gate is an observed green webkit cell AFTER the T017 quiescence repair lands; the flag is the adjudicating instrument, since a genuine engine divergence would still fail a tick-bounded loop. QWIK-THROTTLED: owner-ruled, rescoped separately - do not re-litigate."
