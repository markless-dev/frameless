        windows: "FOUR post-T008 runs: e04b823 RED, dfa9350 green, 0cf937b RED, 39c8a6d green. Two green, two red, discriminated PURELY by whether two tests beat vitest's 5000ms default (measured 4143-7149ms across the four). Nothing in those files changed across the runs - last touched at e04b823. The cell is a COIN FLIP, and 39c8a6d's green had ~6% headroom."
        windows_what_IS_settled: "The CRLF root is CONFIRMED on the real cell: 8 failed files / 36 errors pre-fix -> 2 files post-.gitattributes. T007's fourth-cause hypothesis is now OBSERVED and the ~29 unaccounted failures are accounted for. Cause A is the one NOT closed - npx.cmd + shell works functionally but is timing-marginal."
        webkit: "The cell was ALREADY GREEN for five consecutive runs BEFORE T017 landed (cd34186, ef59d55, 72a09de, e04b823, dfa9350), with no adapter change. All eight observed reds cluster in two windows of rapid concurrent runs, consistent with CPU contention starving frames - which CORROBORATES T017's mechanism but means a green in a quiet window is NON-DISCRIMINATING. T017's distinguishing signatures have never been read, because no post-repair red exists."
