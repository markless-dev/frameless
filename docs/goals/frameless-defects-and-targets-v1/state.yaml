      summary: "RE-DERIVED THE TS2588 INDEPENDENTLY before writing any test, from two authorings - a .then continuation and a plain callback prop with NO promise anywhere - confirming the trigger is NESTING. Landed the failing tests FIRST and watched them go red on tsc's own output. Then added assertLowerableWrites to the React emitter: it walks the handler's unresolved references, keeps write targets including member-chain roots, and THROWS when one sits in a nested function scope. No lowering was implemented; replaceFreeNames was not touched."
      THE_WITNESSED_PRE_FIX_FAILURE_VERBATIM: "FAIL React structural emitter > a state write it cannot lower is refused, not miscompiled > nested-then: AssertionError: expected [ ...(2) ] to deeply equal [] -- + [ \"nested-then.jsx(16,7): error TS2588: Cannot assign to 'ticks' because it is a constant.\", \"nested-then.jsx(17,7): error TS2588: Cannot assign to 'nextPhase' because it is a constant.\" ]. Plus FAIL nested-callback with the same TS2588 on 'ticks', FAIL on the message-quality assertion (expected null not to be null), and FAIL 'the plain callback prop is refused too - the defect is nesting, not promises'. THE CONTROL AND THE CORPUS SWEEP WERE GREEN FROM THE START, which is what makes the four reds mean what they say."
      the_refusal_names_the_consequence_not_just_the_cause: "The shipped message states the write, the enclosing function, the TS2588 it prevents, AND that it would not re-render even if it ran - then adds 'Nested writes DO lower correctly in the Solid emitter; porting that is a design change this refusal deliberately does not make.' A silent failure mode needs a message that explains what WOULD have happened; a bare throw teaches nothing. This is the third fail-closed-loudly guard this session (T033, T039, T044) and the pattern is now house style."
      THE_TEST_IS_DESIGNED_TO_SURVIVE_ITS_OWN_FIX: "The standing assertion is 'REFUSE OR TYPECHECK', not 'throws'. Two consequences the Worker reasoned out rather than stumbled into: a bare toThrow would have failed pre-fix FOR THE WRONG REASON (no throw at all, rather than on the TS2588), which would have made the witnessed failure meaningless; and when someone later ports Solid's lowering, these rows GO GREEN THROUGH THE OTHER BRANCH WITH NO EDIT, leaving only the two message tests to delete deliberately. A test that has to be rewritten the day the defect is fixed is a test that will be deleted carelessly."
