      gate_5_ruling:
        verdict: "RATIFIED, on a corrected ground"
        t003_ground_is_false: "T003 argued 'the baseline form cannot express the IR's declared SyncPolicy in Qwik at all'. FALSE at the shipped version: core-internal.d.ts:2445 declares [K in keyof HTMLElementEventMap as `preventdefault:${K}`]?: boolean, and core.mjs carries isPreventDefault(), PREVENT_DEFAULT = 'preventdefault:' and addUseOnModifier(..., 'preventdefault'). Two sanctioned forms can express it. The Judge found this only by checking."
        the_real_error_is_baseline_selection: "T003 ran Gate 5 against the PRE-FIX output - preventDefault() left inside the lazy QRL. That is not a sanctioned form for this construct: the policy defines sanctioned as what the framework accepts as CORRECT, and Qwik ships a lint rule against this shape plus two dedicated constructs precisely because it does not work. It is wrong output. Comparing a candidate against wrong output is a CATEGORY ERROR that yields a spurious G5 FAIL every time a defect is fixed."
