      what_it_now_bounds:
        quantity: "SETTLE TICKS (SETTLE_TICK_BUDGET = 30) - the quantity the loop actually consumes."
        why_contractual: "One tick is a RACE: a frame if the compositor delivers one, and a MACROTASK TURN regardless. The HTML event loop contracts to run a queued task; the animation-frame callback is explicitly SKIPPABLE, so rAF promises ordering ('before the next repaint') and never a rate. rAF is therefore RACED, never awaited - it wins where delivered and is ignored where it is not, so the loop can no longer park on a promise the engine owes on no schedule."
        not_the_rejected_move: "30 x 16ms is ~480ms, deliberately the same work the old 500ms bought on a 60fps engine. The NUMBER did not grow; the UNIT changed from one no specification guarantees to one that is delivery-contracted. Settle semantics unchanged (SETTLE_STABLE_TICKS = 2, still three equal snapshots)."
