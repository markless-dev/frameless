      defect_1_disposition:
        verdict: "FIXED, honestly"
        witness_precedes_fix: "ca84b89 (witness) precedes c9cf99c (fix), and the witnessed_failure block entered state.yaml IN THE WITNESS COMMIT ITSELF - so the failure was on record before a fix existed, not reconstructed afterwards. Confirmed by git log -S'witnessed_failure'."
        asserts_the_real_thing: "three-way-contract.ts:342-356 counts resourceType 'Document' requests after clicking a real <button type=\"submit\"> and NEVER touches event.defaultPrevented. It carries a second independent signal - writes still 2, which a reload would reset."
        judge_authored_mutants: "The Judge did not trust T003's mutant list. It ran six of its own against the shipped gate via checkSources, THREE of them shapes T003 never wrote: a nested callback inside the lazy element, onSubmit$, optional-chaining event?.preventDefault(), and try/finally in an async handler. All caught; the shipped lowering stays allowed."
      defect_2_disposition:
        verdict: "UPSTREAM is a legitimate closure"
