      THE_RULING_APPLIED_THE_STOPPING_RULE_TO_ITSELF: "THIS IS THE RESULT WORTH READING TWICE. The T024 card ranked parent-child composition as 'THE SINGLE HIGHEST-VALUE ADDITION' and the PM's own dispatch reinforced it with four independent IR-8 measurements from this session. THE JUDGE CUT IT ANYWAY, because it could not be shown to KILL anything. The card's own caveat says confidence arrives when a mutation cannot survive, not when a file count hits a number - and composition over today's IR would have handed vue-tsc, svelte-check and Angular strictTemplates a POPULATION WITH NO SIGNAL, since neither ComponentPropExpression nor PropDestructuringEntry carries a type and all four lanes measure GREEN on wrong-typed props. Adding it would have grown the corpus by the most expensive scenario available while proving nothing. A ruling that overturns its own brief's headline, on measurement, is the mechanism working."
      pm_independently_verified_both_load_bearing_claims: "The PM re-checked the two measurements the overturn rests on, because they contradict the card the PM wrote. (1) THE GUARD IS REAL AND IDENTICAL IN ALL FOUR: svelte/src/emitter/index.ts:723, vue:1053, qwik:1372, angular:1132 all throw '<Framework> emitter does not support composition or shared/handle constructs', and svelte:724, vue:1054 and angular:1133 additionally throw when ir.module.exports.length !== 1. (2) IR-8 IS REAL: schema.ts:150 ComponentPropExpression carries name, kind, value, graphNodeId and path - and NO type; and the shipped packages/frameworks/angular/generated/S2.ts emits '@Input() seed: any;' and '@Input() onTrace: any;'. Both claims hold exactly as reported."
