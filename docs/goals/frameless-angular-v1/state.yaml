      why_pnpm_overrides_is_refused_recorded_so_nobody_re_derives_it: "Three independent grounds. (1) Every move is INSIDE the declaring package's own accepted range - vite@8.0.16 declares esbuild '^0.27.0 || ^0.28.0' and sass '^1.70.0'; unstorage@2.0.0-alpha.7 declares chokidar '^4 || ^5' and lru-cache '^11.2.6'. Nothing is violating anything. (2) A hand-maintained override table becomes the silent thing - it would freeze resolutions with no signal when upstream moves. (3) T002's OWN STATED REASON FOR REFUSING OVERRIDES DOES NOT EVEN APPLY HERE: Angular's vendored vite@7.3.6 carries esbuild as a HARD DEPENDENCY, not a peer, so no peer-slot override could reach it."
      the_recurrence_is_the_board_lesson: "T002 under-scoped this phenomenon, and then T004 under-scoped the SAME phenomenon by a similar factor, and then the PM propagated T004's framing into this task's brief. All three read a diff by eye. THAT IS THE OPTION-D INFERENCE CHAIN RECURRING ONE LAYER UP, IN DEPENDENCY REVIEW. The detection METHOD failed, not the reviewers - which is precisely why the ruling is an instrument rather than a stronger warning."
