  - id: T007
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: >-
      Rule on the dependency leak T004 discovered running the OPPOSITE direction to T002 ruling 1:
      the Angular lane reaches the root catalog, even though the catalog cannot reach the Angular
      lane. Decide whether it is acceptable as-is, needs an asserted fact, or needs a mitigation.
    why_this_exists: >-
      T002 ruling 1 accepted that @angular/build vendors vite as an EXACT dependency, so the root
      catalog cannot pin the Angular toolchain even in principle, and it enumerated the costs of
      that. THE COST LIST HAS A FOURTH ENTRY IT DID NOT NAME. vite@8.0.16 declares esbuild and sass
      as OPTIONAL PEERS; @angular/build's exact esbuild@0.28.1 and sass@1.99.0 now satisfy them
      WORKSPACE-WIDE. Adding the Angular lane therefore moved root vite's esbuild 0.27.7 -> 0.28.1
      and added sass@1.99.0 for react, solid, vue and every vitest browser lane. The isolation
      ruling 1 relied on is one-directional, and the direction that leaks is the one nobody checked.
    pm_verified_at_dispatch: >-
      PM CONFIRMED IN THE LOCKFILE DIFF INDEPENDENTLY, not inherited from the Worker: the root
      vite@8.0.16 importer line moves from (esbuild@0.27.7)(yaml@2.9.0) to
      (esbuild@0.28.1)(sass@1.99.0)(yaml@2.9.0), and the same substitution propagates into
      vite-plus, vitest, @vitest/browser-playwright and vite-plugin-solid. PM then MEASURED the
      blast radius rather than reasoning about it: pnpm test:browser is byte-identical to HEAD on
      all four lanes (react 60, solid 49, svelte 13, vue 18) and the six-row pnpm e2e is green. So
      the leak is REAL, currently BENIGN, and UNMITIGATED.
    inputs:
      - "docs/goals/frameless-angular-v1 T002 ruling 1 and its cost list"
      - "docs/goals/frameless-angular-v1 T004 receipt, FINDING_THE_LEAK_RUNS_THE_OTHER_WAY"
