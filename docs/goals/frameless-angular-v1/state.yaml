      headline: >-
        RULING 4's PREMISE IS REFUTED BUT ITS CONCLUSION SURVIVES, STRONGER. Every @angular-eslint
        rule carries its own membership flag - meta.docs.recommended === 'recommended' - and the
        META PACKAGE'S PUBLISHED PRESET IS GENERATED FROM THAT SAME METADATA. Its header reads
