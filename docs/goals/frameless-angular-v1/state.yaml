      ruling_3e_RESTATED_superseding_the_original_text: >-
        this.-qualification is INSIDE 3e's intent and is NOT content-triggered under Gate 3. The
        distinction that matters: 3a's forbidden content trigger was a DISCRIMINATING PREDICATE OVER
        BODY CONTENTS THAT SELECTS BETWEEN TWO EMISSION SHAPES - which is why two careful readers got
        2 and 6. Qualification is a TOTAL FUNCTION applied identically to every handler, resolving
        against a name set that is a DECLARED IR FACT known before any body is read. No subset, no
        branch, no shape choice, no boundary to disagree about. Same admissibility ground as 3d.
        RESTATED: the lowered method body is transplanted with EXACTLY ONE transformation, total,
        scope-aware and fail-closed. Every free identifier occurrence resolving - under ordinary
        lexical scoping, with body-locals, function and arrow parameters, and @for variables
        shadowing - to a name in the IR's DECLARED COMPONENT BINDING SET (state, props including
        onTrace, derived) is qualified as this.<name>. Operators untouched: next++ becomes this.next++.
        NOTHING else moves - not event, not imports, not injected __framelessWrite(...), not
        body-local const, not lambda parameters, not @for variables. If any binding cannot be
        resolved the emitter THROWS a named error rather than guessing. The property 3e defended
