      summary: "Six gates re-run against the landed lane: G1 PASS, G2 PASS, G3 PASS, G4 PASS (narrowed), G5 FAIL, G6 FAIL. The ruling is upheld AND strengthened, with one of its two stated reasons measured FALSE and replaced. The @Output()->output() half is recorded separately as G4 UNKNOWN because its domain is empty."
      gate_1_discharged_exactly_as_predicted: "G1 was DEFERRED only because Angular was absent. The lane landed at T004 and G1 now PASSES on measurement rather than on assertion - both forms produce zero diagnostics and byte-identical DOM under a real AOT build. G5 did NOT clear, exactly as this card predicted in advance, because it was never about absence."
