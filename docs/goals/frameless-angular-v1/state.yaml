      why_the_meta_package_stays_forbidden: >-
        ts-base.js and template-base.js carry ONLY `parser` and `plugins` - no rules, no files
        globs, no processor. That is the OPPOSITE of Svelte, whose base entry carried the parser
        instance, globs and processor, which is the stated reason Svelte consumed the config whole.
        Angular's parser and processor are already direct dependencies. So the meta package buys
        NOTHING derivable and costs @angular-devkit/core, @angular-devkit/schematics,
        @angular-eslint/builder, @angular-eslint/schematics and an @angular/cli >=22 <23 peer.
        T002's stop_if was NOT reflexive.
      the_one_measured_gap_and_why_its_direction_matters: >-
        use-lifecycle-interface IS in upstream's published ts-recommended at severity 'warn', and its
        meta.docs carries NO recommended key (PM verified: undefined). The derivation yields 12 where
        upstream publishes 13. So the applied set is DERIVED UNION ONE RECORDED ADDITION, the
        addition carrying its measured provenance. NOTE THE DIRECTION: the only frameless-authored
        delta ADDS a rule. AN ADDITIONS-ONLY DELTA CANNOT BE USED TO MAKE A CORPUS GREEN, which is
        what keeps the independence property intact.
      ruling_2_all_four_dissolve_and_the_ordering_is_the_argument: >-
        NONE of the four colliding rules is in the derived set - PM verified component-class-suffix
        and prefer-signals both return undefined. Measured end-to-end with the derived set through
        extract-inline-html on a realistic emitted Angular S2: CLEAN SHAPE 0 MESSAGES, planted mutant
        (@Input('seedAlias') + template ==) 2 MESSAGES, one per plugin.
        THE TRAP THE PM NAMED IS AVOIDED BY ORDERING: the set was fixed by UPSTREAM'S OWN METADATA
        BEFORE the corpus was measured, and the measurement then came back clean. We did not remove
        what fired. If a rule INSIDE the upstream-authored set ever fires, that remains a FINDING and
        a STOP.
        component-class-suffix has no standing and says so itself - "As of v20, this is no longer
        recommended by the Angular Team". THE ANGULAR TEAM REMOVED IT; WE DID NOT.
      prefer_signals_the_tension_is_real_but_not_the_one_it_looked_like: >-
        angular-eslint DOES hold the opposite view of decorator-vs-signal from frameless - but they
        did NOT put that view in `recommended`; it lives in `all`. So "the Angular team decided X"
        OVERSTATES it: they decided it is an OPT-IN OPINION. And the twice-made NO-SUGAR ruling
        turned on G1 (nothing measurable, Angular absent) and G5 (reactivity depth and throw
        behaviour differ). A lint preference addresses NEITHER. It does not overturn the ruling, and
        it must NOT vanish with the apply-all experiment: ROUTED TO T005 to weigh on the record.
      two_bonus_dissolutions: >-
        The three type-requiring THROWERS (no-developer-preview, no-experimental, no-uncalled-signals)
        are ALL outside recommended, so the "cannot be filtered generically" problem is MOOT for the
        applied set - and it is the reason `all` is refused rather than a reason to hand-pick.
