  intake:
    original_request: "Owner asked, during frameless-idiom-policy-v1: 'I'm also wondering if we should start the goals for Vue, Angular, and Svelte.' This board is the Angular answer, prepped after the idiom policy was ratified."
    interpreted_outcome: "Angular becomes a frameless target with proven activation neutrality on official tooling, including the handler lowering Angular's template grammar forces."
    input_shape: specific
    audience: "frameless maintainers and future adapter authors"
    authority: requested
    proof_type: test
    completion_proof: "Angular row green in pnpm e2e with asserted S1/S2/S3 equality."
    likely_misfire: "Treating Angular as 'Vue with different syntax' and discovering mid-implementation that handler bodies cannot be inlined at all. That is a restructuring problem, not a formatting one, and it should shape the emitter's architecture from the first line rather than being retrofitted."
    blind_spots_considered:
      - "FORCED LOWERING is the defining constraint. Angular template expressions forbid const, arrow functions, destructuring and ++, so a handler body cannot be inlined - it must be hoisted to a named class member and referenced. For react/solid/qwik the emitter chooses a handler SHAPE; for Angular it must TRANSFORM. docs/emitter-idiom-policy.md declares this outside policy scope, so do NOT run the six gates on it."
      - "Angular is the framework that forced the policy's baseline definition to stop meaning 'the literal form', because Angular has no literal form. If a case is found where the baseline definition still does not resolve, that is a POLICY DEFECT to report upward, not a licence to improvise."
      - "The decorator-vs-signal question is already ruled and was ruled DENIED, not deferred. G1 will clear when a lane lands; G5 will not, because G5 was never about absence. Be suspicious of a re-derivation that flips it."
    existing_plan_facts:
