      - "The pnpm-lock.yaml diff on the current dirty tree"
    constraints:
      - "Do not implement. Rule."
      - "THE QUESTION IS NOT WHETHER IT BROKE ANYTHING - it demonstrably did not, and that is already measured. The question is whether a silent cross-lane toolchain move is ACCEPTABLE UNASSERTED, given that this board's own ruling 1 invented the asserted-toolchain-fact mitigation for precisely this class of drift."
      - "Weigh the asymmetry explicitly: an exact vendored pin is what makes the Angular lane immune to the catalog, and the SAME exactness is what lets it override optional peers elsewhere. Say whether ruling 1's reasoning survives with a fourth cost recorded, or whether it is materially wrong."
      - "pnpm.overrides was considered and refused by T004 as outside allowed_files. If you rule it correct, say so and spec the Worker package; if you rule it wrong, say why, because it is the obvious repair and a future reader will reach for it."
