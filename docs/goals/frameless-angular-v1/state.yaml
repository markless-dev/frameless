  title: "Frameless Angular adapter v1"
  slug: "frameless-angular-v1"
  kind: specific
  tranche: "Land an Angular lane end to end - official scaffold, emitter with handler-to-class-method lowering, gate, goldens, demo, e2e row asserting S1/S2/S3 equality - then re-run the held-out decorator-vs-signal question against a real build."
  status: active
  started: >-
    STARTED 2026-07-27. T001 Scout dispatched by the PM after frameless-svelte-v1 landed its
    lane (pnpm e2e green, four rows) and ruled IR-4. This board is no longer prepped-only;
    the previous "NOTHING IS RUNNING THIS BOARD" banner is withdrawn as of that dispatch.
  inherited_gaps_revalidated: >-
    Two of the three standing gaps inherited from frameless-idiom-policy-v1 are now FIXED and the
    charter has been corrected: pnpm check DOES typecheck emitted output (three tsc passes plus a
    per-package emitted-typecheck lane), and pnpm test:browser runs clean (react 55/55, solid
    44/44). Still true: pnpm e2e pins dev mode only, scenarios.box.ts modes ['dev'].
  ir_4_ruled_by_svelte: >-
    INHERITED RULING, do NOT re-litigate. frameless-svelte-v1 T005 ruled IR-4 DEFERRED and
    STRENGTHENED after re-running all six gates against a real emitter at a pinned version.
    Binding text, verbatim: "A lane discharges ONLY the Gate 1 absent-framework deferral and the
    Gate 6 no-lane deferral. It does NOT touch G2, G3, G4 or G5, and it does NOT satisfy the
    version corollary's second conjunct." So landing this lane clears Gate 1 and Gate 6 for this
    framework's sugar and NOTHING else. CORRECTED 2026-07-27 by frameless-svelte-v1 T999, which
    caught the PM's original closing sentence contradicting the verbatim quote two lines above it:
    IR-4 may NOT be invoked as a blocker before G2-G5 have been scored against a real emitter. A
    version-gated sugar that FAILs G2 or G5 is DENIED, not deferred - T005 ruled worked example 6
    exactly that way, and its own dissent predicts Vue's defineModel is DENIED at G2, meaning IR-4
    was never its blocker. The withdrawn sentence read "Every version-gated sugar ruling on this
    board must DEFER on IR-4 grounds and say so", which would have manufactured a DEFERRED where a
    DENIED is correct.
  s3_contract_changed_option_d: >-
    demos/react-official/three-way-contract.ts now reads S3's `text` observation from the SERVED
    PAYLOAD (served.text), not the post-activation live DOM, and `served: EnvironmentResponse` is a
    REQUIRED parameter threaded through runScenario at all four existing call sites. A new lane must
    thread it too. Ruled as OPTION D by frameless-svelte-v1 T006, implemented by its T007, after
    svelte 5.56.8's remove_input_defaults() was found to delete the value ATTRIBUTE on hydration by
    design. servedClientEntry and expectedNavigations are total Readonly<Record<...>> tables.
    QUALIFIED 2026-07-27 by frameless-svelte-v1 T999. Option D is UPHELD, but do NOT inherit it as
    "a site correction is free because nothing was lost". Its stated reason - that the value
    attribute "never witnessed client state in ANY lane" - is REFUTED by our own emitted output:
    packages/frameworks/solid/generated/S3.jsx:20 emits attr:value={text()}, a SIGNAL-TRACKED
    content attribute (DEFECTS.md finding 5), so the old live-DOM read DID witness post-hydration
    state in the Solid lane. Option D is a uniform TRADE, not a superset: it gains the
    "markup the server never sent" class in all four lanes and loses the class "S3 text seeded
    wrong at hydration, REACT LANE ONLY".
    CORRECTED A THIRD TIME on 2026-07-27 by frameless-svelte-v1 T011, which MEASURED all four lanes
    instead of inheriting any. solid-js 1.8.22 does NOT rewrite the attribute at hydration:
    web/dist/web.js:148 setProperty and :152 setAttribute BOTH open with `if (isHydrating(node))
    return;`, so under a client mis-seed the Solid attribute AND property keep the served value. PM
    verified both lines. Qwik was MEASURED for the first time (frozen under two independent
    instruments, one of which resumed the container and drove data-writes to 2), so the inherited
    prose happened to be right. DEFECTS finding 5 still stands - a real POST-activation edit through
    the emitted onInput does move the attribute - which is what makes attr: necessary and is also
    the two-sided control proving the read works.
    THE CHAIN IS THE LESSON, and it is why this is recorded rather than just fixed. T006 said "no
    lane". T010 said "SOLID ONLY". The T999 re-audit measured React and said "SOLID AND REACT". T011
    measured all four and the answer is "REACT ONLY". THE SAME INFERENCE ERROR RECURRED THREE TIMES:
    reading attr:value={text()} off an EMITTED GOLDEN and concluding something about HYDRATION-TIME
    behaviour. A golden cannot tell you what a framework does at hydration; only a browser can.
    Each pass corrected the previous one's wording while repeating its method.
    CORRECTED 2026-07-27 by the T999 re-audit: the earlier text said "SOLID LANE ONLY" and that was
    MEASURABLY FALSE. react-dom 19.2.3 also rewrites the value CONTENT ATTRIBUTE at hydration -
    initInput skips the property write while hydrating (react-dom-client.development.js:1720) but
    sets element.defaultValue UNCONDITIONALLY at :1721, and .defaultValue reflects the content
    attribute; the hydration call site is :5287. Measured in Chromium twice, with a non-React input
    on the same page as a frozen-attribute control (seed=bye -> react attr "bye", control attr
    "hello"). PM verified both source lines. The qwik cell of that table remains INHERITED PROSE,
    NEVER MEASURED - treat it as unestablished. THE LESSON FOR THIS BOARD, which is why the
    correction is recorded rather than silently applied: two audit passes checked the DISTRIBUTION
    of a false sentence and neither checked the TRUTH of its replacement, and the replacement was
    labelled "measured" when what had been measured was an emitted golden - which cannot decide
    whether a framework rewrites an attribute at hydration. That is this repo's recurring
    proxy-for-measurement fault recurring one layer up, in the documentation. THE PRECEDENT TO INHERIT, verbatim: "An observation must
    be read where its name claims; a site correction is legitimate even when it trades coverage,
    provided the trade is uniform, the loss is enumerated PER LANE, and a re-open trigger names the
    lost class." So if this board moves a measurement site, it owes a per-lane loss table and a
    re-open trigger - an undisclosed or non-uniform trade is NOT covered by this precedent. Related:
    the three-part widening test's criterion 2 was restated for the same reason; it demanded a
    strictly SMALLER accepted-behaviour set AND a written statement of what the old check caught
    that the new cannot, which cannot both hold. Full trail in
    docs/goals/frameless-svelte-v1/notes/T006-value-attribute-ruling.md.
  svelte_is_the_freshest_precedent: >-
    demos/svelte-official is a landed 4th e2e lane and docs/goals/frameless-svelte-v1 is the closest
    prior board. Read both before planning. pnpm e2e is green with four rows, all observations equal.
  instrument_rules: >-
    FOUR STANDING CONSTRAINTS added by T010, full text in goal.md. This board adds four new
    instruments and four of six findings on the defects goal were instrument faults. (1) Two-variable
    triangulation before any finding is filed - and a finding that reproduces on a stock official
    scaffold with none of our code is evidence the TEST is unfair, not that the framework is broken.
    (2) Every instrument asserts its own preconditions. (3) Two-sided calibration for harnesses, not
    only gates - a settle loop that cannot throw is not a settle loop. (4) An instrument that
    establishes a SET or issues a VERDICT must be calibrated against a KNOWN MEMBER - plant an
    instance a scan should find, read a status field on a case whose true value you already know,
    establish a green cell's variance before treating it as a verdict. NOT redundant with rule 2:
    rule 2 would have a scan assert THAT IT RAN, not that it COVERED THE SHAPE IT NAMED.
  oracle:
    signal: "pnpm e2e includes an Angular row driving an official Angular scaffold at the pinned lockfile version, and its S1/S2/S3 observations are ASSERTED equal to demos/react-official, demos/solid-official, demos/qwik AND demos/svelte-official under the same matrix."
    cadence: "after each Worker package and at final audit"
    final_proof: "A green pnpm e2e receipt naming the Angular row, plus the decorator-vs-signal question re-run with Gate 1 and Gate 5 recorded against a real build rather than a description."
  intake:
    original_request: "Owner asked, during frameless-idiom-policy-v1: 'I'm also wondering if we should start the goals for Vue, Angular, and Svelte.' This board is the Angular answer, prepped after the idiom policy was ratified."
    interpreted_outcome: "Angular becomes a frameless target with proven activation neutrality on official tooling, including the handler lowering Angular's template grammar forces."
    input_shape: specific
    audience: "frameless maintainers and future adapter authors"
    authority: requested
    proof_type: test
    completion_proof: "Angular row green in pnpm e2e with asserted S1/S2/S3 equality."
    likely_misfire: "Treating Angular as 'Vue with different syntax' and discovering mid-implementation that handler bodies cannot be inlined at all. That is a restructuring problem, not a formatting one, and it should shape the emitter's architecture from the first line rather than being retrofitted."
    blind_spots_considered:
      - "FORCED LOWERING is the defining constraint. Angular template expressions forbid const, arrow functions, destructuring and ++, so a handler body cannot be inlined - it must be hoisted to a named class member and referenced. For react/solid/qwik the emitter chooses a handler SHAPE; for Angular it must TRANSFORM. docs/emitter-idiom-policy.md declares this outside policy scope, so do NOT run the six gates on it."
      - "Angular is the framework that forced the policy's baseline definition to stop meaning 'the literal form', because Angular has no literal form. If a case is found where the baseline definition still does not resolve, that is a POLICY DEFECT to report upward, not a licence to improvise."
      - "The decorator-vs-signal question is already ruled and was ruled DENIED, not deferred. G1 will clear when a lane lands; G5 will not, because G5 was never about absence. Be suspicious of a re-derivation that flips it."
    existing_plan_facts:
      - "docs/emitter-idiom-policy.md governs every emission-site form choice. Forced lowering is explicitly NOT a policy question - do not run the gates on it."
      - "Official scaffold only (ng new as it ships). No hand-rolled build harness - see docs/goals/frameless-qwik-v1/ for what that cost."
      - "IR gaps biting Angular: IR-1 no bindable prop kind (blocks model()/[(banana)]), IR-2 no emit concept (blocks output()), IR-3 default slot only (blocks ng-content select=), IR-4 no framework-version input (signal input()/output() need >=17.1/17.2), IR-6 no class/style binding vocabulary (blocks [class.x], ngClass)."
      - "ALREADY RULED, do not re-litigate: decorator @Input()/@Output() vs signal input()/output() member declaration = NO-SUGAR, decided independently twice during frameless-idiom-policy-v1 T006 (PM pre-registration + zero-context cold agent). Decisive gates G1 (nothing measurable, Angular absent) and G5 (reactivity depth + throw behavior differ). Full record: docs/goals/frameless-idiom-policy-v1/notes/T006-cold-agent.md."
      - "GATE 6 DEFERRED: every OTHER Angular sugar ruling is deferred-not-denied until this board lands a lane at a pinned lockfile version."
      - "UNRESOLVED SOURCE CONFLICT inherited: Angular's API docs say model() is stable since v19.0; the v20 announcement says v20. Resolve against the actual lockfile version once one exists."
      - "CORRECTED 2026-07-27 (T010 revalidation): pnpm check DOES now typecheck emitted output - three tsc passes plus a per-package emitted-typecheck lane. NOT a gap. Angular's own build additionally typechecks templates; confirm what that adds rather than assume."
      - "CORRECTED 2026-07-27: pnpm test:browser does NOT hang - it runs clean, react 55/55 and solid 44/44. STILL TRUE: pnpm e2e pins dev mode only."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

