    receipt:
      result: done
      decision: approved
      harness: claude-code
      full_outcome_complete: false
      rationale: >-
        Board PROCEEDS, re-sequenced at one boundary, not narrowed. Two of T001's load-bearing
        findings did NOT survive checking, and the PM independently verified both overturns.
      overturn_1_parseTemplate_PM_VERIFIED: >-
        @angular/compiler@22.0.8 DOES export a single-file template oracle. compiler.d.ts:5197
        declares parseTemplate(template, templateUrl, options?): ParsedTemplate and it IS in the
        runtime value-export list at :6758, with errors: ParseError[] | null. No tsconfig, no
        program. T001's "largest emitter-test-harness divergence on the board" is OVERTURNED - that
        claim was true for TYPE checking (NgtscProgram) and false for GRAMMAR checking, which is
        this board's actual central risk. PM RAN IT: typeof parseTemplate === 'function', a clean
        template returns errors null, and a planted violation returns 1 error - so the two-sided
        calibration the gate needs is already demonstrated.
      overturn_2_corpus_count_PM_VERIFIED: >-
        The corpus carries FIFTEEN event records, not 14. ir.records.events is 1 / 7 / 7; T001
        recorded S3 as 6. PM re-counted from the goldens directly.
      finding_3_policy_defect_reported_upward: >-
        goal.md:13 AND docs/emitter-idiom-policy.md:28-31 both assert Angular template expressions
        forbid ARROW FUNCTIONS, citing angular.dev. At 22.0.8 that is no longer safe to assert -
        compiler.d.ts:1964 declares `class ArrowFunction extends AST`, the template-expression base
        class, alongside TemplateLiteral, SpreadElement, RegularExpressionLiteral and
        TypeofExpression. This does NOT reopen forced lowering: const/let and if remain absent from
        the action grammar and there is NO UpdateExpression node at all, so S1's count++ stays
        unexpressible. But the STATED REASON in two governing documents is partly stale. Recorded as
        a T005 finding per the charter's own instruction, not a T003 work item.
      ruling_1_RESTATED_BY_T007_ON_MEASUREMENT: >-
        RESTATED 2026-07-27, NOT APPENDED TO. THE DECISION BELOW STANDS; ONE OF ITS SENTENCES IS
        FALSE. The original read "there is no shared surface to pin, so the catalog is not violated,
        it is INAPPLICABLE". THERE IS A SHARED SURFACE: the workspace optional-peer graph. T007
        measured that adding the Angular lane moved SIX optional peers and changed the peer identity
        of TWENTY-FIVE packages - the whole SvelteKit stack, @qwik.dev/core and router,
        @markless/core and router, and @async/witness, which is the e2e instrument itself.
        THE CORRECTED FRAME, and the reason this is a restatement rather than a fourth bullet: the
        Angular lane stands in TWO relationships to the catalog, in OPPOSITE directions. It is
        EXEMPT FROM the catalog (what ruling 1 examined, and got right), and it is a PROVIDER INTO
        the peer graph the catalog governs (what ruling 1 did not examine at all). Bolting a fourth
        cost onto a three-cost list whose entries all have the opposite polarity would preserve the
        frame error while appearing to fix it.
        AND THE MECHANISM IS NOT THE ONE ANYONE ASSUMED. It is not vendored exactness: four of the
        six moved peers arrived on ORDINARY CARET RANGES, and two of those are the ng-new scaffold's
        own devDependencies (jsdom ^28.0.0, prettier ^3.8.1), while chokidar came in on
        @angular/compiler-cli's ^5.0.0. THE MECHANISM IS WORKSPACE MEMBERSHIP - so this is not an
        Angular property, and THE NEXT LANE ADDED TO THIS WORKSPACE WILL DO IT TOO.
      ruling_1_build_governance: >-
        The Angular lane is governed by angular.json plus the CLI and is EXEMPT from the vite
        catalog BY CONSTRUCTION. ACCEPTABLE, DOES NOT BLOCK: the oracle is activation neutrality on
        official tooling, and a vendored vite is what official Angular tooling IS. Blocking on it
        would be blocking on the scaffold being official. The precedent is demos/qwik (a stock
        scaffold owning its own pipeline, landed by the goal that exists to forbid hand-rolled
        harnesses), NOT the Qwik vite pin.
        WHAT THE REPO GIVES UP, stated plainly: (a) a vite CVE/bugfix bump in the catalog never
        reaches the Angular lane - only an @angular/build release does; (b) the lane's vite version
        is invisible at pnpm-workspace.yaml, so a reader of the catalog will believe the repo is on
        vite 8 everywhere; (c) an @angular/build patch can move vite under the lane with no file in
        this repo changing.
        MITIGATION REQUIRED AND CHEAP: T004 ships an ASSERTED TOOLCHAIN FACT - read the RESOLVED
        @angular/build's vendored vite version and assert it against a recorded literal. That is the
        baseline-form-inventory discipline applied to the toolchain: the divergence becomes a
        declared entry a test re-reads, so it goes RED on drift instead of drifting silently.
        EXPLICITLY REFUSED: a pnpm.overrides entry forcing the Angular lane onto catalog vite - that
        is a hand-rolled build harness by another name, replacing the version Angular tested against
        with one it did not.
      ruling_1b_typescript_two_populations: >-
        The brief CONFLATED two populations. (a) demos/angular-official declares typescript ~6.0.x
        OFF-CATALOG following demos/svelte-official verbatim and does NOT join the root tsc --noEmit;
        ng build is its typecheck. Settled by precedent. (b) packages/frameworks/angular is OUR
        TypeScript: it takes its own project pass and MUST NOT require TS>=6, guaranteed by a HARD
        IMPORT CONSTRAINT - it may import @angular/compiler and the @angular-eslint leaves, and must
        NOT import @angular/core, @angular/build or @angular/compiler-cli.
        PM MEASUREMENT, the one the Judge required before dispatch: catalog TypeScript 5.9.3 parses
        @angular/compiler 22.0.8 and @angular-eslint 22.1.0 declaration files CLEANLY - pnpm check
        exit 0 with the packages installed. So NO tsconfig exclude and NO package-level typescript
        pin are needed. The Judge pre-ruled both outcomes so no Worker would improvise; this is the
        good one.
      ruling_2_onTrace_is_an_Input_PM_VERIFIED: >-
        @Output()/EventEmitter REFUSED. IR-2 DOES NOT BLOCK THE LANE. Three independent reasons,
        decided by the CORPUS rather than by idiom. (1) The IR says callback -
        ComponentPropExpression.kind 'callback' - while EnrichedEventRecord, the IR's actual event
        concept, binds to a hostNodeId that onTrace does not have; emitting a prop as an output is
        the emitter inventing a construct the IR does not declare. (2) THE CALL SIGNATURE DECIDES
        IT: emit() takes ONE value, and the corpus calls onTrace with TWO and THREE positional
        arguments with the DOM event third. PM VERIFIED against the goldens: onTrace('setup', {runs:
        1}) and onTrace('change', { count }) are two-arg; onTrace('add', {id,title}, event) and nine
        others are three-arg. An output forces an emitter-invented wrapper object no other lane has.
        (3) Arity is VARIABLE within one corpus, so there is no non-arbitrary payload shape.
        ON IDIOM VS CHEAPNESS, honestly: @Output() is idiomatic Angular for a component's OWN event;
        onTrace is a caller-supplied observer threaded identically through four lanes, so "a
        callback passed in is an input" is the framing that applies. The correct answer and the
        cheap answer coincide here, which is worth saying because they often do not.
      ruling_3a_lower_every_handler_unconditionally: >-
        T001 says 13 of 14 need lowering with 2 inlinable. The Judge counts 15 records and up to SIX
        inlinable by the letter of Angular 22's action grammar. THAT DISAGREEMENT IS THE RULING -
        two careful readers of one corpus got 2 and 6, so "is this body inlinable?" is a judgement
        call about a grammar boundary, and a judgement call inside an emitter is DRIFT. It is also
        CONTENT-TRIGGERED: Gate 4 fails a content-recognized subset, and Gate 3's rider would demand
        a fail-closed enumeration of every IR channel that injects statements - EnrichedEventRecord.handlers
        AND ir.persistence, which injects __framelessWrite(...) into handler bodies DURING lowering.
        An inlining rule reading the IR record would not see that injection and would inline a
        handler that later grows a statement. Uniform lowering DELETES the question.
      ruling_3b_names_and_collisions: >-
        on<HostNodeId><EventName>, each segment upper-camelled from DECLARED IR fields verbatim
        (h7 + input -> onH7Input). Keyed on (hostNodeId, eventName) - never contents, never a
        counter. Deliberately NOT the IR id (event:N): an index shifts every downstream name when a
        handler is inserted upstream, so a one-line source edit would rewrite the whole class.
        COLLISIONS: unique across all three goldens, but the schema permits a duplicate, so the
        emitter THROWS a named error rather than appending a suffix - a counter makes names depend
        on record order and silently reintroduces the instability the scheme exists to prevent. A
        planted-duplicate row must prove the throw fires; the corpus has ZERO natural instances, so
        an uncalibrated green is vacuous.
      ruling_3d_parameters_always_pass_never_infer: >-
        Signature is on<Host><Event>(<enclosing @for variables, outermost first>, event: Event).
        $event is passed to EVERY lowered method INCLUDING S1's increment which never reads it -
        deciding otherwise requires inspecting the body, the same content trigger 3a refuses. Every
        enclosing @for variable is passed always; that is a STRUCTURAL template fact, which is what
        makes it admissible where a content fact would not be. Unused params do not fail pnpm check:
        root tsconfig sets strict but NOT noUnusedParameters.
      ruling_3e_the_event_rename_is_DISSOLVED_not_answered: >-
        The brief called it a source transformation. IT IS NOT ONE, if the split is made in the
        right place: the CLASS METHOD KEEPS THE IR'S OWN PARAMETER NAME `event` and its body is a
        VERBATIM TRANSPLANT with nothing rewritten inside it, while the TEMPLATE CALL SITE passes
        Angular's $event - (input)="onH7Input(todo, $event)". $event is not a rename of the author's
        identifier; it is Angular's ONLY spelling for "the event at this binding site", appearing
        only in the template, where the author's identifier never existed. The emitter chooses WHAT
        TO PASS, not what was written.
        CONSEQUENCES: Gate 3 is NOT engaged - no contents inspected. Gate 5 is NOT engaged either -
        Angular sanctions exactly ONE way to reference the event at a binding, so the sanctioned set
        is a singleton with no candidate and no baseline. The Judge DECLINES to fabricate gate
        outcomes for a non-question.
        The body-verbatim property is also what makes IR-5 FREE: S3's four syncPolicy bodies carry
        event.preventDefault() which transplants unchanged into a resident SYNCHRONOUS method, so
        the Qwik QRL-laziness failure has NO ANALOGUE.
      ruling_4_arbiter_route_BOTH_in_T003: >-
        Corrects the record TWICE - the PM's premise was wrong, and T001's correction is NOW ALSO
        STALE: the Svelte gate today imports BOTH eslint-plugin-svelte AND svelte/compiler parse
        (T009 landed). The shipped precedent is not two rival routes, it is BOTH ROUTES IN ONE GATE,
        compiler-first.
        (1) parseTemplate - REQUIRED, PRIMARY, asserted as an EXACT EMPTY error set over all three
        templates with a mutation calibration proving red. It interrogates this board's central risk
        directly: did forced lowering produce a template Angular's own parser accepts?
        (2) @angular-eslint - REQUIRED, SECONDARY, SAME PACKAGE. Restores arbiter independence and
        supplies the one class neither other instrument covers: "compiles clean and is WRONG".
        PUT IN T003 RATHER THAN A T009-STYLE FOLLOW-UP DELIBERATELY, and against the Svelte board's
        own sequencing, because Svelte deferred it and PAID TWICE - a blocked attempt on a missing
        eslint runner, and a checkSources async refactor landing after the gate was written. Both
        costs are now known and both are cheaper while the file is being written.
        (3) NgtscProgram - REFUSED at T003, DEFERRED to T004's real ng build.
        DIVISION OF LABOUR: parseTemplate answers "is this grammatical?", angular-eslint answers
        "grammatical and still wrong?", T004's ng build answers "does it typecheck and AOT-compile?"
      ruling_5_prop_types_FOLLOWING_precedent_not_setting_it: >-
        strictTemplates genuinely covers more than svelte-check - it types $event at every lowered
        call site and validates @for track, and both matter enormously here because 15 LOWERED CALL
        SITES ARE THE RISK SURFACE. But it does NOT close the hole: an untyped @Input() is `any`,
        and `any` defeats strictTemplates exactly as it defeats svelte-check. OUT OF SCOPE for T003 -
        cross-target, and it needs an IR input that does not exist.
        NOT A NEW DISCOVERY: packages/frameworks/react/test/emitted-typecheck.test.ts:14-16 ALREADY
        records it as "deliberate scope, not laxity", citing frameless-testing-ci-v1 T005. So the
        precedent is OLDER than the Svelte board. THREE INDEPENDENT RE-DERIVATIONS (Vue scout,
        Angular scout, Vue judge as IR-8) ARE EVIDENCE THE DOCUMENTATION IS NOT REACHING THE BOARDS.
        Route to a shared board; do not re-derive a fourth time. T003 owes the written record of the
        limitation so a green is not over-read.
      also_ruled:
        - "withIncrementalHydration() IS OFF and the Activation union is NOT widened. A third kind is not a widening of the SAME claim (what Svelte T002 approved for servedClientEntry); it is a NEW claim with no counterpart in the other four lanes, so cross-lane equality would become untestable. If the scaffold enables it by default that is a FINDING AND A STOP, not a workaround."
        - "Post-activation signal is a MEASUREMENT OBLIGATION on T004 with two-sided calibration. No Worker may reason it out. The marker must be set IMPERATIVELY in Angular's own signal, never as a template attribute binding - SSR would emit it and forbidInServedPayload would correctly fail. If both candidates prove unreliable the permitted repair is a STRONGER SIGNAL; raising a timeout is FORBIDDEN."
        - "Dev-warning sink installs at the TOP of src/main.ts before bootstrapApplication and is REQUIRED, owed by T004 and NOT pushable down to T003 - NG0912/NG0913 are HYDRATION diagnostics and hydration only happens in the demo. witness 0.7.0 exposes consoleErrors only, so any T999 check phrased over them passes VACUOUSLY. provideBrowserGlobalErrorListeners() and ErrorHandler DI are NOT substitutes: they catch errors, these are warnings."
        - "IR numbering reconciled. NONE of the seven blocks the lane - the same result Svelte reached, now with IR-2 RESOLVED rather than left conditional. IR-1 out of scope hard; IR-2 deferred per ruling 2; IR-3/IR-6 deferred, no instance; IR-4 deferred and NOT reopened; IR-5 no schema change and LIVE here (4 of S3's 7 records carry syncPolicy); IR-7 GUARD REQUIRED IN T003 - S1's derived is trivial and WILL pass, which is the definition of a green vacuum."
      sequencing_one_boundary_moved: >-
        packages/frameworks/angular is a NODE-ONLY package: no vitest browser lane, no playwright,
        no root test:browser change. Svelte's T003 browser lane worked because vite-plugin-svelte
        compiles .svelte in-process; Angular has no cheap equivalent, and @angular/build's vitest
        integration would drag the vendored vite 7.3.6 into a workspace package alongside vite 8.
        Keeping the Angular BUILD entirely out of packages/frameworks/angular is what GUARANTEES the
        two vites never meet in one package - ruling 1 discharged STRUCTURALLY rather than by policy.
        CONSEQUENCE TO RECORD, NOT HIDE: T003 ships goldens no Angular TYPE checker has seen, so
        T004 carries real risk of finding emitter defects outside its own allowed_files - the pattern
        that blocked Svelte T004. If T004 blocks on an emitter defect, the correct response is a
        T004a emitter-repair package, NOT widening T004's allowed_files.
      dissent:
        - "UNCOMFORTABLE that T003 completes with NO Angular TYPE check having run on emitted output. parseTemplate covers GRAMMAR ONLY. This is strictly weaker than the Svelte lane, whose compile() covered both grammar and a real compile. The alternative - an in-package NgtscProgram - was refused as a second harness and the Judge still believes that is right, but it is a genuine coverage gap between T003 and T004 rather than a solved problem. Merging T003 and T004 would close it; that was considered and REJECTED as too large for the hardest board, and the rejection could reasonably go the other way. PM NOTE: PM accepted the split, on the ground that the Svelte T004 block was survivable and produced the Option D ruling."
        - "PREDICTS angular-eslint's template rules will find the shipped corpus CLEAN, exactly as eslint-plugin-svelte found Svelte's, because Angular's @for makes track SYNTACTICALLY MANDATORY and thereby closes the require-each-key hole at the compiler. If so the arbiter's value is PROSPECTIVE, and its keep is earned by the planted-violation calibration rather than by a finding. Stated so a clean result is not read as the arbiter being pointless, and equally so nobody manufactures a finding to justify it."
        - "UNEASY that ruling 3f found a stale premise in the idiom policy's own preamble by reading a d.ts for ten minutes, and suspects the v17-era grammar description has propagated further than the two cited sites. A systematic re-read of Angular claims across docs/ is probably owed and is not on any board."
        - "T001 MISCOUNTED the corpus (14 vs 15) and UNDERSTATED inlinability (2 vs 6) while being right about every structural risk it named. Both errors are in the direction of making the board look MORE constrained than it is, which is the safe direction, and neither changes a ruling. Recorded because T001 is this board's evidence base and a reader should know its arithmetic was not exact."

