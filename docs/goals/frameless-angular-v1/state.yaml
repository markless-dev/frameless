goal:
  title: "Frameless Angular adapter v1"
  slug: "frameless-angular-v1"
  kind: specific
  tranche: "Land an Angular lane end to end - official scaffold, emitter with handler-to-class-method lowering, gate, goldens, demo, e2e row asserting S1/S2/S3 equality - then re-run the held-out decorator-vs-signal question against a real build."
