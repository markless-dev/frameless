    was never its blocker. The withdrawn sentence read "Every version-gated sugar ruling on this
    board must DEFER on IR-4 grounds and say so", which would have manufactured a DEFERRED where a
    DENIED is correct.
  s3_contract_changed_option_d: >-
    demos/react-official/three-way-contract.ts now reads S3's `text` observation from the SERVED
    PAYLOAD (served.text), not the post-activation live DOM, and `served: EnvironmentResponse` is a
    REQUIRED parameter threaded through runScenario at all four existing call sites. A new lane must
