      result: done
      decision: approved
      full_outcome_complete: false
      harness: claude-code
      note: notes/T007-toolchain-leak.md
      rationale: "ASSERT IT. Not acceptable as-is: detection was a human reading a 3918-line diff, and that human UNDER-SCOPED IT THREEFOLD. pnpm.overrides REFUSED - every move is inside the declaring package's own accepted range, T002's stated reason does not transfer, and a hand-maintained override table becomes the silent thing. T002 ruling 1's DECISION stands; its 'no shared surface to pin' sentence is FALSE and its cost list is framed wrongly rather than short by one. Mechanism REFUTED: 4 of 6 peers arrived on carets and 2 are scaffold devDeps - workspace membership, not exactness. The instrument must assert the SET; toolchain.test.ts was green throughout."
      summary: "Measured the leak independently from the lockfile: 25 packages changed peer identity across all five existing lanes plus @async/witness and @markless/*, driven by six moved optional peers (esbuild 0.27.7->0.28.1, chokidar 4.0.3->5.0.0 MAJOR, plus sass/jsdom/prettier/lru-cache newly resolved). All six are inside their consumers' declared ranges. Ruled ASSERT IT via a workspace peer-resolution inventory, following package-inventory.test.ts's own written placement precedent."
      THE_STATED_MECHANISM_IS_REFUTED_AND_THE_PM_IS_THE_SOURCE: "The brief this Judge was given - written by the PM, propagating the T004 receipt - claimed the symmetry that 'an exact vendored pin is what makes Angular immune to the catalog, and the same exactness is what lets it override optional peers elsewhere'. ELEGANT AND WRONG. MEASURED: four of the six moved peers arrived on ORDINARY CARET RANGES, and two of those are demos/angular-official's OWN ng-new scaffold devDependencies (jsdom ^28.0.0, prettier ^3.8.1); chokidar arrived via @angular/compiler-cli's ^5.0.0 caret. EXACTNESS IS NOT THE CAUSE - WORKSPACE MEMBERSHIP IS. The consequence is the part that matters: this is NOT an Angular property, so the next lane added to this workspace will do it too."
      the_scope_was_understated_by_roughly_the_same_factor_ruling_1_was: "The PM wrote 'react, solid, vue and every vitest browser lane'. MEASURED: 25 packages changed peer identity, including the ENTIRE SvelteKit stack, @qwik.dev/core and @qwik.dev/router, @markless/core and @markless/router, and @async/witness@0.7.0 - WHICH IS THE E2E INSTRUMENT ITSELF. And the largest single item went unnamed by everyone: chokidar crossed a MAJOR boundary, 4.0.3 -> 5.0.0, for unstorage, nitro and both markless packages."
