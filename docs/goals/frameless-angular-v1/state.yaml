        remedy: "Serialize on root package.json. PM ACCEPTED: Angular T003 waits for Vue T003 to land rather than racing a read-modify-write on the same file. The Angular tsconfig does not exist yet, so the PM cannot pre-add the check line either - tsc -p would fail."
      dissent:
        - "THE ARBITER'S PRACTICAL YIELD ON THIS CORPUS IS NEAR ZERO AND THE JUDGE APPROVED IT ANYWAY. 16 rules, measured 0 messages, and most of what recommended covers - lifecycle interfaces, output naming, inputs: metadata, prefer-inject - is machinery this emitter does not produce. Its keep is earned ENTIRELY by the planted-violation calibration, exactly as T002's dissent 2 predicted for parseTemplate. The Judge considered compensating by reaching into `all` for rules that look useful and REFUSED: that is precisely the independence failure this ruling exists to prevent, and A WEAK-BUT-HONEST ARBITER BEATS A STRONG ONE WE PICKED."
        - "The use-lifecycle-interface gap is mildly uneasy-making: a derivation that misses one rule upstream publishes is evidence the metadata is not a perfect mirror of the config, and this generalises from ONE version. If upstream adds a second warn-tier rule the derivation misses it SILENTLY - the same failure mode one level up. The additions list plus an inventory test makes it VISIBLE, not IMPOSSIBLE. Accepted because the miss direction is 'fewer rules judge us', which cannot hide a defect in emitted output, only under-cover it."
        - "Restated 3e is BROADER than the original and the Judge wants that on the record. A total scope-aware transform is more machinery than 'verbatim transplant', and machinery in an emitter is where drift lives. What makes it acceptable is that it is fail-closed and the name set is declared before any body is read. If the Worker finds a binding that is AMBIGUOUS rather than unresolvable, the throw is the right answer and a second T003a is cheaper than a guess."


