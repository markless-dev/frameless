name: CI

on:
  push:
    branches: [main, 'goal/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Browsers are installed explicitly per job that needs them, so the postinstall
  # download is pure waste everywhere else.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  static:
    name: check + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint

  test:
    name: node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  browser:
    name: browser lanes
    runs-on: ubuntu-latest
    # Tightened from 20. The T004 calibration run proved this lane's failure mode
    # is an indefinite hang, not an error, so a generous budget just burns runner
    # time and reads as "slow" rather than "broken".
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/frameworks/react exec playwright install --with-deps chromium
      # This lane was RED by design on the first two runs - that was T004's
      # calibration, proving this workflow catches a real unplanted defect.
      # T010 fixed the cause: vp test bundles vitest@0.1.20 while @vitest/browser
      # is 4.1.5, and the mismatched pair breaks the browser RPC. The scripts now
      # run the real vitest from each package. See notes/T010-browser-lane.md.
      - run: pnpm test:browser

  e2e:
    name: e2e (differential + three-way)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/frameworks/react exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-receipts
          path: |
            demos/*/receipts/**
            demos/*/.witness/receipts/**
          if-no-files-found: warn
